<!DOCTYPE html><html lang="en" style="--hd-top: #e6e6e6; --hd-tool: #f0f0f0; --hd-table: #f8f8f8; --cw-name: 408px; --cw-group: 296px; --cw-tag: 120px;"><head>



<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark History — Relay</title>
<style>
:root{
  --bg:#ffffff; --bg-sidebar:#fafafa; --bg-soft:#f7f7f8; --bg-chip:#f4f4f5;
  --border:#e8e8e8; --border-2:#ececec; --border-strong:#d4d4d8; --indent:#e4e4e7;
  --text:#1c1c1e; --muted:#71717a; --muted-2:#9a9aa3; --code:#3f3f46;
  --ink:#1c1c1e; --ink-bg:#f0f0f0;
  --accent:#3f4ba8; --accent-soft:#eef0fb;
  --up:#a8572a;    /* mais lento  ↑ */
  --up-bg:#fbf2ec;
  --down:#157f6b;  /* mais rápido ↓ */
  --down-bg:#ecf6f2;
  --warn:#9a6b1e;  --warn-bg:#fbf6ea;
  --mono:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  /* cinza dos headers (variação 1 por padrão) — sobrescritos via JS */
  --hd-top:#dedede; --hd-tool:#e9e9e9; --hd-table:#f4f4f4;
  /* larguras redimensionáveis (Teste / Grupo / Tag) */
  --cw-name:300px; --cw-group:200px; --cw-tag:120px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--text);background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#e0e0e4;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#bdbdc4}

/* ---------- HEADER ---------- */
header{height:56px;flex-shrink:0;display:flex;align-items:center;gap:14px;
  padding:0 18px;background:var(--hd-top);border-bottom:1px solid var(--border);box-shadow:0 1px 0 var(--border)}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-dot{width:9px;height:9px;border-radius:2.5px;flex-shrink:0;
  background:linear-gradient(135deg,#828cf2,#4d59c6);box-shadow:0 0 0 3px rgba(126,134,240,.14)}
.brand-label{font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.brand-sep{color:#cfcfd6;font-size:15px}
.brand-name{font-family:var(--sans);font-size:15.5px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.head-chips{display:flex;gap:7px;align-items:center;min-width:0;overflow:hidden;flex:1}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--bg);
  border:1px solid var(--border);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip b{color:var(--text);font-weight:600}
.head-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.gen-time{font-family:var(--mono);font-size:11.5px;color:var(--muted-2);white-space:nowrap}
.icon-btn{height:30px;padding:0 11px;border:1px solid var(--border);border-radius:7px;background:var(--bg);
  color:var(--muted);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;
  transition:.13s}
.icon-btn:hover{background:var(--ink-bg);color:var(--text);border-color:var(--border-strong)}
.icon-btn.on{background:var(--accent-soft);border-color:#c9cef0;color:var(--accent)}
.gray-switch{display:flex;align-items:center;gap:6px;flex-shrink:0}
.gray-switch .gs-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gray-switch .gs-seg{display:inline-flex;background:var(--bg);border:1px solid var(--border-strong);border-radius:7px;padding:2px;gap:2px}
.gray-switch button{width:23px;height:23px;border:none;background:none;border-radius:5px;font-size:12px;
  font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;transition:.12s}
.gray-switch button:hover{color:var(--text);background:var(--ink-bg)}
.gray-switch button.on{background:var(--accent-soft);color:var(--accent)}

/* ---------- DASHBOARD ---------- */
.dash{flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg-soft);
  display:grid;grid-template-columns:repeat(6,1fr);gap:1px;overflow:hidden;
  transition:max-height .2s ease;max-height:120px}
.dash.collapsed{max-height:0;border-bottom:0}
.stat{background:#ffffff;padding:12px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat-k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);
  display:flex;align-items:center;gap:6px}
.stat-v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15}
.stat-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v.sm{font-size:14px;font-weight:600}
.stat .mono{font-family:var(--mono)}
.delta-row{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.delta-row .nm{font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-note{font-size:11.5px;color:var(--muted-2);font-style:italic}

/* ---------- BODY ---------- */
.body{flex:1;display:flex;min-height:0;position:relative}

/* ---- toolbar search (substitui a busca da barra lateral) ---- */
.tool-search{position:relative;flex-shrink:0}
.tool-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.tool-search input{width:240px;height:30px;padding:0 26px 0 30px;border:1px solid var(--border);border-radius:7px;
  background:var(--bg);font-size:12.5px;font-family:var(--sans);color:var(--text);transition:.13s}
.tool-search input::placeholder{color:var(--muted-2)}
.tool-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);width:300px}
.tool-search .tsc{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;
  color:var(--muted-2);font-size:14px;line-height:1;padding:2px 4px;border-radius:4px;display:none}
.tool-search .tsc:hover{background:var(--ink-bg);color:var(--text)}
.tool-search input:not(:placeholder-shown)+.tsc{display:block}

/* ---- navigator drawer (árvore sob demanda, sem menu fixo) ---- */
.nav-scrim{position:absolute;inset:0;background:rgba(20,20,22,.16);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:40}
.nav-scrim.open{opacity:1;pointer-events:auto}
.navdrawer{position:absolute;top:0;left:0;height:100%;width:348px;background:var(--bg);
  border-right:1px solid var(--border-strong);box-shadow:10px 0 36px rgba(0,0,0,.13);
  display:flex;flex-direction:column;min-height:0;z-index:50;
  transform:translateX(-106%);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.navdrawer.open{transform:translateX(0)}
.nav-head{display:flex;align-items:center;gap:9px;padding:13px 12px 11px;border-bottom:1px solid var(--border);flex-shrink:0}
.nav-head .nh-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);flex-shrink:0}
.nav-head .nh-spacer{flex:1}
.nav-close{width:27px;height:27px;border:1px solid var(--border);border-radius:6px;background:var(--bg);
  color:var(--muted);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-close:hover{background:var(--ink-bg);color:var(--text)}
.side-search{padding:12px 12px 8px;display:flex;flex-direction:column;gap:7px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.search-input{width:100%;height:34px;padding:0 30px 0 30px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);font-size:13px;font-family:var(--sans);color:var(--text);transition:.13s}
.search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:none;background:none;
  color:var(--muted-2);font-size:15px;line-height:1;padding:3px;border-radius:4px;display:none}
.search-clear:hover{background:var(--ink-bg);color:var(--text)}
.search-input:not(:placeholder-shown)+.search-clear{display:block}
.side-meta{font-size:11px;color:var(--muted-2);padding:0 2px}
.side-scroll{flex:1;overflow-y:auto;padding:4px 8px 16px}
.side-title{padding:10px 8px 4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-2)}
.tnode{user-select:none}
.trow{display:flex;align-items:center;gap:2px;border-radius:6px;padding:0 6px 0 0;cursor:pointer;min-height:28px;transition:background .1s}
.trow:hover{background:rgba(0,0,0,.04)}
.trow.sel{background:var(--accent-soft)}
.tcaret{width:20px;height:26px;flex-shrink:0;border:none;background:none;color:var(--muted-2);
  font-size:9px;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.tcaret.empty{visibility:hidden}
.tlabel{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 0}
.tnode.lvl-date>.trow>.tlabel{font-weight:600;font-family:var(--mono);font-size:12.5px}
.tnode.lvl-suite>.trow>.tlabel{color:var(--text);font-size:12.5px}
.tnode.lvl-test>.trow>.tlabel{color:var(--muted);font-size:12px;font-family:var(--mono)}
.tbadge{font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--bg-chip);
  border:1px solid var(--border);border-radius:5px;padding:0 6px;height:18px;display:flex;align-items:center;flex-shrink:0}
.tchildren{margin-left:14px;padding-left:8px;border-left:1.5px solid var(--indent)}
.tchildren.hide{display:none}
.tpin{width:22px;height:22px;flex-shrink:0;border:none;background:none;color:var(--muted-2);opacity:0;
  display:flex;align-items:center;justify-content:center;border-radius:4px}
.trow:hover .tpin{opacity:.7}
.tpin:hover{background:var(--ink-bg);opacity:1!important}
.tpin.on{opacity:1;color:var(--accent)}
.tcheck{width:16px;height:16px;flex-shrink:0;border:1.5px solid var(--border-strong);border-radius:4px;
  background:var(--bg);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;
  line-height:1;cursor:pointer;transition:.1s}
.tcheck:hover{border-color:var(--accent)}
.tcheck.on{background:var(--accent);border-color:var(--accent)}
.side-empty{padding:24px 14px;color:var(--muted-2);font-size:12.5px;text-align:center}

/* ---------- MAIN ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{flex-shrink:0;display:flex;align-items:center;gap:9px;padding:9px 16px;border-bottom:1px solid var(--border);
  background:var(--hd-tool);flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg-chip);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.seg button{border:none;background:none;font-size:12.5px;font-weight:500;color:var(--muted);
  padding:5px 12px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600}
.tool-sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.tool-spacer{flex:1}
/* grupos funcionais — separados por dividers, sem caixas */
.tgroup{display:flex;align-items:center;gap:6px}
/* densidade condensada */
body.compact thead th{padding:4px 10px}
body.compact tbody td{padding:3px 10px}
body.compact .tname{font-size:11.5px;gap:5px}
body.compact .cell-mean{font-size:12px}
body.compact .gpill,body.compact .tagchip{font-size:10px}
body.compact .ghead{padding:5px 12px}
body.compact tr.grouphead td{padding:0}
body.compact .trow{min-height:22px}
body.compact .tlabel{padding:2px 0}
body.compact .tcaret{height:22px}
body.compact .tpin{height:18px}
body.compact .side-scroll{padding:2px 8px 12px}
body.compact .stat{padding:8px 16px}
.tcount{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tcount b{color:var(--text);font-weight:600}
.fbtn{height:30px;padding:0 11px;border:1px solid var(--border);border-radius:7px;background:var(--bg);
  color:var(--muted);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.12s;white-space:nowrap}
.fbtn:hover{background:var(--ink-bg);color:var(--text);border-color:var(--border-strong)}
.fbtn.on{background:var(--accent-soft);border-color:#c9cef0;color:var(--accent)}
.fbtn .cnt{font-variant-numeric:tabular-nums;background:var(--accent);color:#fff;border-radius:999px;
  font-size:10px;padding:0 5px;height:15px;display:inline-flex;align-items:center}

/* popover */
.pop{position:absolute;z-index:60;background:var(--bg);border:1px solid var(--border-strong);border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.13);padding:6px;min-width:200px;max-height:340px;overflow-y:auto;display:none}
.pop.open{display:block}
.pop-h{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);padding:6px 8px 4px}
.pop-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12.5px;cursor:pointer}
.pop-item:hover{background:var(--bg-chip)}
.pop-item .cb{width:15px;height:15px;border:1.5px solid var(--border-strong);border-radius:4px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
.pop-item.on .cb{background:var(--accent);border-color:var(--accent)}
.pop-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-item .n{color:var(--muted-2);font-variant-numeric:tabular-nums;font-size:11px}

/* ---------- TABLE ---------- */
.table-scroll{flex:1;overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{position:sticky;top:0;z-index:10;background:var(--hd-table);border-bottom:1px solid var(--border-strong);
  font-weight:600;color:var(--muted);text-align:left;padding:8px 12px;white-space:nowrap;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.03em;user-select:none}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--text);background:#d8d8d8}
thead th.num{text-align:right}
.sort-ind{display:inline-block;width:10px;color:var(--accent);font-size:10px}
th.datecol{text-align:right;border-left:1px solid var(--border)}
th.datecol .dtop{font-family:var(--mono);font-size:11px;color:var(--text);text-transform:none;letter-spacing:0}
tbody td{padding:7px 12px;border-bottom:1px solid var(--border-2);vertical-align:middle}
tbody tr:hover td{background:#fcfcfc}
tbody tr.pinned td{background:#fcfbf6}
tbody tr.pinned:hover td{background:#f7f5ec}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.datecell{text-align:right;border-left:1px solid var(--border-2)}
.cell-mean{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.cell-stack{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.25}
.tname{font-family:var(--mono);font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:7px}
.tname .nm{overflow-wrap:anywhere}
.tparams{color:var(--accent);font-weight:600}
.gpill{font-size:11px;font-family:var(--mono);color:var(--muted);background:var(--bg-chip);border:1px solid var(--border);
  border-radius:5px;padding:1px 7px;white-space:nowrap;display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.gns{color:var(--muted-2)}
.tagchip{font-size:10.5px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:1px 8px}
.rowpin{width:24px;height:24px;border:none;background:none;color:var(--muted-2);opacity:.32;
  display:inline-flex;align-items:center;justify-content:center;border-radius:5px;transition:.12s}
tr:hover .rowpin{opacity:.7}
.rowpin:hover{background:var(--ink-bg);opacity:1;color:var(--text)}
.rowpin.on{opacity:1;color:var(--accent)}
.rowcopy{width:24px;height:24px;border:none;background:none;color:var(--muted-2);opacity:0;
  display:inline-flex;align-items:center;justify-content:center;border-radius:5px}
tr:hover .rowcopy{opacity:.6}
.rowcopy:hover{background:var(--ink-bg);opacity:1;color:var(--text)}
.rowcopy.ok{color:var(--down);opacity:1}

/* delta */
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.same{color:var(--muted)} .delta.new{color:var(--muted-2)}
#dash .delta.down{color:rgb(0, 180, 104)}
.delta .ar{font-size:10px}
.dpill{font-size:10px;color:#74747a;border:1px solid var(--border);border-radius:4px;padding:0 5px;background:var(--bg)}

/* sparkline */
.spark{display:inline-block;vertical-align:middle}
.spark .dot{fill:var(--accent)}
.sparkmuted{color:var(--muted-2);font-size:11px;font-style:italic}

/* group mode */
tr.grouphead td{background:var(--hd-table);border-bottom:1px solid var(--border);border-top:1px solid var(--border);
  padding:0}
.ghead{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}
.ghead:hover{background:#d8d8d8}
.grpall{width:22px;height:22px;border:none;background:none;color:var(--muted);font-size:11px;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;transition:.12s}
.grpall:hover{background:var(--ink-bg);color:var(--text)}
.ghead .gc{width:14px;color:var(--muted-2);font-size:8px;transition:transform .12s}
.ghead .gname{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)}
.ghead .gns2{color:var(--muted-2);font-weight:400}
.ghead .gmeta{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ghead .gmeta b{color:var(--text);font-weight:600}
tr.ghidden{display:none}

/* matrix */
td.mtname{position:sticky;left:0;background:var(--bg);z-index:5;border-right:1px solid var(--border)}
tbody tr:hover td.mtname{background:#fcfcfc}
th.mtname{position:sticky;left:0;z-index:11}

/* ---- colunas redimensionáveis (Teste / Grupo / Tag) ---- */
.col-resizer{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:13}
.col-resizer::after{content:"";position:absolute;top:6px;bottom:6px;right:3px;width:1px;background:var(--border-strong);transition:.12s}
.col-resizer:hover::after,.col-resizer.drag::after{background:var(--accent);width:2px}
th.c-name,td.c-name{width:var(--cw-name);max-width:var(--cw-name)}
th.c-group,td.c-group{width:var(--cw-group);max-width:var(--cw-group)}
th.c-tag,td.c-tag{width:var(--cw-tag);max-width:var(--cw-tag)}
th.c-name,th.c-group,th.c-tag{overflow:hidden}
td.c-name,td.c-group,td.c-tag{overflow:hidden}
td.c-name .tname{min-width:0}
td.c-name .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.c-group .gpill{max-width:100%}
td.c-tag{white-space:nowrap}

.empty-state{padding:60px 20px;text-align:center;color:var(--muted-2)}
.empty-state .big{font-size:15px;color:var(--muted);margin-bottom:6px}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:9px 18px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:.2s;z-index:200;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.demo-flag{font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-bg);border:1px solid #ecd9a8;
  border-radius:5px;padding:1px 7px;text-transform:uppercase;letter-spacing:.04em}
</style></head>
<body class="compact" style="">
<header style="border-width: 0px 0px 1px">
  <div class="brand">

", "pct": null, "prev": null, "sig": false, "af": false}}, {"id": "Relay.Benchmarks.ByteRingBufferBenchmarks.TryPeek_Empty(Capacity: 65536, PayloadSize: 256)", "unit": "ns", "mean": 0.004156430562337239, "stddev": 0.007199148912100179, "p95": 0.011222362518310545, "p99": 0.011222362518310545, "alloc": 0, "d": {"v": "new", "pct": null, "prev": null, "sig": false, "af": false}}, {"id": "Relay.Benchmarks.ByteRingBufferBenchmarks.RoundTrip(Capacity: 65536, PayloadSize: 256)", "unit": "ns", "mean": 5.943813423315684, "stddev": 0.04636499292242024, "p95": 5.989273339509964, "p99": 5.989273339509964, "alloc": 0, "d": {"v": "new", "pct": null, "prev": null, "sig": false, "af": false}}, {"id": "Relay.Benchmarks.ByteRingBufferBenchmarks.TryPublish_Full(Capacity: 65536, PayloadSize: 256)", "unit": "ns", "mean": 0.6366508702437083, "stddev": 0.00043202259745251054, "p95": 0.6369929760694504, "p99": 0.6369929760694504, "alloc": 0, "d": {"v": "new", "pct": null, "prev": null, "sig": false, "af": false}}, {"id": "Relay.Benchmarks.ByteRingBufferBenchmarks.TryPeek_Empty(Capacity: 65536, PayloadSize: 1024)", "unit": "ns", "mean": 0.04048465440670649, "stddev": 0.032045606336777915, "p95": 0.07207842543721199, "p99": 0.07207842543721199, "alloc": 0, "d": {"v": "new", "pct": null, "prev": null, "sig": false, "af": false}}, {"id": "Relay.Benchmarks.ByteRingBufferBenchmarks.RoundTrip(Capacity: 65536, PayloadSize: 1024)", "unit": "ns", "mean": 14.604919155438742, "stddev": 0.2537177972499715, "p95": 14.755952954292297, "p99": 14.755952954292297, "alloc": 0, "d": {"v": "new", "pct": null, "prev": null, "sig": false, "af": false}}, {"id": "Relay.Benchmarks.ByteRingBufferBenchmarks.TryPublish_Full(Capacity: 65536, PayloadSize: 1024)", "unit": "ns", "mean": 0.622013583779335, "stddev": 0.04586751898669347, "p95": 0.6670764833688736, "p99": 0.6670764833688736, "alloc": 0, "d": {"v": "new", "pct": null, "prev": null, "sig": false, "af": false}}]}, {"date": "2026-06-12", "ts": "2026-06-12T12:16: <script>
"use strict";
const RAW = JSON.parse(document.getElementById('bench-data').textContent);

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
function fmtTime(ns){
  if(ns==null) return '—';
  if(ns<1000) return ns.toFixed(2)+' ns';
  if(ns<1e6) return (ns/1e3).toFixed(2)+' µs';
  if(ns<1e9) return (ns/1e6).toFixed(2)+' ms';
  return (ns/1e9).toFixed(2)+' s';
}
function fmtAlloc(b){
  if(b==null||b===0) return '—';
  if(b<1024) return Math.round(b)+' B';
  if(b<1048576) return (b/1024).toFixed(2)+' KB';
  return (b/1048576).toFixed(2)+' MB';
}
function shortTime(ns){ // compact for cells
  return fmtTime(ns);
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function suiteShort(s){ const p=s.split('.'); return p[p.length-1]; }
function suiteNs(s){ const p=s.split('.'); return p.slice(0,-1).join('.'); }
function testName(id,suite){ return id.startsWith(suite+'.') ? id.slice(suite.length+1) : id; }
function splitParams(nm){
  const i=nm.indexOf('(');
  if(i<0) return {base:nm,params:''};
  return {base:nm.slice(0,i),params:nm.slice(i)};
}

/* ============ build model ============ */
// dates sorted desc
const DATES = [...new Set(RAW.runs.map(r=>r.date))].sort().reverse();
// tests: one per bench id, with per-date latest measurement
const TESTMAP = new Map();
for(const run of RAW.runs){
  for(const rec of run.records){
    let t = TESTMAP.get(rec.id);
    if(!t){
      const suite = run.suite;
      const nm = testName(rec.id, suite);
      const sp = splitParams(nm);
      t = {id:rec.id, suite, suiteShort:suiteShort(suite), suiteNs:suiteNs(suite),
           name:nm, base:sp.base, params:sp.params, unit:rec.unit, byDate:{}, tags:new Set()};
      TESTMAP.set(rec.id, t);
    }
    t.tags.add(run.tag);
    const prev = t.byDate[run.date];
    // keep latest run of the day (runs are listed newest-first overall, but compare ts)
    if(!prev || run.ts > prev.ts){
      t.byDate[run.date] = {ts:run.ts, mean:rec.mean, stddev:rec.stddev, p99:rec.p99, p95:rec.p95,
                            alloc:rec.alloc, git:run.git_sha, dirty:run.git_dirty, tag:run.tag};
    }
  }
}
let TESTS = [...TESTMAP.values()];
TESTS.forEach(t=>{ t.tags=[...t.tags]; });

/* synthetic history for demo (clearly labelled) */
let DEMO_DATES = [];
function buildDemo(){
  if(DEMO_DATES.length) return;
  const base = DATES[DATES.length-1]; // earliest real date
  const d0 = new Date(base+'T12:00:00Z');
  const offsets=[21,14,7]; // days before
  DEMO_DATES = offsets.map(o=>{ const d=new Date(d0); d.setUTCDate(d.getUTCDate()-o); return d.toISOString().slice(0,10); });
  let seed=99;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  for(const t of TESTS){
    const real = t.byDate[base];
    if(!real) continue;
    let cur = real.mean*(0.82+rnd()*0.5); // start somewhere off
    DEMO_DATES.forEach((dd,i)=>{
      const factor = 0.9+rnd()*0.28;
      cur = cur*factor;
      t.byDate[dd]={ts:dd+'T12:00:00Z',mean:cur,stddev:real.stddev?real.stddev*(0.7+rnd()*0.8):null,
        p99:real.p99?real.p99*(0.9+rnd()*0.3):null,p95:null,
        alloc:real.alloc!=null?real.alloc*(0.9+rnd()*0.2):null,git:'sim'+i,dirty:false,tag:real.tag,demo:true};
    });
  }
}

function allActiveDates(){
  if(STATE.demo){ buildDemo(); return [...DATES, ...DEMO_DATES].sort().reverse(); }
  return DATES;
}
function activeDates(){
  const all=allActiveDates();
  if(STATE.dateSel && STATE.dateSel.length){
    const s=new Set(STATE.dateSel);
    const f=all.filter(d=>s.has(d));
    if(f.length) return f;
  }
  return all;
}
// delta between a test's value on date vs its immediately-prior active date
function deltaFor(t, dates, idx){
  const cur = t.byDate[dates[idx]];
  if(!cur) return null;
  // find next older date that has a value
  for(let j=idx+1;j<dates.length;j++){
    const prev = t.byDate[dates[j]];
    if(prev){ 
      if(prev.mean==null||cur.mean==null) break;
      const pct=(cur.mean-prev.mean)/prev.mean*100;
      return {pct, prevMean:prev.mean};
    }
  }
  return {pct:null, prevMean:null, isNew:true};
}
function latestOf(t,dates){
  for(const d of dates){ if(t.byDate[d]) return {date:d, ...t.byDate[d]}; }
  return null;
}

/* ============ state ============ */
const LS='benchHistoryUIv5';
const STATE = Object.assign({
  layout:'flat', search:'', sortKey:'date', sortDir:'desc',
  groups:[], tags:[], reg:false, pinnedOnly:false, demo:false,
  pinned:[], collapsed:[], sidebarW:300, dashOpen:true, treeSel:null, navOpen:false, dateSel:[], density:'comfortable', grayTheme:1, colW:{name:300,group:200,tag:120}
}, JSON.parse(localStorage.getItem(LS)||'{}'));
function save(){ localStorage.setItem(LS, JSON.stringify(STATE)); }

const ALL_GROUPS = [...new Set(TESTS.map(t=>t.suite))].sort();
const ALL_TAGS = [...new Set(TESTS.flatMap(t=>t.tags))].sort();

/* ============ filtering ============ */
function matchSearch(t, q){
  if(!q) return true;
  q=q.toLowerCase();
  return t.id.toLowerCase().includes(q) || t.suite.toLowerCase().includes(q);
}
function filtered(){
  const dates=activeDates();
  const q=STATE.search.trim();
  const gset=new Set(STATE.groups), tset=new Set(STATE.tags), pset=new Set(STATE.pinned);
  let rows = TESTS.filter(t=>{
    if(!matchSearch(t,q)) return false;
    if(gset.size && !gset.has(t.suite)) return false;
    if(tset.size && !t.tags.some(x=>tset.has(x))) return false;
    if(STATE.pinnedOnly && !pset.has(t.id)) return false;
    if(STATE.reg){
      const d=deltaFor(t,dates,0);
      if(!(d&&d.pct!=null&&d.pct>0)) return false;
    }
    return true;
  });
  return rows;
}
function sortRows(rows){
  const dates=activeDates();
  const dir = STATE.sortDir==='asc'?1:-1;
  const k=STATE.sortKey;
  // Valores numéricos (mean/stddev/p99 em ns; alloc em bytes) são comparados
  // sempre na MESMA unidade base — nunca pelo número exibido após conversão.
  // Assim 2,5 MB (2.621.440 B) > 139 KB (142.000 B) > 800 B, sempre.
  const val=t=>{
    const lt=latestOf(t,dates);
    switch(k){
      case 'name': return t.name.toLowerCase();
      case 'group': return t.suite.toLowerCase();
      case 'mean': return lt&&lt.mean!=null?Number(lt.mean):Infinity;
      case 'stddev': return lt&&lt.stddev!=null?Number(lt.stddev):Infinity;
      case 'p99': return lt&&lt.p99!=null?Number(lt.p99):Infinity;
      case 'alloc': return lt&&lt.alloc!=null?Number(lt.alloc):Infinity;
      case 'delta':{ const d=deltaFor(t,dates,0); return d&&d.pct!=null?d.pct:-Infinity; }
      case 'date': return lt?lt.ts:'';
      default: return 0;
    }
  };
  const pset=new Set(STATE.pinned);
  rows.sort((a,b)=>{
    // pinned always first
    const pa=pset.has(a.id), pb=pset.has(b.id);
    if(pa!==pb) return pa?-1:1;
    const va=val(a), vb=val(b);
    if(va<vb) return -1*dir; if(va>vb) return 1*dir;
    return a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'});
  });
  return rows;
}

/* ============ delta render ============ */
function deltaHTML(d){
  if(!d) return '';
  if(d.isNew||d.pct==null) return '<span class="delta new">novo</span>';
  const a=Math.abs(d.pct);
  if(a<1) return '<span class="delta same"><span class="ar">↔</span>'+d.pct.toFixed(1)+'%</span>';
  if(d.pct>0) return '<span class="delta up"><span class="ar">↑</span>+'+d.pct.toFixed(1)+'%</span>';
  return '<span class="delta down"><span class="ar">↓</span>'+d.pct.toFixed(1)+'%</span>';
}
function sparkHTML(t,dates){
  const pts=[];
  for(let i=dates.length-1;i>=0;i--){ const v=t.byDate[dates[i]]; if(v&&v.mean!=null) pts.push(v.mean); }
  if(pts.length<2) return '<span class="sparkmuted">—</span>';
  const w=66,h=18,pad=2;
  const mn=Math.min(...pts), mx=Math.max(...pts), rng=(mx-mn)||1;
  const step=(w-pad*2)/(pts.length-1);
  const xy=pts.map((v,i)=>[pad+i*step, h-pad-((v-mn)/rng)*(h-pad*2)]);
  const last=xy[xy.length-1];
  const path=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  // trend color: compare last vs first
  const up = pts[pts.length-1]>pts[0];
  const col = up?'var(--up)':'var(--down)';
  return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><circle class="dot" cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2" fill="'+col+'"/></svg>';
}

/* ============ TABLE: flat ============ */
const SORTCOLS = [
  {k:'name',label:'Test',cls:''},
  {k:'group',label:'Group',cls:''},
];
function thSort(k,label,cls,colKey){
  const on=STATE.sortKey===k;
  const ind=on?(STATE.sortDir==='asc'?'▲':'▼'):'';
  const cc=(cls||'')+(colKey?' c-'+colKey:'');
  const rz=colKey?'<div class="col-resizer" data-col="'+colKey+'"></div>':'';
  return '<th class="sortable '+cc+'" data-sort="'+k+'">'+esc(label)+' <span class="sort-ind">'+ind+'</span>'+rz+'</th>';
}
function renderFlat(rows){
  const dates=activeDates();
  const multi=dates.length>1;
  let h='<table><thead><tr>';
  h+='<th style="width:30px"></th>';
  h+=thSort('name','Test','','name');
  h+=thSort('group','Group','','group');
  h+='<th class="c-tag">Tag<div class="col-resizer" data-col="tag"></div></th>';
  // latest mean + delta
  h+=thSort('mean','Mean','num');
  h+=thSort('delta','Δ vs prev.','num');
  if(multi) h+='<th class="num">Trend</th>';
  h+=thSort('stddev','StdDev','num');
  h+=thSort('p99','P99','num');
  h+=thSort('alloc','Alloc','num');
  h+=thSort('date','Last date','num');
  h+='<th style="width:34px"></th>';
  h+='</tr></thead><tbody>';
  const pset=new Set(STATE.pinned);
  if(!rows.length) h+='<tr><td colspan="20"><div class="empty-state"><div class="big">No tests found</div><div>Adjust search or filters.</div></div></td></tr>';
  for(const t of rows){
    const lt=latestOf(t,dates);
    const d=deltaFor(t,dates,0);
    const pinned=pset.has(t.id);
    h+='<tr class="'+(pinned?'pinned':'')+'" data-id="'+esc(t.id)+'">';
    h+='<td><button class="rowpin '+(pinned?'on':'')+'" data-pin="'+esc(t.id)+'" title="Pin">'+(pinned?'★':'☆')+'</button></td>';
    h+='<td class="c-name"><div class="tname"><span class="nm">'+esc(t.base)+(t.params?'<span class="tparams">'+esc(t.params)+'</span>':'')+'</span></div></td>';
    h+='<td class="c-group"><span class="gpill" title="'+esc(t.suite)+'"><span class="gns">'+esc(t.suiteNs)+'.</span>'+esc(t.suiteShort)+'</span></td>';
    h+='<td class="c-tag">'+t.tags.map(x=>'<span class="tagchip">'+esc(x)+'</span>').join(' ')+'</td>';
    h+='<td class="num"><span class="cell-mean">'+shortTime(lt?lt.mean:null)+'</span></td>';
    h+='<td class="num">'+deltaHTML(d)+'</td>';
    if(multi) h+='<td class="num">'+sparkHTML(t,dates)+'</td>';
    h+='<td class="num">'+(lt&&lt.stddev!=null?fmtTime(lt.stddev):'—')+'</td>';
    h+='<td class="num">'+(lt&&lt.p99!=null?fmtTime(lt.p99):'—')+'</td>';
    h+='<td class="num">'+fmtAlloc(lt?lt.alloc:null)+'</td>';
    h+='<td class="num"><span class="dpill">'+(lt?lt.date.slice(5):'—')+'</span></td>';
    h+='<td><button class="rowcopy" data-copy="'+esc(t.id)+'" title="Copy row">⎘</button></td>';
    h+='</tr>';

/* ============ TABLE: grouped ============ */
function renderGrouped(rows){
  const dates=activeDates();
  const multi=dates.length>1;
  const cset=new Set(STATE.collapsed);
  // group by suite
  const groups=new Map();
  for(const t of rows){ if(!groups.has(t.suite)) groups.set(t.suite,[]); groups.get(t.suite).push(t); }
  const gkeys=[...groups.keys()].sort();
  let colspan = multi?11:10;
  const allCol = gkeys.length>0 && gkeys.every(g=>cset.has(g));
  let h='<table><thead><tr>';
  h+='<th style="width:30px"><button class="grpall" id="grpAllBtn" style="font-size:8px;color:var(--muted-2)" title="'+(allCol?'Expand all groups':'Collapse all groups')+'"><span style="display:inline-block;transition:transform .12s;transform:rotate('+(allCol?-90:0)+'deg)">▼</span></button></th>';
  h+=thSort('name','Test','','name');
  h+='<th class="c-tag">Tag<div class="col-resizer" data-col="tag"></div></th>';
  h+=thSort('mean','Mean','num');
  h+=thSort('delta','Δ vs prev.','num');
  if(multi) h+='<th class="num">Trend</th>';
  h+=thSort('stddev','StdDev','num');
  h+=thSort('p99','P99','num');
  h+=thSort('alloc','Alloc','num');
  h+=thSort('date','Date','num');
  h+='<th style="width:34px"></th>';
  h+='</tr></thead><tbody>';
  const pset=new Set(STATE.pinned);
  if(!rows.length) h+='<tr><td colspan="'+colspan+'"><div class="empty-state"><div class="big">No tests found</div></div></td></tr>';
  for(const gk of gkeys){
    const arr=groups.get(gk);
    const collapsed=cset.has(gk);
    const means=arr.map(t=>{const l=latestOf(t,dates);return l?l.mean:null}).filter(x=>x!=null).sort((a,b)=>a-b);
    const med=means.length?means[Math.floor(means.length/2)]:null;
    const allocSum=arr.reduce((s,t)=>{const l=latestOf(t,dates);return s+(l&&l.alloc?l.alloc:0)},0);
    h+='<tr class="grouphead"><td colspan="'+colspan+'"><div class="ghead" data-group="'+esc(gk)+'">'
      +'<span class="gc" style="transform:rotate('+(collapsed?-90:0)+'deg)">▼</span>'
      +'<span class="gname"><span class="gns2">'+esc(suiteNs(gk))+'.</span>'+esc(suiteShort(gk))+'</span>'
      +'<span class="gmeta"><span><b>'+arr.length+'</b> tests</span>'
      +'<span>median <b>'+shortTime(med)+'</b></span>'
      +'<span>alloc <b>'+fmtAlloc(allocSum||null)+'</b></span></span></div></td></tr>';
    for(const t of arr){
      const lt=latestOf(t,dates); const d=deltaFor(t,dates,0); const pinned=pset.has(t.id);
      h+='<tr class="'+(collapsed?'ghidden ':'')+(pinned?'pinned':'')+'" data-id="'+esc(t.id)+'">';
      h+='<td><button class="rowpin '+(pinned?'on':'')+'" data-pin="'+esc(t.id)+'">'+(pinned?'★':'☆')+'</button></td>';
      h+='<td class="c-name"><div class="tname"><span class="nm">'+esc(t.base)+(t.params?'<span class="tparams">'+esc(t.params)+'</span>':'')+'</span></div></td>';
      h+='<td class="c-tag">'+t.tags.map(x=>'<span class="tagchip">'+esc(x)+'</span>').join(' ')+'</td>';
      h+='<td class="num"><span class="cell-mean">'+shortTime(lt?lt.mean:null)+'</span></td>';
      h+='<td class="num">'+deltaHTML(d)+'</td>';
      if(multi) h+='<td class="num">'+sparkHTML(t,dates)+'</td>';
      h+='<td class="num">'+(lt&&lt.stddev!=null?fmtTime(lt.stddev):'—')+'</td>';
      h+='<td class="num">'+(lt&&lt.p99!=null?fmtTime(lt.p99):'—')+'</td>';
      h+='<td class="num">'+fmtAlloc(lt?lt.alloc:null)+'</td>';
      h+='<td class="num"><span class="dpill">'+(lt?lt.date.slice(5):'—')+'</span></td>';
      h+='<td><button class="rowcopy" data-copy="'+esc(t.id)+'">⎘</button></td>';
      h+='</tr>';
    }
  }
  h+='</tbody></table>';
  return h;
}

/* ============ TABLE: matrix ============ */
function renderMatrix(rows){
  const dates=activeDates();
  let h='<table><thead><tr>';
  h+='<th style="width:30px"></th>';
  h+='<th class="mtname sortable c-name" data-sort="name">Test <span class="sort-ind">'+(STATE.sortKey==='name'?(STATE.sortDir==='asc'?'▲':'▼'):'')+'</span><div class="col-resizer" data-col="name"></div></th>';
  h+=thSort('group','Group','','group');
  h+='<th class="num">Trend</th>';
  for(let i=0;i<dates.length;i++){
    const isDemo = DEMO_DATES.includes(dates[i]);
    h+='<th class="datecol'+(i===0?' sortable':'')+'"'+(i===0?' data-sort="mean"':'')+'><span class="dtop">'+dates[i].slice(5)+'</span>'+(isDemo?' <span class="demo-flag">sim</span>':'')+'<br><span style="font-size:9.5px;color:var(--muted-2);text-transform:none">'+(i===0?'most recent':'')+'</span></th>';
  }
  h+='<th style="width:34px"></th></tr></thead><tbody>';
  const pset=new Set(STATE.pinned);
  if(!rows.length) h+='<tr><td colspan="'+(dates.length+5)+'"><div class="empty-state"><div class="big">No tests found</div></div></td></tr>';
  for(const t of rows){
    const pinned=pset.has(t.id);
    h+='<tr class="'+(pinned?'pinned':'')+'" data-id="'+esc(t.id)+'">';
    h+='<td><button class="rowpin '+(pinned?'on':'')+'" data-pin="'+esc(t.id)+'">'+(pinned?'★':'☆')+'</button></td>';
    h+='<td class="mtname c-name"><div class="tname"><span class="nm">'+esc(t.base)+(t.params?'<span class="tparams">'+esc(t.params)+'</span>':'')+'</span></div></td>';
    h+='<td class="c-group"><span class="gpill" title="'+esc(t.suite)+'">'+esc(t.suiteShort)+'</span></td>';
    h+='<td class="num">'+sparkHTML(t,dates)+'</td>';
    for(let i=0;i<dates.length;i++){
      const v=t.byDate[dates[i]];
      const d=deltaFor(t,dates,i);
      if(!v){ h+='<td class="datecell"><span class="sparkmuted">—</span></td>'; continue; }
      h+='<td class="datecell"><div class="cell-stack"><span class="cell-mean">'+shortTime(v.mean)+'</span>'+deltaHTML(d)+'</div></td>';
    }
    h+='<td><button class="rowcopy" data-copy="'+esc(t.id)+'">⎘</button></td>';
    h+='</tr>';
  }
  h+='</tbody></table>';
  return h;
}

/* ============ dashboard ============ */
function renderDash(){
  const dates=activeDates();
  const env=RAW.current_env.env;
  const totalTests=TESTS.length, totalGroups=ALL_GROUPS.length;
  const realDates=DATES.length;
  const runs=RAW.runs.length;
  // gains/regressions (need multi date)
  let gains=[],regs=[];
  if(dates.length>1){
    for(const t of TESTS){
      const d=deltaFor(t,dates,0);
      if(d&&d.pct!=null){ if(d.pct<0) gains.push({t,pct:d.pct}); else if(d.pct>0) regs.push({t,pct:d.pct}); }
    }
    gains.sort((a,b)=>a.pct-b.pct); regs.sort((a,b)=>b.pct-a.pct);
  }
  const gate=RAW.gate_candidates.length, openReg=RAW.open_regressions.length;
  const dmin=dates[dates.length-1], dmax=dates[0];
  function gainCard(title,arr,cls,sign){
    if(!arr.length) return '<div class="stat"><div class="stat-k">'+title+'</div><div class="empty-note">Available from the 2nd ingest</div><div class="stat-sub">only 1 date loaded</div></div>';
    const top=arr.slice(0,2).map(x=>'<div class="delta-row"><span class="delta '+cls+'"><span class="ar">'+(sign>0?'↑':'↓')+'</span>'+(sign>0?'+':'')+x.pct.toFixed(1)+'%</span><span class="nm" title="'+esc(x.t.id)+'">'+esc(x.t.base)+'</span></div>').join('');
    return '<div class="stat"><div class="stat-k">'+title+'</div>'+top+'</div>';
  }
  const dash=$('#dash');
  dash.innerHTML=
    '<div class="stat"><div class="stat-k">Tests & Groups</div><div class="stat-v">'+totalTests+'</div><div class="stat-sub">in <b>'+totalGroups+'</b> groups</div></div>'
   +'<div class="stat"><div class="stat-k">Runs & Period</div><div class="stat-v">'+runs+'</div><div class="stat-sub">'+(realDates===1?'1 date · ':realDates+' dates · ')+'<span class="mono">'+(dmin===dmax?dmax:dmin+'→'+dmax)+'</span></div></div>'
   +gainCard('Top gains',gains,'down',-1)
   +gainCard('Top regressions',regs,'up',1)
   +'<div class="stat"><div class="stat-k">Regressions / Gate</div><div class="stat-v">'+openReg+'<span style="font-size:13px;color:var(--muted);font-weight:600"> open</span></div><div class="stat-sub"><b>'+gate+'</b> gate candidates</div></div>'
   +'<div class="stat"><div class="stat-k">Environment</div><div class="stat-v sm mono">'+esc(env.runtime)+'</div><div class="stat-sub" title="'+esc(env.cpu)+'">'+esc(env.cpu.replace(/^.*?Core /,''))+' · '+env.cores+'c · GC '+esc(env.gc)+'</div></div>';
}

/* ============ sidebar tree ============ */
function buildTree(){
  const q=STATE.search.trim().toLowerCase();
  const dates=allActiveDates();
  // date -> suite -> [tests]
  const tree=new Map();
  for(const d of dates) tree.set(d,new Map());
  for(const t of TESTS){
    for(const d of dates){
      if(!t.byDate[d]) continue;
      // search filter: match date, suite or test
      if(q){
        const hit = d.toLowerCase().includes(q) || t.suite.toLowerCase().includes(q) || t.id.toLowerCase().includes(q);
        if(!hit) continue;
      }
      const sm=tree.get(d);
      if(!sm.has(t.suite)) sm.set(t.suite,[]);
      sm.get(t.suite).push(t);
    }
  }
  const cset=new Set(STATE.collapsed);
  const dSel=new Set(STATE.dateSel), gSel=new Set(STATE.groups);
  let h='<div class="side-title">Dates › Groups › Tests</div>';
  let any=false;
  for(const d of dates){
    const sm=tree.get(d);
    if(!sm.size) continue;
    any=true;
    const isDemo=DEMO_DATES.includes(d);
    const dKey='date:'+d;
    const dCol=cset.has(dKey);
    let testCount=0; sm.forEach(a=>testCount+=a.length);
    h+='<div class="tnode lvl-date"><div class="trow" data-toggle="'+esc(dKey)+'"><button class="tcaret" style="transform:rotate('+(dCol?-90:0)+'deg)">▼</button><span class="tcheck '+(dSel.has(d)?'on':'')+'" data-datecheck="'+esc(d)+'" title="Select date">'+(dSel.has(d)?'✓':'')+'</span><span class="tlabel">'+d+(isDemo?' <span class="demo-flag">sim</span>':'')+'</span><span class="tbadge">'+testCount+'</span></div>';
    h+='<div class="tchildren '+(dCol?'hide':'')+'">';
    for(const sk of [...sm.keys()].sort()){
      // ordena testes do grupo em ordem crescente de nome (natural: 100000 < 1000000)
      const arr=sm.get(sk).slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
      const sKey='suite:'+d+':'+sk;
      const sCol=cset.has(sKey);
      h+='<div class="tnode lvl-suite"><div class="trow" data-toggle="'+esc(sKey)+'"><button class="tcaret" style="transform:rotate('+(sCol?-90:0)+'deg)">▼</button><span class="tcheck '+(gSel.has(sk)?'on':'')+'" data-groupcheck="'+esc(sk)+'" title="Select group">'+(gSel.has(sk)?'✓':'')+'</span><span class="tlabel" title="'+esc(sk)+'">'+esc(suiteShort(sk))+'</span><span class="tbadge">'+arr.length+'</span></div>';
      h+='<div class="tchildren '+(sCol?'hide':'')+'">';
      for(const t of arr){
        const pinned=STATE.pinned.includes(t.id);
        h+='<div class="tnode lvl-test"><div class="trow" data-test="'+esc(t.id)+'"><button class="tcaret empty"></button><span class="tlabel" title="'+esc(t.name)+'">'+esc(t.name)+'</span><button class="tpin '+(pinned?'on':'')+'" data-pin="'+esc(t.id)+'" title="Pin">'+(pinned?'★':'☆')+'</button></div></div>';
      }
      h+='</div></div>';
    }
    h+='</div></div>';
  }
  if(!any) h+='<div class="side-empty">Nothing matches “'+esc(STATE.search)+'”.</div>';
  $('#tree').innerHTML=h;
  $('#sideMeta').textContent = TESTS.length+' tests · '+ALL_GROUPS.length+' groups · '+DATES.length+(DATES.length===1?' date':' dates');
}

/* ============ popovers ============ */
let openPop=null;
function closePop(){ if(openPop){ openPop.remove(); openPop=null; } }
function makePop(btn, title, items, selectedArr, onToggle){
  closePop();
  const pop=document.createElement('div'); pop.className='pop open';
  let h='<div class="pop-h">'+title+'</div>';
  for(const it of items){
    const on=selectedArr.includes(it.value);
    h+='<div class="pop-item '+(on?'on':'')+'" data-v="'+esc(it.value)+'"><span class="cb">'+(on?'✓':'')+'</span><span class="nm" title="'+esc(it.label)+'">'+esc(it.label)+'</span>'+(it.n!=null?'<span class="n">'+it.n+'</span>':'')+'</div>';
  }
  pop.innerHTML=h;
  document.body.appendChild(pop);
  const r=btn.getBoundingClientRect();
  pop.style.left=Math.min(r.left, window.innerWidth-pop.offsetWidth-12)+'px';
  pop.style.top=(r.bottom+6)+'px';
  pop.addEventListener('click',e=>{
    const it=e.target.closest('.pop-item'); if(!it) return;
    onToggle(it.dataset.v); e.stopPropagation();
  });
  openPop=pop;
}
document.addEventListener('click',e=>{
  if(openPop && !openPop.contains(e.target) && !e.target.closest('.fbtn')) closePop();
});

let toastT;
function toast(msg){

}

/* ============ export ============ */
function rowTSV(t){
  const dates=activeDates(); const lt=latestOf(t,dates); const d=deltaFor(t,dates,0);
  return [t.id, t.suite, fmtTime(lt?lt.mean:null), (d&&d.pct!=null?d.pct.toFixed(1)+'%':'new'),
    (lt&&lt.stddev!=null?fmtTime(lt.stddev):''),(lt&&lt.p99!=null?fmtTime(lt.p99):''),fmtAlloc(lt?lt.alloc:null),lt?lt.date:''].join('\t');
}
function exportAll(){
  const rows=sortRows(filtered());
  const head=['benchId','suite','mean','delta','stddev','p99','alloc','date'].join('\t');
  const txt=[head,...rows.map(rowTSV)].join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast('✓ '+rows.length+' rows copied (TSV)'),()=>toast('Copy failed'));
}

  const cp=e.target.closest('[data-copy]');
  if(cp){ const t=TESTMAP.get(cp.dataset.copy); navigator.clipboard.writeText(rowTSV(t)).then(()=>{cp.classList.add('ok');cp.textContent='✓';toast('Row copied');setTimeout(()=>{cp.classList.remove('ok');cp.textContent='⎘';},1200);}); return; }
  const gh=e.target.closest('[data-group]');
  if(gh){ const g=gh.dataset.group; const i=STATE.collapsed.indexOf(g); if(i<0)STATE.collapsed.push(g);else STATE.collapsed.splice(i,1); refresh(); return; }
});
function togglePin(id){ const i=STATE.pinned.indexOf(id); if(i<0)STATE.pinned.push(id);else STATE.pinned.splice(i,1); applyFilterBtns(); refresh(); }
/* ---- redimensionamento de colunas (Teste / Grupo / Tag) ---- */
function applyColW(){
  const c=STATE.colW||{}; const rs=document.documentElement.style;
  rs.setProperty('--cw-name',(c.name||300)+'px');
  rs.setProperty('--cw-group',(c.group||200)+'px');
  rs.setProperty('--cw-tag',(c.tag||120)+'px');
}
(function(){
  const MIN={name:120,group:90,tag:70};
  let drag=null;
  $('#tableScroll').addEventListener('mousedown',e=>{
    const h=e.target.closest('.col-resizer'); if(!h) return;
    e.preventDefault();
    const key=h.dataset.col;
    const cur=(STATE.colW&&STATE.colW[key])||parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cw-'+key))||200;
    drag={key,startX:e.clientX,startW:cur,el:h}; h.classList.add('drag');
    document.body.style.cursor='col-resize'; document.body.style.userSelect='none';
  });
  window.addEventListener('mousemove',e=>{
    if(!drag) return;
    let w=Math.round(drag.startW+(e.clientX-drag.startX));
    w=Math.max(MIN[drag.key]||80,Math.min(760,w));
    if(!STATE.colW) STATE.colW={}; STATE.colW[drag.key]=w;
    document.documentElement.style.setProperty('--cw-'+drag.key,w+'px');
  });
  window.addEventListener('mouseup',()=>{
    if(!drag) return;
    drag.el&&drag.el.classList.remove('drag'); drag=null;
    document.body.style.cursor=''; document.body.style.userSelect='';
    window.__colJustResized=true; setTimeout(()=>{window.__colJustResized=false;},0); save();
  });
})();
function afterTreeFilter(){ applyFilterBtns(); renderDash(); renderTable(); buildTree(); save(); }
function toggleDateSel(d){ const i=STATE.dateSel.indexOf(d); if(i<0)STATE.dateSel.push(d);else STATE.dateSel.splice(i,1); afterTreeFilter(); }
function toggleGroupSel(g){ const i=STATE.groups.indexOf(g); if(i<0)STATE.groups.push(g);else STATE.groups.splice(i,1); afterTreeFilter(); }

// tree interactions
$('#tree').addEventListener('click',e=>{
  const dc=e.target.closest('[data-datecheck]'); if(dc){ e.stopPropagation(); toggleDateSel(dc.dataset.datecheck); return; }
  const gc=e.target.closest('[data-groupcheck]'); if(gc){ e.stopPropagation(); toggleGroupSel(gc.dataset.groupcheck); return; }
  const pin=e.target.closest('[data-pin]'); if(pin){ e.stopPropagation(); togglePin(pin.dataset.pin); return; }
  const tog=e.target.closest('[data-toggle]');
  if(tog){ const k=tog.dataset.toggle; const i=STATE.collapsed.indexOf(k); if(i<0)STATE.collapsed.push(k);else STATE.collapsed.splice(i,1); buildTree(); save(); return; }
  const test=e.target.closest('[data-test]');
  if(test){ const id=test.dataset.test; STATE.search=splitParams(testName(id,TESTMAP.get(id).suite)).base; $('#sideSearch').value=STATE.search; renderTable(); buildTree(); save(); }
});

// resizer
(function(){
  const rz=$('#resizer'), sb=$('#sidebar'); if(!rz||!sb) return; let dragging=false;
  rz.addEventListener('mousedown',e=>{dragging=true;rz.classList.add('drag');document.body.style.cursor='col-resize';document.body.style.userSelect='none';e.preventDefault();});
  window.addEventListener('mousemove',e=>{ if(!dragging)return; let w=e.clientX - sb.getBoundingClientRect().left; w=Math.max(210,Math.min(620,w)); STATE.sidebarW=w; sb.style.width=w+'px'; });
  window.addEventListener('mouseup',()=>{ if(dragging){dragging=false;rz.classList.remove('drag');document.body.style.cursor='';document.body.style.userSelect='';save();} });
})();

window.addEventListener('keydown',e=>{
  if((e.key==='/'||(e.key==='f'&&(e.metaKey||e.ctrlKey))) && document.activeElement!==$('#sideSearch')){ e.preventDefault(); $('#sideSearch').focus(); }
  if(e.key==='Escape'){ closePop(); if(STATE.navOpen){ openNav(false); return; } if(document.activeElement===$('#sideSearch')&&STATE.search){STATE.search='';$('#sideSearch').value='';renderTable();buildTree();save();} }
});

/* ============ init ============ */
$('#sideSearch').value=STATE.search;
fullRender();
</script>



</body></html>
