elay/MpscQueueSink.Packet.cs:127`) | same packet loop shape with MPSC byte ring | 0 B | Same idle cleanup applies. |\\n| `RotatingFileSink.ShouldRotate` (`src/Relay/Sinks/RotatingFileSink.cs:84`) | post-fix predicate BDN: 13.76 ns wall; actionable delta vs old path: -8.08 ns ~= -36c | 0 B | Prior `DateTime.UtcNow.Date` regression is resolved. Full `WriteToBackend` is 66.22 ns wall and still 0 B. |\\n| Buffered `FileSink` / `TcpSink` / `NamedPipeSink` / `UnixSocketSink` | ~10-18c copy/prefix per payload; syscall on flush | 0 B/call | Healthy. |\\n| `UdpSink.WriteToBackend` (`src/Relay/Sinks/UdpSink.cs:41`) | static ~2000c syscall per payload | 0 B/call | Only optimizable by changing UDP batching semantics or using platform-specific multi-send. |\\n\\n## 3. Memory and allocation map\\n\\nSteady-state hot path allocation is 0 B/call. The meaningful memory cost is cold/startup capacity:\\n\\n| Component | Memory shape | Managed/Native | Hot-path allocation? |\\n|---|---:|---|---:|\\n| `SpscRingBuffer<T>` | `capacity * sizeof(T)` | native, 64B aligned | no |\\n| `MpscRingBuffer<T>` | `capacity * sizeof(Slot)` where slot is `int Published + T` | native, 64B aligned base | no |\\n| `SpscByteRingBuffer` / `MpscByteRingBuffer` | `capacity` bytes | pinned managed array / POH | no |\\n| Typed file/TCP write buffer | `4096 * sizeof(T)`; T=64B => 256 KiB | pinned managed array / POH | no |\\n| Packet file/TCP/pipe/unix buffers | usually ~64 KiB | pinned managed array / POH | no |\\n| `BatchSink` scratch | `batchCapacity` | pinned managed array / POH | no |\\n| `RamSink<T>` default | 8,388,608 slots; T=64B => ~512 MiB | native | no |\\n| `RamSink` packet default | 4 MiB | native | no |\\n\\nNo memory optimization is recommended for the normal hot path. Capacity tuning is deployment policy: lowering ring sizes saves memory but reduces burst tolerance and changes fallback/drop behavior.\\n\\n## 4. Possible gains, only where justified\\n\\n### G1 - Packet consumer idle clock check\\n\\n**Classification:** recommended small cleanup. It affects idle CPU/power and flush polling overhead, not payload-copy throughput.\\n\\n**Where:**\\n\\n- `src/Relay/SpscQueueSink.Packet.cs:160`\\n- `src/Relay/MpscQueueSink.Packet.cs:180`\\n\\n**Current shape:**\\n\\n```csharp\\nbool flushDue = Volatile.Read(ref _flushRequested) == 1\\n             || HfClock.NowTicks >= flushDeadline;\\nif (checkDeadline && flushDue)\\n{\\n    Volatile.Write(ref _flushRequested, 0);\\n    FlushBackend();\\n    TryRecoverBackend();\\n    TryDrainToPrev();\\n    flushDeadline = HfClock.NowTicks + _flushIntervalTicks;\\n}\\n```\\n\\nIn the spin phase, `checkDeadline` is false for most iterations, but the packet loops still call `HfClock.NowTicks` unless `_flushRequested == 1`. That contradicts the topology intent: \\\"spin phase: every 8 iters\\\". The typed loops already use the cheaper shape.\\n\\n**What to do:**\\n\\nAlign packet loops with the typed loops:\\n\\n```csharp\\nbool flushNow    = Volatile.Read(ref _flushRequested) == 1;\\nbool deadlineHit = checkDeadline && HfClock.NowTicks >= flushDeadline;\\n\\nif (flushNow || deadlineHit)\\n{\\n    if (flushNow) Volatile.Write(ref _flushRequested, 0);\\n    FlushBackend();\\n    if (deadlineHit)\\n    {\\n        TryRecoverBackend();\\n        TryDrainToPrev();\\n    }\\n    flushDeadline = HfClock.NowTicks + _flushIntervalTicks;\\n}\\n```\\n\\nIf exact current packet semantics must be preserved for `TryRecoverBackend` on manual flush, keep those calls unconditional inside the block; the important performance part is `deadlineHit = checkDeadline && ...`.\\n\\n**Expected gain:**\\n\\nUp to 8 avoided `Stopwatch.GetTimestamp` calls in the first 10 empty spin iterations when there is no explicit flush request. Using the cost map's ~20c per `HfClock.NowTicks`, that is up to ~160c saved per empty spin cycle. Memory gain: none.\\n\\n### G2 - SharedMemorySink contiguous-write fast path\\n\\n**Classification:** conditional; worth implementing only if `SharedMemorySink` is a real high-rate path.\\n\\n**Where:**\\n\\n- `src/Relay/Sinks/SharedMemorySink.cs:88` (`Accept`)\\n- `src/Relay/Sinks/SharedMemorySink.cs:119` (`WriteRing`)\\n\\n**Current shape:**\\n\\nAfter reserving with CAS, every payload uses a `stackalloc byte[4]` length buffer plus two modular `WriteRing` calls, even when the frame is fully contiguous in the MMF data area.\\n\\n**What to do:**\\n\\nAdd a common-case branch after the CAS reservation:\\n\\n```csharp\\nbyte* data = _ptr + HEADER_SIZE;\\nif (oldIdx + frameLen <= _dataCapacity)\\n{\\n    BinaryPrimitives.WriteInt32BigEndian(new Span<byte>(data + oldIdx, 4), payload.Length);\\n    payload.CopyTo(new Span<byte>(data + oldIdx + 4, payload.Length));\\n    return true;\\n}\\n\\n// existing wrapped path\\nSpan<byte> lenBuf = stackalloc byte[4];\\nBinaryPrimitives.WriteInt32BigEndian(lenBuf, payload.Length);\\nWriteRing(data, _dataCapacity, oldIdx, lenBuf);\\nWriteRing(data, _dataCapacity, (oldIdx + 4) % _dataCapacity, payload);\\nreturn true;\\n```\\n\\n**Expected gain:**\\n\\nMeasured current cost is ~11.79 ns for 64B and ~13.96 ns for 256B, 0 B allocated. The unavoidable part is the CAS plus payload copy; the avoidable part is stackalloc + two modular `WriteRing` loops in the non-wrap case. A realistic target is a small single-digit ns gain (~5-15c) on contiguous writes, gated by BDN. Memory gain: none.\\n\\n### G3 - UDP batching is a protocol-level option, not a transparent fix\\n\\n**Classification:** conditional; do not implement as a default replacement.\\n\\n**Where:**\\n\\n- `src/Relay/Sinks/UdpSink.cs:41`\\n\\n**Current shape:**\\n\\n`UdpSink.WriteToBackend` emits one UDP datagram per payload, so the consumer pays a syscall per delivered record. The static model estimates ~2000c per record. The existing BDN push benchmark measures producer-side enqueue/saturation, not delivered datagrams, so it cannot prove wire throughput.\\n\\n**What to do first:**\\n\\nAdd a delivered-count benchmark or receiver-side counter before changing code. If the wire protocol can accept multiple logical payloads in one UDP datagram, add a separate opt-in sink that batches length-delimited payloads up to MTU / `maxPayload`. Do not silently change `UdpSink` datagram semantics.\\n\\n**Expected gain if protocol allows batching:**\\n\\nSyscall cost can be amortized from ~2000c per payload to roughly ~2000c per batch plus framing/copy cost. Memory impact would be one reusable send buffer. Without protocol permission, expected safe gain is zero.\\n\\n## 5. Non-gains rejected by this pass\\n\\n| Candidate | Decision |\\n|---|---|\\n| `RotatingFileSink.Cleanup` LINQ allocation | Cold rotation path only; not hot-path memory. |\\n| Padding `MpscRingBuffer<T>.Slot` to a full cache line | Could double ring memory and the phase 7 data points at CAS contention first. Not justified without a slot-layout experiment. |\\n| Moving packet byte rings from pinned arrays to native memory | No per-call allocation today; added unsafe complexity has no proven cycle win. |\\n| Replacing packet `MultiSink` with `Multi2PacketSink` for speed | Phase 6 shows packet `Multi2` was slightly slower at N=2, though smaller in code size. |\\n| Lowering default ring capacities in code | This is workload policy, not a universal performance fix. Tune constructor values per deployment. |\\n\\n## 6. Recommended next actions\\n\\n1. Implement G1 if idle CPU matters for packet sinks; it is local and low risk.\\n2. Implement G2 only behind a BDN gate for `SharedMemorySinkBenchmarks.Accept_Single`.\\n3. Treat G3 as a protocol/project decision. Add delivered-count measurement before any UDP batching design.\\n4. Keep the zero-allocation invariant as a release gate for all hot-path benchmarks.\", \"/docs/reports/2026-04-26-hot-path-audit-relay.md\": \"# Hot Path Audit — Relay (v3)\\n\\n**Date:** 2026-04-26\\n**Scope:** `src/Relay/**` + `src/Relay.Sinks.Http/**` + `src/Relay.Sinks.Observability/**`\\n**Auditor:** Claude Opus 4.7 / hot-path-audit (generic) skill\\n**Prior reports:** `2026-04-23-hot-path-audit-relay.md` (v1), `2026-04-23-hot-path-audit-relay-v2.md` (v2)\\n**Benchmarks consulted:** `BenchmarkDotNet.Artifacts/results/*` (24-25 Apr); fresh smoke run on `EnqueueBenchmarks`\\n\\n---\\n\\n## Delta vs v2\\n\\nThree days of Phase 3.0 work landed (commits `f1887a9` → `a9e6316`):\\n\\n| Area | Change |\\n|---|---|\\n| Buffers | `SpscRingBuffer<T>` now allocates via `NativeMemory.AlignedAlloc(64)` (was POH array) — slot @ cache-line boundary guaranteed for sizeof(T)≥64. v2 finding A4 (BCE) supersededby unsafe pointer indexing `_basePtr[tail & _mask]`. |\\n| Buffers | `SpscRingBuffer<T>` adds **producer `_cachedHead`** + **consumer `_cachedTail`** snapshots — eliminates cross-core `Volatile.Read` on the SPSC fast path (prior pattern only existed on MPSC). |\\n| Buffers | `TryPublishBatch`, `TryConsumeBatch` added — N writes/reads per single fence. |\\n| Pipes | `MpscQueueSink<T>` added (mirrors SPSC contract; per-slot `Published` flag, FIX #18 layout). |\\n| Pipes | `BatchSink` (POH scratch + accumulator) added. |\\n| Sinks | `Relay.Sinks.Http.HttpBatchSink` (POST + circuit breaker), `Relay.Sinks.Observability.Seq.SeqSink` (CLEF), `RotatingFileSink`, `NamedPipeSink`, `UnixSocketSink`, `SharedMemorySink`, `UdpSink` — all new. |\\n| Tests | `MmfPipe`/`TcpPipe`/`FilterPipe` test gaps from v2 still **OPEN**. |\\n| Bench | `MpscBenchmarks`, `ByteRingBufferBenchmarks`, `MultiEnqueueBenchmarks`, `PropagateBenchmarks`, `FilterPipeBenchmarks`, `QueuePipeThroughputBenchmarks` artifacts present (24 Apr). |\\n\\n---\\n\\n## Hot Paths (current)\\n\\n| File | Justification |\\n|---|---|\\n| `DispatchSink.cs` `Enqueue` | Tick-rate entry — every item passes through. |\\n| `Buffers/SpscRingBuffer.cs` `TryPublish/TryConsume/TryPublishBatch/TryConsumeBatch` | SPSC ring fast path. |\\n| `Buffers/MpscRingBuffer.cs` `TryPublish/TryConsume/TryConsumeBatch` | MPSC ring fast path. |\\n| `Buffers/SpscByteRingBuffer.cs`, `MpscByteRingBuffer.cs` | Packet-sink ring fast path. |\\n| `SpscQueueSink.cs` `Accept`, `EnqueueBatch`, `ConsumeLoop` | Producer enqueue + consumer drain. |\\n| `MpscQueueSink.cs` `Accept`, `ConsumeLoop` | Producer CAS + consumer drain. |\\n| `ForkSink.cs`, `MultiSink.cs` (and `Multi2Sink`), `FilterSink.cs` | Composition operators on every Enqueue. |\\n| `BatchSink.cs` `WriteToBackend`, `FlushScratch` | Consumer-thread accumulator. |\\n\\nThe new HTTP / Seq / Rotating sinks live downstream of `BatchSink`/`SpscQueueSink`; they are **consumer-thread only** and not on the producer hot path.\\n\\n---\\n\\n## Findings\\n\\n### NEW REGRESSION — F21/G23 — `MpscQueueSink.Flush()` calls `FlushBackend()` on producer thread (HIGH)\\n\\n**Location:** `src/Relay/MpscQueueSink.cs:122`\\n```csharp\\npublic override void Flush() => FlushBackend();\\n```\\n\\n**Problem.** `FlushBackend` is a backend-touching method (file/socket/IO) that the consumer thread also invokes from `ConsumeLoop` (line 180). Producer thread invocation introduces:\\n1. **Concurrent backend access** — file `FileStream.Flush`, socket `Send`, MMF `accessor.Flush` are not safe under concurrent calls without synchronization. Race / corruption / `IOException`.\\n2. **Blocking syscall on producer** — the producer thread blocks for kernel I/O latency while the consumer thread can also be inside the same syscall. Defeats the entire async-delivery design.\\n3. **Inconsistency vs SPSC** — `SpscQueueSink.Flush()` (line 147) correctly signals via `_flushRequested` flag, picked up by the consumer loop. The MPSC variant skipped this pattern.\\n\\n**Why it matters.** MPSC use-case is multi-producer; one producer calling `Flush()` while N others call `Enqueue()` and the consumer is mid-flush is a 3-way race over a non-thread-safe backend.\\n\\n**Fix.**\\n```csharp\\nprivate int _flushRequested;\\n\\npublic override void Flush() => Volatile.Write(ref _flushRequested, 1);\\n\\n// in ConsumeLoop:\\nbool flushNow = Volatile.Read(ref _flushRequested) == 1;\\nif (flushNow || (checkDeadline && HfClock.NowTicks >= flushDeadline))\\n{\\n    if (flushNow) Volatile.Write(ref _flushRequested, 0);\\n    FlushBackend();\\n    ...\\n}\\n```\\n\\nMirror exactly the SPSC pattern. Status: **OPEN — fix recommended in next commit.**\\n\\n---\\n\\n### NEW — A1 (resolved differently) — SPSC ring `_cachedHead`/`_cachedTail` (✅)\\n\\nThe v2 audit's hot-path cycle math focused on `IsHealthy`. The current implementation now caches head/tail on producer/consumer threads (`SpscRingBuffer.cs:33-35`), so the steady-state `TryPublish` path skips `Volatile.Read(_head)` entirely until the cache predicts ring-full. Same for `TryConsume`.\\n\\nPer smoke run: `EnqueueBenchmarks.Depth1_Healthy` ≈ 0.9 ns (24 Apr artifact). 0.9ns × 4.6 GHz ≈ **4 cycles** for the full Enqueue → IsHealthy → TryPublish path on a healthy depth-1 chain. Matches CLAUDE.md cycle budget.\\n\\n**Status: ✅ better than v2 reported.**\\n\\n---\\n\\n### NEW — C9 — `BatchSink.WriteToBackend` swallows oversized payload silently from caller perspective (LOW — by contract)\\n\\n`BatchSink.cs:46-50` — drop counter incremented (`Volatile.Read` exposed as `OversizedDropCount`), no exception, no `Next?.Enqueue` propagation. **By design** per Phase 3.0 spec: oversize is producer-error. Caller must size scratch ≥ max payload.\\n\\n**Status: ℹ️ Documented; no action needed.**\\n\\n---\\n\\n### NEW — F21 — `BatchSink._scratch` / `_offset` mutated on consumer thread only (✅)\\n\\nBoth fields touched only inside `WriteToBackend` and `FlushBackend`, both abstract-overridden methods called from the inherited `SpscQueueSink<byte>`'s consumer loop. Single-threaded by base contract. No fence needed. **Status: ✅ correct.**\\n\\n---\\n\\n### NEW — H24c — `MpscRingBuffer<T>.TryConsumeBatch` allocates zero (✅) but per-slot fence cost amortizes worse than SPSC\\n\\n`MpscRingBuffer.cs:159-177` — each slot still incurs `Volatile.Read(Published)` + `Volatile.Write(Published, 0)` per item. Only the **head update** is amortized to one `Volatile.Write` at end of batch. SPSC `TryConsumeBatch` saves more: *all* per-slot fences gone.\\n\\n**Status: ⚠️ Documented in code comment (`MpscRingBuffer.cs:153-156`). Architectural — per-slot Published flag is the cost of MPSC algorithm. No change unless BDN shows this dominates.**\\n\\n---\\n\\n### CARRIED FROM v2 — open items\\n\\n| ID | File | Issue | Status |\\n|----|------|-------|--------|\\n| H24a | `FilterSink.cs` | Predicate-fail → not-to-Next invariant has no test | **OPEN** |\\n| H24c | `MmfSink.cs` | Zero test coverage | **OPEN** |\\n| H24d | `TcpSink.cs` | Zero test coverage | **OPEN** |\\n| H26  | All | No stress tests | **OPEN** |\\n| F22  | `SpscQueueSink.Start` | No core-affinity API | **OPEN** (LOW) |\\n| M2   | `TryDrainToPrev` | SPSC race on producer-resume | **OPEN/Documented** |\\n\\n`FilterPipeBenchmarks` artifact exists (24 Apr) — covers perf, not correctness invariant.\\n`QueuePipeThroughputBenchmarks` artifact exists — partial coverage of MmfPipe/TcpPipe behaviour via fan-out.\\n\\n---\\n\\n### NEW — H24a (Phase 3 sinks) — `BatchSink`, `HttpBatchSink`, `SeqSink`, `RotatingFileSink`, `NamedPipeSink`, `UnixSocketSink`, `SharedMemorySink`, `UdpSink` test coverage gap (HIGH)\\n\\nPhase 3.0 added 8 sinks. None has dedicated tests for:\\n- Backend failure → `_healthy = false` → fallback path\\n- Recovery → `_healthy = true` → `TryDrainToPrev`\\n- HttpBatchSink circuit-breaker state machine (open/half-open/closed)\\n- BatchSink oversized drop counting under burst\\n- RotatingFileSink rotation race (concurrent timer trigger + consumer write)\\n\\n**Status: OPEN.** Phase 3 spec acknowledged this; tests deferred. Block before Phase 3 graduation.\\n\\n---\\n\\n### NEW — A4 (resolved) — Bounds check elimination via unsafe pointer (✅)\\n\\nv2's A4 concern was `_buffer[x & _mask]` triggering BCE failure. Current code uses `_basePtr[tail & _mask]` where `_basePtr` is `T*` — **no bounds check possible by definition**. Eliminated.\\n\\n**Status: ✅ resolved by NativeMemory migration.**\\n\\n---\\n\\n### NEW — C12 — `_consumeBuf` is POH-pinned BatchSize=256 array per pipe (✅)\\n\\n`SpscQueueSink.cs:73`, `MpscQueueSink.cs:74` — `GC.AllocateArray<T>(BatchSize, pinned: true)`. Single allocation per pipe, lives for the life of the pipe, never reallocated. Stable address for native interop. **Correct pooling.**\\n\\n---\\n\\n### NEW — C16 — `BatchSink.OnFlush` handles `try/finally` per flush (LOW — informational)\\n\\n`BatchSink.cs:75-76` — `try { OnFlush(...); } finally { _offset = 0; }`. The `try`/`finally` prevents JIT inlining of `OnFlush` only inside `FlushScratch`, but `FlushScratch` itself is `[AggressiveInlining]` and only called from 2 sites. Cost: ~1 prologue/epilogue per flush boundary. Negligible at flush cadence (ms). **No action.**\\n\\n---\\n\\n## Summary Table\\n\\n| ID | Severity | Component | Issue | Status |\\n|---|---|---|---|---|\\n| **NEW H1** | **HIGH** | `MpscQueueSink.Flush()` | Calls `FlushBackend` on producer thread — race + blocking | **OPEN** |\\n| NEW A1 | — | `SpscRingBuffer` cached head/tail | Eliminates cross-core volatile read on fast path | ✅ |\\n| NEW A4 | — | `SpscRingBuffer._basePtr[]` | Unsafe pointer kills BCE concern | ✅ |\\n| NEW H24a | HIGH | 8 Phase 3 sinks | Zero test coverage | OPEN |\\n| NEW C12 | — | `_consumeBuf` | POH array, single alloc — correct | ✅ |\\n| NEW C9 | INFO | `BatchSink` oversized drop | By contract | ✅ |\\n| NEW F21b | — | `BatchSink._scratch` | Consumer-thread only — correct | ✅ |\\n| Carried H24a | MED | `FilterSink` invariant | Untested | OPEN |\\n| Carried H24c | HIGH | `MmfSink` | Zero test coverage | OPEN |\\n| Carried H24d | HIGH | `TcpSink` | Zero test coverage | OPEN |\\n| Carried H26 | HIGH | All | No stress tests | OPEN |\\n| Carried F22 | LOW | `SpscQueueSink.Start` | No core-affinity API | OPEN |\\n| Carried M2 | MED | `TryDrainToPrev` | SPSC race window on resume | OPEN/Documented |\\n\\n---\\n\\n## Benchmark Validation\\n\\n### `EnqueueBenchmarks` — 24 Apr artifact vs 26 Apr smoke (Intel i7-12700, ShortRun)\\n\\n| Method | 24 Apr Mean | 26 Apr Mean | Δ |\\n|---|---|---|---|\\n| `Depth1_Healthy` | 0.90 ns | **0.22 ns** | −76% (within ShortRun noise floor; both effectively measuring loop overhead — JIT now inlines deeper) |\\n| `Depth2_AcceptReject` | 2.28 ns | 4.05 ns | +78% (regression candidate — verify with longer run; could be ShortRun variance, code size 274 vs 250 B suggests body grew) |\\n| `Depth2_HeadUnhealthy` | 0.68 ns | 1.71 ns | +151% (likely ShortRun noise; both sub-2ns) |\\n| `Depth3_AllUnhealthy` | 3.11 ns | 2.02 ns | −35% |\\n\\n**Caveat:** ShortRun (3 iterations × 3 warmup) has visible jitter at sub-ns scale. Recommendation: re-run with `--job medium` (8 iterations, 5 warmup) for definitive numbers. The Depth1 path is essentially loop overhead at this scale. The Depth2_AcceptReject delta is the only one worth investigating with a longer run.\\n\\n### `ByteEnqueueBenchmarks` — 26 Apr smoke (parallel hierarchy)\\n\\n| Method | Mean | Code Size |\\n|---|---|---|\\n| `Depth1_Byte_Healthy` | 0.20 ns | 422 B |\\n| `Depth2_Byte_AcceptReject` | 3.05 ns | 423 B |\\n| `Depth2_Byte_HeadUnhealthy` | 3.59 ns | 437 B |\\n| `Depth3_Byte_AllUnhealthy` | 3.27 ns | 453 B |\\n\\nThe byte (`PacketSink`) hierarchy carries the same fast-path shape — Depth1 collapses to loop overhead.\\n\\n### `MultiEnqueueBenchmarks` — 26 Apr smoke\\n\\n| Method | Mean | Code Size |\\n|---|---|---|\\n| `Multi_Enqueue` (array) | 3.18 ns | 313 B |\\n| `Multi2_Enqueue` (CRTP, sealed children) | 3.17 ns | 293 B |\\n\\nCLAUDE.md claimed Multi2 saves ~6c (~1.3 ns) by devirtualizing both children. **Measurement does not show this gain at depth 2.** Ratio 0.99 — within noise. Either the JIT already devirtualizes the array variant via PGO, or the savings only materialize at deeper child trees. Worth a Phase 4 investigation.\\n\\nCLAUDE.md cycle budget — `Successful Enqueue (depth 1) ~32c`. At 4.6 GHz: 32c ≈ 6.9 ns. **Measurement is ~4× better than budget — budget is conservative.** Recommendation: update CLAUDE.md cycle budget to reflect post-A1 reality.\\n\\n### `MpscBenchmarks.MpscRingBuffer.TryPublish` (no contention, Capacity=1024)\\n\\n| Method | Mean | Ratio vs SPSC |\\n|---|---|---|\\n| `Spsc_TryPublish_Baseline` | 1.12 ns | 1.00 |\\n| `Mpsc_TryPublish_NoContention` | 6.47 ns | **5.76×** |\\n\\nCAS overhead is the entire delta (~5 ns ≈ 23 cycles for `LOCK CMPXCHG`). Matches Intel published cost. No regression.\\n\\n### Open BDN gaps\\n\\n- `BatchSink` — no benchmark suite. Allocation invariants and oversized-drop hot path unverified.\\n- `HttpBatchSink` — no benchmark. Circuit-breaker state transitions and POST batching unmeasured.\\n- `MpscByteRingBuffer` — has `MpscBenchmarks` artifact; coverage limited to `TryPublish_Full` / `TryConsume_Empty`. No throughput-under-contention bench.\\n\\n---\\n\\n## Category Scores\\n\\n| Group | v2 | v3 | Δ | Notes |\\n|---|---|---|---|---|\\n| A. CPU & Computation | 8 | **9** | +1 | A1 + A4 resolved via NativeMemory + cached head/tail |\\n| B. Memory Layout | 10 | **10** | — | NativeMemory.AlignedAlloc(64) cements 64B-aligned slot start |\\n| C. Allocation & GC | 10 | **10** | — | POH `_consumeBuf`, POH `_scratch` correct |\\n| D. Language Runtime | 9 | **9** | — | No change |\\n| E. Compiler & JIT | 8 | **9** | +1 | Sealed `PropagateAfterAccept` constants devirtualize via JIT |\\n| F. Concurrency | 9 | **6** | **−3** | **MpscQueueSink.Flush race**; M2 carried; new sinks unverified |\\n| G. System Boundary | 9 | **8** | −1 | MpscQueueSink.Flush invokes syscall on producer thread |\\n| H. Test Validation | 5 | **4** | −1 | 8 new sinks added without tests; carried gaps unresolved |\\n\\n---\\n\\n## Verdict\\n\\n**Performance: STRONGER than v2.** The buffer-layer migration to `NativeMemory.AlignedAlloc` + producer/consumer cache snapshots delivers measured Depth-1 Enqueue at 0.9 ns. The cycle budget in CLAUDE.md is now conservative.\\n\\n**Correctness: ONE NEW HIGH-SEVERITY REGRESSION.** `MpscQueueSink.Flush()` directly invokes `FlushBackend` on the producer thread — race against the consumer loop and against concurrent producers. Must be fixed before MPSC is recommended in production.\\n\\n**Tests: REGRESSION.** 8 new sinks without dedicated coverage. Phase 3 acceptance criteria did not include test gates.\\n\\n### Priority queue (ordered)\\n1. **(HIGH)** Fix `MpscQueueSink.Flush()` to use `_flushRequested` signal — mirror SPSC pattern.\\n2. **(HIGH)** Add `BatchSinkTests`, `HttpBatchSinkTests`, `SeqSinkTests`, `RotatingFileSinkTests`.\\n3. **(HIGH)** Add `MmfSinkTests`, `TcpSinkTests`, `FilterSinkTests` (predicate-fail invariant).\\n4. **(HIGH)** Add stress test suite (1+ minute runs, memory-growth gates).\\n5. **(MEDIUM)** Add `BatchSinkBenchmarks`, `HttpBatchSinkBenchmarks`.\\n6. **(MEDIUM)** Update CLAUDE.md cycle budget — Enqueue depth-1 is ~4c, not 32c.\\n7. **(LOW)** `SpscQueueSink.Start(coreAffinity)` opt-in.\\n\\n---\\n\\n…(truncated)\", \"/docs/superpowers/specs/2026-04-30-release-skills-design.md\": \"# Design: Solution Release Skills\\n\\n**Date:** 2026-04-30\\n**Status:** Implemented\\n**Scope:** Global (`~/.claude/skills/`) — applicable to any .NET solution\\n\\n---\\n\\n## Context\\n\\nRelay is a private .NET library targeting GitHub Packages. Before this work, no CI/CD\\ninfrastructure existed, no NuGet metadata was defined in any `.csproj`, and no release\\nprocess was documented. The goal was a reusable, sequenced process for any .NET solution\\n(1–N publishable projects) covering validation, merge, packaging, and publication.\\n\\n---\\n\\n## Three-Skill Architecture\\n\\n```\\n/release-1-checklist <version>   →   /release-2-merge-master   →   /release-3-execute\\n (develop)                               (develop → master)           (master)\\n Validates gates                          Safe merge                  Pack → publish\\n Produces release-action.md              Reads version from file      Tag → GitHub Release\\n                                                                       Back-merge develop\\n```\\n\\nEach skill has a single responsibility and a hard pre-condition on the previous one's\\noutput. They can also be run independently (e.g., checklist without publishing).\\n\\n---\\n\\n## Skill Summaries\\n\\n### `/release-1-checklist` (modified from existing)\\n\\n**File:** `~/.claude/skills/release-1-checklist/SKILL.md`\\n\\nGate validation skill. Accepts version as optional argument (`/release-1-checklist 1.0.0`).\\nRuns: git state, build, tests, documentation gates, version source check, sensitive file scan.\\n\\n**Additions over original:**\\n- Version argument handling (skips interactive Step 1 when arg provided)\\n- Gate **5e** — TOPOLOGY.md (explicit, conditional on CLAUDE.md)\\n- Gate **5f** — Benchmark report (informative/WARN, never blocks)\\n- `Version:` field in `release-action.md` header\\n- Merge Steps updated to point to `/release-2-merge-master`\\n\\n### `/release-2-merge-master` (new)\\n\\n**File:** `~/.claude/skills/release-2-merge-master/SKILL.md`\\n\\nMerge-only skill. Pre-condition: `release-action.md` with all gates PASS or N/A.\\nReads version from file, validates git state on both branches, executes `--no-ff` merge,\\npushes master, returns to develop.\\n\\n### `/release-3-execute` (new)\\n\\n**File:** `~/.claude/skills/release-3-execute/SKILL.md`\\n\\nFull publish skill. Pre-condition: master branch, clean tree, `release-action.md` PASS.\\nFive phases:\\n\\n| Phase | Action |\\n|---|---|\\n| 0 — Detect | Discover publishable projects, GitHub owner/repo |\\n| 1 — Pre-flight | Verify release-action.md, branch, working tree |\\n| 2 — Setup (idempotent) | `Directory.Build.props`, SourceLink, workflows, `PackageId` |\\n| 3 — Release notes | Parse CHANGELOG → condense → `release-notes.md` → user approval |\\n| 4 — Execute | Build → test → pack → publish → tag → GitHub Release → back-merge |\\n\\n---\\n\\n## GitHub — One-time Manual Configuration\\n\\n| Setting | Location | Value |\\n|---|---|---|\\n| Workflow permissions | Settings → Actions → General | Read and write |\\n| Branch protection — master | Settings → Branches | Require `build` CI, up to date, no bypass |\\n| Branch protection — develop | Settings → Branches | Same as master |\\n\\n---\\n\\n## NuGet Metadata (created by Phase 2 of release-3-execute)\\n\\n`Directory.Build.props` — shared across all publishable projects:\\n\\n```xml\\n<Authors>, <PackageLicenseExpression>, <RepositoryUrl>, <RepositoryType>\\n<Deterministic>, <IncludeSymbols>, <SymbolPackageFormat>snupkg\\n<EmbedUntrackedSources>, <PublishRepositoryUrl>\\n<ContinuousIntegrationBuild Condition=\\\"GITHUB_ACTIONS\\\">\\n```\\n\\nPer-project: `<PackageId>` + `Microsoft.SourceLink.GitHub` (`PrivateAssets=All`).\\n\\n---\\n\\n## GitHub Actions Workflows (created by Phase 2)\\n\\n| Workflow | Trigger | Actions |\\n|---|---|---|\\n| `build.yml` | push/PR to develop or master | `dotnet build -warnaserror` + `dotnet test` |\\n| `release.yml` | push of tag `v*` | build → test → pack → push to GitHub Packages |\\n\\n---\\n\\n## Version Strategy\\n\\nTag-based, manual:\\n\\n1. `/release-1-checklist 1.0.0` → version flows into `release-action.md`\\n2. `/release-2-merge-master` + `/release-3-execute` read version from file\\n3. Tag `v1.0.0` created by Phase 4, triggering `release.yml` on GitHub\\n\\nNo version property in files — single source of truth is the git tag.\\n\\n---\\n\\n## Consuming the Package (other projects)\\n\\n`nuget.config` required with GitHub Packages source + PAT (`read:packages` scope).\\nSnippet generated and displayed by `/release-3-execute` Phase 2g.\\n\\n---\\n\\n## Verification End-to-End\\n\\n```bash\\n# 1. On develop\\n/release-1-checklist 0.1.0\\n# → release-action.md with gates 5e, 5f present\\n\\n# 2.\\n/release-2-merge-master\\n# → merge commit \\\"release: v0.1.0 w/Claude\\\", returns to develop\\n\\n# 3. On master (after merge)\\n/release-3-execute\\n# → Phase 2: creates Directory.Build.props, workflows, SourceLink\\n# → Phase 3: generates release-notes.md, awaits approval\\n# → Phase 4: publishes, tags, creates GitHub Release, back-merges\\n```\\n\\nVerify at: `github.com/<owner>/Relay/packages`, `/releases`, Actions tab.\", \"/docs/reports/2026-05-25-hot-path-audit-relay.md\": \"# Hot-Path Audit — Relay core (2026-05-25)\\n\\n**Scope:** `DispatchSink.cs`, `SpscQueueSink.cs`, `MpscQueueSink.cs`, `RotatingFileSink.cs`\\n**Trigger:** Changes since last audit (2026-04-30) — gate 5h of release v1.0.2 checklist\\n**Date:** 2026-05-25\\n**Runtime:** .NET 9.0.14, X64 RyuJIT AVX2, i7-12700\\n\\n---\\n\\n## Hot-Path Identification\\n\\n| Path | Qualification |\\n|---|---|\\n| `DispatchSink<T>.Enqueue` → `IsHealthy` → `Accept` → `Next?.Enqueue` | Called at tick-rate frequency; CLAUDE.md: ~32c budget |\\n| `SpscQueueSink<T>.Accept` → `_ring.TryPublish` | ~25c budget; lock-free volatile write |\\n| `MpscQueueSink<T>.Accept` → `_ring.TryPublish` | ~25c budget; CAS per write |\\n| `SpscQueueSink<T>.ConsumeLoop` batch drain | Consumer thread; `TryConsumeBatch` + `WriteToBackend` per item |\\n| `RotatingFileSink.ShouldRotate` | Consumer thread; per-record predicate via `HfClock.NowTicks` |\\n\\nCold paths not audited: constructors, `Start()`, `Stop()`, `Dispose()`, `TryRecoverBackend`, `TryDrainToPrev`.\\n\\n---\\n\\n## Changes Audited (since 2026-04-30)\\n\\n| Commit | Change |\\n|---|---|\\n| `da425c1` | Add opt-in `threadPriority` + `affinityCpu` params to `SpscQueueSink<T>` + `MpscQueueSink<T>` ctors |\\n| `7555a76` | Remove dead code in `PinLinux`; tighten `ThreadAffinity` pin test |\\n| `5ec6cce` | Enforce cache-line alignment in Release; fix `DispatchSink` XML doc |\\n| `925acac` | Revert: restore `HfClock`-tick rotation check in `RotatingFileSink` (prior revert of perf fix) |\\n| `this` | Inject `Func<DateTime>` in `RotatingFileSink` — removes `DateTime.UtcNow` from all methods |\\n| `1321d6c` | Guard bypass path against unhealthy-but-open connection (TcpSink) |\\n| `ec2d019` | Loop `Send/Write` in packet sinks for partial-send correctness |\\n| `a29c69f` | Guard oversized payload in fixed-buffer sinks |\\n| `15face0` | Enforce SPSC publish ordering in `SharedMemorySink` |\\n\\n---\\n\\n## Findings\\n\\n### A. CPU & Computation\\n\\n**A1 — CPU Cycles:** PASS\\n`Enqueue` path: `IsHealthy` volatile read (~7c) → short-circuit `&&` → `Accept` virtual call (devirtualized when sealed) → `TryPublish` (~25c). No redundant computation.\\n\\n`PropagateAfterAccept` correctly stored as `readonly bool` field (not virtual property), eliminating one vtable slot and one indirect call per `Enqueue`.\\n\\n**A2 — Branch Prediction:** PASS\\nOn healthy steady-state: `IsHealthy = true` → predictable taken. `PropagateAfterAccept = false` → constant; JIT folds `!false` → `if (accepted) return` → predictable taken. `Next?.Enqueue` → null-check is data-stable per chain depth.\\n\\n**A3 — SIMD:** N/A — dispatch routing, not numeric.\\n\\n**A4 — Bounds Check Elimination:** N/A — ring buffer BCEs audited in ring-buffer reports.\\n\\n---\\n\\n### B. Memory Layout & Access\\n\\n**B5 — Cache Locality:** PASS\\nNew fields `_threadPriority` (`ThreadPriority` = 4B) and `_affinityCpu` (`int` = 4B) added to `SpscQueueSink<T>` and `MpscQueueSink<T>`. Both are `readonly`, initialized in constructor, accessed only from `Start()` (cold path). Hot-path fields (`_healthy`, `_ring`) are unaffected.\\n\\n**B6 — False Sharing:** PASS\\n`SpscRingBuffer<T>` and `MpscRingBuffer<T>` use 128-byte `PaddedLong` for head/tail — unchanged. Sink class instance layout is unordered (heap object); `_healthy` (volatile bool, producer-read / consumer-write) and `_running` (volatile bool, producer-write / consumer-read) are separate fields without explicit layout, but on a reference-type object their inter-field proximity is JIT-dependent and not altered by these changes.\\n\\n**B7 — Memory Access Patterns:** PASS\\n`ConsumeLoop` batch drain: `TryConsumeBatch` fills `_consumeBuf` (POH-pinned `T[]`), then iterates sequentially — forward stride, hardware-prefetcher friendly.\\n\\n**B8 — Indirection:** PASS\\n2 levels on hot path: sink → ring `PaddedLong` head/tail → POH-pinned `T[]` slot. Unchanged by these changes.\\n\\n---\\n\\n### C. Allocation & GC\\n\\n**C9 — Zero-Allocation:** PASS\\n`Enqueue` → `Accept` → `TryPublish`: no allocation. `Next?.Enqueue` null-conditional: compiler emits conditional branch, no delegate allocation. Confirmed by BDN `[MemoryDiagnoser]`.\\n\\nNew `Func<DateTime> _utcNow` in `RotatingFileSink`: default is `(static () => DateTime.UtcNow)` — static lambda, no closure, no per-call allocation. Called only at rotation events (cold path).\\n\\n**C10 — GC Pressure:** PASS\\nPOH-pinned arrays (`_consumeBuf`, `_writeBuffer`) prevent GC scan. No new hot-path allocations.\\n\\n**C11 — Boxing:** PASS\\n`where T : unmanaged` constraint prevents boxing on all generic paths. `ThreadPriority` enum stored as `readonly ThreadPriority` field — no boxing in constructor or `Start()`.\\n\\n---\\n\\n### D. Language Runtime\\n\\n**D13 — Value Types:** PASS\\n`in T item` in `Enqueue` and `Accept` passes by reference — no struct copy on hot path.\\n\\n**D14 — Closures/Delegates:** PASS\\n`(static () => DateTime.UtcNow)` in `RotatingFileSink` constructor: C# 9+ static lambda — no closure allocation. Stored as `readonly Func<DateTime>` field — one heap word, initialized once.\\n\\n**D19 — Inlining:** PASS\\n`[AggressiveInlining]` present on `Enqueue`, `Accept` (SpscQueueSink + MpscQueueSink), and `TryPublish` / `TryConsume` (ring buffers). No method body growth from these changes.\\n\\n**D20 — Static/Const Propagation:** PASS\\n`PropagateAfterAccept = false` is a `readonly bool` load from the object; JIT reads this at JIT time for sealed types where it can prove the value, folding the branch.\\n\\n---\\n\\n### E. Compiler & JIT\\n\\nNo JIT-specific regressions observed. Added fields are cold-path; no IL size increase in hot methods.\\n\\n---\\n\\n### F. Concurrency\\n\\n**F21 — Lock-Free:** PASS\\nNo `lock`, `Monitor`, or `Mutex` on any path. `_flushRequested`: `Volatile.Read/Write` pair. `_healthy`: `volatile bool`. `_running`: `volatile bool`. `TryPublish` (SPSC): `Volatile.Write(tail)`. `TryPublish` (MPSC): `Interlocked.Add` CAS. Unchanged by these changes.\\n\\n**F22 — Thread Affinity:** PASS\\nNew `affinityCpu` parameter: consumed exclusively inside `ConsumeLoop()` at thread startup (`if (_affinityCpu >= 0) ThreadAffinity.Pin(_affinityCpu)`). Cold path — no hot-path impact. Best-effort pin; failure is silent, thread runs unpinned.\\n\\n---\\n\\n### G. System Boundary\\n\\n**G23 — Syscall:** PASS\\n`HfClock.NowTicks` = `Stopwatch.GetTimestamp()` = `QueryPerformanceCounter` (user-space on Win, `rdtsc`-derived on Linux). ~25c, no kernel transition per call. `RotatingFileSink.ShouldRotate` correctly uses HfClock ticks (not `DateTime.UtcNow`) for the per-record predicate.\\n\\n`DateTime.UtcNow` now isolated to the default `Func<DateTime>` factory in `RotatingFileSink` — called only at rotation events (cold path).\\n\\n---\\n\\n### H. Tests\\n\\n**H24 — Unit Tests:** PASS — 209 tests, 0 failures.\\n\\n**H25 — Integration Tests:** PASS — chain, SPSC/MPSC pipeline, fallback, recovery drain all covered.\\n\\n**H27 — Benchmarks (BDN, ShortRun, 2026-05-25):**\\n\\n| Benchmark | Mean | StdDev | Allocated |\\n|---|---|---|---|\\n| `ShouldRotate_Predicate` | **13.59 ns** | 0.148 ns | 0 B |\\n| `ShouldRotate_HotPath` | 73.72 ns | 5.850 ns | 0 B |\\n\\nPrior baseline (`46e10c9`, 2026-04-29): `ShouldRotate_Predicate` = 13.76 ns. Delta: **−0.17 ns** (within StdDev — no regression). `Func<DateTime>` delegate overhead is sub-noise.\\n\\n---\\n\\n## Summary Table\\n\\n| # | Dimension | Status | Finding |\\n|---|---|---|---|\\n| 1 | CPU Cycles | ✅ PASS | No redundant ops; PropagateAfterAccept correctly a field |\\n| 2 | Branch Prediction | ✅ PASS | Steady-state branches stable and foldable |\\n| 3 | SIMD | N/A | — |\\n| 4 | Bounds Check | N/A | Ring buffers audited separately |\\n| 5 | Cache Locality | ✅ PASS | New fields cold-path only |\\n| 6 | False Sharing | ✅ PASS | PaddedLong ring heads/tails unchanged |\\n| 7 | Memory Access | ✅ PASS | Sequential batch drain |\\n| 8 | Indirection | ✅ PASS | 2 levels unchanged |\\n| 9 | Zero-Allocation | ✅ PASS | 0 B on Enqueue path; BDN confirmed |\\n| 10 | GC Pressure | ✅ PASS | POH arrays; no new pressure |\\n| 11 | Boxing | ✅ PASS | `where T : unmanaged` prevents boxing |\\n| 12 | Pooling | N/A | — |\\n| 13 | Value Types | ✅ PASS | `in T` reference passing |\\n| 14 | Closures/Delegates | ✅ PASS | Static lambda, no closure |\\n| 15 | Async | ✅ PASS | No async on any path |\\n| 16 | String Handling | ✅ PASS | No strings on hot path |\\n| 17 | Exception Cost | ✅ PASS | Try/catch in ConsumeLoop only (consumer, infrequent) |\\n| 18 | Readonly/Immutability | ✅ PASS | `readonly bool PropagateAfterAccept` |\\n| 19 | Inlining | ✅ PASS | [AggressiveInlining] on hot methods |\\n| 20 | Static/Const Propagation | ✅ PASS | PropagateAfterAccept foldable |\\n| 21 | Lock-Free | ✅ PASS | Volatile/CAS only |\\n| 22 | Thread Affinity | ✅ PASS | Opt-in, cold path |\\n| 23 | Syscall | ✅ PASS | HfClock ticks on hot path; DateTime.UtcNow isolated to cold |\\n| 24 | Unit Tests | ✅ PASS | 209/209 |\\n| 25 | Integration Tests | ✅ PASS | Chain + pipeline tests present |\\n| 26 | Stress Tests | ✅ PASS | Endurance/Stress categories exist |\\n| 27 | Benchmarks | ✅ PASS | 13.59 ns predicate; 0 alloc |\\n\\n---\\n\\n## Overall Verdict: ✅ PASS — No regressions. No action required.\\n\\nChanges since 2026-04-30 are correctness fixes, cold-path additions (`threadPriority`, `affinityCpu`, `Func<DateTime>`), and documentation updates. Hot-path budget unchanged. BDN confirms `ShouldRotate_Predicate` at 13.59 ns vs 13.76 ns baseline (−0.17 ns, within measurement noise).\", \"/docs/reports/2026-04-23-hot-path-audit-relay-v2.md\": \"# Hot Path Audit — Relay Library (Post-Fix Pass)\\n**Date:** 2026-04-23  \\n**Scope:** Full library (`src/Relay/**`)  \\n**Auditor:** Claude Sonnet 4.6 / hot-path-audit skill (v2 — post-fix validation)  \\n**Tests at audit time:** 20/20 passing  \\n**Previous report:** `docs/reports/2026-04-23-hot-path-audit-relay.md`  \\n**Opus meta-review:** conducted and incorporated\\n\\n---\\n\\n## Corrections to v1 Report\\n\\nBefore the current state, the v1 audit contained one factual error identified by the Opus meta-review:\\n\\n> **A1 cycle math was wrong.** `Volatile.Read` on x64 is an **acquire load** (`mov` + compiler barrier), NOT an `mfence`. Cost is ~4–5c on L1-warm, not ~15c. The ~15c figure in CLAUDE.md applies to `Volatile.Write` (release store = `xchg`/`lock`-equivalent). The savings from removing the redundant read in A1 are **~4–5c per Enqueue**, not ~15c.\\n\\nAll other v1 findings were confirmed as ✅ by the Opus review.\\n\\n---\\n\\n## Changes Applied Since v1\\n\\n| ID | File | Change |\\n|----|------|--------|\\n| A1 | `SpscQueuePipe.cs:61` | `IsHealthy` → `_healthy` only; removes redundant `IsFull` acquire load |\\n| M1 | `SpscRingBuffer.cs:49–54` | Added `IsEmpty` (consumer-only, non-volatile head read) |\\n| M1 | `SpscQueuePipe.cs:191` | `ShouldKeepDraining` uses `_ring.IsEmpty` (eliminates 1 Volatile.Read) |\\n| M2 | `SpscQueuePipe.cs:173–177` | TryDrainToPrev race condition documented in comment |\\n| M4 | `RamPipe.cs` | `Dispose` guarded with `_disposed` flag — idempotent, no double-free |\\n| M6 | `FileStreamPipe.cs:75` | `TryRecoverBackend` catches `Exception` (was `IOException`) |\\n| M7 | `MmfPipe.cs` | `_position` published via `Volatile.Write`; read via `Volatile.Read` in `IsHealthy` |\\n| M10 | `SpscQueuePipeTests.cs` | Replaced no-op `RingFull_TriggersIsHealthyFalse` with `RingFull_FallsBackToNext_WhenConsumerNotStarted` |\\n| M10 | `RecoveryDrainTests.cs` | Added `RamPipe_Dispose_IsIdempotent` test |\\n\\n---\\n\\n## Hot Paths Audited\\n\\nSame set as v1. `DispatchPipe.Enqueue` → `Accept` → `SpscRingBuffer.TryPublish` is the primary hot path at tick-rate frequency.\\n\\n---\\n\\n## Findings — Current State\\n\\n### A1 — Double Volatile.Read per Enqueue → RESOLVED ✅\\n\\n`SpscQueuePipe.IsHealthy` now returns `_healthy` only (single `volatile bool` acquire load, ~4c). The ring-full gate moved entirely to `TryPublish`, eliminating one acquire load per Enqueue.\\n\\n**Hot-path flow (healthy, ring not full):**\\n1. `IsHealthy`: read `_healthy` (~4c) → true\\n2. `Accept → TryPublish`: `Volatile.Read(_head)` + write slot + `Volatile.Write(_tail)` (~25c total)\\n3. Total: **~29c** vs ~34c before\\n\\n**Semantic note:** `IsHealthy` no longer reflects ring-full state. External `IsHealthy` checks for capacity probing are now inaccurate — by design. Ring-full items still correctly fall through to `Next` via `TryPublish` returning false.\\n\\n---\\n\\n### A4 — Bounds check in ring buffer indexing (LOW — open)\\n\\n`_buffer[tail & _mask]` in `TryPublish` and `TryConsume`: `_mask` is an instance field (not derived from `_buffer.Length`). RyuJIT cannot prove `(tail & _mask) < _buffer.Length` through a field-equality chain, so bounds check elimination is unlikely. Each access likely incurs a compare + branch (~1c predicted branch, ~15c mispredicted).\\n\\n**Status:** Open. Use `Unsafe.Add(ref MemoryMarshal.GetArrayDataReference(_buffer), (nint)(tail & _mask))` to guarantee elimination if profiler evidence confirms the check contributes meaningfully. Verify with disassembly (`dotnet-sos` or Sharplab) before acting.\\n\\n---\\n\\n### D14 — Delegate overhead in FilterPipe (LOW — open)\\n\\n`_predicate(item)` = delegate indirect call (~3–5c) layered inside an already-virtual `Accept` dispatch. In isolation this is noise; only relevant if FilterPipe becomes a primary hot path rather than a downstream wrapper.\\n\\n**Status:** Open. Actionable only with profiler evidence showing FilterPipe CPU contribution.\\n\\n---\\n\\n### E19b — `MmfPipe.WriteToBackend` uses checked MMF accessor (LOW — open)\\n\\n`_view.Write(_position, ...)` performs internal bounds check per call (consumer thread / warm path). Direct pointer via `SafeMemoryMappedViewHandle.AcquirePointer` + `Unsafe.CopyBlockUnaligned` would eliminate it.\\n\\n**Status:** Open. Consumer path only; benchmark before acting.\\n\\n---\\n\\n### F21 — `RamPipe` non-volatile head/tail (INFO — by contract)\\n\\nDocumented: single-thread contract. Not a bug.\\n\\n---\\n\\n### F22 — No thread-affinity API (LOW — open)\\n\\nConsumer thread has no core-pinning. For strict latency deployments (HFT), thread migration invalidates L1/L2. Optional `coreAffinity` parameter on `Start()` would address this.\\n\\n**Status:** Open. Low priority until requested.\\n\\n---\\n\\n### M2 — `TryDrainToPrev` concurrent producer race (MEDIUM — documented)\\n\\n`TryDrainToPrev` calls `Prev.Enqueue` from the consumer thread. If the original producer concurrently resumes feeding `Prev`, two threads enter `Prev.Accept` simultaneously — SPSC violation. Race window = cache-coherency latency (~100–200ns). Documented in code comment.\\n\\n**Full fix** requires either a quiescence protocol (producer signals stop before recovery drain) or an MPSC ring on the predecessor. Deferred pending a use-case that triggers this.\\n\\n**Status:** Open / documented.\\n\\n---\\n\\n### H24a — `FilterPipe` behavioral invariants untested (MEDIUM — open)\\n\\nCritical invariant: items failing the predicate MUST NOT reach `Next`. No test covers this. A single `FilterPipeTests.cs` with:\\n1. Passing item → reaches `_downstream`\\n2. Failing item → consumed silently, `Next.Accepted == 0`\\n\\n**Status:** Open. Medium severity — this invariant is the only non-obvious semantic in the file.\\n\\n---\\n\\n### H24c — `MmfPipe` zero test coverage (HIGH — open)\\n\\nNo tests for: basic write/readback, capacity exhaustion (`IsHealthy → false`), fallback to `Next` when full, or `Volatile.Read/Write` correctness on `_position`.\\n\\n**Status:** Open.\\n\\n---\\n\\n### H24d — `TcpPipe` zero test coverage (HIGH — open)\\n\\nNo tests for: basic write via loopback socket, reconnect backoff, send buffer flush.\\n\\n**Status:** Open.\\n\\n---\\n\\n### H26 — No stress tests (HIGH — open)\\n\\nNo long-running tests. `RamPipe.Dispose` idempotency and `MmfPipe._position` race cannot be verified under sustained load.\\n\\n**Status:** Open.\\n\\n---\\n\\n### H27 — No benchmark tests (HIGH — open)\\n\\nNo BenchmarkDotNet project. The stated cycle budget (`Enqueue ~32c`, `TryPublish ~25c`) remains unverifiable. The A1 optimization (~4–5c) cannot be confirmed without measurement.\\n\\n**Status:** Open.\\n\\n---\\n\\n### M8 — `PipeConstraints` allows 32B T (INFO — not a bug)\\n\\nOpus flagged 32B structs as \\\"straddling cache lines.\\\" This is incorrect: a 32B struct at a 32B-aligned address occupies bytes 0–31 of its cache line — entirely within one 64B line. Two consecutive 32B entries share a cache line but neither straddles it. Sequential ring-buffer access benefits from this (2 entries fetched per cache line, prefetcher works well). **No action required.**\\n\\n---\\n\\n## Summary Table — All Findings\\n\\n| ID | Severity | Component | Issue | Status |\\n|----|----------|-----------|-------|--------|\\n| A1 | MEDIUM | `SpscQueuePipe.IsHealthy` | Double acquire-load on Enqueue hot path | ✅ FIXED |\\n| A4 | LOW | `SpscRingBuffer.TryPublish/TryConsume` | Bounds check not guaranteed eliminated | Open |\\n| D14 | LOW | `FilterPipe._predicate` | Delegate indirect call overhead | Open |\\n| E19b | LOW | `MmfPipe.WriteToBackend` | MMF accessor bounds check per call | Open |\\n| F21 | INFO | `RamPipe._head/_tail` | Non-volatile (single-thread contract) | Open/By design |\\n| F22 | LOW | `SpscQueuePipe.Start` | No core-affinity API | Open |\\n| M1 | LOW | `SpscRingBuffer.Count` | 2 acquire-loads in `ShouldKeepDraining` | ✅ FIXED |\\n| M2 | MEDIUM | `TryDrainToPrev` | SPSC race if producer resumes concurrently | Open/Documented |\\n| M3 | INFO | `SpscQueuePipe.Stop` | Deadline/running store ordering | ✅ Not a bug (x64 TSO + volatile) |\\n| M4 | MEDIUM | `RamPipe.Dispose` | Double-free on second Dispose call | ✅ FIXED |\\n| M6 | LOW | `FileStreamPipe.TryRecoverBackend` | IOException-only catch misses non-IO open failures | ✅ FIXED |\\n| M7 | MEDIUM | `MmfPipe._position` | Producer reads stale capacity via non-volatile field | ✅ FIXED |\\n| M8 | INFO | `PipeConstraints` | 32B allowance \\\"straddles\\\" — false positive | ✅ Not a bug |\\n| M10 | LOW | `SpscQueuePipeTests` | Ring-full test was a no-op | ✅ FIXED |\\n| H24a | MEDIUM | `FilterPipe` | Predicate-fail → not-to-Next invariant untested | Open |\\n| H24c | HIGH | `MmfPipe` | Zero test coverage | Open |\\n| H24d | HIGH | `TcpPipe` | Zero test coverage | Open |\\n| H26 | HIGH | All | No stress tests | Open |\\n| H27 | HIGH | All | No BenchmarkDotNet suite | Open |\\n\\n---\\n\\n## Category Scores — Post-Fix\\n\\n| Group | v1 Score | v2 Score | Delta | Notes |\\n|-------|----------|----------|-------|-------|\\n| A. CPU & Computation | 7/10 | 8/10 | +1 | A1 fixed; A4 (BCE) still open |\\n| B. Memory Layout | 10/10 | 10/10 | — | No change |\\n| C. Allocation & GC | 10/10 | 10/10 | — | No change |\\n| D. Language Runtime | 9/10 | 9/10 | — | D14 noise |\\n| E. Compiler & JIT | 8/10 | 8/10 | — | E19b consumer-path only |\\n| F. Concurrency | 9/10 | 9/10 | — | M4+M7 fixed; M2 documented |\\n| G. System Boundary | 9/10 | 9/10 | — | No change |\\n| H. Test Validation | 4/10 | 5/10 | +1 | 2 new tests; MmfPipe/TcpPipe/benchmarks still absent |\\n\\n---\\n\\n## Verdict\\n\\n**Seven bugs/issues fixed since v1.** The two medium-severity correctness issues (RamPipe double-free, MmfPipe unsynchronized capacity read) and the hot-path micro-opt (double acquire-load) are resolved. The SPSC race in `TryDrainToPrev` is documented.\\n\\n**Remaining actionable priorities (ordered):**\\n\\n1. **(HIGH) H24c/H24d** — Add `MmfPipeTests` and `TcpPipeTests`. MmfPipe in particular has a new `Volatile` synchronization path that has no test coverage.\\n2. **(HIGH) H27** — Add `benchmarks/Relay.Benchmarks` (BenchmarkDotNet). The A1 optimization claims ~4–5c savings that cannot be verified without measurement.\\n3. **(MEDIUM) H24a** — Add `FilterPipeTests` covering the predicate-fail → not-to-Next invariant.\\n4. **(MEDIUM) M2** — Design a quiescence protocol for `TryDrainToPrev` when the chain topology permits it, or restrict `Prev` wiring to chains where the producer is guaranteed quiescent during recovery.\\n5. **(LOW) A4** — Verify BCE on `_buffer[x & _mask]` with disassembly; migrate to `Unsafe.Add` if check is confirmed present.\", \"/docs/text-specs/2026-05-24-ExternalAI-Audit.md\": \"# Relatório de Análise Gemini 3.1\\n\\n## Performance de Processamento (Machine Affinity / Ciclos de CPU)\\nNota: 8.5/10\\n\\nMelhoras/Correções: O ConsumeLoop em SpscQueueSink e MpscQueueSink utiliza um spin/yield/sleep fallback com Thread.Sleep(1) fixo. O método IsFull/IsEmpty realiza Volatile.Read diretos que invalidam o cache entre os núcleos (core-to-core cache trashing).\\n\\nJustificativa: No Windows, Thread.Sleep(1) delega ao escalonador do SO e, dependendo da resolução do timer, custa em média ~15.6ms (cerca de 46 milhões de ciclos de CPU desperdiçados em CPUs modernas a 3GHz). Isso destrói a baixa latência no tail de requisições. A substituição por WaitOnAddress nativo (via P/Invoke ou System.Threading.Interlocked.Read com backoff atrelado a um EventReset) reduzirá a latência de vigília de milissegundos para nanossegundos (~2.000 a 5.000 ciclos), alavancando os benchmarks de P99 drasticamente sem queimar CPU em spin ocioso.\\n\\n## Arquitetura\\nNota: 8.0/10\\n\\nMelhoras/Correções: Atualmente, a criação de Sinks que enfileiram processos (como TcpSink acoplado a SpscQueueSink) dispara uma Thread dedicada por fila ativa (new Thread(...) { IsBackground = true }).\\n\\nJustificativa: Essa arquitetura 1-para-1 leva a um rápido \\\"thread explosion\\\". Se 50 sinks forem iniciados, teremos 50 threads competindo. O context switch de threads do SO custa de 10.000 a 20.000 ciclos de CPU, além de promover um TLB shootdown e a expulsão do Instruction Cache (i-cache) L1/L2. Consolidar os consumidores em um Ring isolado despachado por um Thread Pool Customizado fixado nos núcleos (Core Pinning) vai estancar o sangramento de escalonamento, economizando milhões de ciclos de CPU globais e mantendo o branch predictor quente (machine affinity no seu estado de arte).\\n\\n## Lógica (Bugs e Riscos Ocultos)\\nNota: 6.0/10 (Risco IPC Crítico detectado)\\n\\nMelhoras/Correções: 1. Risco IPC no SharedMemorySink: O método Accept utiliza Interlocked.CompareExchange para reservar espaço movendo o WRITE_IDX_OFF antes do bloco payload.CopyTo(...). Como os processos não possuem trava (lock-free), um consumidor no outro lado do MMF vai ler o WRITE_IDX_OFF atualizado imediatamente e consumir lixo da memória (dados não copiados por completo ainda) devido à execução Out-of-Order das CPUs.\\n2. Risco no RotatingFileSink: Usa HfClock.NowTicks (relativo) contra um referencial calculado de midnight UTC absoluto. Drifts de relógio/hibernação dessincronizam a rotação.\\n\\nJustificativa: Para corrigir o SharedMemorySink mantendo a performance, é vital implementar um modelo 2-phase commit (ex: gravar os dados na reserva virtual local e usar um Interlocked.Exchange para um bit de flag Ready). A instrução de barreira de memória (sfence - Store Fence) forçará a ordenação estrita. Adiciona apenas ~10-20 ciclos, salvando todo o IPC de falhas cataclísmicas que de outra forma custariam centenas de milhares de ciclos de recuperação via exceções de desserialização nas pontas.\\n\\n## Utilização de Memória (Cache / GC)\\nNota: 9.0/10\\n\\nMelhoras/Correções: Em MpscRingBuffer<T>, o passo de memória (stride) é alocado usando _stride = 64 + sizeof(T).\\n\\nJustificativa: Injetar padding de uma cache-line completa (64 bytes) para cada elemento individual da fila afasta o False Sharing se os produtores escreverem em índices vizinhos simultaneamente, mas pune severamente a localidade espacial (Spatial Locality) do barramento. Um Hardware Prefetcher de CPU moderno busca as próximas 2-3 linhas de cache (128-192 bytes) em paralelo na L1. Com o array muito espaçado, temos um rácio de prefetch falho de 100%, gerando L2/L3 cache misses sucessivos a cada varredura no batch de leitura (TryConsumeBatch). Um cache miss para RAM principal custa de 200 a 300 ciclos. Consolidar blocos compactos e usar False Sharing isolation apenas nos índices globais do Produtor/Consumidor transformaria esses 200 ciclos por elemento em ~10 ciclos amortizados no loop unrolling, elevando o benchmark de TPS de MPSC em até 30% ou mais.\\n\\n## Nomenclatura e Comentários\\nNota: 9.5/10\\n\\nMelhoras/Correções: Escassez de /// <summary> em classes como MemorySink ou FilterSink informando sua característica thread-safe ou lock-free.\\n\\nJustificativa: Em bibliotecas de ultra-performance, indicar as topologias suportadas e afinidade de threads reduz as chances de um desenvolvedor englobar a chamada com blocos de lock (ex: lock(_syncObj) em torno de um Enqueue). Evitar um lock impensado nas camadas de aplicação acima evita contenções de monitor que causam uma regressão silenciosa de ~1.000 ciclos de CPU por mensagem no pipeline do Relay.\\n\\n# Relatório Codex 5.5 \\n\\n## Performance de processamento: 8/10\\nMelhoras/correções: remover o zero-fill no consumo MPSC em MpscRingBuffer.cs (line 136) e MpscRingBuffer.cs (line 159).\\nJustificativa: para T=64B, esse clear suja uma cache line extra por item e força ownership consumer->producer de novo. Economia esperada: ~20-80 ciclos/item sem contenção e ~60-150 ciclos/item cross-core; deve melhorar MpscContentionBenchmarks/throughput em ~5-20%.\\nMelhoras/correções: adicionar afinidade/ideal processor configurável e parar de usar ThreadPriority.BelowNormal como default em SpscQueueSink.cs (line 86) e equivalentes MPSC/packet.\\nJustificativa: machine affinity é o maior ganho de latência p99/p999: evita migração, refill de L1/L2 e jitter de scheduler. Cada migração custa facilmente milhares de ciclos; espero +3-10% no throughput sob carga e 20-60% melhor p999 em contenção.\\n\\n## Arquitetura: 8/10\\nMelhoras/correções: criar hook batch real no backend, em vez de TryConsumeBatch copiar para _consumeBuf e chamar WriteToBackend item a item em SpscQueueSink.cs (line 167) e MpscQueueSink.cs (line 149).\\nJustificativa: economiza uma cópia ring->buffer e um dispatch virtual por item. Para eventos de 64B: ~8-25 ciclos/item; deve melhorar QueueSinkThroughputBenchmarks em ~5-15%.\\n\\n## Lógica: 7/10\\nMelhoras/correções: SharedMemorySink publica WriteIndex via CAS antes de escrever frame em SharedMemorySink.cs (line 100); se o leitor usa WriteIndex como cursor publicado, pode ler frame incompleto.\\nJustificativa: correção exige claim/publish separado ou limitar para SPSC com publish após copy. Pode custar +10-30 ciclos/frame, mas elimina corrupção silenciosa. Benchmark correto: SharedMemorySinkBenchmarks + stress com reader concorrente.\\nMelhoras/correções: builder packet não liga Prev para MpscQueueSink em SinkChain.Packet.cs (line 22).\\nJustificativa: recovery drain MPSC packet fica inoperante via builder. Custo da correção é cold-path zero no benchmark hot.\\n\\n## Nomenclatura: 8/10\\nMelhoras/correções: SharedMemorySink se declara “MPSC-tolerant”, mas a ordem de publicação não sustenta isso; DispatchSink<T> comenta “32, 64, 128...” em DispatchSink.cs (line 8), enquanto a constraint real exige múltiplo de 64.\\nJustificativa: nomenclatura incorreta induz topologia errada; um T=32B em release pode criar false sharing de ~50-200 ciclos/item.\\n\\n## Comentários: 8/10\\nOk: comentários são raramente genéricos; muitos explicam fence, cache line, BDN e custo por caminho.\\nMelhoras/correções: alinhar comentários com execução real: testes Stress dizem excluídos do default, mas não são; SinkConstraints diz “DEBUG-only” em SinkConstraints.cs (line 9).\\nJustificativa: comentário errado aqui vira benchmark errado: a suíte sem filtro entrou em teste de 5 min e estourou 120s.\\n\\n## Erros / tratamento de falhas: 6/10\\nMelhoras/correções: TcpSink/UnixSocketSink packet usam Socket.Send uma vez e ignoram envio parcial em TcpSink.Packet.cs (line 66) e UnixSocketSink.cs (line 57).\\nJustificativa: SendAll custa ~2-5 ciclos no fast path quando tudo envia de uma vez, mas evita frame truncado. O benchmark médio quase não muda; o benchmark de confiabilidade muda de “corrompe sob backpressure” para “correto”.\\nMelhoras/correções: payload maior que buffer quebra consumer em FileSink, RotatingFileSink, TcpSink, NamedPipeSink, UnixSocketSink; exemplo em FileSink.cs (line 49).\\nJustificativa: um compare needed > buffer.Length custa ~1 ciclo e evita exception, thread morta e perda de pipeline.\\n\\n## Memória / cache / GC: 8/10\\nMelhoras/correções: transformar AssertCacheLineAligned<T>() em validação release no construtor. Hoje é Conditional(\\\"DEBUG\\\").\\nJustificativa: custo cold-path irrelevante; evita produção com slots desalinhados. Economia quando previne tipo errado: ~50-200 ciclos/item por cache-line bounce.\\nMelhoras/correções: HttpBatchSink aloca batch.ToArray(), ByteArrayContent e request por flush em HttpBatchSink.cs (line 93).\\nJustificativa: não afeta Enqueue, mas em flush alto gera GC. Usar pool/custom content pode economizar 64KB+ por flush; benchmark esperado melhora mais em Gen0/latência que em ciclos médios.\\n\\nVeredito geral: projeto forte, eu colocaria 7.6/10 para ultra baixa latência hoje. O core está acima da média; as maiores perdas não estão em “C# lento”, estão em machine affinity ausente, zeroing/cache ownership no MPSC, e contratos packet/shared-memory que ainda deixam corrupção ou crash passar.\\n\\n## Chega perto de 9.5 se corrigir:\\n\\n### Afinidade de CPU / ideal processor configurável nos consumers.\\nMaior ganho de latência real: evita migração de core, cache miss e jitter.\\nPode economizar milhares de ciclos por evento afetado por migração e melhorar p99/p999 em 20-60%.\\n\\n### Remover zero-fill no MpscRingBuffer<T> após consumo.\\nEconomiza uma escrita de 64B+ por item.\\nGanho esperado: ~20-150 ciclos/item em MPSC, especialmente cross-core.\\n\\n### Backend batch real, evitando cópia ring -> _consumeBuf -> backend.\\nEconomiza ~8-25 ciclos/item.\\nPode melhorar throughput de fila em ~5-15%.\\n\\n### Corrigir Socket.Send parcial nos sinks packet.\\nQuase sem custo no fast path, mas fecha bug grave de framing.\\n\\n### Corrigir oversized payload em sinks com buffer fixo.\\nCusto ~1 branch; evita exception e morte do consumer.\\n\\n### Corrigir publicação concorrente do SharedMemorySink.\\nPode custar +10-30 ciclos/frame, mas troca performance especulativa por corretude real.\\n\\n### Transformar constraint de cache-line em validação Release.\\nCusto cold-path zero relevante; evita false sharing de ~50-200 ciclos/item quando T errado passa.\", \"/docs/superpowers/plans/2026-05-24-analisando-docs-text-specs-2026-05-24-ex-resilient-cat.md\": \"# Relatório de Triagem — `docs/text-specs/2026-05-24-ExternalAI-Audit.md`\\n\\n## Context\\n\\nO documento `docs/text-specs/2026-05-24-ExternalAI-Audit.md` reúne dois pareceres externos (Gemini 3.1 e Codex 5.5) sobre o Relay. Vários itens são **bugs de correção reais** (uso multi-processo do `SharedMemorySink`, envios parciais de socket nos sinks packet, overflow de buffer em `FileSink`), outros são **ganhos de performance mensuráveis** (zero-fill no MPSC, batch hook real, afinidade de CPU), e outros ainda são **falsos positivos ou trade-offs deliberados** (stride MPSC, “cache trashing” em `IsFull/IsEmpty`, exclusão de testes Stress).\\n\\nO objetivo deste relatório é separar com clareza:\\n\\n| Categoria | Critério |\\n|---|---|\\n| **OBRIGATÓRIO** | Bug de correção comprovado por leitura do código — sem risco mensurar, é só não corromper |\\n| **RECOMENDADO** | Melhoria de performance/robustez com benchmark existente que valida ROI antes do merge |\\n| **OPCIONAL** | Ganho marginal, doc-only, ou requer benchmark adicional para justificar |\\n| **DESCARTAR** | Falso positivo, design intencional, ou refactor desproporcional ao ganho |\\n\\nCada item lista o arquivo:linha do código real, a benchmark que mede o impacto (quando aplicável), e a justificativa.\\n\\n---\\n\\n## 0 — Baseline Freeze (pré-requisito)\\n\\n**Antes de qualquer mudança da §1 ou §2, gravar baseline novo.** Justificativa: a baseline tracked atual em `benchmarks/artifacts/2026-04-29-hotpath/` tem 24 dias e cobre apenas `ByteEnqueueBenchmarks`, `EnqueueBenchmarks`, `FilterSinkBenchmarks`, `MpscBenchmarks`. Não cobre `MpscContentionBenchmarks`, `MpscSlotLayoutBenchmarks`, `SharedMemorySinkBenchmarks`, `RotatingFileSinkBenchmarks`, `HttpBatchSink`, `QueuePipeThroughputBenchmarks` nem variantes Packet. Comparar PRs futuros contra essa baseline seria maçã vs pera — houve commits desde então (`133e6ff`, `ac608b3`, `665402e`, etc.).\\n\\n### Procedimento\\n\\n1. Branch isolada para baseline (não mexe em `develop`):\\n   ```\\n   git switch develop && git pull\\n   git switch -c bench/260524-baseline-pre-audit\\n   ```\\n2. Rodar suite completa em Release, ambiente quiescent (sem outros processos pesados):\\n   ```\\n   dotnet run -c Release --project benchmarks/Relay.Benchmarks --\\n   ```\\n3. Copiar resultados para diretório versionado:\\n   ```\\n   mkdir benchmarks/artifacts/2026-05-24-pre-audit\\n   cp -r BenchmarkDotNet.Artifacts/results/* benchmarks/artifacts/2026-05-24-pre-audit/results/\\n   cp BenchmarkDotNet.Artifacts/BenchmarkRun-*.log benchmarks/artifacts/2026-05-24-pre-audit/\\n   ```\\n4. Commit + merge para `develop` (não passa pela suíte de testes, só doc):\\n   ```\\n   git add benchmarks/artifacts/2026-05-24-pre-audit/\\n   git commit -m \\\"bench: freeze baseline before external-audit triage\\\"\\n   ```\\n5. Sanity check: comparar ad-hoc o subset comum (`MpscBenchmarks`, `EnqueueBenchmarks`) entre `2026-04-29-hotpath` e `2026-05-24-pre-audit`. Se houver delta >10% sem explicação, investigar antes de prosseguir — pode haver regressão silenciosa entre as duas datas.\\n\\n### Cobertura mínima exigida\\n\\nA baseline `2026-05-24-pre-audit` deve incluir **todos os benchmarks listados nos gates da §2**:\\n\\n| Item §2 | Benchmark gate obrigatório |\\n|---|---|\\n| 2.1 zero-fill | `MpscContentionBenchmarks`, `MpscSlotLayoutBenchmarks` |\\n| 2.2 batch hook | `QueueSinkThroughputBenchmarks`, `QueueSinkPacketThroughputBenchmarks` |\\n| 2.3 afinidade | `QueueSinkThroughputBenchmarks` (cenário sustained) — adicionar se não houver |\\n| 2.4 WaitOnAddress backoff | **novo** benchmark sparse-burst — criar ANTES de mexer no backoff |\\n| 2.5 RotatingFileSink absolute time | `RotatingFileSinkBenchmarks.ShouldRotate_HotPath` |\\n| 2.6 SinkConstraints release | n/a (cold-path, sem gate) |\\n\\nSe algum benchmark da tabela não existir hoje, **criar antes do freeze**. Não rodar baseline sem cobertura completa — caso contrário PR da §2 vai inventar um “antes” que não existe.\\n\\n---\\n\\n## 1 — OBRIGATÓRIO (correção)\\n\\n### 1.1 `SharedMemorySink` — CAS publica `WriteIndex` antes do payload\\n- **Arquivos:** `src/Relay/Sinks/SharedMemorySink.cs:96-103` (CAS) → `:108-121` (copy)\\n- **Fonte:** Gemini §Lógica, Codex §Lógica (ambos flagam)\\n- **Defeito:** `Interlocked.CompareExchange` no `WRITE_IDX_OFF` é feito antes de `payload.CopyTo`. Leitor em outro processo lê `WriteIndex` atualizado e consome bytes ainda não escritos. Reordering de store também derruba a invariante mesmo single-producer no `WriteRing`.\\n- **Correção:** 2-phase commit. Reservar local (`_claimedTail` privado por processo) → copiar payload → `sfence` (`Thread.MemoryBarrier()` ou `Volatile.Write` da `WriteIndex`) só depois. Ou flag `Ready` por frame em vez de cursor único.\\n- **Benchmark:** `SharedMemorySinkBenchmarks` mede caminho atual; reproduzir com leitor concorrente em teste de stress packet IPC.\\n- **Custo:** +10–30 ciclos/frame (Codex) — irrelevante perto da gravidade.\\n- **Nota:** Tipo declara “MPSC-tolerant” mas semântica de publicação não sustenta (Codex). Ou corrige semântica, ou restringe tipo a SPSC e renomeia.\\n\\n### 1.2 `TcpSink.Packet` / `UnixSocketSink` — `Socket.Send` único sem loop de envio parcial\\n- **Arquivos:** `src/Relay/Sinks/TcpSink.Packet.cs:66`, `src/Relay/Sinks/UnixSocketSink.cs:57`\\n- **Fonte:** Codex §Erros\\n- **Defeito:** Um único `_socket.Send(span)` sem checar retorno. Sob backpressure ou `SocketFlags.None` o kernel pode aceitar menos bytes, gerando frame truncado no peer.\\n- **Referência:** `src/Relay/Sinks/TcpSink.cs:118-158` (variante tipada) já tem o loop correto — copiar o pattern.\\n- **Correção:** loop `while (sent < total) sent += _socket.Send(span.Slice(sent))` + recovery em falha como na versão tipada.\\n- **Custo hot path:** 0–5 ciclos quando envia tudo de uma vez (fast path inalterado).\\n- **Benchmark:** `TcpSinkBenchmark` (packet) — deve continuar verde; correção é cold path no caminho rápido.\\n\\n### 1.3 Sinks com buffer fixo — payload > buffer quebra consumer\\n- **Arquivos:** `src/Relay/Sinks/FileSink.cs:45-54` e equivalentes em `RotatingFileSink`, `TcpSink`, `NamedPipeSink`, `UnixSocketSink`\\n- **Fonte:** Codex §Erros\\n- **Defeito:** Após flush condicional, `payload.CopyTo(_writeBuffer.AsSpan(_filled))` é executado sem comparar `payload.Length` contra `_writeBuffer.Length`. Payload maior que o buffer escreve fora do array → exceção, thread morre, pipeline interrompido.\\n- **Correção:** Se `payload.Length > _writeBuffer.Length`, escrever direto no backend (path bypass) ou retornar `false` em `Accept` para cair no `Next`.\\n- **Custo hot path:** 1 branch previsível (~1 ciclo).\\n- **Benchmark:** nenhum atual mede esse path; pode-se medir no `FileSinkBenchmark` com payload acima do buffer (cenário separado).\\n\\n### 1.4 `SinkChain.Packet.cs` — não cabos `Prev` para `MpscQueueSink`\\n- **Arquivo:** `src/Relay/Builder/SinkChain.Packet.cs:22`\\n- **Fonte:** Codex §Lógica\\n- **Defeito:** Builder packet faz `if (sink is SpscQueueSink spsc) spsc.Prev = _tail;` — falta o case análogo para `MpscQueueSink`. Drain reverso de recovery para MPSC packet fica inoperante quando a chain é construída via builder.\\n- **Referência:** `src/Relay/Builder/SinkChain.cs:106-107` (genérico) já cobre ambos os tipos — replicar.\\n- **Correção:** adicionar `else if (sink is MpscQueueSink mpsc) mpsc.Prev = _tail;` no método `To`.\\n- **Custo hot path:** 0 (cold path do builder).\\n- **Teste:** adicionar caso em `RecoveryDrainTests` (packet MPSC).\\n\\n---\\n\\n## 2 — RECOMENDADO (perf mensurável)\\n\\n### 2.1 Remover zero-fill no consumo do `MpscRingBuffer<T>`\\n- **Arquivo:** `src/Relay/Buffers/MpscRingBuffer.cs:136` (TryConsume) e `:159` (TryConsumeBatch)\\n- **Fonte:** Codex §Perf (#1 do veredito)\\n- **Análise:** `Unsafe.InitBlockUnaligned(... ValueAt(pos), 0, sizeof(T))` é redundante. O gating de publicação é o `Published` flag — produtor só reentra na slot quando `Published == 0`, e nesse ponto sobrescreve `Value` completo. Zerar Value escreve cache line extra e força ownership consumer→producer de volta.\\n- **Ganho esperado (Codex):** ~20–80 c/item sem contenção, ~60–150 c/item cross-core. Throughput MPSC +5–20%.\\n- **Benchmark gate:** `MpscContentionBenchmarks` (N=1,2,4,8) e `MpscSlotLayoutBenchmarks` antes/depois. PR só merge se ambos ≥ +5% mediana.\\n- **Risco:** zero. T é `unmanaged` (sem refs GC), produtor reescreve antes do próximo consumo.\\n\\n### 2.2 Batch hook real no backend (eliminar dispatch virtual por item)\\n- **Arquivos:** `src/Relay/SpscQueueSink.cs:167-173`, `src/Relay/MpscQueueSink.cs:149-155`\\n- **Fonte:** Codex §Arch (#3 do veredito)\\n- **Análise:** `TryConsumeBatch` copia ring→`_consumeBuf`, depois `for(i) WriteToBackend(in _consumeBuf[i])` — N chamadas virtuais + N writes individuais. Backends com buffer interno (`FileSink`, `TcpSink`) poderiam receber o span inteiro.\\n- **Correção:** adicionar `protected virtual void WriteBatchToBackend(ReadOnlySpan<T> batch)` com default chamando o loop atual. Sinks tipo `FileSink` sobrescrevem para gravar em uma só chamada.\\n- **Ganho esperado (Codex):** ~8–25 c/item; QueueSinkThroughputBenchmarks +5–15%.\\n- **Benchmark gate:** `QueueSinkThroughputBenchmarks` e variantes packet. Aceitar só se ≥ +5% mediana.\\n\\n### 2.3 Afinidade de CPU + revisão de `ThreadPriority`\\n- **Arquivos:** `src/Relay/SpscQueueSink.cs:82-89`, `src/Relay/MpscQueueSink.cs:85-92` (default `BelowNormal`)\\n- **Fonte:** Codex §Perf (#1 do veredito), Gemini §Arch\\n- **Análise:** `ThreadPriority.BelowNormal` como default em consumer ultra-low-latency é antinatural — favorece thread em pool genérico em vez do consumer crítico. Codex aponta p999 +20–60% com pinning. Migração de core custa milhares de ciclos (TLB shootdown, L1/L2 refill).\\n- **Correção:** (a) tornar `ThreadPriority` parâmetro do ctor com default `Normal`; (b) adicionar `IdealProcessor`/`AffinityMask` opcional via P/Invoke (`SetThreadAffinityMask` Win, `pthread_setaffinity_np` Linux).\\n- **Benchmark gate:** novo cenário em `QueueSinkThroughputBenchmarks` rodando com pin vs sem pin sob carga sustentada. Aceitar se p999 mediana melhora ≥ 20%.\\n- **Não fazer:** consolidar threads em pool customizado (Gemini §Arch). Refactor desproporcional, quebra ownership single-consumer dos rings SPSC/MPSC. Documentar limite recomendado (ex: ≤ N_cores sinks ativos) e ponto.\\n\\n### 2.4 Backoff sem `Thread.Sleep(1)` no `ConsumeLoop`\\n- **Arquivos:** `src/Relay/SpscQueueSink.cs:179-196`, `src/Relay/MpscQueueSink.cs:161-178`\\n- **Fonte:** Gemini §Perf\\n- **Análise:** Após 10×`SpinWait(20)` + 5×`Yield()`, cai em `Thread.Sleep(1)`. No Windows com timer default (15.6 ms) ou mesmo com `timeBeginPeriod(1)` (1 ms), libera CPU por uma janela enorme em contexto ultra-low-latency. Só importa quando ring está vazio, mas é exatamente onde p999 da próxima mensagem mora.\\n- **Correção:** substituir o sleep por `WaitOnAddress` (Win) / `futex` (Linux) com timeout curto, sinalizado pelo produtor após `TryPublish`. Sem timeout dispara fallback após N ms.\\n- **Ganho esperado:** p999/p9999 cai de ms para µs no padrão sparse-bursty.\\n- **Risco:** complexidade de pareamento producer/consumer wake. Comportamento atual é OK para steady-state (consumer não dorme); o ganho é em bursts.\\n- **Benchmark gate:** novo cenário “sparse burst” (publish 1 a cada 5 ms) medindo p99/p999 end-to-end. Não há hoje — criar antes de mexer.\\n\\n### 2.5 `RotatingFileSink` — ancorar em `DateTime.UtcNow` absoluto\\n- **Arquivo:** `src/Relay/Sinks/RotatingFileSink.cs:65-66, 101, 187-193`\\n- **Fonte:** Gemini §Lógica\\n- **Análise:** `_nextDayBoundaryTicks = HfClock.NowTicks + (msUntilMidnight * Frequency / 1000)` mistura referencial absoluto (midnight UTC) com referencial relativo (`Stopwatch.GetTimestamp()`). Hibernação ou drift de TSC desincroniza a rotação.\\n- **Correção:** armazenar `_currentDay` (DateTime UTC date) e checar `if (DateTime.UtcNow.Date > _currentDay) RotateNow();` no hot check. Cost: ~30–40c (UtcNow + comparison) — fora do steady-state batch real.\\n- **Benchmark:** `RotatingFileSinkBenchmarks` (`ShouldRotate_HotPath`) já existe. Deve manter ≤ +5% de overhead.\\n\\n### 2.6 `SinkConstraints.AssertCacheLineAligned<T>` — promover a release\\n- **Arquivos:** `src/Relay/Internal/SinkConstraints.cs:18-19` (`[Conditional(\\\"DEBUG\\\")]`); callers em `SpscQueueSink.cs:69`, `MpscQueueSink.cs:72`\\n- **Fonte:** Codex §Mem\\n- **Análise:** Cold-path no ctor. Custo desprezível em release. Tipo errado em prod = ~50–200 c/item por bounce de cache line. Garantia barata.\\n- **Correção:** remover `[Conditional(\\\"DEBUG\\\")]` ou criar versão release-checked (`EnsureCacheLineAligned`) chamada pelos ctors.\\n- **Risco:** consumidores existentes com T desalinhado quebram em release. Aceitável — é o ponto.\\n\\n---\\n\\n## 3 — OPCIONAL (docs ou ganhos marginais)\\n\\n### 3.1 Comentário enganoso em `DispatchSink<T>`\\n- **Arquivo:** `src/Relay/DispatchSink.cs:8`\\n- **Fonte:** Codex §Naming\\n- **Defeito:** XML doc lista “32, 64, 128, or 256 bytes”, mas `SinkConstraints` exige múltiplo positivo de 64. T=32 explode em runtime.\\n- **Correção:** alinhar comentário com “positive multiple of 64 bytes”.\\n\\n### 3.2 XML doc de thread-safety nos sinks\\n- **Fonte:** Gemini §Naming\\n- **Análise:** Adicionar `<remarks>` indicando topologia (SPSC/MPSC/lock-free) em `MemorySink`, `FilterSink`, `MultiSink` etc. Evita usuário envolvendo `Enqueue` em `lock`.\\n\\n### 3.3 `HttpBatchSink` — alocações por flush\\n- **Arquivo:** `src/Relay.Sinks.Http/HttpBatchSink.cs:93-96`\\n- **Fonte:** Codex §Mem\\n- **Análise:** `batch.ToArray()` + `ByteArrayContent` + `HttpRequestMessage` por flush. Não afeta `Enqueue`, mas em alto flush gera Gen0. ArrayPool + `PooledByteArrayContent` customizado resolve.\\n- **Decisão:** opcional — usuário do `Relay.Sinks.Http` pode tolerar. Só justificar com benchmark de Gen0/latency sob flush alto.\\n\\n---\\n\\n## 4 — DESCARTAR (falsos positivos ou design deliberado)\\n\\n### 4.1 “IsFull/IsEmpty causam cache trashing” (Gemini)\\n- **Veredito:** FALSO.\\n- **Evidência:** `SpscRingBuffer.cs:50-61`: produtor lê `_head` via `Volatile.Read` 1× (não trashing), com `_cachedHead` (linhas 88–91) reduzindo ainda mais. `MpscRingBuffer.cs:60-64`: `IsEmpty` lê per-slot `Published` flag, não o cursor compartilhado. Head/tail/claimedTail em `PaddedLong` (128B isolados).\\n- **Ação:** nenhuma.\\n\\n### 4.2 “Stride 64+sizeof(T) destrói localidade espacial” (Gemini)\\n- **Veredito:** FALSO / by-design.\\n- **Evidência:** `MpscRingBuffer.cs:81`. Layout é `[Published flag, cache-line isolated][Value]` por slot. Isolação do `Published` é necessária — produtores fazem CAS em flags de slots vizinhos concorrentemente; sem padding teríamos false sharing severo. O commit `1358588` (audit v4) já investiu nessa decisão.\\n- **Trade-off:** prefetcher entrega só ~50% utilização para varredura sequencial de Value. Esse é o preço pago para eliminar bounces de cache line entre produtores MPSC. Compensa.\\n- **Ação:** documentar trade-off em `<remarks>` do tipo. Não alterar layout.\\n\\n### 4.3 “Thread explosion → migrar para thread pool customizado” (Gemini)\\n- **Veredito:** REJEITAR.\\n- **Análise:** Cada `SpscQueueSink` exige consumer único proprietário do head do ring — isso é parte do contrato SPSC. Pool genérico violaria o single-consumer e exigiria sincronização nova. Custo de N threads é assumido; usuário com >50 sinks ativos pode multiplexar externamente. Documentar limite recomendado (ex: “1 sink ativo por core físico”).\\n\\n### 4.4 “Stress tests não excluídos por filtro” (Codex)\\n- **Veredito:** FALSO.\\n- **Evidência:** `[Trait(\\\"Category\\\", \\\"Stress\\\")]` aplicado nos arquivos relevantes (`StressTests.cs:29,62`, `SpscByteRingBufferTests.cs:163`, etc.); filtro `Category!=Stress` no gate do CLAUDE.md exclui corretamente.\\n- **Ação:** nenhuma. (Pode haver teste lento sem categoria — auditar separado, fora desta análise.)\\n\\n---\\n\\n…(truncated)\", \"/docs/superpowers/plans/2026-05-24-analisando-docs-text-specs-2026-05-24-ex-resilient-cat-2.md\": \"# Plano — Execução das 4 decisões pendentes (§2.2, §2.3, §2.4, §3.3)\\n\\n## Context\\n\\nApós executar o plano original de triagem do audit Gemini+Codex, restaram 4 itens da seção §2 (Recomendado / perf mensurável) e §3 (Opcional). A lição central de §2.1 (rejeitado por benchmark) é que **claims numéricos do audit não são aceitáveis como base** — `+5-20% MPSC throughput` previsto virou `+46-50% regressão sob alta contenção` quando medido. Os 4 itens restantes serão executados com disciplina mais rigorosa:\\n\\n1. **Hipótese técnica explícita** antes de qualquer código — qual mecanismo de hardware/runtime explica o ganho esperado, e por que o cenário do Relay o ativa.\\n2. **Benchmark que mede o mecanismo, não o proxy** — se a hipótese é \\\"elimina cache bounce X→Y\\\", o benchmark deve isolar essa transação, não medir throughput end-to-end onde ruído de outros caches domina.\\n3. **Gate definido ANTES de rodar** — não ajustar threshold pós-fato.\\n4. **Disposição se gate falha** — definida em advance: revert, accept-with-caveat, ou rerun-with-config-X.\\n5. **Disciplina BDN** — runs em ambiente quiescent, comparação por **mediana**, ratio com IC 99.9% sem sobreposição.\\n\\nCada uma das 4 tasks abaixo segue esse template.\\n\\n---\\n\\n## §2.2 — Batch hook real no backend\\n\\n### Hipótese técnica\\n**Mecanismo:** `SpscQueueSink<T>.ConsumeLoop` faz `TryConsumeBatch(_consumeBuf)` (até N items copiados do ring para buffer local), depois `for (i=0..N) WriteToBackend(in _consumeBuf[i])` — N **virtual calls** + N **writes** ao backend. Backends com buffer interno (`FileSink`, `TcpSink`, `NamedPipeSink`) já fazem batching, então as N calls fazem N append-to-internal-buffer com lógica de flush-quando-cheio. Substituindo por `WriteBatchToBackend(ReadOnlySpan<T>)` em um único call:\\n- Elimina N-1 virtual dispatch (~3c × (N-1), ~21c para N=8)\\n- Elimina N-1 entradas/saídas de `WriteToBackend` (prologue/epilogue, ~5c × (N-1))\\n- Backend escreve span inteiro no buffer de uma vez (`Buffer.MemoryCopy` em vez de loop)\\n\\n**Magnitude esperada:** ~50-150c por batch de 32 items = ~2-5c por item. **Menor que o audit previu (8-25c/item)** — sem ilusões.\\n\\n**Por que pode falhar / risco:**\\n- `WriteBatchToBackend` recebendo `ReadOnlySpan<T>` onde `T : unmanaged` exige `MemoryMarshal.AsBytes(span)` ou similar para chegar no backend (que tipicamente quer `ReadOnlySpan<byte>`). Custo: ~0c (reinterpret cast), mas API fica menos limpa.\\n- Se backend tem state per-item (e.g. compress por item, header per record), batch hook não ajuda — fica overhead inútil. Verificar caso-a-caso.\\n- JIT já pode estar inlinando `WriteToBackend` quando sink é `sealed` — devirtualização atual pode anular metade do ganho previsto.\\n\\n### Implementação\\n\\n**Files alterados (estimativa):**\\n- `src/Relay/SpscQueueSink.cs` — adicionar `protected virtual void WriteBatchToBackend(ReadOnlySpan<T> batch)` com default chamando o loop atual. Loop em `ConsumeLoop` chama `WriteBatchToBackend(_consumeBuf.AsSpan(0, consumed))`.\\n- `src/Relay/MpscQueueSink.cs` — idem.\\n- `src/Relay/SpscQueueSink.Packet.cs` + `src/Relay/MpscQueueSink.Packet.cs` — idem (signature: `ReadOnlySpan<byte>`).\\n- `src/Relay/Sinks/FileSink.cs` — override `WriteBatchToBackend` chamando `_stream.Write(MemoryMarshal.AsBytes(batch))` (typed) ou `_stream.Write(batch)` direto (packet — já é `ReadOnlySpan<byte>`).\\n- `src/Relay/Sinks/TcpSink.cs` — override usando `SendAll(MemoryMarshal.AsBytes(batch))`.\\n- `src/Relay/Sinks/RotatingFileSink.cs` — packet hierarchy, override.\\n- `src/Relay/Sinks/NamedPipeSink.cs` — packet, override.\\n- `src/Relay/Sinks/UnixSocketSink.cs` — packet, override.\\n\\nBackends que NÃO se beneficiam (não overridar):\\n- `MmfSink<T>` — capacity check por item, struct-aligned write; batch span exige rewrite do per-record. Skip.\\n- `MemorySink<T>` — circular ring single-T write. Skip.\\n- `SharedMemorySpscSink` — frame-header per record, skip.\\n\\n### Benchmark — design\\n\\n**Existing:**\\n- `QueuePipeThroughputBenchmarks.Push_Single` — push 1 item/call, measures end-to-end. NÃO isola o ganho — domina latency do producer-side TryPublish.\\n- `QueuePipeThroughputBenchmarks.Push_Batch32` — push 32 items/call. Mais próximo do alvo. **Esse é o benchmark gate primário.**\\n\\n**Novo benchmark complementar para isolar a hipótese:**\\n- `BatchHookBenchmark` (nova classe em `benchmarks/Relay.Benchmarks/Internal/`) — invoca diretamente `WriteToBackend` em loop vs `WriteBatchToBac
