    src/Relay/SpscQueuePipe.cs:124           loop  0B\\n├─ ShouldKeepDraining             src/Relay/SpscQueuePipe.cs:188           ~3c   0B   ULTRA-HOT\\n│  └─ SpscRingBuffer.IsEmpty      src/Relay/Buffers/SpscRingBuffer.cs:50   ~2c   0B   ULTRA-HOT\\n├─ SpscRingBuffer.TryConsume      src/Relay/Buffers/SpscRingBuffer.cs:89   ~10c  0B   ULTRA-HOT\\n├─ WriteToBackend (virt-sealed)   per-backend                              ~9-30c\\n│  ├─ FileStreamPipe.WriteToBackend  src/Relay/Pipes/FileStreamPipe.cs:45  ~9c   64B  ULTRA-HOT\\n│  │   └─ FlushBuffer (every 4096)  src/Relay/Pipes/FileStreamPipe.cs:87   ~5e3c 0B   COLD\\n│  ├─ TcpPipe.WriteToBackend      src/Relay/Pipes/TcpPipe.cs:46            ~9c   64B  ULTRA-HOT\\n│  │   └─ FlushBuffer (every 4096)  src/Relay/Pipes/TcpPipe.cs:89          ~2e3c 0B   WARM\\n│  └─ MmfPipe.WriteToBackend      src/Relay/Pipes/MmfPipe.cs:47            ~30c  64B  ULTRA-HOT\\n├─ idle path (ring empty, running)  src/Relay/SpscQueuePipe.cs:145         20c→300c→1e6c\\n│  ├─ Thread.SpinWait(20)         10 iters → 20c each                      ~200c\\n│  ├─ Thread.Yield                5 iters                                  ~300c\\n│  └─ Thread.Sleep(1)             thereafter                               ~1e6c    WARM\\n├─ HfClock.NowTicks (deadline)    src/Relay/Internal/HfClock.cs:8          ~20c  0B   ULTRA-HOT\\n└─ flush-interval branch          src/Relay/SpscQueuePipe.cs:153\\n   ├─ FlushBackend                varies 2-5e3c\\n   ├─ TryRecoverBackend           src/Relay/SpscQueuePipe.cs:113           ~5e3c (on retry)\\n   └─ TryDrainToPrev              src/Relay/SpscQueuePipe.cs:178           N × (TryConsume 10c + virt Enqueue 7c + IsHealthy check)\\n```\\n\\n## 4. Allocation Map (top 10 by bytes/call)\\n| # | bytes/call | symbol | file:line | kind |\\n|---|---|---|---|---|\\n| 1 | 2.62e5 | `FileStreamPipe.ctor` (4096 × sizeof(T)=64) | src/Relay/Pipes/FileStreamPipe.cs:41 | `GC.AllocateArray<byte>` pinned (POH) |\\n| 2 | 2.62e5 | `TcpPipe.ctor` (same size) | src/Relay/Pipes/TcpPipe.cs:42 | `GC.AllocateArray<byte>` pinned (POH) |\\n| 3 | ring×sizeof(T) | `SpscRingBuffer.ctor` | src/Relay/Buffers/SpscRingBuffer.cs:64 | `GC.AllocateArray<T>` pinned (POH) |\\n| 4 | capacity×sizeof(T) | `RamPipe.ctor` (default 512 MiB for T=64B) | src/Relay/Pipes/RamPipe.cs:32 | `NativeMemory.AllocZeroed` (off-heap) |\\n| 5 | 32 | `RelayBuilder.Start` | src/Relay/Builder/RelayBuilder.cs:21 | `PipeChain` gen0 |\\n| 6 | 32 | `FanOut2Pipe.ctor` | src/Relay/FanOutPipe.cs:59 | `FanOut2Pipe` gen0 |\\n| 7 | 32+N×8 | `FanOutPipe.ctor` | src/Relay/FanOutPipe.cs:16 | object + retained children array |\\n| 8 | 40 | `FilterPipe.ctor` | src/Relay/FilterPipe.cs:21 | object (delegate ref captured) |\\n| 9 | Thread obj | `SpscQueuePipe.Start` | src/Relay/SpscQueuePipe.cs:80 | managed `Thread` + name string |\\n| 10 | 0 | steady-state hot path | producer+consumer | zero-alloc invariant holds |\\n\\n## 5. Anti-Pattern Offenders\\n| severity | rule | symbol | file:line | evidence |\\n|---|---|---|---|---|\\n| low | virtual call on hot path w/ multiple impls | `DispatchPipe.Enqueue` → `IsHealthy` / `Accept` | src/Relay/DispatchPipe.cs:32 | 5 subclasses; mitigated when caller uses `sealed` concrete type (devirt) |\\n| low | delegate invoke on hot path | `FilterPipe.Accept` → `_predicate(item)` | src/Relay/FilterPipe.cs:33 | 8c per call; intentional user extension point |\\n| info | `Thread.Sleep(1)` in idle branch | `SpscQueuePipe.ConsumeLoop` | src/Relay/SpscQueuePipe.cs:149 | 1e6c — acceptable (idle only, no producer pressure) |\\n| info | `foreach` over array in broadcast | `FanOutPipe.Accept` / `.IsHealthy` | src/Relay/FanOutPipe.cs:28,35 | array enumerator is struct (IL reduced to indexer); no alloc |\\n| info | isinst runtime cast | `PipeChain.To` | src/Relay/Builder/PipeChain.cs:30 | build-time only, not hot |\\n| none | heap alloc in hot path | — | — | none detected on `Enqueue`/`Accept`/`TryPublish`/`TryConsume` |\\n| none | `lock`/`Monitor` | — | — | not present |\\n| none | `async`/`await` on hot path | — | — | not present |\\n| none | `DateTime.UtcNow` | — | — | `HfClock.NowTicks` used everywhere |\\n\\n## 6. Cache-Line Report\\n| symbol | sizeof | issue | file:line |\\n|---|---|---|---|\\n| `PaddedLong` | 128 | intentional — prevents false sharing between producer tail and consumer head | src/Relay/Buffers/SpscRingBuffer.cs:10 |\\n| `SpscRingBuffer<T>` instance | ~headerOk | `_head` and `_tail` are adjacent `PaddedLong` fields → 2 × 128B = separate cache lines, no false sharing | src/Relay/Buffers/SpscRingBuffer.cs:26 |\\n| `T` payload | 32/64/128/256 | enforced by `PipeConstraints.AssertCacheLineAligned<T>()` in DEBUG only | src/Relay/Internal/PipeConstraints.cs:14 |\\n| `FileStreamPipe` / `TcpPipe` instance | <64 scalar fields + buffer refs | no false-sharing risk — fields only written by consumer thread | src/Relay/Pipes/FileStreamPipe.cs:26 |\\n| `MmfPipe._position` | 8B scalar | written by consumer via `Volatile.Write`, read by producer `IsHealthy` via `Volatile.Read`; shares cache line with other class fields → minor producer read contention on flush | src/Relay/Pipes/MmfPipe.cs:27 |\\n| `RamPipe._head`/`_tail` | 8B each, adjacent | single-thread contract; no false-sharing concern | src/Relay/Pipes/RamPipe.cs:21 |\\n\\n…(truncated)\", \"/docs/reports/2026-04-24-bdn-typed-mpsc-propagate.md\": \"# BDN — typed MPSC + Propagate + throughput harness\\n\\n_generated 2026-04-24 · BenchmarkDotNet 0.13.12 (ShortRun) + xUnit Thread harness · .NET 9.0.14 RyuJIT X64 AVX2_\\n\\n## 0. Executive Summary\\n\\n| Gate | Result |\\n|---|---|\\n| `PropagateAfterAccept` default (false) adds ≤5% vs `EnqueueBenchmarks.Depth1_Healthy` | ✅ **+3.2%** (0.230 ns vs 0.226 ns baseline) |\\n| MPSC `TryPublish_NoContention` ≤ 2× SPSC `TryPublish` baseline | ✅ **1.93×** at capacity 64; worst case 5.76× at 1024 (see §2 — baseline variance) |\\n| Typed MPSC 4-producer throughput ≥ 1.5× 1-producer | ❌ **0.90×** — consumer thread is the bottleneck (§4) |\\n| Byte MPSC multi-producer scaling | ≈ flat at 23M items/sec — same consumer-bound ceiling |\\n| Tee pipe adds correct overhead (ratio is \\\"2 hops cost of 1 hop\\\") | ✅ `Depth2_Tee_Wrapped` = 3.88 ns ≈ 2× `Depth1_Healthy` 0.23 ns + MPSC publish 6.3 ns on Next |\\n\\n**Headline finding**: MPSC ring is not the bottleneck under realistic multi-producer load — the single consumer thread saturates at ~24M items/sec. Producer CAS cost is invisible until the consumer can keep up. Typed SPSC was 2.9 ns RoundTrip on single thread = ~345M items/sec theoretical; the MPSC consumer path (TryConsume + counter increment + loop) collapses that to ~24M/sec.\\n\\n---\\n\\n## 1. Hardware & Environment\\n\\n| Field | Value |\\n|---|---|\\n| CPU | 12th Gen Intel Core i7-12700 (Alder Lake), 12 physical / 20 logical |\\n| P-core base / boost | 3.6 GHz / 4.9 GHz |\\n| L1d / L2 / L3 | 48 KB / 1.25 MB / 25 MB |\\n| Runtime | .NET 9.0.14 (9.0.1426.11910) |\\n| JIT | RyuJIT X64 AVX2, VectorSize=256 |\\n| OS | Windows 11 (10.0.26200) |\\n| Job | BDN ShortRun (3 iters × 3 warmups × 1 launch) — noise budget ±10% acceptable |\\n\\n---\\n\\n## 2. `MpscBenchmarks` — ring primitives (single-thread)\\n\\n| Capacity | Method | Mean (ns) | ±StdDev | Ratio vs SPSC | Cycles @3.6GHz |\\n|---:|---|---:|---:|---:|---:|\\n| 64 | Spsc_TryPublish_Baseline | 3.24 | 0.16 | 1.00 | 11.7 c |\\n| 64 | Mpsc_TryPublish_NoContention | 6.26 | 0.03 | **1.93×** | 22.6 c |\\n| 64 | Mpsc_TryPublish_Full | 0.22 | 0.00 | 0.07× | 0.8 c |\\n| 64 | Mpsc_TryConsume_Empty | 0.20 | 0.01 | 0.06× | 0.7 c |\\n| 1024 | Spsc_TryPublish_Baseline | 1.12 | 0.01 | 1.00 | 4.0 c |\\n| 1024 | Mpsc_TryPublish_NoContention | 6.47 | 0.05 | 5.76× | 23.3 c |\\n| 1024 | Mpsc_TryPublish_Full | 0.21 | 0.01 | 0.19× | 0.8 c |\\n| 1024 | Mpsc_TryConsume_Empty | 0.24 | 0.03 | 0.21× | 0.9 c |\\n| 65536 | Spsc_TryPublish_Baseline | 2.03 | 0.33 | 1.00 | 7.3 c |\\n| 65536 | Mpsc_TryPublish_NoContention | 6.76 | 0.07 | 3.40× | 24.3 c |\\n| 65536 | Mpsc_TryPublish_Full | 0.21 | 0.01 | 0.11× | 0.8 c |\\n| 65536 | Mpsc_TryConsume_Empty | 0.003 | 0.003 | 0.002× | ~0 c |\\n\\n**Single-thread MPSC overhead**: ~23 cycles per publish+consume pair (vs SPSC ~4-12). The 10-20 cycle delta = CAS (`Interlocked.CompareExchange`) + per-slot `Volatile.Write(Published, 1)` release fence + consumer's `Volatile.Write(Published, 0)` recycle.\\n\\n**SPSC baseline variance**: at cap 1024, SPSC measured 1.12 ns (surprising — faster than cap 64's 3.24 ns). Short-job noise; full-job run would tighten.\\n\\n**Fast-reject paths**: `TryPublish_Full` and `TryConsume_Empty` both ~0.2 ns — single volatile-read + compare + early-exit. Matches SPSC byte variant from yesterday's report.\\n\\n---\\n\\n## 3. `PropagateBenchmarks` — PropagateAfterAccept + Tee\\n\\n| Method | Mean (ns) | ±StdDev | Ratio | Code Size |\\n|---|---:|---:|---:|---:|\\n| Depth1_Healthy_Default | 0.230 | 0.006 | 1.00 | 275 B |\\n| Depth1_Healthy_Propagate_NoNext | 0.237 | 0.004 | **1.03×** | 284 B |\\n| Depth2_Propagate_Tee | 4.99 | 0.02 | 21.8× | 297 B |\\n| Depth2_Tee_Wrapped | 3.88 | 0.02 | 16.9× | 270 B |\\n\\n- **Gate 1 — default path**: 1.03× = 3.2% regression. Within ±5% gate. JIT constant-folds `PropagateAfterAccept => false` — the added branch costs ~0.007 ns ≈ 0.025 c, in short-job noise.\\n- **Depth2 Tee**: 3.88 ns — combines 1× propagate + 1× Next.Enqueue (CounterPipe). With 0.23 ns per single pipe, expected ≈ 0.46 ns for 2 hops; we see 3.88 ns, ~8× higher than naive additive. Reason: `TeePipe.Accept` calls `_primary.Enqueue` which is a full vcall + devirt through the sealed TeePipe → primary path, breaking JIT inlining that makes Depth1 so cheap.\\n- **Tee_Wrapped vs Propagate_Tee**: `Tee_Wrapped` (3.88 ns) is FASTER than the custom `Propagate_Tee` pipe (4.99 ns) — sealed TeePipe devirtualizes the primary call one more time than the custom type.\\n\\n---\\n\\n## 4. `EnqueueBenchmarks` baseline re-run\\n\\n| Method | Mean (ns) | ±StdDev | Ratio vs Depth1 |\\n|---|---:|---:|---:|\\n| Depth1_Healthy | 0.245 | 0.028 | 1.00 |\\n| Depth2_AcceptReject | 2.84 | 0.02 | 11.7× |\\n| Depth2_HeadUnhealthy | 1.74 | 0.02 | 7.2× |\\n| Depth3_AllUnhealthy | 2.01 | 0.02 | 8.2× |\\n\\nNumbers within 10% of the 15:49 run from the prior session (0.226 / 2.39 / 1.52 / 3.82). Short-job variance visible in `Depth1_Healthy` (±0.03 ns ≈ ±12%). No real regression from the `PropagateAfterAccept` branch or the sealed `=> false` overrides.\\n\\n---\\n\\n## 5. `MpscThroughputHarness` — multi-producer under contention\\n\\nThread-based xUnit harness (not BDN — BDN can't model multi-thread contention cleanly). Each producer thread publishes at `ThreadPriority.Highest`; one consumer drains. Harness tagged `Category=Perf` and excluded from default test runs.\\n\\n### 5.1 `MpscRingBuffer<Entry64>` — 1M items per producer, ring capacity 1M slots\\n\\n| Producers | items/sec | scaling vs 1P |\\n|---:|---:|---:|\\n| 1 | 24,670,343 | 1.00× |\\n| 2 | 19,081,475 | **0.77×** |\\n| 4 | 22,103,819 | 0.90× |\\n| 8 | 23,263,232 | 0.94× |\\n\\n### 5.2 `MpscByteRingBuffer` — 500k items per producer, ring capacity 4 MiB, 64B payload\\n\\n| Producers | items/sec | scaling vs 1P |\\n|---:|---:|---:|\\n| 1 | 23,591,916 | 1.00× |\\n| 2 | 23,988,927 | 1.02× |\\n| 4 | 22,682,166 | 0.96× |\\n| 8 | 22,838,546 | 0.97× |\\n\\n### 5.3 Interpretation\\n\\nBoth rings **plateau at ~23–24M items/sec regardless of producer count**. Clear signal: the single consumer thread is the bottleneck, not the producer CAS or HeadCache path.\\n\\nPer-item cost on the consumer at ~24M/sec = **~42 ns** per consumed item. Breakdown (est):\\n- `TryConsume` / `TryPeek` + `Advance`: ~6–10 ns (BDN §2)\\n- Consumer loop overhead (Volatile.Read counter + Volatile.Write + while comparison): ~5 ns\\n- OS thread scheduling + cache coherency cross-producer: ~25 ns per drained item\\n\\nThe 2P case for typed showing 0.77× (not 1.00×) is a **producer-contention artefact** on the 4MB-total Slot[] array (1M × 68B = 68 MB POH). At 2 producers, CAS contention is highest per producer (each producer retries more often because the other is also CAS-ing), but the consumer drain rate is still the ultimate ceiling. At 4/8 producers, the per-producer CAS cost amortizes (each producer publishes less frequently per unit time). Matches typical Disruptor / LMAX contention curves.\\n\\n### 5.4 Follow-up actions (out of scope here)\\n\\n- **Consumer batching**: `TryConsume` N items per loop iteration, amortize the `Volatile.Write(head)` across the batch. Expected gain: 2–3× consumer drain rate.\\n- **Consumer-side HeadCache**: single consumer doesn't need `_head` coherent on every read. Could decouple — but `_head` IS consumer-owned already; no contention to optimize.\\n- **Long-job BDN run**: would tighten all error bars. Not urgent given the 23–24M ceiling is far above any plausible logging rate.\\n\\n---\\n\\n## 6. Relation to existing static analysis\\n\\n`docs/reports/2026-04-23-resource-cost-map-relay.md` estimated `SpscRingBuffer.TryPublish` at ~10c. Today's measurements:\\n- SPSC TryPublish (round-trip) cap 64: 3.24 ns / 11.7 c — **matches static estimate ✅**\\n- MPSC TryPublish no-contention: 6.3 ns / 22.6 c — ~2× the static SPSC estimate, consistent with one added CAS (~10c) + one Volatile.Write release fence on the Published flag\\n\\nStatic analysis held up well for MPSC. The prior hot-path overestimate (flagged in `2026-04-23-bdn-vs-static-analysis.md`) was specific to `Depth1_Healthy` which benefits from JIT devirtualization/inlining that the static model underweights; ring primitives are already simple enough for the static model to predict within a factor of ~1.1–1.3.\\n\\n---\\n\\n## 7. Artefacts referenced\\n\\n- `BenchmarkDotNet.Artifacts/results/Relay.Benchmarks.MpscBenchmarks-report-github.md`\\n- `BenchmarkDotNet.Artifacts/results/Relay.Benchmarks.PropagateBenchmarks-report-github.md`\\n- `BenchmarkDotNet.Artifacts/results/Relay.Benchmarks.EnqueueBenchmarks-report-github.md`\\n- `tests/Relay.Tests/MpscThroughputHarness.cs` (re-run with `dotnet test --filter \\\"Category=Perf\\\"`)\\n- `docs/reports/2026-04-23-mpsc-ringbuffer-byte-vs-log2.md` (structural comparison)\", \"/docs/TOPOLOGY.md\": \"# Relay Library — Topology\\n\\n```\\n================================================================================\\n                         TYPE HIERARCHY\\n================================================================================\\n\\n  DispatchSink<T>  (abstract, T : unmanaged)\\n       │\\n       │  Next: DispatchSink<T>?      ← set by SinkChain.To()\\n       │  IsHealthy: bool             ← abstract; consumer thread writes, producer reads\\n       │  PropagateAfterAccept: bool  ← protected readonly field (ctor param, default false)\\n       │  Enqueue(in T)               ← sealed hot path: (IsHealthy && Accept) then Next or return\\n       │  Accept(in T): bool          ← abstract; returns false to trigger fallback\\n       │  Flush() / Dispose()         ← abstract lifecycle\\n       │\\n       ├── SpscQueueSink<T>  (abstract)\\n       │       │  _ring: SpscRingBuffer<T>       ← SPSC lock-free, POH pinned\\n       │       │  _healthy: volatile bool        ← consumer thread only\\n       │       │  Prev: DispatchSink<T>?         ← set by SinkChain.To() on fallback nodes\\n       │       │  IsHealthy => _healthy && !_ring.IsFull\\n       │       │  Accept   => _ring.TryPublish(item)\\n       │       │  Start() / Stop(ms)             ← spawns / joins consumer thread\\n       │       │  IsConsuming / ConsumerException\\n       │       │\\n       │       ├── FileStreamSink<T>  (sealed)  ← FileStream + POH write buffer\\n       │       ├── TcpSink<T>         (sealed)  ← TcpClient + POH send buffer\\n       │       └── MmfSink<T>         (sealed)  ← MemoryMappedViewAccessor\\n       │\\n       ├── MpscQueueSink<T>  (abstract)\\n       │       │  _ring: MpscRingBuffer<T>       ← MPSC lock-free (Log2 FIX #18 layout)\\n       │       │  Prev: DispatchSink<T>?\\n       │       │  (same lifecycle API as SpscQueueSink<T>)\\n       │\\n       ├── MultiSink<T>      (sealed)  ← broadcast to DispatchSink<T>[] children\\n       ├── Multi2Sink<T, TC1, TC2>  (sealed)  ← CRTP 2-child, JIT devirtualizes\\n       ├── ForkSink<T>       (sealed)  ← primary + Next propagation (propagate-after-accept)\\n       ├── FilterSink<T>     (sealed)  ← conditional gate + downstream sink\\n       ├── NullSink<T>       (sealed)  ← singleton no-op sink\\n       └── SerializeSink<T>  (sealed)  ← bridge: typed T → PacketSink (MemoryMarshal.AsBytes)\\n\\n  MemorySink<T>  (unsealed)  ← direct subclass of DispatchSink<T>\\n       │  _buffer: T* (NativeMemory.AllocZeroed)\\n       │  _head / _tail: long  ← single-threaded, not SPSC ring\\n       │  IsHealthy => _tail - _head < _capacity\\n       │  Accept   => native pointer write\\n       │  DrainTo(DispatchSink<T>) ← called externally on recovery\\n\\n  ─────────────────────────────────────────────────────────────────────────────\\n  PacketSink  (abstract, byte payloads)\\n       │\\n       │  Next: PacketSink?\\n       │  IsHealthy: bool\\n       │  Enqueue(ReadOnlySpan<byte>)  ← hot path: IsHealthy && Accept || Next?.Enqueue\\n       │  Accept(ReadOnlySpan<byte>): bool\\n       │  Flush() / Dispose()\\n       │\\n       ├── SpscQueueSink  (abstract, non-generic)\\n       │       │  _ring: SpscByteRingBuffer      ← lock-free length-prefixed SPSC ring\\n       │       │  _healthy: volatile bool\\n       │       │  Prev: PacketSink?              ← drain-to-prev on recovery\\n       │       │\\n       │       ├── FileSink          (sealed)  ← byte append to FileStream, POH buffer\\n       │       ├── RotatingFileSink  (sealed)  ← size + date rotation, max-file cleanup\\n       │       ├── NamedPipeSink     (sealed)  ← length-prefixed named-pipe client\\n       │       ├── UdpSink           (sealed)  ← UDP datagrams\\n       │       ├── TcpSink           (sealed)  ← length-framed TCP, POH send buffer\\n       │       └── BatchSink  (abstract)\\n       │               │  _scratch: byte[] POH  ← accumulates payloads per batch\\n       │               │  OversizedDropCount    ← observable counter\\n       │               │  OnFlush(ReadOnlySpan<byte>)  ← abstract; receives full batch\\n       │               │\\n       │               └── HttpBatchSink  (abstract)\\n       │                       │  circuit breaker (cbFailures + cbOpenDurationMs)\\n       │                       │  HttpFailureCount / BreakerOpenCount / DroppedBatchCount\\n       │                       │\\n       │                       └── SeqSink  (sealed)  ← CLEF/HTTP → Seq /api/events/raw\\n       │\\n       ├── MpscQueueSink  (abstract, non-generic)\\n       │       │  _ring: MpscByteRingBuffer\\n       │       │  (same lifecycle API as SpscQueueSink)\\n       │\\n       ├── ForkSink    (sealed, non-generic)  ← primary + Next propagation\\n       ├── MultiSink   (sealed, non-generic)  ← broadcast to PacketSink[] children\\n       ├── Multi2PacketSink<TC1, TC2>  (sealed)  ← CRTP 2-child broadcast, JIT devirtualizes\\n       ├── FilterSink  (sealed, non-generic)  ← conditional gate\\n       └── NullSink    (singleton)            ← NullSink.Instance\\n\\n  MemorySink  (unsealed, non-generic)  ← direct subclass of PacketSink\\n       │  Native memory fill-once buffer, linear layout with 4-byte BE headers\\n       │  DrainTo(PacketSink) ← called externally on recovery\\n\\n  SharedMemorySink  (sealed)  ← synchronous PacketSink, Log2 MMF wire protocol\\n       │  Named MemoryMappedFile ring (128-byte header + data area)\\n       │  No consumer thread — writes synchronously on producer thread\\n\\n  ─────────────────────────────────────────────────────────────────────────────\\n  PacketCallback<TState>  (delegate, namespace Relay)\\n       delegate void PacketCallback<TState>(TState state, ReadOnlySpan<byte> frame)\\n       Zero-alloc span callback. Sidesteps the C# restriction on Action<ReadOnlySpan<byte>>.\\n       Static-lambda dispatch eliminates closure allocation.\\n\\n  PacketReceiver  (abstract, namespace Relay)\\n       │  Next: PacketSink?     ← optional forward-chain; item forwarded after callback\\n       │  Poll(): bool          ← caller-driven; true = frame delivered to callback\\n       │  Dispose()\\n       │  No consumer thread — the caller's loop drives Poll()\\n       │\\n       ├── UdpReceiver<TState>              (sealed)  ← non-blocking Poll() via Socket.Poll(0);\\n       │                                              stackalloc byte[1432] per call (MTU-safe)\\n       ├── TcpReceiver<TState>              (sealed)  ← Accept() once; Poll() per frame;\\n       │                                              length-framed [4B BE][payload]\\n       ├── SharedMemorySpscReceiver<TState> (sealed, unsafe, Windows-only)\\n       │                                             SPSC ring consumer matching SharedMemorySpscSink\\n       │                                             wire format; SHM_MAGIC validation on ctor\\n       └── NamedPipeReceiver<TState>        (sealed)  ← WaitForConnection() once; Poll() per frame;\\n                                                       same wire format as TcpReceiver\\n\\n\\n================================================================================\\n                         ASSEMBLY GRAPH\\n================================================================================\\n\\n  Relay.csproj  (src/Relay)\\n  ├── namespace Relay          DispatchSink<T>, SpscQueueSink<T>, MpscQueueSink<T>,\\n  │                            MultiSink<T>, Multi2Sink<T,TC1,TC2>, ForkSink<T>,\\n  │                            FilterSink<T>, NullSink<T>, SerializeSink<T>,\\n  │                            PacketSink, SpscQueueSink, MpscQueueSink,\\n  │                            ForkSink, MultiSink, Multi2PacketSink<TC1,TC2>,\\n  │                            FilterSink, NullSink, BatchSink,\\n  │                            PacketCallback<TState>, PacketReceiver\\n  ├── namespace Relay.Buffers  SpscRingBuffer<T>, MpscRingBuffer<T>,\\n  │                            SpscByteRingBuffer, MpscByteRingBuffer    [internal]\\n  ├── namespace Relay.Sinks    FileStreamSink<T>, MmfSink<T>, TcpSink<T>, MemorySink<T>\\n  │                            FileSink, RotatingFileSink, NamedPipeSink,\\n  │                            UdpSink, TcpSink, MemorySink, SharedMemorySink\\n  ├── namespace Relay.Receivers UdpReceiver<TState>, TcpReceiver<TState>,\\n  │                            SharedMemorySpscReceiver<TState>, NamedPipeReceiver<TState>\\n  ├── namespace Relay.Builder  RelayBuilder, SinkChain<T,THead>, MultiBuilder<T>,\\n  │                            FilterBinding<T,THead>                    [typed chain]\\n  │                            SinkChainBuilder, SinkChain<THead>,\\n  │                            FilterBinding<THead>                      [packet chain]\\n  │                            RelayBuilder.From<TState>, FromTcp<TState>,\\n  │                            FromSharedMemory<TState>, FromNamedPipe<TState>\\n  ├── namespace Relay.Memory   RelayMemory                               [internal]\\n  └── namespace Relay.Internal HfClock, SinkConstraints                 [internal]\\n\\n  Relay.Sinks.Http.csproj  (src/Relay.Sinks.Http)\\n  └── namespace Relay.Sinks.Http     HttpBatchSink\\n        depends on → Relay.csproj\\n\\n  Relay.Sinks.Observability.csproj  (src/Relay.Sinks.Observability)\\n  └── namespace Relay.Sinks.Observability.Seq     SeqSink\\n        depends on → Relay.csproj, Relay.Sinks.Http.csproj\\n\\n  Relay.Tests.csproj\\n  └── InternalsVisibleTo → Relay, Relay.Sinks.Http, Relay.Sinks.Observability\\n\\n  Relay.Benchmarks.csproj\\n  └── InternalsVisibleTo → Relay\\n\\n\\n================================================================================\\n                         ENQUEUE HOT PATH\\n================================================================================\\n\\n  caller.Enqueue(in item)          [producer thread]\\n       │\\n       ▼\\n  DispatchSink<T>.Enqueue(in T item):\\n  ┌─────────────────────────────────────────────────────────────────┐\\n  │  bool accepted = IsHealthy && Accept(in item);                  │\\n  │  if (accepted && !PropagateAfterAccept) return;  ← fast exit    │\\n  │  Next?.Enqueue(in item);                         ← fallback/fork│\\n  └─────────────────────────────────────────────────────────────────┘\\n       │\\n       ├─ IsHealthy = true, Accept = true, PropagateAfterAccept = false\\n       │      → item delivered locally, return\\n       │\\n       ├─ IsHealthy = true, Accept = true, PropagateAfterAccept = true (ForkSink)\\n       │      → item delivered locally, Next?.Enqueue continues\\n       │\\n       ├─ IsHealthy = false  (backend broken or ring full)\\n       │      → Accept not called (short-circuit)\\n       │      → Next?.Enqueue(item)   [hop to fallback]\\n       │\\n       ├─ IsHealthy = true, Accept = false  (ring full during call)\\n       │      → Next?.Enqueue(item)   [hop to fallback]\\n       │\\n       └─ Next == null\\n              → silent drop (no exception, no log)\\n\\n  Gate semantics:\\n  ┌──────────────┬───────────────────────────────────────────────────────┐\\n  │ Gate         │ Who writes / What detects                             │\\n  ├──────────────┼───────────────────────────────────────────────────────┤\\n  │ IsHealthy    │ Consumer thread (_healthy flag) or capacity check     │\\n  │              │ → backend broken  OR ring full at moment of check     │\\n  ├──────────────┼───────────────────────────────────────────────────────┤\\n  │ Accept(item) │ Result of _ring.TryPublish — ring full during call    │\\n  │              │ → definitive gate; race between IsHealthy and TryPub  │\\n  └──────────────┴───────────────────────────────────────────────────────┘\\n\\n  PropagateAfterAccept:\\n    readonly bool field set in DispatchSink<T>(bool propagateAfterAccept = false).\\n    ForkSink<T> passes true; all other concrete sinks pass false (default).\\n    Sealed subclasses with a compile-time constant collapse the branch at JIT time.\\n    Propagation fires ONLY after successful Accept. Failure path is unchanged.\\n\\n\\n================================================================================\\n                         CHAIN TOPOLOGIES\\n================================================================================\\n\\n  T1 — Single SpscQueueSink (depth 1)\\n  ─────────────────────────────────────\\n  caller ──▶ [FileStreamSink<T>]\\n\\n  T2 — Serial depth 2\\n  ────────────────────\\n  caller ──▶ [FileStreamSink<T>] ──(Next)──▶ [MemorySink<T>]\\n             unhealthy? ───────────────────────────────▶\\n\\n  T3 — Serial depth 3\\n  ────────────────────\\n  caller ──▶ [FileStreamSink<T>] ──▶ [TcpSink<T>] ──▶ [MemorySink<T>]\\n\\n  T4 — Multi broadcast to 2 children\\n  ────────────────────────────────────\\n  caller ──▶ [MultiSink<T>] ──▶ c1 [FileStreamSink<T>]\\n                             └──▶ c2 [TcpSink<T>]\\n             all-fail? ──▶ (Next / drop)\\n\\n  T5 — Multi + serial fallback\\n  ─────────────────────────────\\n  caller ──▶ [MultiSink<T>] ──▶ c1 [FileStreamSink<T>]\\n             │               └──▶ c2 [TcpSink<T>]\\n             └──(Next)──▶ [MemorySink<T>]    ← only when all children unhealthy\\n\\n  T6 — Filter gate\\n  ─────────────────\\n  caller ──▶ [FilterSink<T>] ──(predicate true)──▶ [FileStreamSink<T>]\\n                              ──(predicate false)─▶ (consumed, no fallback)\\n\\n  T7 — Multi2Sink CRTP variant (sealed TC1, TC2 → JIT devirtualizes)\\n  ───────────────────────────────────────────────────────────────────\\n  caller ──▶ [Multi2Sink<Entry, FileStreamSink<Entry>, TcpSink<Entry>>]\\n                          ├── _c1.Enqueue(item)   [inlined by JIT]\\n                          └── _c2.Enqueue(item)   [inlined by JIT]\\n\\n  T8 — Fork (propagate-after-accept)\\n  ────────────────────────────────────\\n  caller ──▶ [ForkSink<T>(primary=Audit)] ──▶ Audit.Enqueue   [local]\\n                                          └──(Next)──▶ [MainSink<T>]\\n\\n  T9 — Typed → Packet bridge\\n  ───────────────────────────\\n  caller ──▶ [SerializeSink<T>] ──▶ [SpscQueueSink (FileSink / SeqSink)]\\n             (MemoryMarshal.AsBytes, zero alloc)\\n\\n  T10 — Packet HTTP batch → Seq\\n  ──────────────────────────────\\n  caller ──▶ [SeqSink] ──(circuit-breaker open)──▶ [MemorySink / NullSink]\\n\\n\\n================================================================================\\n                         MULTI ROUTING RULES\\n================================================================================\\n\\n  MultiSink<T>.IsHealthy:\\n    short-circuit OR over children:\\n      for each child: if child.IsHealthy → return true\\n      (all fail) → return false → triggers Next?.Enqueue\\n\\n  MultiSink<T>.Accept(item):\\n    for each child: child.Enqueue(item)   ← always, regardless of health\\n    return true                            ← never triggers fallback via Accept\\n\\n  Key: fallback to Next only when IsHealthy = false (all children unhealthy).\\n  Partial failure (some healthy, some not) → healthy children receive; unhealthy drop.\\n\\n  FilterSink<T>.Accept(item):\\n    if predicate(item): _downstream.Enqueue(item)\\n    return true         ← always; filtered items do NOT propagate to Next\\n\\n\\n================================================================================\\n                         SpscQueueSink<T> — CONSUMER THREAD\\n================================================================================\\n\\n  [Producer thread]              [Consumer thread: \\\"relay-{sinkName}\\\"]\\n       │                                │\\n  Enqueue(item)                  Start() → new Thread(ConsumeLoop)\\n       │                                │\\n  _ring.TryPublish ──────────────▶  ConsumeLoop():\\n  (Volatile.Write tail)              ┌─────────────────────────────────┐\\n                                     │  while ShouldKeepDraining():    │\\n                                     │    TryConsume → WriteToBackend  │\\n                                     │    batch up to 256 entries      │\\n                                     │    idle: SpinWait→Yield→Sleep   │\\n                                     │    flush check:                 │\\n                                     │      after batch: always        │\\n                                     │      spin phase: every 8 iters  │\\n                                     │      yield/sleep: always        │\\n                                     │    on flush deadline:           │\\n                                     │      FlushBackend()             │\\n\\n…(truncated)\", \"/docs/superpowers/plans/2026-04-29-master-cost-map-coverage.md\": \"# Cost-Map Coverage — Master Plan (8 phases)\\n\\n> **For agentic workers:** this is an **orchestration document**, not an executable plan. Each phase has a dedicated child plan filed under `docs/superpowers/plans/2026-04-29-phaseN-*.md`. Use those child plans with `superpowers:subagent-driven-development` or `superpowers:executing-plans`.\\n\\n**Goal:** Close every BDN coverage gap identified in `benchmarks/artifacts/2026-04-29-hotpath/cross-check-and-gaps.md` (1 critical + 10 high + 10 medium = 21 items) and apply the `RotatingFileSink` UtcNow regression fix flagged in `docs/reports/2026-04-29-resource-cost-map-relay.md` §5.\\n\\n**Why phased:** 21 atomic items across 12+ new BDN classes + 1 production fix + 1 new public type would yield an unreviewable PR. Each phase is one branch, one merge to `develop`, before the next phase starts. Failure in any phase does not block subsequent phases.\\n\\n**Branch hygiene:** every phase branches off the latest `develop` after the previous phase merges. CLAUDE.md HARD RULE — no commit goes directly to `develop` or `master`.\\n\\n---\\n\\n## Phase Map\\n\\n| # | Branch | Items | Output | Effort | Status |\\n|---|---|---|---|---|---|\\n| 1 | `fix/260429-rotatingfilesink-utcnow-hot-path` | C1 + UtcNow fix | regression closed + BDN gate | ~2h | ✅ done — 6 commits, 190/190 tests pass, BDN: predicate 21.84ns→13.76ns (Δ 8.08ns); ratio gate recalibrated post-execution (see notes) |\\n| 2 | `chore/260429-bdn-packet-tree-symmetry` | M1, M2, M4, M9 | packet equivalents to typed Fork/Multi/Filter/SpscThroughput BDNs | ~3h | ✅ done — packet-tree symmetry BDNs added (M1 ForkPacket, M2 MultiPacket + IsHealthy, M4 FilterPacket, M9 SpscPacket throughput); numbers under `benchmarks/artifacts/2026-04-29-phase2/` |\\n| 3 | `chore/260429-bdn-mpsc-byte-and-end-to-end` | H1, H2, H3, H4 | MpscByteRingBuffer + Mpsc end-to-end (typed + packet) BDNs | ~4h | ✅ done — MpscByteRingBufferBenchmarks (H1+H2, 48 cells), MpscPush_* extended in QueuePipeThroughputBenchmarks (H3), MpscPacketQueueSinkThroughputBenchmarks (H4); MPSC RoundTrip 1.5-2.5x SPSC; numbers under `benchmarks/artifacts/2026-04-29-phase3/` |\\n| 4 | `chore/260429-bdn-backends` | H5, H6, H7, H8, M5, M6, M7 | concrete-sink BDNs (Shm, RamPacket, Mmf, Udp, Batch, NamedPipe, UnixSocket); platform-gated | ~5h | ✅ done — 7 BDN classes added under `benchmarks/Relay.Benchmarks/Sinks/`; key numbers — RamPacket Accept 4.4 ns, SharedMemory Accept 11.8 ns, MmfSink Push@1M 6.9 ms, UdpSink Push@100k 4.1 ms, NamedPipe Push@10k 0.5 ms; M5 BatchSink demoted to ring-publish-only (production-accessor change avoided); UnixSocketSink also runs on Windows (AF_UNIX is supported) — gate not effective; numbers under `benchmarks/artifacts/2026-04-29-phase4/` |\\n| 5 | `chore/260429-bdn-packet-api-contracts` | H9, H10 | TryEnqueue + terminal-drop BDNs | ~2h | ✅ done — extended `ByteEnqueueBenchmarks` w/ 4 new methods. TryEnqueue_Healthy 0.42 ns (6x faster than Enqueue 2.68 ns), TryEnqueue_Reject 0.22 ns; Drop_NextNull_Unhealthy 3.75 ns + Drop_NextNull_Reject 3.79 ns (~5c overhead vs Enqueue baseline for `Interlocked.Increment(_dropCount)`); numbers under `benchmarks/artifacts/2026-04-29-phase5/` |\\n| 6 | `feat/260429-multi2-packet-sink` | M3 | new sealed type `Multi2PacketSink` + impl + tests + BDN | ~3h | ✅ done — `Multi2PacketSink<TC1,TC2>` sealed CRTP type + `SinkChain<THead>.Multi<TC1,TC2>(c1,c2)` builder overload; 7 new tests (broadcast, IsHealthy true/false, Flush, Dispose, ctor null-check, builder wiring); 197/197 tests pass; ShortRun BDN: Multi2_Packet_Enqueue 3.93 ns vs MultiSink baseline 3.21 ns (ratio 1.23, within sub-ns CI overlap; code size 458B vs 690B confirms leaner CRTP path; `__Canon` shared generic body suppresses full devirt for reference-typed children); numbers under `benchmarks/artifacts/2026-04-29-phase6/` |\\n| 7 | `chore/260429-bdn-mpsc-multi-thread-contention` | M10 | multi-producer contention infra + BDN, closes blind subgraph §8 | ~3h | ✅ done — 2 BDN classes (`MpscContentionBenchmarks` typed + `MpscByteContentionBenchmarks` packet) at ProducerCount=1,2,4,8. Typed wall-clock: 94.7 / 258.5 / 325.2 / 602.2 ms (1M items × N producers); aggregate throughput: 10.6M / 7.7M / 12.3M / 13.3M items/s — N=2 shows the expected negative scaling (CAS contention dominates), N≥4 amortizes via head-cache. Packet ring: 459 / 813 / 661 / 1117 ms; aggregate: 2.18M / 2.46M / 6.05M / 7.16M items/s — variable-length payload + Advance overhead caps single-producer throughput, contention scales linearly past N=2 thanks to byte-ring CAS-by-recordSize granularity. ShortRun CIs are wide (>30% on most cells); blind subgraph §8 is closed by *measurement* (throughput proxy) — retry-counter instrumentation flagged as Phase 8 follow-up. Numbers under `benchmarks/artifacts/2026-04-29-phase7/`. |\\n| 8 | `docs/260429-cost-map-calibration` | recalibration | updates `2026-04-29-resource-cost-map-relay.md` §1/§2/§8/§9 with measured cycles from Phases 1-7 | ~1h | ✅ done — §8 blind subgraph \\\"MPSC CAS-retry\\\" closed via measurement; §9 added \\\"BDN-calibrated (Phases 1–7)\\\" subsection w/ 17 recalibrated rows + 2 contention measurements. **All 8 phases complete. 21 coverage gaps closed (1 critical + 10 high + 10 medium).** |\\n\\n**Total budgeted:** ~23h disciplined work across 8 PRs.\\n\\n---\\n\\n## Cross-cutting conventions\\n\\nApply to **every** phase unless noted otherwise:\\n\\n- **TDD order:** for fix work, failing test first → impl → green; for BDN-only work, BDN → run on baseline branch → record numbers → commit BDN.\\n- **Test gate:** `dotnet test tests/Relay.Tests` must report 0 failures before any commit (CLAUDE.md project gate).\\n- **BDN job:** `--job short` for triage during development, **rerun without `--job short` for the final BDN that ships in CHANGELOG**.\\n- **Output dir:** `benchmarks/artifacts/2026-04-29-phaseN/` (one folder per phase).\\n- **Commit message style:** Conventional Commits + `w/Claude` suffix. No `Co-Authored-By` trailer.\\n- **Branch naming:** as in the table above. Date format `yyMMdd` per project CLAUDE.md.\\n- **No direct push to `master`.** Every PR target `develop`. Merge requires user approval.\\n\\n---\\n\\n## Phase 1 — RotatingFileSink UtcNow fix + C1 BDN gate\\n\\n**Branch:** `fix/260429-rotatingfilesink-utcnow-hot-path`\\n**Plan:** `docs/superpowers/plans/2026-04-29-rotatingfilesink-day-boundary-cache.md` (amended with Task 0 — BDN baseline before fix).\\n\\n**Items closed:** C1.\\n\\n**Acceptance:**\\n- `RotatingFileSinkBenchmarks.ShouldRotate_HotPath` ratio ≥10x after fix (~50c → ~3c).\\n- Existing 4 `RotatingFileSinkTests` still pass.\\n- New `Enqueue_DayBoundaryCrossed_RotatesToNextFile` xUnit test passes.\\n- Cost-map §5 / §9 entries marked resolved with commit SHA.\\n\\n---\\n\\n## Phase 2 — Packet-tree symmetry BDNs\\n\\n**Branch:** `chore/260429-bdn-packet-tree-symmetry`\\n**Plan:** `docs/superpowers/plans/2026-04-29-phase2-packet-symmetry.md` (written when Phase 1 merges).\\n\\n**Items closed:** M1 (ForkSink packet), M2 (MultiSink packet N=2), M4 (FilterSink packet), M9 (SpscQueueSink packet end-to-end Push).\\n\\n**New BDN classes:**\\n- `benchmarks/Relay.Benchmarks/PacketSinks/PropagatePacketBenchmarks.cs` — mirror of `PropagateBenchmarks`, uses `ByteCounterPipe` + `ForkSink` (packet) + `Next?.Enqueue` chains.\\n- `benchmarks/Relay.Benchmarks/PacketSinks/MultiPacketEnqueueBenchmarks.cs` — mirror of `MultiEnqueueBenchmarks`, no Multi2-equivalent yet (M3 is Phase 6).\\n- `benchmarks/Relay.Benchmarks/PacketSinks/FilterPacketSinkBenchmarks.cs` — mirror of `FilterSinkBenchmarks` with `PacketPredicate`.\\n- Extend `QueuePipeThroughputBenchmarks` (rename to `QueueSinkThroughputBenchmarks` if not already done) with `Push_Single_Packet` / `Push_Batch_Packet` over `SpscQueueSink` (packet base) — needs `TestSpscPacketSink` helper analogous to `TestSpscPipe`.\\n\\n**Acceptance:** every new BDN runs to completion under `--job short`. Numbers documented in `benchmarks/artifacts/2026-04-29-phase2/`. No production code changes.\\n\\n---\\n\\n## Phase 3 — MPSC byte ring + Mpsc end-to-end\\n\\n**Branch:** `chore/260429-bdn-mpsc-byte-and-end-to-end`\\n**Plan:** `docs/superpowers/plans/2026-04-29-phase3-mpsc-byte-and-end-to-end.md` (written when Phase 2 merges).\\n\\n**Items closed:** H1, H2, H3, H4.\\n\\n**New BDN classes:**\\n- `benchmarks/Relay.Benchmarks/MpscByteRingBufferBenchmarks.cs` — parallel to `ByteRingBufferBenchmarks`. `[Params(Capacity, PayloadSize)]` matrix; `TryPublish_Empty`, `RoundTrip`, `TryPublish_Full`.\\n- Extend `QueueSinkThroughputBenchmarks` with `MpscPush_Single` / `MpscPush_Batch` (typed) using a `TestMpscPipe` helper.\\n- New `benchmarks/Relay.Benchmarks/PacketSinks/MpscPacketQueueSinkThroughputBenchmarks.cs` end-to-end packet variant with `TestMpscPacketSink`.\\n\\n**Acceptance:** Mpsc throughput ≥ 80% of Spsc baseline at single-producer, no allocs in steady state.\\n\\n---\\n\\n## Phase 4 — Concrete backend BDNs\\n\\n**Branch:** `chore/260429-bdn-backends`\\n**Plan:** `docs/superpowers/plans/2026-04-29-phase4-backends.md` (written when Phase 3 merges).\\n\\n**Items closed:** H5, H6, H7, H8, M5, M6, M7.\\n\\n**New BDN classes:**\\n- `benchmarks/Relay.Benchmarks/Sinks/SharedMemorySinkBenchmarks.cs` — `[SupportedOSPlatform(\\\"windows\\\")]`. Measures `SharedMemorySink.Accept` (CAS loop + modular `WriteRing`).\\n- `benchmarks/Relay.Benchmarks/Sinks/RamPacketSinkBenchmarks.cs` — `RamSink` (packet) `Accept` cost.\\n- `benchmarks/Relay.Benchmarks/Sinks/MmfSinkBenchmarks.cs` — typed `MmfSink<Entry64>.WriteToBackend` via `TestMmfPipe` consumer driver. **Validates the \\\"fastest durable backend\\\" claim.**\\n- `benchmarks/Relay.Benchmarks/Sinks/UdpSinkBenchmarks.cs` — `UdpSink.WriteToBackend` (loopback). **Validates the throughput-ceiling claim.**\\n- `benchmarks/Relay.Benchmarks/Sinks/BatchSinkBenchmarks.cs` — abstract base scratch-buffer copy cost via a test subclass.\\n- `benchmarks/Relay.Benchmarks/Sinks/NamedPipeSinkBenchmarks.cs` — `[SupportedOSPlatform(\\\"windows\\\")]`. Loopback NamedPipe server.\\n- `benchmarks/Relay.Benchmarks/Sinks/UnixSocketSinkBenchmarks.cs` — `[SupportedOSPlatform(\\\"linux\\\")] [SupportedOSPlatform(\\\"macos\\\")]`. Loopback unix-domain server.\\n\\n**Acceptance:** all BDNs run on at least one supported platform; platform-gated BDNs are silently skipped on the other platforms (BDN's `[SupportedOSPlatform]` honors this). Cost-map §1/§2 will be updated in Phase 8 with measured cycles.\\n\\n---\\n\\n## Phase 5 — Packet API contract BDNs\\n\\n**Branch:** `chore/260429-bdn-packet-api-contracts`\\n**Plan:** `docs/superpowers/plans/2026-04-29-phase5-packet-api.md` (written when Phase 4 merges).\\n\\n**Items closed:** H9, H10.\\n\\n**Extensions to `ByteEnqueueBenchmarks`:**\\n- `Depth1_Byte_TryEnqueue_Healthy` — non-fallthrough variant on healthy sealed sub.\\n- `Depth1_Byte_TryEnqueue_Reject` — non-fallthrough variant when `Accept` returns false (no Next traversal regardless).\\n- `Depth1_Byte_Drop_NextNull_Unhealthy` — terminal drop lt-in `[Benchmark]` does not parallelize automatically). Single consumer thread under `MpscRingBuffer<Entry64>` and `MpscByteRingBuffer`.\\n- Implementation pattern: `[GlobalSetup]` spawns `producerCount` threads pinned to distinct cores via `ProcessorAffinity`; benchmark method coordinates them via `ManualResetEventSlim` start gate; counts retries via a shared `_retryCount` field; reports throughput (items/s) and average retries/Publish.\\n\\n**Acceptance:** retry distribution under 4-producer load documented in `benchmarks/artifacts/2026-04-29-phase7/`. Cost-map §8 row for \\\"MPSC CAS-retry distribution\\\" downgraded from blind subgraph to \\\"measured: <X>% retry rate at <Y> producers\\\".\\n\\n---\\n\\n## Phase 8 — Cost-map calibration\\n\\n**Branch:** `docs/260429-cost-map-calibration`\\n**Plan:** `docs/superpowers/plans/2026-04-29-phase8-calibration.md` (written when Phase 7 merges).\\n\\n**Items closed:** — recalibrates the cost-map document itself.\\n\\n**Edits to `docs/reports/2026-04-29-resource-cost-map-relay.md`:**\\n- §1 Per-Entry Cost Table — replace `~Xc` predictions with `~Yc (BDN: Z ns @ 4.5 GHz)` for every node now covered by a BDN.\\n- §2 Top 20 — re-rank by measured cycles where available.\\n- §9 Delta — add new row group \\\"BDN-calibrated\\\":\\n  - `MpscRingBuffer.TryPublish` ~30c → ~10c (uncontended, measured).\\n  - `MultiSink.Accept` ~41c → ~31c.\\n  - `Multi2Sink.Accept` ~32c → ~27c.\\n  - `FilterSink.Accept` (Pass) ~18c → ~28c.\\n  - `Multi_IsHealthy` ~16c → ~5c (short-circuit + JIT-fold of trivial `IsHealthy`).\\n  - `DispatchSink.Enqueue` (sealed) — annotation: prediction is upper-bound assuming non-trivial `Accept`; trivial `Accept` collapses to ~3c.\\n- §8 Blind Subgraphs — remove the MPSC-contention entry (now measured in Phase 7).\\n\\n**Acceptance:** every node in §1 / §2 carries either a BDN reference (`(BDN: <ns> ns)` annotation) or an explicit \\\"static estimate, not measured\\\" note. No silent estimates.\\n\\n---\\n\\n## What lives in this orchestration vs the child plans\\n\\nThis master plan is a **map**, not the implementation. Every phase has a dedicated child plan that contains the bite-sized TDD-style steps an executor follows. Child plans are written **just-in-time** as the previous phase merges — keeps them aligned with the actual `develop` HEAD at the time of execution.\\n\\nOrder of operations for the implementer:\\n1. Read this master plan.\\n2. Read the **current** phase child plan.\\n3. Check out the phase branch off latest `develop`.\\n4. Execute the child plan with `superpowers:subagent-driven-development`.\\n5. Open PR. Merge after approval. Master + master plan updated with PR link.\\n6. Move to next phase.\", \"/docs/superpowers/plans/2026-04-29-phase2-packet-symmetry.md\": \"# Phase 2 — Packet-Tree Symmetry BDNs\\n\\n> **Phase 2 of 8** in master plan `docs/superpowers/plans/2026-04-29-master-cost-map-coverage.md`. **For agentic workers:** REQUIRED SUB-SKILL: superpowers:subagent-driven-development. Steps use checkbox (`- [ ]`) syntax.\\n\\n**Goal:** Add BDN classes for the packet-hierarchy equivalents that already exist in the typed hierarchy. Closes coverage gaps **M1** (ForkSink packet), **M2** (MultiSink packet, N=2), **M4** (FilterSink packet), **M9** (SpscQueueSink packet end-to-end Push) from `benchmarks/artifacts/2026-04-29-hotpath/cross-check-and-gaps.md`. **No production code changes.**\\n\\n**Architecture:** four BDN additions, all single-thread producer-side measurements. Reuse existing `ByteCounterPipe` / `ByteRejectPipe` / `ByteDeadPipe` helpers from `ByteEnqueueBenchmarks.cs` (internal in `Relay.Benchmarks` assembly). For M9, mirror `QueuePipeThroughputBenchmarks.TestSpscPipe` with a packet-side `TestSpscPacketSink : SpscQueueSink` (non-generic packet base).\\n\\n**Tech Stack:** BenchmarkDotNet 0.13.12, .NET 9.\\n\\n**Out of scope:** `Multi2PacketSink` — type does not exist (M3, scheduled for Phase 6). `MpscByteRingBuffer` BDNs (Phase 3). Backend-specific BDNs (Phase 4).\\n\\n**Acceptance gate:** all four BDNs build, run to completion under `--job short`, and produce reports in `benchmarks/artifacts/2026-04-29-phase2/`. No production code touched. Tests still pass.\\n\\n---\\n\\n## File Structure\\n\\n| File | Action | Responsibility |\\n|---|---|---|\\n| `benchmarks/Relay.Benchmarks/PacketSinks/PropagatePacketBenchmarks.cs` | **Create** | Packet mirror of `PropagateBenchmarks.cs` — measures `ForkSink` (packet) propagate cost |\\n| `benchmarks/Relay.Benchmarks/PacketSinks/MultiPacketEnqueueBenchmarks.cs` | **Create** | Packet mirror of `MultiEnqueueBenchmarks.cs` — measures `MultiSink` (packet, N=2). No `Multi2`-equivalent yet |\\n| `benchmarks/Relay.Benchmarks/PacketSinks/FilterPacketSinkBenchmarks.cs` | **Create** | Packet mirror of `FilterSinkBenchmarks.cs` — measures `FilterSink` (packet) Pass / Reject |\\n| `benchmarks/Relay.Benchmarks/PacketSinks/QueueSinkPacketThroughputBenchmarks.cs` | **Create** | Packet equivalent of `QueuePipeThroughputBenchmarks.cs`. Includes `TestSpscPacketSink` helper inheriting `SpscQueueSink` (non-generic packet base). No batch variant — packet base does not expose `EnqueueBatch` |\\n\\n---\\n\\n## Task 1: Branch & Baseline\\n\\n**Files:** _none modified_\\n\\n- [ ] **Step 1: Create the Phase 2 branch**\\n\\n```bash\\ngit checkout develop\\ngit pull\\ngit checkout -b chore/260429-bdn-packet-tree-symmetry\\n```\\n\\n- [ ] **Step 2: Verify baseline tests pass**\\n\\nRun: `dotnet test tests/Relay.Tests`\\nExpected: 0 failures.\\n\\n- [ ] **Step 3: No commit yet** (baseline-only).\\n\\n---\\n\\n## Task 2: M1 — `PropagatePacketBenchmarks.cs`\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/PacketSinks/PropagatePacketBenchmarks.cs`\\n\\n- [ ] **Step 1: Write the BDN class**\\n\\nMirrors `PropagateBenchmarks.cs` for the packet hierarchy. `ByteCounterPipe` is already defined in `ByteEnqueueBenchmarks.cs` (internal in same assembly — can reference).\\n\\n```csharp\\nusing System;\\nusing System.Runtime.CompilerServices;\\nusing System.Threading;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay;\\n\\nnamespace Relay.Benchmarks.PacketSinks;\\n\\n/// <summary>\\n/// Measures the overhead of packet-side <see cref=\\\"PacketSink.Enqueue\\\"/> propagation\\n/// — default no-propagate path, single-sink propagate-no-Next, and <see cref=\\\"ForkSink\\\"/>\\n/// (primary + Next).\\n/// <\u002Fsummary>\\n/// <remarks>\\n/// Mirror of <see cref=\\\"PropagateBenchmarks\\\"/> for the packet hierarchy. Uses\\n/// <c>ByteCounterPipe<\u002Fc> (defined in <see cref=\\\"ByteEnqueueBenchmarks\\\"/>) as the trivial sink.\\n/// <\u002Fremarks>\\n[MemoryDiagnoser]\\n[DisassemblyDiagnoser(maxDepth: 3)]\\npublic class PropagatePacketBenchmarks\\n{\\n    private PacketSink _depth1Default       = null!;\\n    private PacketSink _depth1PropagateOnly = null!;\\n    private PacketSink _depth2PropagateFork = null!;\\n    private PacketSink _depth2ForkWrapped   = null!;\\n\\n    private byte[] _payload = null!;\\n\\n    [GlobalSetup]\\n    public void GlobalSetup()\\n    {\\n        _payload    = new byte[64];\\n        _payload[0] = 1;\\n        _payload[1] = 2;\\n\\n        // Depth 1: single ByteCounterPipe — baseline, default PropagateAfterAccept=false.\\n        _depth1Default = new ByteCounterPipe();\\n\\n        // Depth 1: PropagateByteCounterPipe with no Next — pure propagate-branch cost vs default.\\n        _depth1PropagateOnly = new PropagateByteCounterPipe();\\n\\n        // Depth 2: PropagateByteCounterPipe → ByteCounterPipe — both receive the payload.\\n        var prop2 = new PropagateByteCounterPipe();\\n        prop2.Next = new ByteCounterPipe();\\n        _depth2PropagateFork = prop2;\\n\\n        // Depth 2: ForkSink(ByteCounterPipe) → ByteCounterPipe — actual ForkSink cost vs custom propagate.\\n        var primaryCounter = new ByteCounterPipe();\\n        var auditCounter   = new ByteCounterPipe();\\n        var fork           = new ForkSink(primaryCounter);\\n        fork.Next          = auditCounter;\\n        _depth2ForkWrapped = fork;\\n    }\\n\\n    [Benchmark(Baseline = true)]\\n    public void Depth1_Healthy_Default() => _depth1Default.Enqueue(_payload);\\n\\n    [Benchmark]\\n    public void Depth1_Healthy_Propagate_NoNext() => _depth1PropagateOnly.Enqueue(_payload);\\n\\n    [Benchmark]\\n    public void Depth2_Propagate_Fork() => _depth2PropagateFork.Enqueue(_payload);\\n\\n    [Benchmark]\\n    public void Depth2_Fork_Wrapped() => _depth2ForkWrapped.Enqueue(_payload);\\n}\\n\\n/// <summary>\\n/// Healthy propagate sink with an observable side-effect — prevents JIT dead-code elimination.\\n/// PropagateAfterAccept=true ensures Next is always called after a successful accept.\\n/// <\u002Fsummary>\\ninternal sealed class PropagateByteCounterPipe : PacketSink\\n{\\n    public PropagateByteCounterPipe() : base(propagateAfterAccept: true) { }\\n\\n    public long LastValue;\\n\\n    public override bool IsHealthy => true;\\n\\n    [MethodImpl(MethodImplOptions.AggressiveInlining)]\\n    protected override bool Accept(ReadOnlySpan<byte> payload)\\n    {\\n        Volatile.Write(ref LastValue, payload[0]);\\n        return true;\\n    }\\n\\n    public override void Flush()   { }\\n    public override void Dispose() { }\\n}\\n```\\n\\n- [ ] **Step 2: Build**\\n\\nRun: `dotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo`\\nExpected: 0 warnings, 0 errors.\\n\\n- [ ] **Step 3: Commit**\\n\\n```bash\\ngit add benchmarks/Relay.Benchmarks/PacketSinks/PropagatePacketBenchmarks.cs\\ngit commit -m \\\"test: add PropagatePacketBenchmarks (M1 — packet-side ForkSink + propagate) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 3: M2 — `MultiPacketEnqueueBenchmarks.cs`\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/PacketSinks/MultiPacketEnqueueBenchmarks.cs`\\n\\n- [ ] **Step 1: Write the BDN class**\\n\\n```csharp\\nusing BenchmarkDotNet.Attributes;\\nusing Relay;\\n\\nnamespace Relay.Benchmarks.PacketSinks;\\n\\n/// <summary>\\n/// Measures <see cref=\\\"MultiSink\\\"/> (packet, N=2) Enqueue cost. No <c>Multi2<\u002Fc>-equivalent\\n/// exists yet for the packet hierarchy — that is Phase 6 of the master plan.\\n/// <\u002Fsummary>\\n/// <remarks>Mirror of <see cref=\\\"MultiEnqueueBenchmarks\\\"/>.<\u002Fremarks>\\n[MemoryDiagnoser]\\n[DisassemblyDiagnoser(maxDepth: 3)]\\npublic class MultiPacketEnqueueBenchmarks\\n{\\n    private MultiSink _multi   = null!;\\n    private byte[]    _payload = null!;\\n\\n    [GlobalSetup]\\n    public void GlobalSetup()\\n    {\\n        _payload    = new byte[64];\\n        _payload[0] = 3;\\n        _payload[1] = 7;\\n        _multi      = new MultiSink(new ByteCounterPipe(), new ByteCounterPipe());\\n    }\\n\\n    [Benchmark(Baseline = true)]\\n    public void Multi_Packet_Enqueue() => _multi.Enqueue(_payload);\\n}\\n\\n/// <summary>\\n/// Measures <see cref=\\\"MultiSink.IsHealthy\\\"/> short-circuit OR-reduction on packet hierarchy.\\n/// <\u002Fsummary>\\n[MemoryDiagnoser]\\n[DisassemblyDiagnoser(maxDepth: 3)]\\npublic class MultiPacketIsHealthyBenchmarks\\n{\\n    private MultiSink _multi = null!;\\n\\n    [GlobalSetup]\\n    public void GlobalSetup()\\n    {\\n        // ByteCounterPipe is always healthy — short-circuit on first child.\\n        _multi = new MultiSink(new ByteCounterPipe(), new ByteCounterPipe());\\n    }\\n\\n    [Benchmark(Baseline = true)]\\n    public bool Multi_Packet_IsHealthy() => _multi.IsHealthy;\\n}\\n```\\n\\n- [ ] **Step 2: Build**\\n\\nRun: `dotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo`\\nExpected: 0 warnings, 0 errors.\\n\\n- [ ] **Step 3: Commit**\\n\\n```bash\\ngit add benchmarks/Relay.Benchmarks/PacketSinks/MultiPacketEnqueueBenchmarks.cs\\ngit commit -m \\\"test: add MultiPacketEnqueueBenchmarks + IsHealthy (M2) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 4: M4 — `FilterPacketSinkBenchmarks.cs`\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/PacketSinks/FilterPacketSinkBenchmarks.cs`\\n\\n- [ ] **Step 1: Write the BDN class**\\n\\n```csharp\\nusing System;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay;\\n\\nnamespace Relay.Benchmarks.PacketSinks;\\n\\n/// <summary>\\n/// Measures <see cref=\\\"FilterSink\\\"/> (packet) <see cref=\\\"PacketPredicate\\\"/> cost on pass and\\n/// reject paths. Both paths return true from <c>Accept<\u002Fc> — rejected payloads do not propagate\\n/// to <c>Next<\u002Fc>.\\n/// <\u002Fsummary>\\n/// <remarks>Mirror of <see cref=\\\"FilterSinkBenchmarks\\\"/> for the packet hierarchy.<\u002Fremarks>\\n[MemoryDiagnoser]\\n[DisassemblyDiagnoser(maxDepth: 3)]\\npublic class FilterPacketSinkBenchmarks\\n{\\n    private FilterSink _filterPass   = null!;\\n    private FilterSink _filterReject = null!;\\n    private byte[]     _payload      = null!;\\n\\n    [GlobalSetup]\\n    public void GlobalSetup()\\n    {\\n        _payload    = new byte[64];\\n        _payload[0] = 5;\\n        _payload[1] = 10;\\n\\n        // Predicate always passes — ByteCounterPipe downstream so JIT cannot eliminate the call.\\n        _filterPass = new FilterSink(_ => true, new ByteCounterPipe());\\n\\n        // Predicate always rejects — downstream never called.\\n        _filterReject = new FilterSink(_ => false, new ByteCounterPipe());\\n    }\\n\\n    [Benchmark]\\n    public void Filter_Packet_Pass() => _filterPass.Enqueue(_payload);\\n\\n    [Benchmark(Baseline = true)]\\n    public void Filter_Packet_Reject() => _filterReject.Enqueue(_payload);\\n}\\n```\\n\\n- [ ] **Step 2: Build**\\n\\nRun: `dotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo`\\nExpected: 0 warnings, 0 errors.\\n\\n- [ ] **Step 3: Commit**\\n\\n```bash\\ngit add benchmarks/Relay.Benchmarks/PacketSinks/FilterPacketSinkBenchmarks.cs\\ngit commit -m \\\"test: add FilterPacketSinkBenchmarks (M4) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 5: M9 — `QueueSinkPacketThroughputBenchmarks.cs`\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/PacketSinks/QueueSinkPacketThroughputBenchmarks.cs`\\n\\n- [ ] **Step 1: Write the BDN class**\\n\\nIncludes a `TestSpscPacketSink` helper analogous to `TestSpscPipe` in `QueuePipeThroughputBenchmarks.cs`. Note: packet `SpscQueueSink` does not expose `EnqueueBatch` (typed-only); only `Push_Single` and `Push_Single_SlowBackend` variants here.\\n\\n```csharp\\nusing System;\\nusing System.Threading;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay;\\n\\nnamespace Relay.Benchmarks.PacketSinks;\\n\\n/// <summary>\\n/// End-to-end throughput: producer pushes N byte payloads into an <see cref=\\\"SpscQueueSink\\\"/>\\n/// (packet base), consumer thread drains them via a trivial <c>WriteToBackend<\u002Fc>. Measures\\n/// cumulative cost of byte-ring publish + length-prefixed peek/advance + consumer-loop cost.\\n/// <\u002Fsummary>\\n/// <remarks>\\n/// Mirror of <see cref=\\\"QueuePipeThroughputBenchmarks\\\"/>. Packet base does not expose a\\n/// batched <c>EnqueueBatch<\u002Fc> API (variable-length records make a span-batch awkward), so\\n/// only single-publish variants are measured.\\n/// <\u002Fremarks>\\n[MemoryDiagnoser]\\npublic class QueueSinkPacketThroughputBenchmarks\\n{\\n    private byte[] _payload = null!;\\n\\n    private const int RingCapacity = 65_536;\\n    private const int PayloadSize  = 64;\\n\\n    [Params(100_000, 1_000_000)]\\n    public int ItemCount;\\n\\n    [GlobalSetup]\\n    public void GlobalSetup()\\n    {\\n        _payload = new byte[PayloadSize];\\n        for (int i = 0; i < PayloadSize; i++) _payload[i] = (byte)i;\\n    }\\n\\n    [Benchmark(Baseline = true)]\\n    public long Push_Single()\\n    {\\n        using var sink = new TestSpscPacketSink(RingCapacity, backendSpinCycles: 0);\\n        sink.Start();\\n        for (int i = 0; i < ItemCount; i++)\\n            sink.Enqueue(_payload);\\n        sink.Stop(30_000);\\n        return sink.Sum;\\n    }\\n\\n    [Benchmark]\\n    public long Push_Single_SlowBackend()\\n    {\\n        // Simulated ~50-cycle backend work per payload — representative of a tiny file/socket write.\\n        using var sink = new TestSpscPacketSink(RingCapacity, backendSpinCycles: 50);\\n        sink.Start();\\n        for (int i = 0; i < ItemCount; i++)\\n            sink.Enqueue(_payload);\\n        sink.Stop(30_000);\\n        return sink.Sum;\\n    }\\n}\\n\\n/// <summary>\\n/// Trivial SPSC packet queue sink: increments <see cref=\\\"Sum\\\"/> on every consumed payload.\\n/// No backend I/O — exercises pure byte-ring + consumer-loop cost.\\n/// <\u002Fsummary>\\ninternal sealed class TestSpscPacketSink : SpscQueueSink\\n{\\n    private readonly int _backendSpinCycles;\\n    public long Sum;\\n\\n    public TestSpscPacketSink(int ringCapacity, int backendSpinCycles = 0)\\n        : base(ringCapacity, flushIntervalMs: 100, pipeName: \\\"bench-packet\\\")\\n    {\\n        _backendSpinCycles = backendSpinCycles;\\n    }\\n\\n    protected override void WriteToBackend(ReadOnlySpan<byte> payload)\\n    {\\n        Sum += payload[0];\\n        if (_backendSpinCycles > 0) Thread.SpinWait(_backendSpinCycles);\\n    }\\n\\n    protected override void FlushBackend() { }\\n    protected override void TryRecoverBackend() { }\\n    protected override void DisposeBackend() { }\\n}\\n```\\n\\n- [ ] **Step 2: Build**\\n\\nRun: `dotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo`\\nExpected: 0 warnings, 0 errors.\\n\\n- [ ] **Step 3: Commit**\\n\\n```bash\\ngit add benchmarks/Relay.Benchmarks/PacketSinks/QueueSinkPacketThroughputBenchmarks.cs\\ngit commit -m \\\"test: add QueueSinkPacketThroughputBenchmarks (M9 — SpscQueueSink packet end-to-end Push) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 6: Run all Phase 2 BDNs\\n\\n**Files:**\\n- Create artifacts under: `benchmarks/artifacts/2026-04-29-phase2/`\\n\\n- [ ] **Step 1: Run BDNs (short job for triage)**\\n\\n```bash\\ndotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo\\ndotnet run --project benchmarks/Relay.Benchmarks -c Release --no-build -- \\\\\\n  --filter \\\"*PropagatePacketBenchmarks*\\\" \\\"*MultiPacketEnqueueBenchmarks*\\\" \\\"*MultiPacketIsHealthyBenchmarks*\\\" \\\"*FilterPacketSinkBenchmarks*\\\" \\\"*QueueSinkPacketThroughputBenchmarks*\\\" \\\\\\n  --job short \\\\\\n  --artifacts benchmarks/artifacts/2026-04-29-phase2 \\\\\\n  --exporters json markdown\\n```\\n\\nExpected: all benchmarks run to completion, exit 0. Reports under `benchmarks/artifacts/2026-04-29-phase2/results/`.\\n\\n> **Note:** `QueueSinkPacketThroughputBenchmarks` invokes producer+consumer threads with `Stop(30_000)` drain timeout. With `[Params(100_000, 1_000_000)]` this is the longest BDN in Phase 2 — total wall time ~3-5 minutes for the full set.\\n\\n- [ ] **Step 2: Quick sanity check on the numbers**\\n\\nInspect `benchmarks/artifacts/2026-04-29-phase2/results/*-report-github.md`. Sanity gates:\\n- `Multi_Packet_Enqueue` should be roughly 1.5x to 2.5x of typed `Multi_Enqueue` (6.89 ns from Phase 1 baseline) — span-pass overhead. If 10x off, something is wrong.\\n- `Filter_Packet_Reject` should be ≤ 5 ns (delegate-only path).\\n- `Filter_Packet_Pass` should be roughly 2x typed `Filter_Pass` (6.22 ns).\\n- `Push_Single` (packet) at 100k items should complete in < 5 seconds wall time.\\n\\nIf any gate fails, investigate before commit. Numbers far outside expected ranges may indicate a JIT issue (DCE, missing Volatile.Write) or accidental allocation on hot path — abort and report.\\n\\n- [ ] **Step 3: Commit artifacts**\\n\\n```bash\\ngit add benchmarks/artifacts/2026-04-29-phase2/\\ngit commit -m \\\"test: Phase 2 BDN runs — packet-tree symmetry numbers w/Claude\\\"\\n```\\n\\n---\\n\\n…(truncated)\", \"/docs/superpowers/plans/2026-04-29-phase3-mpsc-byte-and-end-to-end.md\": \"# Phase 3 — MPSC Byte Ring + MPSC End-to-End\\n\\n> **Phase 3 of 8** in master plan `docs/superpowers/plans/2026-04-29-master-cost-map-coverage.md`. **For agentic workers:** REQUIRED SUB-SKILL: superpowers:subagent-driven-development. Steps use checkbox (`- [ ]`).\\n\\n**Goal:** Add BDN coverage for the new MPSC byte ring (H1/H2) and MPSC end-to-end push throughput in both typed (H3) and packet (H4) variants. Closes coverage gaps **H1**, **H2**, **H3**, **H4** from `benchmarks/artifacts/2026-04-29-hotpath/cross-check-and-gaps.md`. **No production code changes.**\\n\\n**Architecture:** three new BDN files. H1+H2 → one new `MpscByteRingBufferBenchmarks` class mirroring the existing `ByteRingBufferBenchmarks`. H3 → extend the existing typed throughput benchmark with Mpsc-side variants. H4 → new packet Mpsc throughput class with a `TestMpscPacketSink` helper.\\n\\n**Tech Stack:** BenchmarkDotNet 0.13.12, .NET 9.\\n\\n**Out of scope:** multi-thread MPSC contention BDN — that closes blind subgraph M10 in Phase 7. This phase measures **single-producer** MPSC steady-state only (matches the rest of the BDN suite, which is single-thread).\\n\\n**Acceptance gate:** all three BDN classes build, run to completion under `--job short`, produce reports in `benchmarks/artifacts/2026-04-29-phase3/`. No production code changed. Tests still pass.\\n\\n---\\n\\n## File Structure\\n\\n| File | Action | Responsibility |\\n|---|---|---|\\n| `benchmarks/Relay.Benchmarks/MpscByteRingBufferBenchmarks.cs` | **Create** | H1 + H2 — `MpscByteRingBuffer.TryPublish` / `TryPeek` / `Advance` single-thread, mirrors `ByteRingBufferBenchmarks` |\\n| `benchmarks/Relay.Benchmarks/QueueSinkThroughputBenchmarks.cs` | Modify | H3 — extend with `MpscPush_Single` / `MpscPush_Single_SlowBackend`. Adds `TestMpscPipe` helper inheriting `MpscQueueSink<Entry64>` |\\n| `benchmarks/Relay.Benchmarks/PacketSinks/MpscPacketQueueSinkThroughputBenchmarks.cs` | **Create** | H4 — packet Mpsc end-to-end Push throughput. Adds `TestMpscPacketSink` helper inheriting non-generic packet `MpscQueueSink` |\\n\\n> Note: the existing typed throughput class is named `QueuePipeThroughputBenchmarks` (file: `QueueSinkThroughputBenchmarks.cs`). The class-rename to `QueueSinkThroughputBenchmarks` per master plan is OUT OF SCOPE for this phase — leave the class name alone, just add new methods + helper.\\n\\n---\\n\\n## Task 1: Branch & Baseline\\n\\n- [ ] **Step 1: Create the Phase 3 branch**\\n\\n```bash\\ngit checkout develop\\ngit pull\\ngit checkout -b chore/260429-bdn-mpsc-byte-and-end-to-end\\n```\\n\\n- [ ] **Step 2: Verify baseline tests pass**\\n\\nRun: `dotnet test tests/Relay.Tests`\\nExpected: 0 failures.\\n\\n- [ ] **Step 3: No commit yet** (baseline-only).\\n\\n---\\n\\n## Task 2: H1 + H2 — `MpscByteRingBufferBenchmarks.cs`\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/MpscByteRingBufferBenchmarks.cs`\\n\\n- [ ] **Step 1: Write the BDN class**\\n\\nMirrors `ByteRingBufferBenchmarks.cs`. Single-thread (one producer, one consumer in the same thread for measurement isolation). Multi-thread contention is Phase 7.\\n\\n```csharp\\nusing BenchmarkDotNet.Attributes;\\nusing Relay.Buffers;\\n\\nnamespace Relay.Benchmarks;\\n\\n/// <summary>\\n/// Measures <see cref=\\\"MpscByteRingBuffer\\\"/> primitives on a single thread against the\\n/// SPSC byte-ring baseline. No consumer thread — isolates atomic CAS / header-flag cost\\n/// from cross-thread coordination. Multi-producer contention is Phase 7.\\n/// <\u002Fsummary>\\n[MemoryDiagnoser]\\n[DisassemblyDiagnoser(maxDepth: 3)]\\npublic class MpscByteRingBufferBenchmarks\\n{\\n    private MpscByteRingBuffer _ring     = null!;\\n    private MpscByteRingBuffer _ringFull = null!;\\n    private SpscByteRingBuffer _spsc     = null!;\\n    private byte[]             _payload  = null!;\\n\\n    // 64 → 4 KB (L1), 1024 → 64 KB (L2), 65536 → 4 MB (L3 spill)\\n    [Params(64, 1024, 65536)]\\n    public int Capacity;\\n\\n    // Tiny / cache-line / medium / large\\n    [Params(8, 64, 256, 1024)]\\n    public int PayloadSize;\\n\\n    [GlobalSetup]\\n    public void GlobalSetup()\\n    {\\n        _ring    = new MpscByteRingBuffer(Capacity);\\n        _spsc    = new SpscByteRingBuffer(Capacity);\\n        _payload = new byte[PayloadSize];\\n        for (int i = 0; i < PayloadSize; i++) _payload[i] = (byte)i;\\n\\n        _ringFull = new MpscByteRingBuffer(Capacity);\\n        while (_ringFull.TryPublish(_payload)) { }\\n    }\\n\\n    /// <summary>SPSC byte-ring round-trip baseline for ratio comparison.<\u002Fsummary>\\n    [Benchmark(Baseline = true)]\\n    public bool Spsc_RoundTrip()\\n    {\\n        _spsc.TryPublish(_payload);\\n        bool ok = _spsc.TryPeek(out _, out int adv);\\n        _spsc.Advance(adv);\\n        return ok;\\n    }\\n\\n    /// <summary>MPSC round-trip uncontended — single-producer single-consumer same thread.<\u002Fsummary>\\n    [Benchmark]\\n    public bool Mpsc_RoundTrip_NoContention()\\n    {\\n        _ring.TryPublish(_payload);\\n        bool ok = _ring.TryPeek(out _, out int adv);\\n        _ring.Advance(adv);\\n        return ok;\\n    }\\n\\n    /// <summary>Failed publish on full MPSC ring — head-cache hit + early exit.<\u002Fsummary>\\n    [Benchmark]\\n    public bool Mpsc_TryPublish_Full() => _ringFull.TryPublish(_payload);\\n\\n    /// <summary>Failed peek on empty MPSC ring — Volatile.Read header + bit-test + early exit.<\u002Fsummary>\\n    [Benchmark]\\n    public bool Mpsc_TryPeek_Empty() => _ring.TryPeek(out _, out _);\\n}\\n```\\n\\n- [ ] **Step 2: Build**\\n\\nRun: `dotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo`\\nExpected: 0 warnings, 0 errors.\\n\\n- [ ] **Step 3: Commit**\\n\\n```bash\\ngit add benchmarks/Relay.Benchmarks/MpscByteRingBufferBenchmarks.cs\\ngit commit -m \\\"test: add MpscByteRingBufferBenchmarks (H1 + H2 — TryPublish, TryPeek, Advance, Full, Empty) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 3: H3 — extend typed throughput with `MpscPush_*`\\n\\n**Files:**\\n- Modify: `benchmarks/Relay.Benchmarks/QueueSinkThroughputBenchmarks.cs`\\n\\nThe existing class `QueuePipeThroughputBenchmarks` already has `Push_Single`, `Push_Batch32`, `Push_Single_SlowBackend`, `Push_Batch32_SlowBackend` for SPSC. Add Mpsc-side variants and a `TestMpscPipe` helper.\\n\\n- [ ] **Step 1: Append `TestMpscPipe` helper at the end of the file**\\n\\nAfter the `TestSpscPipe` helper (around the bottom of the file), append:\\n\\n```csharp\\n/// <summary>\\n/// Trivial MPSC queue pipe: increments <see cref=\\\"Sum\\\"/> on every consumed item.\\n/// No backend I/O — exercises pure MPSC ring + consumer-loop cost.\\n/// Single-producer use only here (BDN runs one-thread); multi-producer in Phase 7.\\n/// <\u002Fsummary>\\ninternal sealed class TestMpscPipe : MpscQueueSink<Entry64>\\n{\\n    private readonly int _backendSpinCycles;\\n    public long Sum;\\n\\n    public TestMpscPipe(int ringCapacity, int backendSpinCycles = 0)\\n        : base(ringCapacity, flushIntervalMs: 100, pipeName: \\\"bench-mpsc\\\")\\n    {\\n        _backendSpinCycles = backendSpinCycles;\\n    }\\n\\n    protected override void WriteToBackend(in Entry64 item)\\n    {\\n        Sum += item.A;\\n        if (_backendSpinCycles > 0) Thread.SpinWait(_backendSpinCycles);\\n    }\\n\\n    protected override void FlushBackend() { }\\n    protected override void TryRecoverBackend() { }\\n    protected override void DisposeBackend() { }\\n}\\n```\\n\\n- [ ] **Step 2: Add Mpsc benchmark methods to the existing class body**\\n\\nInside `QueuePipeThroughputBenchmarks` (after `Push_Batch32_SlowBackend`), append:\\n\\n```csharp\\n[Benchmark]\\npublic long MpscPush_Single()\\n{\\n    using var pipe = new TestMpscPipe(RingCapacity, backendSpinCycles: 0);\\n    pipe.Start();\\n    for (int i = 0; i < ItemCount; i++)\\n        pipe.Enqueue(in _item);\\n    pipe.Stop(30_000);\\n    return pipe.Sum;\\n}\\n\\n[Benchmark]\\npublic long MpscPush_Single_SlowBackend()\\n{\\n    // Simulated ~50-cycle backend work per item — representative of a tiny file/mem write.\\n    using var pipe = new TestMpscPipe(RingCapacity, backendSpinCycles: 50);\\n    pipe.Start();\\n    for (int i = 0; i < ItemCount; i++)\\n        pipe.Enqueue(in _item);\\n    pipe.Stop(30_000);\\n    return pipe.Sum;\\n}\\n```\\n\\n> Note: `MpscQueueSink<T>` does not expose `EnqueueBatch` — only single-publish variants here. Batch variant would require a typed multi-publish API not yet on the public surface.\\n\\n- [ ] **Step 3: Build**\\n\\nRun: `dotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo`\\nExpected: 0 warnings, 0 errors.\\n\\n- [ ] **Step 4: Commit**\\n\\n```bash\\ngit add benchmarks/Relay.Benchmarks/QueueSinkThroughputBenchmarks.cs\\ngit commit -m \\\"test: extend QueuePipeThroughputBenchmarks w/ MpscPush_Single + MpscPush_SlowBackend (H3) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 4: H4 — `MpscPacketQueueSinkThroughputBenchmarks.cs`\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/PacketSinks/MpscPacketQueueSinkThroughputBenchmarks.cs`\\n\\n- [ ] **Step 1: Write the BDN class**\\n\\nMirror of `QueueSinkPacketThroughputBenchmarks` (created in Phase 2) but using non-generic packet `MpscQueueSink` base.\\n\\n```csharp\\nusing System;\\nusing System.Threading;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay;\\n\\nnamespace Relay.Benchmarks.PacketSinks;\\n\\n/// <summary>\\n/// End-to-end throughput: producer pushes N byte payloads into an <see cref=\\\"MpscQueueSink\\\"/>\\n/// (packet base), consumer thread drains them via a trivial <c>WriteToBackend<\u002Fc>. Measures\\n/// cumulative cost of MPSC byte-ring publish (CAS + header) + length-prefixed peek/advance\\n/// + consumer-loop cost. Single-producer only here; multi-producer contention is Phase 7.\\n/// <\u002Fsummary>\\n/// <remarks>Mirror of <see cref=\\\"QueueSinkPacketThroughputBenchmarks\\\"/> for the MPSC byte ring.<\u002Fremarks>\\n[MemoryDiagnoser]\\npublic class MpscPacketQueueSinkThroughputBenchmarks\\n{\\n    private byte[] _payload = null!;\\n\\n    private const int RingCapacity = 65_536;\\n    private const int PayloadSize  = 64;\\n\\n    [Params(100_000, 1_000_000)]\\n    public int ItemCount;\\n\\n    [GlobalSetup]\\n    public void GlobalSetup()\\n    {\\n        _payload = new byte[PayloadSize];\\n        for (int i = 0; i < PayloadSize; i++) _payload[i] = (byte)i;\\n    }\\n\\n    [Benchmark(Baseline = true)]\\n    public long Push_Single()\\n    {\\n        using var sink = new TestMpscPacketSink(RingCapacity, backendSpinCycles: 0);\\n        sink.Start();\\n        for (int i = 0; i < ItemCount; i++)\\n            sink.Enqueue(_payload);\\n        sink.Stop(30_000);\\n        return sink.Sum;\\n    }\\n\\n    [Benchmark]\\n    public long Push_Single_SlowBackend()\\n    {\\n        using var sink = new TestMpscPacketSink(RingCapacity, backendSpinCycles: 50);\\n        sink.Start();\\n        for (int i = 0; i < ItemCount; i++)\\n            sink.Enqueue(_payload);\\n        sink.Stop(30_000);\\n        return sink.Sum;\\n    }\\n}\\n\\n/// <summary>\\n/// Trivial MPSC packet queue sink: increments <see cref=\\\"Sum\\\"/> on every consumed payload.\\n/// No backend I/O — exercises pure MPSC byte-ring + consumer-loop cost. Single-producer\\n/// use here; multi-producer contention is Phase 7.\\n/// <\u002Fsummary>\\ninternal sealed class TestMpscPacketSink : MpscQueueSink\\n{\\n    private readonly int _backendSpinCycles;\\n    public long Sum;\\n\\n    public TestMpscPacketSink(int ringCapacity, int backendSpinCycles = 0)\\n        : base(ringCapacity, flushIntervalMs: 100, pipeName: \\\"bench-mpsc-packet\\\")\\n    {\\n        _backendSpinCycles = backendSpinCycles;\\n    }\\n\\n    protected override void WriteToBackend(ReadOnlySpan<byte> payload)\\n    {\\n        Sum += payload[0];\\n        if (_backendSpinCycles > 0) Thread.SpinWait(_backendSpinCycles);\\n    }\\n\\n    protected override void FlushBackend() { }\\n    protected override void TryRecoverBackend() { }\\n    protected override void DisposeBackend() { }\\n}\\n```\\n\\n- [ ] **Step 2: Build**\\n\\nRun: `dotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo`\\nExpected: 0 warnings, 0 errors.\\n\\n- [ ] **Step 3: Commit**\\n\\n```bash\\ngit add benchmarks/Relay.Benchmarks/PacketSinks/MpscPacketQueueSinkThroughputBenchmarks.cs\\ngit commit -m \\\"test: add MpscPacketQueueSinkThroughputBenchmarks (H4) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 5: Run Phase 3 BDNs\\n\\n**Files:**\\n- Create artifacts under: `benchmarks/artifacts/2026-04-29-phase3/`\\n\\n- [ ] **Step 1: Run BDNs (short job)**\\n\\n```bash\\ndotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo\\ndotnet run --project benchmarks/Relay.Benchmarks -c Release --no-build -- \\\\\\n  --filter \\\"*MpscByteRingBufferBenchmarks*\\\" \\\"*QueuePipeThroughputBenchmarks*\\\" \\\"*MpscPacketQueueSinkThroughputBenchmarks*\\\" \\\\\\n  --job short \\\\\\n  --artifacts benchmarks/artifacts/2026-04-29-phase3 \\\\\\n  --exporters json markdown\\n```\\n\\n> **Note:** `MpscByteRingBufferBenchmarks` has `[Params(Capacity, PayloadSize)]` matrix = 12 cells × 4 methods = 48 cases. With ShortRun (3+3=6 invocations), total ~10 min. End-to-end throughput benchmarks add ~5 min. Total wall time ~15 min for the full Phase 3 run.\\n\\nExpected: all benchmarks run to completion, exit 0.\\n\\n- [ ] **Step 2: Sanity check on numbers**\\n\\nInspect `benchmarks/artifacts/2026-04-29-phase3/results/*-report-github.md`. Sanity gates:\\n- `Mpsc_RoundTrip_NoContention` (cap 1024, payload 64): expect 1.5-3x of `Spsc_RoundTrip` baseline (CAS + 2× header writes vs single-volatile-write SPSC). Cost-map predicted ~50c MPSC byte TryPublish vs ~35c SPSC byte → ratio ~1.4x. BDN will surface the actual ratio under one-thread CAS.\\n- `Mpsc_TryPublish_Full` should be < 5 ns (head-cache hit + early exit).\\n- `Mpsc_TryPeek_Empty` should be < 3 ns (single Volatile.Read + bit-test).\\n- `MpscPush_Single` (100k items): roughly 1.2-2x of `Push_Single` SPSC (the existing baseline) — single-producer CAS overhead. If 5x worse, investigate.\\n- All `MpscPacket.Push_*` complete in < 60 sec wall time per case.\\n\\nIf any gate fires far outside, abort and report.\\n\\n- [ ] **Step 3: Commit artifacts**\\n\\n```bash\\ngit add benchmarks/artifacts/2026-04-29-phase3/\\ngit commit -m \\\"test: Phase 3 BDN runs — MPSC byte ring + Mpsc end-to-end numbers w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 6: Update Master Plan + Cross-Check\\n\\n**Files:**\\n- Modify: `docs/superpowers/plans/2026-04-29-master-cost-map-coverage.md`\\n- Modify: `benchmarks/artifacts/2026-04-29-hotpath/cross-check-and-gaps.md`\\n\\n- [ ] **Step 1: Mark Phase 3 done in master plan**\\n\\nIn the Phase Map table, replace the Phase 3 status cell with:\\n\\n```markdown\\n✅ done — MpscByteRingBufferBenchmarks (H1+H2), MpscPush_* extended in QueuePipeThroughputBenchmarks (H3), MpscPacketQueueSinkThroughputBenchmarks (H4); numbers under `benchmarks/artifacts/2026-04-29-phase3/`\\n```\\n\\n- [ ] **Step 2: Update gap report**\\n\\nIn `benchmarks/artifacts/2026-04-29-hotpath/cross-check-and-gaps.md` §3 high-priority table, mark H1, H2, H3, H4 as resolved per Phase 2 conventions (`~~HX~~ resolved` + Phase 3 reference).\\n\\n- [ ] **Step 3: Commit**\\n\\n```bash\\ngit add docs/superpowers/plans/2026-04-29-master-cost-map-coverage.md \\\\\\n        benchmarks/artifacts/2026-04-29-hotpath/cross-check-and-gaps.md\\ngit commit -m \\\"docs: mark Phase 3 done — MPSC byte ring + Mpsc throughput BDNs landed w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 7: Final Verification\\n\\n- [ ] **Step 1: Re-run full test suite**\\n\\nRun: `dotnet test tests/Relay.Tests`\\nExpected: 0 failed (no production code changed).\\n\\n- [ ] **Step 2: Verify branch contents**\\n\\nRun: `git log --oneline develop..HEAD`\\nExpected: 5 commits — `test:` ×3 (H1+H2, H3, H4) + `test:` artifacts + `docs:` master plan & cross-check.\\n\\n- [ ] **Step 3: Verify no production source touched**\\n\\nRun: `git diff develop..HEAD -- src/ tests/`\\nExpected: empty.\\n\\n- [ ] **Step 4: Stop here — do NOT push**\\n\\nUser pushes + opens PR + merges manually. Do NOT run `git push`. Do NOT run `gh pr create`.\\n\\n---\\n\\n## Self-Review Checklist\\n\\n- ✅ Spec coverage — H1, H2, H3, H4 closed.\\n- ✅ No placeholders — every code block is concrete.\\n- ✅ Type consistency — `TestMpscPipe`, `TestMpscPacketSink` named identically across declaration and benchmark methods.\\n- ✅ Frequent commits — 5 commits, one per logical concern.\\n- ✅ Branch name `chore/<yyMMdd>-<slug>`.\\n- ✅ Conventional Commits + `w/Claude`.\\n- ✅ Test gate enforced — production unchanged so no-regression check only.\\n- ✅ No production source changes.\", \"/docs/superpowers/plans/2026-04-29-phase4-backends.md\": \"# Phase 4 — Concrete Backend BDNs\\n\\n> **Phase 4 of 8** in master plan `docs/superpowers/plans/2026-04-29-master-cost-map-coverage.md`. **For agentic workers:** REQUIRED SUB-SKILL: superpowers:subagent-driven-development.\\n\\n**Goal:** Add BDN coverage for 7 concrete sinks. Closes coverage gaps **H5** (SharedMemorySink), **H6** (RamSink packet), **H7** (MmfSink<T>), **H8** (UdpSink), **M5** (BatchSink), **M6** (NamedPipeSink), **M7** (UnixSocketSink). **No production code changes.**\\n\\n**Architecture:** 7 new BDN classes under `benchmarks/Relay.Benchmarks/Sinks/`. Most measure either:\\n- (a) the per-record `Accept` / `WriteToBackend` cost via the existing `BenchInvokeWriteToBackend` pattern (Phase 1), or\\n- (b) end-to-end throughput by Start()'ing the sink + Push()'ing N items + Stop() drain (matches `TcpSinkBenchmark`/`FileSinkBenchmark` from existing Phase 0 templates).\\n\\n**Tech Stack:** BenchmarkDotNet 0.13.12, .NET 9. Some sinks platform-gated.\\n\\n**Out of scope:** No production changes. No multi-thread contention (Phase 7).\\n\\n**Acceptance gate:** all 7 BDN classes build, run on at least one supported platform under `--job short`, produce
