kend` com span de 32. Usa um sink concreto sealed (`InMemoryByteSink` que apenas faz `_total += span.Length`) para isolar dispatch+entry/exit cost de I/O real.\\n  - Methods: `Loop32_PerItemDispatch`, `Single32_BatchDispatch`\\n  - `[DisassemblyDiagnoser]` para confirmar devirtualization\\n\\n**Gate (PRE-DEFINIDO):**\\n- `Push_Batch32` (typed throughput): median improvement **≥ 3%** vs `2026-05-24-pre-audit` baseline. (Audit previu 5-15%; após §2.1 falsificação, abaixo 3% atribuímos a ruído.)\\n- `BatchHookBenchmark.Single32_BatchDispatch` ≤ 0.7× `Loop32_PerItemDispatch` median (i.e. batch path é pelo menos 30% mais rápido na nano-bench isolada — se não, fix não engaja o mecanismo).\\n- Tests `dotnet test --filter \\\"Category!=Endurance&Category!=Stress&Category!=Perf\\\"` continuam 0 fails.\\n\\n**Disposição se gate falha:**\\n- `BatchHookBenchmark` mostra <30% melhora: hipótese sobre dispatch cost falsa em .NET 9 (JIT já inlinou). REVERT.\\n- `BatchHookBenchmark` ok mas `Push_Batch32` <3%: hipótese isolada confirma mas não engaja em path real (provavelmente porque outras componentes dominam). Documentar finding, REVERT.\\n- Ambos ok: MERGE.\\n\\n---\\n\\n## §2.3 — CPU affinity + revisão `ThreadPriority`\\n\\n### Hipótese técnica\\n**Mecanismo:** Default `ThreadPriority.BelowNormal` faz o consumer concorrer com qualquer thread Normal/AboveNormal no scheduler — Windows pode preemptá-lo. Sem affinity, scheduler pode migrar o consumer entre cores; cada migração: TLB shootdown (~500c) + L1d refill (~1000c, 64 lines × 16c) + L1i refill (~500c) + branch predictor reset (~hundreds of cycles). Total estimado: **2000-4000c por migração**.\\n\\nPara um consumer rodando a 1M items/sec, mesmo 1 migração/sec não é nada em throughput (~0.4%), mas mata p99/p999 (uma mensagem fica 2-4µs pior). Em sparse-burst (1 item/5ms), p999 é dominado por essa migração.\\n\\n**Pinning** (`SetThreadAffinityMask`) + `Priority = Normal` (ou AboveNormal):\\n- Elimina migrações\\n- Mantém cache quente entre invocações\\n- Aceita mais CPU quando há contenção\\n\\n**Magnitude esperada (post-§2.1 calibration):** throughput **flat ou +0-2%** (não é onde mora o ganho); **p99/p999 -10% a -40%** sob carga sustentada misturada com outros workloads na máquina.\\n\\n**Por que pode falhar / risco:**\\n- Em máquina dedicada (sem outros workloads), scheduler já mantém consumer no mesmo core empiricamente. Pinning sem benefício. Real win só aparece em ambiente compartilhado (servidor com ≥4 processos competindo).\\n- Pinning em CPU errado (e.g. um E-core do 12700 em vez de P-core) regrede severamente. Default deve ser \\\"primeiro P-core livre\\\".\\n- Sobre-comprometer (pinning múltiplos consumers ao mesmo core) é pior que default.\\n- ThreadPriority.AboveNormal pode causar starvation de outras threads do mesmo processo se mal usado (e.g. logger consumer matando UI thread).\\n\\n### Implementação\\n\\n**Files alterados:**\\n- `src/Relay/SpscQueueSink.cs` + packet — adicionar parâmetros opcionais ao ctor:\\n  ```csharp\\n  public SpscQueueSink<T>(\\n      int ringCapacity,\\n      int flushIntervalMs,\\n      string sinkName,\\n      ThreadPriority threadPriority = ThreadPriority.Normal,    // NEW default\\n      int affinityCpu = -1)                                       // NEW\\n  ```\\n  Default new = Normal (não BelowNormal). `affinityCpu = -1` = sem pin (preserva comportamento atual).\\n- Em `Start()`: se `_affinityCpu >= 0`, chamar P/Invoke pós-`_thread.Start()` para set affinity.\\n- `src/Relay/MpscQueueSink.cs` + packet — idem.\\n- `src/Relay/Internal/ThreadAffinity.cs` (NOVO) — P/Invoke wrapper:\\n  - Windows: `SetThreadAffinityMask(GetCurrentThread(), 1UL << cpu)` \\n  - Linux: `pthread_setaffinity_np` via `sched_setaffinity` syscall\\n  - Fail-soft: se P/Invoke falha (e.g. CPU não existe), log warning silencioso (no logging dep) ou retorna false; ctor continua. Affinity é best-effort.\\n\\n**Backward-compat:** mudança de default `BelowNormal → Normal` é potencial regressão pra usuários que dependem disso (improvável). Documentar em commit + breaking-changes/release-notes.\\n\\n### Benchmark — design\\n\\n**Novo benchmark necessário** (não existe equivalente atual):\\n- `QueueSinkLatencyBenchmark` em `benchmarks/Relay.Benchmarks/` — mede **per-message latency** end-to-end, capturando p50/p99/p999 manualmente (não via BDN's Mean):\\n  - Producer thread publica N=1M items, cada um carimba `HfClock.NowTicks` ANTES de `TryPublish`.\\n  - Consumer thread, em `WriteToBackend`, lê o ticks do item e calcula delta vs `HfClock.NowTicks` atual.\\n  - Acumula em histograma fixo (1024 buckets log-scale de 100ns a 1ms).\\n  - Pós-run: extrai p50, p99, p999, max.\\n  - **3 cenários:** `Default` (BelowNormal, no pin), `NormalPriority` (Normal, no pin), `NormalPinned` (Normal, affinityCpu=2 — P-core fixo).\\n  - Sustained load: producer roda em loop hot, sem yield, 30s.\\n  - **`[Trait(\\\"Category\\\", \\\"Perf\\\")]`** para que rode só sob demanda.\\n\\n**Auxiliar — `QueuePipeThroughputBenchmarks`:** rerun com novo default `Normal` priority. Esperado: flat ou +0-2% throughput.\\n\\n**Gate (PRE-DEFINIDO):**\\n- `QueueSinkLatencyBenchmark.NormalPinned.p999` ≤ 0.8 × `Default.p999` mediana de 3 runs. (i.e. pin + Normal melhora p999 em ≥20%.)\\n- `QueueSinkLatencyBenchmark.NormalPriority.p999` ≤ 0.95 × `Default.p999` (Normal sem pin já dá pelo menos 5% — confirma que parte do ganho vem só da priority).\\n- `QueuePipeThroughputBenchmarks.Push_Batch32` post-fix: dentro de ±5% vs baseline (no regression).\\n\\n**Disposição se gate falha:**\\n- p999 não melhora: hipótese sobre migration cost falsa neste ambiente (12700, máquina dedicada). REVERT do default change; manter os parâmetros como **opt-in** (mantém API mas default fica `BelowNormal`/`-1`). Usuário em ambiente compartilhado pode opt-in.\\n- p999 melhora mas throughput regrede >5%: trade-off ruim. REVERT default, manter opt-in.\\n- Ambos ok: MERGE com novo default.\\n\\n---\\n\\n## §2.4 — `WaitOnAddress` backoff\\n\\n### Hipótese técnica\\n**Mecanismo atual:** `ConsumeLoop` quando ring vazio: 10× `SpinWait(20)` → 5× `Thread.Yield()` → `Thread.Sleep(1)`. No Windows com timer resolution default = 15.6ms, `Sleep(1)` pode dormir até 15.6ms. Mesmo com `timeBeginPeriod(1)` (1ms granularity), mínimo é ~1ms.\\n\\nEm traffic **steady-state** (ring sempre tem items), backoff nunca aciona — sem mudança. Em traffic **sparse-bursty** (gap >20×SpinWait + 5×Yield = ~10µs), consumer dorme. Próximo item após o dormiar fica esperando até o sleep expirar = 1-15ms latency.\\n\\n**Fix:** Substituir `Sleep(1)` por `WaitOnAddress(&_publishedCount, expected, sizeof(int), timeout=1ms)`:\\n- Consumer dorme em condição sobre uma palavra (e.g. ring's tail counter)\\n- Producer em `TryPublish` chama `WakeByAddressSingle(&_publishedCount)` após advance\\n- Wake é µs-level (~5-10µs latency end-to-end), não ms\\n\\nLinux: `futex(FUTEX_WAIT_PRIVATE)` + `futex(FUTEX_WAKE_PRIVATE)`. Mesma semântica.\\n\\n**Magnitude esperada:**\\n- Sparse-burst (1 item/5ms): p99/p999 latency cai de 1-15ms para 5-50µs. **Order of magnitude.**\\n- Steady-state: zero change (consumer não dorme).\\n- Risco específico: producer-side wake cost. `WakeByAddressSingle` é ~30-50c quando ninguém espera, ~µs quando alguém. Em 10M items/sec, +30c/item = 0.3 ns/item — mensurável.\\n  - **Mitigação:** producer só chama wake quando flag `_consumerSleeping` (atomic int) é set. Adiciona 1 atomic load no producer hot path (~3-5c). Trade-off favorável se sparse-burst é cenário real.\\n\\n**Por que pode falhar / risco:**\\n- Em high-throughput steady-state, o atomic check pelo producer pode regredir throughput (~5c × items/sec).\\n- WaitOnAddress só está disponível em Win8+ — já é o caso, .NET 9 só roda em Win10+.\\n- Em Linux, `futex` exige `pthread_cond_t` wrapper ou raw syscall (raw é melhor para evitar libc overhead).\\n- Complexidade: estado do consumer (sleeping/running) precisa ser observável atomicamente pelo producer.\\n\\n### Implementação\\n\\n**Files alterados:**\\n- `src/Relay/Internal/ParkingLot.cs` (NOVO) — abstração platform-specific:\\n  - Windows: `[DllImport(\\\"kernel32\\\")] WaitOnAddress`, `WakeByAddressSingle`, `WakeByAddressAll`\\n  - Linux: `[DllImport(\\\"libc\\\")] sys_futex` via syscall (avoiding pthread_cond_t)\\n  - API: `Park(ref int address, int expected, int timeoutMs)`, `Unpark(ref int address)`\\n  - Fail-soft: se P/Invoke não disponível, fallback para `Thread.Sleep(timeoutMs)` (preserva comportamento atual)\\n- `src/Relay/SpscQueueSink.cs` + packet — adicionar `_consumerSleeping` flag (`int`, 0=running, 1=sleeping). Alterar `ConsumeLoop` backoff:\\n  ```csharp\\n  // após spin + yield exaustos:\\n  Interlocked.Exchange(ref _consumerSleeping, 1);\\n  if (TryConsume...) { Interlocked.Exchange(ref _consumerSleeping, 0); /* process */ }\\n  else { ParkingLot.Park(ref _publishedCount, lastSeen, 1); Interlocked.Exchange(ref _consumerSleeping, 0); }\\n  ```\\n- Em `_ring.TryPublish` ou na chamada de Enqueue após publish:\\n  ```csharp\\n  Volatile.Write(ref _publishedCount, _publishedCount + 1);\\n  if (Volatile.Read(ref _consumerSleeping) == 1) ParkingLot.Unpark(ref _publishedCount);\\n  ```\\n- `src/Relay/MpscQueueSink.cs` + packet — idem.\\n\\n**API impacto:** zero — comportamento externo idêntico, só latency interna muda.\\n\\n### Benchmark — design\\n\\n**Novo benchmark necessário:**\\n- `SparseBurstLatencyBenchmark` em `benchmarks/Relay.Benchmarks/`:\\n  - 3 padrões de tráfego:\\n    - `SparseBurst_1Per5ms` (200 items/sec, isolated)\\n    - `MicroBurst_10Items_Per100ms` (100 items/sec in bursts)\\n    - `Steady_1M_PerSec` (steady, para detectar regressão de throughput)\\n  - Per-message latency histogram (mesmo design do `QueueSinkLatencyBenchmark` em §2.3).\\n  - 2 cenários: `WithSleepBackoff` (current), `WithParkingLot` (post-fix).\\n  - **`[Trait(\\\"Category\\\", \\\"Perf\\\")]`**\\n\\n**Gate (PRE-DEFINIDO):**\\n- `SparseBurst_1Per5ms.p99 (WithParkingLot)` ≤ 100µs. (`WithSleepBackoff` typically 1-15ms — ≥10× improvement minimum.)\\n- `Steady_1M_PerSec.p99 (WithParkingLot)` ≤ 1.05× `WithSleepBackoff.p99` (no regression — ≤5% slowdown acceptable to pay for sparse-burst win).\\n- `QueuePipeThroughputBenchmarks.Push_Single (post-fix)` median dentro de ±3% baseline.\\n- Tests pass.\\n\\n**Disposição se gate falha:**\\n- Sparse-burst p99 não cai abaixo de 100µs: ParkingLot impl bug ou consumer não dorme realmente. Investigar antes de decidir.\\n- Steady-state regrede >5%: producer-side wake cost dominante. Tentar `_consumerSleeping` flag check otimizado (e.g. `Volatile.Read` em vez de `Interlocked`). Se ainda regrede, REVERT.\\n- Ambos ok: MERGE.\\n\\n### Complexidade\\n\\nEsta é a task mais complexa do plano (~2-3 dias). Razões:\\n- P/Invoke cross-platform com fallback\\n- Estado de sleep observável atomicamente\\n- Edge cases: producer publica DURANTE consumer ir-dormir (ABA-ish)\\n- Spurious wakes (futex)\\n\\n**Sugestão de subdivisão:**\\n- §2.4.a — implementar `ParkingLot` standalone com tests de unidade (park-unpark, timeout, spurious wake)\\n- §2.4.b — integrar em `SpscQueueSink<T>` + packet (mais simples, single consumer)\\n- §2.4.c — integrar em `MpscQueueSink<T>` + packet (cuidado com múltiplos producers chamando wake)\\n- §2.4.d — rodar gates e decidir\\n\\n---\\n\\n…(truncated)\", \"/docs/reports/2026-05-26-hot-path-audit-receivers.md\": \"# Hot-Path Audit — Receivers (post v1.0.2 back-merge)\\n\\n**Date:** 2026-05-26\\n**Scope:** `b0ed316..HEAD` — `PacketCallback` delegate, `PacketReceiver` base, `UdpReceiver<TState>`, `TcpReceiver<TState>`, `NamedPipeReceiver<TState>`, `SharedMemorySpscReceiver<TState>`, `RelayBuilder.From.cs`.\\n**Tier:** `ultra-low-latency` (project-wide; every `.cs` is hot path per `CLAUDE.md`).\\n\\n## Audited files\\n\\n| File | Hot-path role |\\n|---|---|\\n| `src/Relay/PacketCallback.cs` | Zero-alloc delegate over `ReadOnlySpan<byte>` |\\n| `src/Relay/PacketReceiver.cs` | Abstract base — caller-driven `Poll()` |\\n| `src/Relay/Receivers/UdpReceiver.cs` | Data-plane non-blocking UDP receive |\\n| `src/Relay/Receivers/TcpReceiver.cs` | Management-plane TCP frame receive |\\n| `src/Relay/Receivers/NamedPipeReceiver.cs` | Management-plane named-pipe receive |\\n| `src/Relay/Receivers/SharedMemorySpscReceiver.cs` | Hot-path SPSC MMF ring receive |\\n| `src/Relay/Builder/RelayBuilder.From.cs` | Cold-path factories (4 entry points) |\\n| `src/Relay/Builder/RelayBuilder.cs` | XML-doc edit only |\\n\\n## Findings\\n\\n### F0 — TcpReceiver / NamedPipeReceiver: bogus `frameLen` desyncs the wire  [HIGH — correctness] · **RESOLVED 2026-05-26**\\n\\n> **Fix:** `fix/260526-receiver-desync-stall`. On invalid `frameLen`, the stream/pipe is torn down and `Poll()` throws `InvalidDataException`. Subsequent `Poll()` returns `false`. Regression tests in `tests/Relay.Tests/Receivers/ReceiverDesyncStallTests.cs`.\\n\\n\\n**Dim:** D24 (Unit tests), correctness.\\n**Files:** `TcpReceiver.cs:84-87`, `NamedPipeReceiver.cs:70-73`.\\n\\n```csharp\\nif (!ReadExact(header)) return false;\\nint frameLen = BinaryPrimitives.ReadInt32BigEndian(header);\\nif (frameLen <= 0 || frameLen > _buffer.Length) return false;   // ← payload NEVER drained\\n```\\n\\nWhen the 4-byte header has already been consumed and the decoded `frameLen` is invalid, `Poll` returns `false` but the supposed payload bytes remain on the wire. Next `Poll` reads 4 bytes from the *middle of that payload*, interprets as length, and the stream is permanently desynced. Frame protocol cannot recover.\\n\\nTrusted-peer scenario (default `TcpSink`/`NamedPipeSink`): never triggers — sinks always send correct length prefixes. Hostile / mis-versioned / corrupted peer: **permanent silent failure**, no telegraph.\\n\\nFix: on bogus `frameLen`, do not return silently. Tear down stream (`Dispose`/null out `_stream`/`_pipe`) and surface `IOException` to the caller. Caller restarts the management session. Add unit test (sender writes header with negative length → receiver rejects + disconnects).\\n\\n### F0b — SharedMemorySpscReceiver: bogus `frameLen` stalls the consumer  [HIGH — correctness] · **RESOLVED 2026-05-26**\\n\\n> **Fix:** `fix/260526-receiver-desync-stall`. Constructor now validates `SHM_MAGIC` (`0x4C473200`); `Poll()` throws `InvalidDataException` on invalid `frameLen` instead of stalling. Regression tests in `tests/Relay.Tests/Receivers/ReceiverDesyncStallTests.cs`.\\n\\n\\n**Dim:** D24 (Unit tests), correctness.\\n**File:** `SharedMemorySpscReceiver.cs:94`.\\n\\n```csharp\\nif (frameLen <= 0 || frameLen > _frameBuffer.Length) return false;\\n```\\n\\n`_readIndex` is **not advanced** on rejection. Next `Poll` re-reads the same 4 bytes → same bogus length → indefinite stall. The producer (`SharedMemorySpscSink.Accept` lines 104–135) does not gate on `_readIndex` either, so the producer cannot rescue the consumer by overwriting the slot — and when it eventually wraps over the stuck slot, the consumer reads from a slot that has been overwritten partway, with no integrity tag to detect torn data.\\n\\nFix: validate magic + frameLen at receive; on rejection, mark receiver `_disposed` (or expose `IsHealthy`) and throw at next `Poll`. Either way, do not silently stall.\\n\\n### F1 — TcpReceiver / NamedPipeReceiver: `Poll` can block mid-frame  [HIGH] · **RESOLVED 2026-05-26 (doc)**\\n\\n> **Fix:** `fix/260526-receiver-desync-stall`. `TcpReceiver` XML rewritten — removed the misleading \\\"non-blocking poll\\\" claim; documents non-blocking at frame boundaries + possible mid-frame block on TCP segmentation; matches the `NamedPipeReceiver` management-plane wording. No behavioural change.\\n\\n\\n**Dim:** D23 (Syscall), D17 (Exception/blocking semantics).\\n**Files:** `TcpReceiver.cs:79-95`, `NamedPipeReceiver.cs:65-82`.\\n\\n`Poll()` checks `DataAvailable` / `IsConnected` ONCE at frame start, then enters `ReadExact` which loops `Stream.Read` synchronously without timeout. If the sender publishes only the 4-byte header (or part of the payload) before stalling, the next `Read` blocks indefinitely on a stream in default blocking mode.\\n\\n`TcpReceiver` XML doc claims **\\\"Non-blocking poll\\\"** — contradicts behavior. `NamedPipeReceiver` doc states blocking is acceptable for management-plane; consistent with implementation. TCP is the contradiction.\\n\\nMitigation options (pick one):\\n- (a) Set `_stream.ReadTimeout = N`, catch `IOException` with `SocketException(WSAETIMEDOUT/EAGAIN)`, stash partial bytes; finish on next Poll. Real non-blocking semantics.\\n- (b) Use frame-state machine: header (4B) read non-blocking; once header complete, read payload non-blocking; advance state on partial reads.\\n- (c) Document that mid-frame blocking is possible and that this receiver is for \\\"management-plane\\\" use only (matches NamedPipe doc).\\n\\nRecommendation: (c) for v1.0.3 — already implicit in code remark `// [management-plane]`. Update public XML doc to remove \\\"non-blocking\\\" wording. (a)/(b) for future zero-copy data-plane.\\n\\n### F2 — SharedMemorySpscReceiver: zero-copy is UNSAFE under current protocol  [WITHDRAWN]\\n\\n**Dim:** D1, D9, D7. Initial recommendation withdrawn after sink re-read.\\n\\n`SharedMemorySpscSink.Accept` (lines 104–135) does **not** gate on `_readIndex`: the producer advances `WriteIdx` unconditionally and silently overwrites unread slots on overrun. The current receiver design (copy into `_frameBuffer` then advance `_readIndex` then callback) is what guarantees the callback sees a consistent packet even when the producer overruns mid-callback. Zero-copy would expose the callback span to torn data from a concurrent producer write.\\n\\nThe copy is **the safety mechanism**, not an oversight. Keep as-is. Adjacent finding F-SHM below describes the underlying protocol gap.\\n\\n### F-SHM — SharedMemorySpscSink lacks producer-side overrun gate  [MEDIUM — adjacent / out-of-scope but blocks F2]\\n\\n**Dim:** D21 (Lock-Free / Contention), correctness.\\n**File:** `SharedMemorySpscSink.cs:104-135` (pre-existing, not in audit delta).\\n\\n`Accept` reads `WriteIdx`, advances unconditionally, writes payload, publishes. Never compares `(WriteIdx + frameLen)` against `ReadIdx`. Consequences:\\n- Silent data loss on consumer-lag (acceptable per Log2 wire compat).\\n- Consumer's `_readIndex == writeIndex` empty-check is **ambiguous** between \\\"empty\\\" and \\\"wrapped exactly one ring\\\" — at saturation the consumer can deadlock or read corrupted frames.\\n- Without integrity tag (CRC/sentinel), receiver cannot detect torn frames from in-flight overruns.\\n\\nOut of scope for this audit (sink is pre-v1.0.2 code). Flagged because F2's zero-copy depends on adding this gate or a per-slot publish bit. Track separately.\\n\\n### F3 — NamedPipeReceiver: POH-pinned 4-byte `_header` field  [MEDIUM] · **RESOLVED 2026-05-26**\\n\\n> **Fix:** `fix/260526-receiver-desync-stall`. Removed `_header` field and its POH allocation; `Poll` now uses `Span<byte> header = stackalloc byte[4]`, mirroring `TcpReceiver`. One less per-instance pinned object on the LOH/POH; cache-resident span on the hot path.\\n\\n\\n**Dim:** D9 (Zero-allocation), D5 (Cache locality).\\n**File:** `NamedPipeReceiver.cs:24, 42, 70`.\\n\\n```csharp\\nprivate readonly byte[] _header;  // 4-byte length prefix; POH-pinned\\n...\\n_header = GC.AllocateUninitializedArray<byte>(4, pinned: true);\\n```\\n\\nA 4-byte POH allocation pays the full pinned-object header overhead (~24 B on x64) plus a heap dereference per access. The sibling `TcpReceiver.Poll` (line 83) uses `stackalloc byte[4]` — strictly faster (zero load, cache-resident).\\n\\nFix: replace `_header` field with `Span<byte> header = stackalloc byte[4];` inside `Poll`, mirroring TCP.\\n\\n### F4 — All Receivers: no BenchmarkDotNet harness  [MEDIUM]\\n\\n**Dim:** D27 (Benchmark tests), D29 (Benchmark discipline), D31 (Regression detection).\\n**Files:** `benchmarks/Relay.Benchmarks/` — no `*Receiver*Benchmark.cs`.\\n\\n`benchmarks/baselines/results/` covers Sinks (`FileSink`, `TcpSink`, `ChainBenchmark`) but no Receiver-side counterpart. Cycle budget for `UdpReceiver.Poll` / `TcpReceiver.Poll` / `SharedMemorySpscReceiver.Poll` is undocumented and unmeasured.\\n\\nRequired: add `Receivers/` benchmark subdir with at minimum one `[MemoryDiagnoser]` benchmark per receiver. Baseline before next release.\\n\\n### F5 — UdpReceiver: two syscalls per successful packet  [LOW / by-design]\\n\\n**Dim:** D23 (Syscall).\\n**File:** `UdpReceiver.cs:59-62`.\\n\\n`_socket.Poll(0, SelectRead)` → `_socket.Receive(...)` = two syscalls when data is present (`select` then `recvfrom`). For sustained inbound traffic where every Poll succeeds, the `select` is wasted work.\\n\\nAlternative: rely on non-blocking `Receive` throwing `SocketException(WouldBlock)`. Cost trade-off:\\n- Bursty workload (most polls = empty): current pattern wins; `Poll(0)` is ~1–3 µs, exception throw is ~10–100 µs.\\n- Saturated workload: receive-first pattern wins.\\n\\nCoordination/management plane is bursty by nature — current choice is correct. Document the assumption in XML so future contributors don't \\\"optimize\\\" the wrong way.\\n\\n### F6 — TcpReceiver / NamedPipeReceiver: `ReadExact` swallows EOS  [LOW]\\n\\n**Dim:** D17 (Exception cost), D24 (Unit tests).\\n**Files:** `TcpReceiver.cs:97-107`, `NamedPipeReceiver.cs:84-94`.\\n\\n`ReadExact` returns `false` on `read == 0`, which conflates \\\"no data\\\" with \\\"peer disconnect\\\". Caller (`Poll`) returns `false` and the next Poll repeats. No reconnect path; no exception telegraph.\\n\\nAcceptable for management-plane (caller restarts session), but should be documented. Tests do not currently assert disconnect-mid-frame behavior — add coverage.\\n\\n### F7 — SharedMemorySpscReceiver: missing magic/sanity check  [LOW]\\n\\n**Dim:** D24 (Unit tests), defensive correctness.\\n**File:** `SharedMemorySpscReceiver.cs:71-74`.\\n\\nConstructor reads `_dataCapacity = *(int*)(_ptr + DATA_CAP_OFF)` without verifying the magic at offset 0 (`0x4C473200` per `SharedMemorySpscSink.cs:49`). Opening a foreign MMF gives garbage capacity; subsequent `% _dataCapacity` may divide by zero or overflow.\\n\\nFix: validate magic in constructor; throw `InvalidDataException` on mismatch. Cold path — free.\\n\\n### F8 — SharedMemorySpscReceiver: `% _dataCapacity` per Poll  [INFO]\\n\\n**Dim:** D7 (Memory access patterns).\\n\\n3 modulos per `Poll` (`payloadStart`, `_readIndex` advance, `ReadRing` chunk). Cannot be replaced with `& (capacity-1)` because `SharedMemorySpscSink` defines `_dataCapacity = totalCapacity - HEADER_SIZE`, which is not power-of-2 for typical sizes (e.g. 4 MiB − 128 B). A protocol change would be required — out of scope for this audit. Document the design choice (Log2 wire compatibility).\\n\\n### F9 — PacketCallback<TState> delegate design  [POSITIVE]\\n\\n**Dim:** D14 (Closures/Delegates), D11 (Boxing).\\n**File:** `PacketCallback.cs`.\\n\\n`delegate void PacketCallback<TState>(TState, ReadOnlySpan<byte>)` — the canonical fix for the language constraint that bans `Action<ReadOnlySpan<byte>>`. `TState` threaded as a parameter eliminates closure allocation; static lambdas (`static (s, f) => ...`) compile to a single delegate instance. Excellent.\\n\\n## Summary table\\n\\n| # | Sev | Component | Dim | Action |\\n|---|---|---|---|---|\\n| F0 | H | Tcp/NamedPipe | corr | Bogus frameLen desyncs wire — disconnect on rejection, add test |\\n| F0b | H | SharedMemorySpsc | corr | Bogus frameLen stalls consumer — fail-fast/throw, add test |\\n| F1 | H | Tcp/NamedPipe | D23/D17 | Update XML doc or implement non-blocking state machine |\\n| F2 | — | SharedMemorySpsc | D1/D9 | **WITHDRAWN** — zero-copy unsafe without F-SHM gate |\\n| F-SHM | M | SharedMemorySpscSink (pre-existing) | D21 | Track separately: add producer-side overrun gate |\\n| F3 | M | NamedPipe | D9 | Replace POH `_header` field with `stackalloc byte[4]` |\\n| F4 | M | Udp + SharedMemorySpsc only | D27 | Add narrowed BDN harness (Tcp/Pipe = management-plane, defer) |\\n| F5 | L | Udp | D23 | Document `Poll(0)+Receive` rationale in XML |\\n| F6 | L | Tcp/NamedPipe | D17 | Document EOS-as-false; add disconnect-mid-frame test |\\n| F7 | L | SharedMemorySpsc | D24 | Validate magic in ctor (subsumed by F0b fix) |\\n| F8 | INFO | SharedMemorySpsc | D7 | Document non-power-of-2 capacity (protocol-locked) |\\n| F9 | + | PacketCallback | D14 | Keep as-is |\\n\\n## Per-dimension scores\\n\\n| Dim | Score (1–10) | Notes |\\n|---|---|---|\\n| 1. CPU Cycles | 7 | Lean per-receiver; SHM has avoidable copy |\\n| 2. Branch Prediction | 9 | Early returns predictable |\\n| 3. SIMD / Vectorization | n/a | Receive path has no SIMD opportunity |\\n| 4. Bounds Check Elimination | 8 | Span idioms correct |\\n| 5. Cache Locality | 8 | Field count modest; POH buffers cache-friendly |\\n| 6. False Sharing | 9 | SPSC; no contended fields |\\n| 7. Memory Access Patterns | 7 | Modulo per access in SHM ring |\\n| 8. Indirection Count | 8 | Sealed receiver classes; one delegate dispatch |\\n| 9. Zero-Allocation | 6 | F2 avoidable copy, F3 wasteful POH `_header` |\\n| 10. GC Pressure | 9 | POH for long-lived; no Gen0 churn |\\n| 11. Boxing / Unboxing | 10 | Generic TState — no boxing |\\n| 12. Pooling | 9 | One buffer per instance reused |\\n| 13. Value Types | 9 | ReadOnlySpan<byte> used correctly |\\n| 14. Closures & Delegates | 10 | PacketCallback<TState> = canonical zero-alloc form |\\n| 15. Async Overhead | 10 | None |\\n| 16. String Handling | 10 | None on hot path |\\n| 17. Exception Cost | 5 | Mid-frame Read may throw; no catch in Poll |\\n| 18. Readonly / Immutability | 8 | Fields readonly where possible |\\n| 19. Inlining & Devirt | 9 | `[AggressiveInlining]` on Poll, ReadRing |\\n| 20. Static / Const Propagation | 8 | SHM header offsets are const |\\n| 21. Lock-Free / Contention | 9 | Volatile.Read/Write only |\\n| 22. Thread Affinity & NUMA | 7 | Caller-owned; receiver doesn't pin |\\n| 23. Syscall / Kernel Transitions | 5 | F1 blocking risk, F5 double syscall, F8 mandatory |\\n| 24. Unit Tests | 7 | Tests exist; no alloc/disconnect assertions |\\n| 25. Integration Tests | 7 | RelayBuilderReceiverTests wires factories |\\n| 26. Stress Tests | 4 | No long-running receiver stress; no backpressure |\\n| 27. Benchmark Tests | 2 | No BDN for receivers |\\n| 28. Hot Path Identification | 9 | XML docs explicit on hot vs management plane |\\n| 29. Benchmark Discipline | 3 | No baseline for receivers |\\n| 30. Profiling Evidence | 5 | Existing benchmark dir; no receiver profile |\\n| 31. Regression Detection | 4 | No CI gate; no receiver baseline |\\n\\n## Verdict\\n\\n**BLOCKED ON v1.0.3 — F0 + F0b are correctness bugs.**\\n\\nMandatory before tag:\\n1. F0 — Tcp/NamedPipe disconnect on bogus frameLen, with unit test.\\n2. F0b — SharedMemorySpsc fail-fast on bogus frameLen, with unit test.\\n3. F1 — XML doc: remove \\\"non-blocking\\\" claim from `TcpReceiver` (or implement true non-blocking).\\n4. F4 — BDN harness for `UdpReceiver` + `SharedMemorySpscReceiver` only. Tcp/Pipe BDN deferred (management-plane).\\n\\nRecommended next release: F3 stackalloc fix, F5/F6 docs, F-SHM protocol gate (separate ticket).\\n\\n…(truncated)\", \"/docs/reports/2026-05-26-resource-cost-map-receivers.md\": \"# Resource Cost Map — receivers (post v1.0.2)\\n\\n_generated 2026-05-26 · model x64-zen4 v1 · library mode · static estimate, not benchmark_\\n\\n## 0. Header\\n\\n- scope: `src/Relay/PacketCallback.cs`, `src/Relay/PacketReceiver.cs`, `src/Relay/Receivers/*.cs`, `src/Relay/Builder/RelayBuilder.From.cs`\\n- mode: **library** (`Relay.dll`; no `Main`; rates `unknown` unless integrator hints)\\n- entry points: 4 hot `Poll()` + 4 ctor + 4 factory + 2 accept/wait — 14 total (hinted: 0, unknown: 14)\\n- nodes analyzed: 27\\n- blind subgraphs: `PacketSink.Enqueue` (polymorphic; ≥8 concrete impls eceiver.cs:99  ~size  unknown  0  memcpy (linear in frameLen; F2 withdrawn)\\n├─ Volatile.Write ReadIdx                      Receivers/SharedMemorySpscReceiver.cs:103 ~1   unknown  0  store\\n├─ PacketCallback<TState> invoke               Receivers/SharedMemorySpscReceiver.cs:105 ~8   unknown  0  delegate\\n└─ Next?.Enqueue(payload)                      Receivers/SharedMemorySpscReceiver.cs:106 ~8±  unknown  0  polymorphic\\n```\\n\\n## 4. Allocation Map (top by bytes/call)\\n\\n| # | bytes/call | bytes/s | symbol | file:line | kind |\\n|---|---:|---:|---|---|---|\\n| 1 | 0 | unknown | `UdpReceiver.Poll` | `Receivers/UdpReceiver.cs:57` | `stackalloc 1432B` — stack |\\n| 2 | 0 | unknown | `TcpReceiver.Poll` | `Receivers/TcpReceiver.cs:79` | `stackalloc 4B` header + POH `_buffer` reused |\\n| 3 | 0 | unknown | `NamedPipeReceiver.Poll` | `Receivers/NamedPipeReceiver.cs:65` | POH `_header` (F3 waste) + POH `_buffer` reused |\\n| 4 | 0 | unknown | `SharedMemorySpscReceiver.Poll` | `Receivers/SharedMemorySpscReceiver.cs:82` | `stackalloc 4B` + POH `_frameBuffer` reused |\\n| 5 | 0 (BDN-verified) | unknown | All Poll paths | — | BDN `[MemoryDiagnoser]` shows 0 B/op on Poll_Empty and Roundtrip for SHM 64/256/1024 |\\n\\nConstructor allocations (cold):\\n- `UdpReceiver` ctor: 1× `Socket` (~120 B Gen0).\\n- `TcpReceiver` ctor: 1× POH `byte[bufferSize]` (default 65 536 B) + `TcpListener` (~64 B).\\n- `NamedPipeReceiver` ctor: 1× POH `byte[4]` (`_header` — F3 wasteful 24 B+ pin) + 1× POH `byte[bufferSize]`.\\n- `SharedMemorySpscReceiver` ctor: 1× POH `byte[maxFrameSize]` + `MemoryMappedFile` handle.\\n\\n## 5. Anti-Pattern Offenders (library mode — no ULTRA-HOT tier without rate hint)\\n\\n| Severity | Rule | symbol | file:line | evidence |\\n|---|---|---|---|---|\\n| info | syscall-per-call | `UdpReceiver.Poll` data path | `Receivers/UdpReceiver.cs:59,62` | 2 syscalls per successful packet (F5; by-design for bursty workload) |\\n| info | syscall-per-call | `TcpReceiver.Poll` data path | `Receivers/TcpReceiver.cs:81,84,90` | 3+ syscalls per frame; F1 mid-frame blocking |\\n| info | syscall-per-call | `NamedPipeReceiver.Poll` data path | `Receivers/NamedPipeReceiver.cs:67,70,77` | 3+ syscalls per frame; F1 mid-frame blocking |\\n| warn | wasteful-POH-pin | `NamedPipeReceiver._header` | `Receivers/NamedPipeReceiver.cs:24,42,70` | F3: 4-byte POH alloc; sibling TCP uses `stackalloc` |\\n| warn | correctness-not-perf | `TcpReceiver.Poll` bogus frameLen | `Receivers/TcpReceiver.cs:87` | F0: header consumed, payload not — permanent wire desync |\\n| warn | correctness-not-perf | `NamedPipeReceiver.Poll` bogus frameLen | `Receivers/NamedPipeReceiver.cs:73` | F0: same as TCP |\\n| warn | correctness-not-perf | `SharedMemorySpscReceiver.Poll` bogus frameLen | `Receivers/SharedMemorySpscReceiver.cs:94` | F0b: `_readIndex` not advanced → infinite stall |\\n| info | modulo-on-non-pow2 | `SharedMemorySpscReceiver.Poll` | `Receivers/SharedMemorySpscReceiver.cs:97,102,119` | F8: 3× `% _dataCapacity` per Poll; protocol-locked (Log2 wire compat) |\\n| info | virtual-dispatch | `Next?.Enqueue` polymorphic | all `Poll` tail calls | `PacketSink` base; concrete sink unknown at receiver site (GDV may kick in if pipeline is sealed) |\\n\\nNo `block` severity — `block` requires ULTRA-HOT tier which needs a rate hint not present in library mode.\\n\\n## 6. Cache-Line Report\\n\\n| symbol | sizeof | issue | file:line |\\n|---|---:|---|---|\\n| `UdpReceiver<TState>` instance | ~40 B (5 ref slots) | one cache line | `Receivers/UdpReceiver.cs:21` |\\n| `TcpReceiver<TState>` instance | ~64 B (7 ref slots + int) | exactly one cache line | `Receivers/TcpReceiver.cs:18` |\\n| `NamedPipeReceiver<TState>` instance | ~48 B (6 ref slots) | one cache line | `Receivers/NamedPipeReceiver.cs:19` |\\n| `SharedMemorySpscReceiver<TState>` instance | ~80 B (8 ref + 2 int + bool) | spans 2 lines | `Receivers/SharedMemorySpscReceiver.cs:27` |\\n\\nNo `T : unmanaged` payload structs int t size, queue depth, IRQ rate | n/a |\\n| `PacketCallback<TState>` body | user-supplied | callback content is integrator's code; cost set by them | `delegates.<callback-name>.cycles_per_call` |\\n| `MemoryMappedViewAccessor.AcquirePointer` | `Receivers/SharedMemorySpscReceiver.cs:67` | ctor-only; cold | n/a |\\n\\n## 9. Delta vs prior — _no prior cost map for this scope; this file is the first snapshot._\\n\\n---\\n\\n## Caveats\\n\\n- Library mode: all `calls/s` are `unknown`. Ranking is by `cycles/call`. Integrator hints needed to compute absolute `weight/s`.\\n- Cycle estimates calibrated to BDN where measured (SHM Poll, UDP Poll); modelled from cost table where not (TCP, NamedPipe). TCP/NamedPipe model error band: ±30%.\\n- `Next?.Enqueue` cost shown as `~8±` is just the dispatch jump; the callee's body adds 30–500 c depending on which sink terminates the chain (terminal `NullSink` ≈ 5 c, terminal `MmfSink` ≈ 80 c, terminal queue sink ≈ 30 c). Integrators should re-rank with their pipeline's concrete tail.\\n- `% _dataCapacity` cost (20 c) is the integer-divide path. JIT cannot strength-reduce because `_dataCapacity` is a field, not constant, and the protocol bars power-of-2 (header subtraction). Acceptable per F8.\", \"/docs/superpowers/plans/2026-05-27-quero-criar-um-teste-idempotent-thompson.md\": \"# Circular Ring Topology Tests — Relay.Tests\\n\\n## Context\\n\\nCriar testes de performance/stress/endurance que exercitem topologias de sinks em anel circular. Objetivo: medir throughput sustentado, saturação de backpressure e pressão GC em cadeiras de múltiplos nós interconectados. O \\\"circular\\\" é implementado no `WriteToBackend` do consumer thread — não via `sink.Next` (que causaria recursão infinita no hot path).\\n\\n---\\n\\n## Critical Constraint: SPSC vs MPSC no nó de entrada\\n\\nEm topologia **infinita** (producer contínuo), o último nó do ring chama `Node-1.Enqueue` no seu consumer thread — simultaneamente ao producer thread. Isso viola o contrato SPSC.\\n\\n| Modo | Nó-1 (entrada) | Outros nós |\\n|---|---|---|\\n| **Finite** (producer faz join antes do ring fechar) | SpscRingNode OK | SPSC/MPSC/Sync livre |\\n| **Infinite** (producer contínuo) | **MpscRingNode obrigatório** | SPSC/MPSC/Sync livre |\\n\\n---\\n\\n## Topologias ASCII\\n\\n### Ring-3 Finite (SPSC)\\n```\\n   P → [N1:Spsc] → [N2:Spsc] → [N3:Spsc] ─┐\\n        ↑                                    │  WriteToBackend N3 → N1\\n        └────────────────────────────────────┘\\n   sink.Next = NullSink<T>.Instance em todos os nós\\n```\\n\\n### Ring-3 Infinite (MPSC entry)\\n```\\n   P ──→ [N1:Mpsc] → [N2:Spsc] → [N3:Spsc] ─┐\\n   (P + T3)↑                                  │\\n            └──────────────────────────────────┘\\n```\\n\\n### Ring-5 Finite\\n```\\n   P → [N1] → [N2] → [N3] → [N4] → [N5] ─┐\\n        ↑                                   │\\n        └───────────────────────────────────┘\\n   (todos SpscRingNode; Infinite: N1=Mpsc)\\n```\\n\\n### Ring-8 Mixed (finite; Infinite: N1→Mpsc)\\n```\\n   P → [N1:Spsc] → [N2:Spsc] → [N3:Mpsc] → [N4:Sync+MemorySink(8M)] →\\n       [N5:Spsc] → [N6:Spsc] → [N7:Mpsc] → [N8:Spsc] ─┐\\n        ↑                                                │\\n        └────────────────────────────────────────────────┘\\n   SyncNode em N4: Accept() count++ → _next.Enqueue (profundidade de stack = 1 por hop)\\n```\\n\\n### Ring-13 Mixed — tabela de configuração\\n| Idx | Tipo | ringCapacity | flushMs | Nota |\\n|---|---|---|---|---|\\n| 1 | Mpsc (∞) / Spsc (fin) | 65536 | 10 | Entry node |\\n| 2 | Spsc | 32768 | 10 | |\\n| 3 | Spsc | 32768 | 10 | |\\n| 4 | Sync+Mem | 1<<23 | — | Synchronous, MemorySink backing |\\n| 5 | Spsc | 32768 | 10 | |\\n| 6 | Mpsc | 32768 | 10 | |\\n| 7 | Spsc | 16384 | 5 | Ring menor → mede saturação |\\n| 8 | Spsc | 32768 | 10 | |\\n| 9 | Mpsc | 65536 | 10 | |\\n| 10 | Spsc | 32768 | 10 | |\\n| 11 | Sync+Mem | 1<<23 | — | Segundo nó síncrono |\\n| 12 | Spsc | 32768 | 10 | |\\n| 13 | Spsc | 32768 | 10 | Fecha para N1 |\\n\\n```\\n   P → [N1] → [N2] → [N3] → [N4:Sync] → [N5] → [N6] → [N7] →\\n       [N8] → [N9] → [N10] → [N11:Sync] → [N12] → [N13] ─┐\\n        ↑                                                   │\\n        └───────────────────────────────────────────────────┘\\n```\\n\\n### Receiver + Sink Ring (PacketSink hierarchy, Windows-only)\\n```\\n   P → [PacketNode#1:Spsc] → SharedMemorySpscSink(\\\"relay-in\\\") \\n                                         │ MMF #1\\n                                         ▼\\n                             SharedMemorySpscReceiver(\\\"relay-in\\\")\\n                                  [PollerThread T_in]\\n                                         │\\n   ┌─────────────────────────────────────┘\\n   ├→ [PacketNode#2:Spsc] → [PacketNode#3:Mpsc] → [PacketNode#4:Spsc] → [PacketNode#5:Spsc]\\n   │                                                                              │\\n   │                                                                              ▼\\n   │                                                             SharedMemorySpscSink(\\\"relay-out\\\")\\n   │                                                                         │ MMF #2\\n   │                                                                         ▼\\n   │                                                        SharedMemorySpscReceiver(\\\"relay-out\\\")\\n   │                                                             [PollerThread T_out]\\n   │                                                                         │\\n   └─────────────────────────────────────────────────────────────────────────┘\\n   (re-injeta em PacketNode#1 — fecha o ring)\\n   \\n   2 MMFs necessários: SharedMemorySpscSink é single-producer-per-instance\\n```\\n\\n### Fluxo de dados Finite (hop counter no payload)\\n```\\n   Struct: [ HopCount:long | Id:long | padding... ]\\n                  ↑\\n                  1º campo — Unsafe.As<T,long> funciona em qualquer tamanho\\n\\n   WriteToBackend:\\n     count++\\n     hopCount = Unsafe.As<T,long>(ref item)   // lê 1º campo\\n     hopCount--\\n     Unsafe.As<T,long>(ref item) = hopCount\\n     if (hopCount > 0) _next.Enqueue(in item)\\n     else droppedTerminal++\\n   \\n   Teste termina: sum(counter[i]) == N * K  (todos os hops processados)\\n```\\n\\n### Fluxo de dados Infinite (saturação)\\n```\\n   while (sw.Elapsed < duration) { Node1.Enqueue(in item); injected++; }\\n   \\n   Backpressure:\\n     Ring cheio → Accept retorna false → sink.Next = NullSink absorve drop\\n     (ou CountingTerminalSink em saturation tests para contagem)\\n   \\n   Shutdown: Stop producer → Thread.Sleep(2s) → StopAll(ring, drainMs:5000)\\n   Assertion: totalProcessed ≥ injected * (ringSize - 1)  // ≥95% delivery\\n              gen0Δ == 0 && gen1Δ == 0\\n```\\n\\n---\\n\\n## Payload Structs (múltiplos de 64B; HopCount sempre no offset 0)\\n\\n| Struct | Size | Campos extras |\\n|---|---|---|\\n| `Packet64` | 64B | `HopCount:long, Id:long` (pad 48B via Size=64) |\\n| `Packet128` | 128B | `HopCount:long, Id:long, Seq:long` (pad 104B) |\\n| `Packet256` | 256B | `HopCount:long, Id:long, Seq:long` (pad 232B) |\\n| `Packet320` | 320B | `HopCount:long, Id:long, Seq:long` (pad 296B) |\\n\\n---\\n\\n## Arquivos a Criar\\n\\n```\\ntests/Relay.Tests/Circular/\\n  Helpers/\\n    CircularPayloads.cs      ← Packet64/128/256/320; PacketLayout (byte ring header helpers)\\n    RingNode.cs              ← SpscRingNode<T>, MpscRingNode<T>, SyncRingNode<T>,\\n                                BackendRingNode<T>, PacketRingNode, BackendPacketRingNode,\\n                                PacketMpscRingNode, CountingTerminalSink<T>\\n    RingTopology.cs          ← BuildSpscRing<T>, BuildMixedRingMpscEntry<T>, BuildPacketRing,\\n                                RingNodeConfig, StartAll, StopAll, TotalCount, PollerThread\\n    RingTestReport.cs        ← coleta janelas de throughput, GC, memória; Print(ITestOutputHelper)\\n  PureSinkRingTests.cs       ← Ring-3/5/8/13 sem backend I/O; finite + infinite; múltiplos payloads\\n  BackendSinkRingTests.cs    ← ring + cada sink concreto de /Relay/Sinks; finite + infinite\\n  ReceiverSinkRingTests.cs   ← Windows-only; Receiver ring; backends de rede (Tcp/Udp/NamedPipe)\\n  SaturationTests.cs         ← small rings, backpressure, drop accounting\\n```\\n\\n---\\n\\n## Implementação dos Helpers\\n\\n### `RingNode.cs` — classes internas sealed\\n\\n**`SpscRingNode<T> : SpscQueueSink<T>`**\\n```csharp\\ninternal sealed class SpscRingNode<T> : SpscQueueSink<T> where T : unmanaged\\n{\\n    internal DispatchSink<T>? _next;  // ring forward — NOT sink.Next\\n    private long _count;              // consumer-thread-only → plain increment, no Interlocked\\n    private long _droppedTerminal;\\n    private readonly bool _decrementHops;\\n\\n    public long Count => Volatile.Read(ref _count);\\n    public long DroppedTerminal => Volatile.Read(ref _droppedTerminal);\\n\\n    protected override unsafe void WriteToBackend(in T item)\\n    {\\n        _count++;\\n        if (_decrementHops)\\n        {\\n            ref long hops = ref Unsafe.As<T, long>(ref Unsafe.AsRef(in item));\\n            if (--hops <= 0) { _droppedTerminal++; return; }\\n        }\\n        _next?.Enqueue(in item);\\n    }\\n    // FlushBackend, TryRecoverBackend, DisposeBackend: vazios\\n}\\n```\\n\\n**`MpscRingNode<T> : MpscQueueSink<T>`** — mesma estrutura, herda MPSC.\\n\\n**`BackendRingNode<T> : SpscQueueSink<T>`** — wraps qualquer backend real (`FileStreamSink<T>`, `MmfSink<T>`, etc.)\\n```csharp\\ninternal sealed class BackendRingNode<T> : SpscQueueSink<T> where T : unmanaged\\n{\\n    private readonly DispatchSink<T> _backend; // backend real (tem próprio consumer thread)\\n    internal DispatchSink<T>? _next;\\n    private long _count;\\n\\n    public long Count => Volatile.Read(ref _count);\\n\\n    protected override void WriteToBackend(in T item)\\n    {\\n        _count++;\\n        _backend.Enqueue(in item);   // escreve no backend (async, próprio consumer thread)\\n        _next?.Enqueue(in item);     // forwarda no ring\\n    }\\n    // FlushBackend → _backend.Flush(); TryRecoverBackend → vazio; DisposeBackend → _backend.Dispose()\\n}\\n```\\nUso: nós com I/O real no ring. Backends file-based (sem servidor necessário) em BackendSinkRingTests; backends de rede também em BackendSinkRingTests com listener/drain dedicado.\\n\\n**`SyncRingNode<T> : DispatchSink<T>`** — `Accept()` (chama no producer OU consumer thread)\\n- Counter: `Interlocked.Increment` (multi-thread)\\n- Backing optional `MemorySink<T>` para saturação\\n- `Accept` retorna false quando MemorySink cheia (sink.Next = CountingTerminalSink absorve)\\n\\n**`PacketRingNode : SpscQueueSink` (packet non-generic)**\\n- Scratch buffer: `GC.AllocateUninitializedArray<byte>(maxPayload, pinned: true)` no ctor\\n- `WriteToBackend`: lê hop via `PacketLayout.ReadHop`, decrementa, copia para scratch com header atualizado, chama `_next.Enqueue(scratch.AsSpan(0, len))`\\n- Custo: 1 memcpy por hop por nó (documentado; zero alocação em steady state)\\n- **`BackendPacketRingNode`**: mesma ideia que `BackendRingNode<T>` mas para hierarquia Packet — wraps `FileSink`, `RotatingFileSink`, etc.\\n\\n**`CountingTerminalSink<T> : DispatchSink<T>`** — conta drops para saturation tests\\n\\n### `RingTopology.cs`\\n```csharp\\ninternal static class RingTopology\\n{\\n    public static SpscRingNode<T>[] BuildSpscRing<T>(int n, int ringCap, int flushMs, bool decrementHops) ...\\n    public static DispatchSink<T>[] BuildMixedRingMpscEntry<T>(RingNodeConfig[] configs) ...\\n    public static void StartAll<T>(DispatchSink<T>[] ring) ...  // chama Start() em Spsc/Mpsc nodes + backends\\n    public static void StopAll<T>(DispatchSink<T>[] ring, int drainMs) ... // ordem forward: 1..N\\n    public static long TotalCount<T>(DispatchSink<T>[] ring) ... // soma _count de todos\\n    // packet variants idem\\n}\\n\\n// RingNodeConfig descreve cada nó:\\ninternal record struct RingNodeConfig(\\n    RingNodeKind Kind,       // Spsc | Mpsc | Sync | BackendSpsc | BackendMpsc\\n    int RingCapacity,\\n    int FlushMs,\\n    DispatchSink? Backend);  // null para nós puros\\n\\ninternal sealed class PollerThread : IDisposable\\n{\\n    // Thread dedicada que chama recv.Poll() em loop com SpinWait(20) quando Poll()==false\\n    // Priority = AboveNormal; IsBackground = true\\n}\\n```\\n\\n---\\n\\n## Topologias com Backends Reais\\n\\n### Ring-3 com FileStreamSink + MmfSink (typed)\\n```\\n   P → [N1:BackendSpsc(FileStreamSink<T>, temp-file)] →\\n       [N2:BackendSpsc(MmfSink<T>, temp-mmf)]         →\\n       [N3:Spsc(puro)]                                 ─┐\\n        ↑                                               │\\n        └───────────────────────────────────────────────┘\\n   Teardown: Delete temp files.\\n```\\n\\n### Ring-5 com backends Packet (FileSink + RotatingFileSink)\\n```\\n   P → [N1:BackendPacket(FileSink, temp-file)]                      →\\n       [N2:BackendPacket(RotatingFileSink, temp-dir, maxBytes=1MB)] →\\n       [N3:PacketRingNode(puro)]                                     →\\n       [N4:BackendPacket(FileSink, temp-file2)]                      →\\n       [N5:PacketRingNode(puro)]                                     ─┐\\n        ↑                                                              │\\n        └──────────────────────────────────────────────────────────────┘\\n```\\n\\n### Ring-3 com backends de rede (BackendSinkRingTests)\\n```\\n   P → [N1:Mpsc(puro)] → [N2:BackendSpsc(TcpSink<T>, loopback:portX)] → [N3:Spsc(puro)] ─┐\\n        ↑                          │ (consumer thread envia sobre TCP)                      │\\n        └──────────────────────────┼────────────────────────────────────────────────────────┘\\n                                   ▼\\n                         TcpListener drain thread (descarta, não re-injeta)\\n   \\n   Variantes: TcpSink<T> | UdpSink | NamedPipeSink | SharedMemorySpscSink em N2.\\n   Cada sink de rede = listener/drain dedicado que descarta sem re-injetar (evita backpressure artificial).\\n```\\n\\n### Receiver + Sink Ring — ring atravessa IPC via Receiver (Windows-only)\\n```\\n   P → [PacketNode#1:Spsc] → SharedMemorySpscSink(\\\"relay-in\\\")\\n                                         │ MMF #1\\n                                         ▼\\n                             SharedMemorySpscReceiver(\\\"relay-in\\\")\\n                                  [PollerThread T_in]\\n                                         │\\n   ┌─────────────────────────────────────┘\\n   ├→ [PacketNode#2:Spsc] → [PacketNode#3:Mpsc] → [PacketNode#4:Spsc] → [PacketNode#5:Spsc]\\n   │                                                                              │\\n   │                                                                              ▼\\n   │                                                             SharedMemorySpscSink(\\\"relay-out\\\")\\n   │                                                                         │ MMF #2\\n   │                                                                         ▼\\n   │                                                        SharedMemorySpscReceiver(\\\"relay-out\\\")\\n   │                                                             [PollerThread T_out]\\n   │                                                                         │\\n   └─────────────────────────────────────────────────────────────────────────┘\\n   (re-injeta em PacketNode#1 — fecha o ring via callback do receiver)\\n   2 MMFs: SharedMemorySpscSink é single-producer-per-instance\\n```\\n\\n---\\n\\n…(truncated)\", \"/docs/superpowers/plans/2026-05-27-quero-criar-um-teste-idempotent-thompson-2.md\": \"# Plano: Throughput Perf Tests + Warmup nos Stress Tests Existentes\\n\\n## Context\\n\\nOs stress tests atuais em `Relay.Tests/Circular/` sofrem de dois problemas:\\n1. **Sem warmup explícito**: os primeiros 1–2 snapshots são contaminados por JIT compilation e escalonamento inicial de threads, distorcendo min/avg/stddev.\\n2. **Janela curta**: 5–10 snapshots não permitem stddev confiável nem detecção de GC drift ao longo do tempo.\\n\\nBenchmarkDotNet **não é adequado** para ring topology: BDN mede latência de batch (startup + inject + drain), enquanto a métrica relevante aqui é throughput sustentado em steady-state (msg/s). Usar BDN incluiria overhead de criação de threads nos números.\\n\\nSolução em duas partes:\\n- **Parte 1** — Adicionar warmup + aumentar duração nos stress tests existentes.\\n- **Parte 2** — Criar `CircularThroughputPerfTests.cs` (`[Trait(\\\"Category\\\",\\\"Perf\\\")]`) com protocolo de warmup longo + 30s de medição.\\n\\n## Parte 1 — Ampliar Stress Tests Existentes\\n\\n### Arquivos modificados\\n\\n| Arquivo | Testes stress afetados |\\n|---|---|\\n| `PureSinkRingTests.cs` | `Ring3_Packet64_Infinite_5s_Throughput` → `_30s_` |\\n| | `Ring5_Packet128_Infinite_5s_Throughput` → `_30s_` |\\n| | `Ring8_Packet256_Infinite_10s_Throughput` → `_30s_` |\\n| | `Ring13_Packet320_Infinite_10s_Throughput` → `_30s_` |\\n| `BackendSinkRingTests.cs` | `Ring3_FileStreamSink_Packet64_Infinite_5s_Throughput` → `_30s_` |\\n| `SaturationTests.cs` | `Ring3_Packet64_SmallBuffer_5s_SaturationRateMeasured` → `_30s_` |\\n| `ReceiverSinkRingTests.cs` | `Ring3_SharedMemorySpscSink_Packet_Infinite_5s_Throughput` → `_30s_` |\\n\\n### Protocolo atual → novo\\n\\n```csharp\\n// ANTES\\nreport.Start();\\nfor (int s = 0; s < snapshots; s++)   // snapshots = 5 ou 10\\n{\\n    Thread.Sleep(1_000);\\n    report.Record(ring.TotalCount());\\n}\\n\\n// DEPOIS\\n// Warmup: 5s sem gravação — JIT compila, ring atinge steady-state\\nThread.Sleep(5_000);\\n\\nconst int snapshots = 30;\\nreport.Start();\\nfor (int s = 0; s < snapshots; s++)   // 30s de medição\\n{\\n    Thread.Sleep(1_000);\\n    report.Record(ring.TotalCount());\\n}\\n```\\n\\n- Warmup: `Thread.Sleep(5_000)` antes de `report.Start()` (não grava snapshots)\\n- Snapshots: 5 ou 10 → **30** (30s de medição)\\n- `RingTestReport` já suporta `maxSnapshots` (default 120), não precisa mudar\\n- Rename de método: `_5s_` ou `_10s_` → `_30s_` (reflete duração real da janela de medição)\\n- `Stop(drainMs: 2_000)` permanece\\n\\n### Testes finitos (commit gate): inalterados\\n\\nOs testes sem `[Trait(\\\"Category\\\",\\\"Stress\\\")]` não são modificados.\\n\\n---\\n\\n## Parte 2 — CircularThroughputPerfTests.cs (novo)\\n\\n**Arquivo:** `tests/Relay.Tests/Circular/CircularThroughputPerfTests.cs`\\n\\n### Protocolo (mais rigoroso que stress)\\n\\n```csharp\\n// 10s de warmup (duplo do stress)\\nThread.Sleep(10_000);\\n\\nconst int snapshots = 30;\\nreport.Start();\\nfor (int s = 0; s < snapshots; s++)\\n{\\n    Thread.Sleep(1_000);\\n    report.Record(ring.TotalCount());\\n}\\nring.Stop(drainMs: 2_000);\\nreport.Stop();\\nreport.Print(label, ring.TotalCount());\\nring.TotalCount().Should().BeGreaterThan(0);\\n```\\n\\n### Configurações (7 testes, ~6 min cada → ~42 min total)\\n\\n**NodeCount scaling (Packet64, RingCap=8192, seed=512):**\\n| Teste | Nodes |\\n|---|---|\\n| Ring3_Packet64_Perf_30s_ThroughputSteadyState | 3 |\\n| Ring5_Packet64_Perf_30s_ThroughputSteadyState | 5 |\\n| Ring8_Packet64_Perf_30s_ThroughputSteadyState | 8 |\\n| Ring13_Packet64_Perf_30s_ThroughputSteadyState | 13 |\\n\\n**PayloadSize scaling (Ring-3, RingCap=8192, seed=512):**\\n| Teste | Payload |\\n|---|---|\\n| Ring3_Packet128_Perf_30s_ThroughputSteadyState | 128B |\\n| Ring3_Packet256_Perf_30s_ThroughputSteadyState | 256B |\\n| Ring3_Packet320_Perf_30s_ThroughputSteadyState | 320B |\\n\\nTodos usam `InfiniteRingTopology<T>` (entry `MpscRingNode<T>`) e `DecrementHops=false`.\\n\\n---\\n\\n## Infraestrutura reutilizada (sem modificações)\\n\\n| Componente | Arquivo |\\n|---|---|\\n| `InfiniteRingTopology<T>` | `Helpers/RingTopology.cs` |\\n| `RingNodeConfig` | mesmo arquivo |\\n| `RingTestReport` | `Helpers/RingTestReport.cs` |\\n| `Packet64/128/256/320` | `Helpers/CircularPayloads.cs` |\\n\\n---\\n\\n## Revisão\\n\\n- Implementação: **Sonnet** (tasks independentes, padrão claro)\\n- Revisão final de todo código gerado: **Opus**\\n\\n---\\n\\n## Verificação\\n\\n```powershell\\n# Commit gate — deve continuar passando (≤60s):\\ndotnet test tests/Relay.Tests -c Release --filter \\\"Category!=Endurance&Category!=Stress&Category!=Perf\\\"\\n\\n# Smoke: 1 stress test com novo protocolo (~36s):\\ndotnet test tests/Relay.Tests -c Release --filter \\\"FullyQualifiedName~Ring3_Packet64_Infinite_30s\\\"\\n\\n# Todos os Perf tests (~42 min):\\ndotnet test tests/Relay.Tests -c Release --filter \\\"Category=Perf\\\" -v normal\\n```\", \"/docs/superpowers/plans/2026-05-27-quero-criar-um-teste-idempotent-thompson-3.md\": \"# Status: Testes 30s em Sinks, Chains e Circular\\n\\n## Pergunta\\n\\n\\\"Temos testes de Sinks completos, encadeados e circulares, com durações de 30s também?\\\"\\n\\n---\\n\\n## Resposta direta: Não\\n\\n| Categoria | 30s Warmup + Snapshot | Observação |\\n|---|---|---|\\n| **Circular** (ring topology) | ✅ Stress 5s+30s / Perf 10s+30s | Concluído na sessão anterior |\\n| **Ring buffers (raw)** | ❌ Sem warmup | `MpscThroughputHarness`, `SpscByteRingBufferTests` stress — correctness ou throughput cru sem protocolo |\\n| **Sinks individuais** | ❌ Sem 30s | Todos correctness-gate (finitos) |\\n| **Chains encadeadas** | ❌ Sem 30s | Todos correctness-gate (finitos) |\\n\\n---\\n\\n## Análise dos testes non-Circular\\n\\n### Stress de correctness (não precisam de 30s)\\n\\nEstes testes medem **ausência de corrupção/perda**, não throughput. O timeout de 30s é um teto, não uma janela de medição. JIT warmup não distorce resultados de correctness.\\n\\n| Arquivo | Testes Stress | Propósito |\\n|---|---|---|\\n| `MpscByteRingBufferTests.cs` | 100K records, 4 threads | No-loss, no-corruption |\\n| `MpscRingBufferTests.cs` | 8 producers × 50K | No-corruption sob contention |\\n| `SpscByteRingBufferTests.cs` | 1M records | No-loss single producer |\\n| `SharedMemorySinkTests.cs` | 20K frames 4KB | No partial-frame race |\\n\\n**Veredicto:** Corretos como estão. Não requerem warmup.\\n\\n### MpscThroughputHarness (gaps reais)\\n\\n`tests/Relay.Tests/MpscThroughputHarness.cs` — 2 testes `[Trait(\\\"Category\\\",\\\"Perf\\\")]`:\\n- `Typed_MpscRingBuffer_Throughput_Sweep_1_2_4_8_Producers`\\n- `Byte_MpscRingBuffer_Throughput_Sweep_1_2_4_8_Producers`\\n\\n**Problemas:**\\n1. **Sem warmup** — primeira rodada inclui JIT compilation\\n2. **Sem RingTestReport** — métricas brutas (items/elapsed), sem stddev, min/avg/max, GC tracking\\n3. Mede throughput do ring buffer cru (sem circular re-injection) — método de medição diferente dos Circular perf tests é adequado, mas a ausência de warmup não é\\n\\n**Gap:** O protocolo de warmup não foi aplicado aqui.\\n\\n---\\n\\n## Plano: Corrigir MpscThroughputHarness\\n\\n### Mudança mínima — `MpscThroughputHarness.cs`\\n\\nAdicionar uma rodada de warmup antes do sweep principal em cada teste:\\n\\n```csharp\\n// ANTES — sweep direto, primeira rodada = JIT\\nforeach (int producerCount in new[] { 1, 2, 4, 8 })\\n{\\n    // ... measure run\\n}\\n\\n// DEPOIS — warmup 1 run, depois sweep\\n// Warmup: JIT-compile the hot path with 1 producer, discard result\\nRunOnce(producerCount: 1, items: 200_000, discard: true);\\n\\nforeach (int producerCount in new[] { 1, 2, 4, 8 })\\n{\\n    // ... measure run (same as before)\\n}\\n```\\n\\n- Sem RingTestReport — o harness usa `Stopwatch` direto (adequado para \\\"items/s por producer count\\\", que é uma medida batch, não steady-state interval)\\n- Apenas acrescentar 1 rodada de warmup antes do loop — cirúrgico\\n\\n### Arquivos modificados\\n\\n| Arquivo | Mudança |\\n|---|---|\\n| `tests/Relay.Tests/MpscThroughputHarness.cs` | Warmup run antes do sweep em ambos os testes |\\n\\n### O que NÃO fazer\\n\\n- **Não criar throughput tests para chains lineares** — chains lineares esgotam items; não há steady-state natural. Escopo futuro se demonstrado por profiling.\\n- **Não adicionar RingTestReport ao harness** — o modelo batch (inject-all-drain) do harness é diferente do modelo interval dos Circular tests; misturar seria incorreto.\\n- **Não alterar testes de correctness** — propósito diferente, não requerem warmup.\\n\\n---\\n\\n## Verificação\\n\\n```powershell\\n# Commit gate — deve continuar passando:\\ndotnet test tests/Relay.Tests -c Release --filter \\\"Category!=Endurance&Category!=Stress&Category!=Perf\\\"\\n\\n# Smoke — 1 perf test com warmup:\\ndotnet test tests/Relay.Tests -c Release --filter \\\"FullyQualifiedName~Typed_MpscRingBuffer_Throughput\\\" -v normal\\n```\", \"/docs/reports/2026-05-27-hot-path-audit-circular-ring-tests.md\": \"# Hot Path Audit — Circular Ring Tests\\n\\n**Date:** 2026-05-27  \\n**Scope:** `tests/Relay.Tests/Circular/PureSinkRingTests.cs`, `tests/Relay.Tests/Circular/ReceiverSinkRingTests.cs`  \\n**Trigger:** `banned-api-enforce` Gate 1 flagged `Thread.Sleep` + structural signals in both files  \\n**Gate:** Gate 2 — deep hot-path analysis  \\n**Auditor:** Claude (Sonnet 4.6)\\n\\n---\\n\\n## Audited Files\\n\\n| File | Hot-Path Justification |\\n|------|------------------------|\\n| `PureSinkRingTests.cs` | Contains producer injection loop calling `ring.Entry.Enqueue(...)` at ~22k items/s during commit-gate tests. Structural signal: tight for-loop over `itemCount`. |\\n| `ReceiverSinkRingTests.cs` | Contains a receiver polling loop (`while (pollerRun == 1) { ... }`) running at bus speed. Structural signal: `Thread.SpinWait` inside a tight while loop. |\\n\\n---\\n\\n## Gate 1 Findings (from banned-api-enforce)\\n\\n| File | Line(s) | Pattern | Classification |\\n|------|---------|---------|----------------|\\n| `PureSinkRingTests.cs` | 49 | `Thread.Sleep(pollMs)` — `WaitQuiesce` helper | Test orchestration |\\n| `PureSinkRingTests.cs` | 68 | `Thread.Sleep(pollMs)` — `WaitQuiescePacket` helper | Test orchestration |\\n| `PureSinkRingTests.cs` | 175, 180, 205, 210, 240, 245, 265, 270 | `Thread.Sleep(1_000)` — stress snapshot loop | Stress test (commit-gate excluded) |\\n| `ReceiverSinkRingTests.cs` | 55 | `Thread.Sleep(pollMs)` — `WaitQuiesce` helper | Test orchestration |\\n| `ReceiverSinkRingTests.cs` | 102, 178 | `Thread.SpinWait(20)` — poller idle back-off | Polling primitive (not `Thread.Sleep`) |\\n| `ReceiverSinkRingTests.cs` | 129, 208 | `Thread.Sleep(200)` — post-stop drain window | Test teardown |\\n| `ReceiverSinkRingTests.cs` | 199 | `Thread.Sleep(1_000)` — stress snapshot | Stress test (commit-gate excluded) |\\n\\n---\\n\\n## Audit Dimensions\\n\\n### Step 1 — Hot Path Identification\\n\\n**Delivery hot path:** `Enqueue(item)` → SPSC/MPSC ring buffer → consumer thread → `WriteToBackend` → `RingNext?.Enqueue(item)`.\\n\\n**Paths executed by test code:**\\n| Code segment | On hot path? | Rationale |\\n|---|---|---|\\n| `ring.Entry.Enqueue(new Packet64 { ... })` injection loop | **Yes** — producer side of the ring | Calls into library hot path directly |\\n| `WaitQuiesce` polling loop with `Thread.Sleep` | **No** | Runs after injection completes; monitors quiescence |\\n| `Thread.SpinWait(20)` in receiver poller | **Yes** — tight loop, but idle branch only | Only reached when `Poll()` returns false (ring empty) |\\n| `Thread.Sleep(200)` post-stop drain window | **No** | Runs after `n2.Stop(); n1.Stop(); n0.Stop()` completes |\\n| `Thread.Sleep(1_000)` in stress snapshot loops | **No** | Between 1-second observation windows; `[Trait(\\\"Category\\\",\\\"Stress\\\")]` |\\n\\n### A3 — CPU Cycles (injection loop)\\n\\nThe injection loop:\\n```csharp\\nfor (long id = 0; id < itemCount; id++)\\n    ring.Entry.Enqueue(new Packet64 { HopCount = hopCount, Id = id });\\n```\\n- `Packet64` is a `struct` — stack-allocated. No allocation per iteration.\\n- `Enqueue` is `[AggressiveInlining]` on `DispatchSink<T>`. JIT inlines into caller.\\n- **No issue.**\\n\\nThe packet injection loop:\\n```csharp\\nSpan<byte> buf = stackalloc byte[64];\\nfor (long id = 0; id < itemCount; id++)\\n{\\n    buf.Clear();\\n    PacketLayout.WriteHop(buf, hopCount);\\n    PacketLayout.WriteId(buf, id);\\n    ring.Entry.Enqueue(buf);\\n}\\n```\\n- `stackalloc byte[64]` is outside the loop — single stack allocation.\\n- `buf.Clear()` is `Span.Clear()` → `Unsafe.InitBlockUnaligned` → single SIMD zero.\\n- `WriteHop`/`WriteId` are `Unsafe.WriteUnaligned` — direct register writes.\\n- **No issue.**\\n\\n### C9 — Zero-Allocation (injection loops)\\n\\n`new Packet64 { ... }` is a value-type struct literal. Assigned to stack slot. No heap allocation.  \\n`stackalloc byte[64]` is stack memory. No heap allocation.  \\n**No allocation on the producer hot path.**\\n\\n### C9 — Zero-Allocation (WaitQuiesce)\\n\\n`WaitQuiesce` creates no heap allocations. The `Func<long>` delegate is captured once at call site (potential single heap allocation at test setup, not per-poll). No issue in the polling body.\\n\\n### D14 — Closures & Delegates\\n\\n`WaitQuiesce(() => n0.Count + n1.Count + n2.Count)` — the lambda captures `n0`, `n1`, `n2` which are local variables. This creates one delegate allocation per call (cold — called once per test). Acceptable.\\n\\n### F21 — Lock-Free / Contention\\n\\n`Interlocked.Increment(ref ctr[0])` in the receiver callback: correct lock-free pattern. The callback runs on the poller thread; `ctr[0]` is a shared counter. **No issue.**\\n\\n`Volatile.Read(ref pollerRun)` / `Volatile.Write(ref pollerRun, 0)`: correct volatile fence for cross-thread signalling. **No issue.**\\n\\n### D17 — Exception Cost\\n\\nNo `try/catch` in any injection loop or poller. `WaitQuiesce` has no exception handling. **No issue.**\\n\\n### Thread.Sleep — Gate 2 Analysis\\n\\nPer CLAUDE.md: `Thread.Sleep → ManualResetEventSlim.Wait or Task.Delay (cold path)`.\\n\\n**`WaitQuiesce` polling (`Thread.Sleep(pollMs)`, pollMs=20):**\\n- Purpose: Wait 20 ms between polls checking whether `TotalCount()` has stabilised.\\n- Hot path impact: **None.** Runs only after all items are injected, waiting for the ring to drain. The ring consumer threads continue running freely during this wait.\\n- Alternative: `ManualResetEventSlim.Wait` would require the ring to signal — but `TotalCount()` stability is not a signallable event from inside the ring nodes. A signal-based approach would require modifying production code to instrument test concerns. Not appropriate.\\n- The CLAUDE.md testing section explicitly allows `Thread.Sleep` in tests for \\\"short, deterministic windows\\\" — 20 ms qualifies.\\n- **VERDICT: Accepted.** Cold path, test-only, bounded window (2 × 20 ms stable = 40 ms minimum).\\n\\n**`Thread.Sleep(200)` drain window (ReceiverSinkRingTests.cs:129, 208):**\\n- Purpose: After `Stop()` completes and shm is disposed, allows the poller thread to drain any frames already in the shared ring buffer before signalling shutdown.\\n- Hot path impact: **None.** Runs in test teardown after ring nodes are stopped.\\n- Alternative: Replace with a `ManualResetEventSlim` signalled from the poller after detecting no more frames. More correct but adds complexity; the 200 ms bound is adequate for the commit-gate test's 50-item workload.\\n- **VERDICT: Accepted.** Test teardown, bounded, not on delivery hot path.\\n\\n**`Thread.Sleep(1_000)` in stress snapshot loops:**\\n- Entirely within `[Trait(\\\"Category\\\",\\\"Stress\\\")]` tests excluded from the commit gate.\\n- **VERDICT: Accepted.** No impact on commit gate.\\n\\n### Thread.SpinWait — Gate 2 Analysis\\n\\n`Thread.SpinWait(20)` executes the x86 PAUSE instruction 20 times (~20 × 5 ns = ~100 ns on modern Intel). It is NOT `Thread.Sleep`. It is the canonical adaptive back-off primitive for lock-free polling and is not in the banned-API list.\\n\\nThe poller loop:\\n```csharp\\nwhile (Volatile.Read(ref pollerRun) == 1)\\n{\\n    if (!receiver.Poll()) Thread.SpinWait(20);\\n}\\n```\\n- When frames are available: `Poll()` returns true, `SpinWait` is skipped. Full-speed polling.\\n- When idle: `SpinWait(20)` briefly backs off without yielding the OS scheduler. Correct pattern.\\n- This loop runs on a dedicated test thread, not on any Relay consumer thread.\\n- **VERDICT: Accepted.** Correct primitive. Not banned.\\n\\n### H24/H25 — Test Coverage\\n\\nAddressed by the feature itself — these ARE the test files. Coverage review is out of scope for this audit.\\n\\n---\\n\\n## Summary of Findings\\n\\n| # | Severity | Component | Issue | Action |\\n|---|---|---|---|---|\\n| 1 | Info | `WaitQuiesce` (both files) | `Thread.Sleep(20)` not on delivery hot path | Accepted — test orchestration, cold path |\\n| 2 | Info | ReceiverSinkRingTests | `Thread.Sleep(200)` post-stop drain | Accepted — test teardown, cold path |\\n| 3 | Info | Stress tests | `Thread.Sleep(1_000)` snapshot timing | Accepted — commit-gate excluded |\\n| 4 | Info | ReceiverSinkRingTests | `Thread.SpinWait(20)` poller idle back-off | Accepted — correct primitive, not banned |\\n| 5 | None | Injection loops | `new Packet64` / `stackalloc byte[64]` | Zero-alloc confirmed |\\n| 6 | None | All | Lock/Monitor usage | None found |\\n| 7 | None | All | LINQ usage | None found |\\n| 8 | None | All | DateTime.UtcNow usage | None found (`Environment.TickCount64` used) |\\n\\n---\\n\\n## Scores\\n\\n| Cluster | Score | Notes |\\n|---|---|---|\\n| A. CPU & Computation | 9/10 | Injection loops are struct + inlined Enqueue, zero overhead |\\n| B. Memory Layout | 10/10 | Packet structs are cache-line aligned; stackalloc in producer |\\n| C. Allocation & GC | 10/10 | Zero allocation on delivery hot path |\\n| D. Language Runtime | 9/10 | One delegate allocation per WaitQuiesce call (cold, acceptable) |\\n| E. Compiler/JIT | 9/10 | Enqueue is AggressiveInlining; no virtual dispatch in loops |\\n| F. Concurrency | 10/10 | Volatile + Interlocked only; no lock/Monitor |\\n| G. System Boundary | 9/10 | Thread.Sleep only in cold paths; SpinWait correct in poller |\\n| H. Test Validation | 10/10 | Commit-gate finite + stress/endurance gated correctly |\\n\\n---\\n\\n## Verdict\\n\\n**PASS — No hot-path violations.**\\n\\nAll `Thread.Sleep` calls are in test orchestration code (WaitQuiesce polling, drain windows) or in `[Trait(\\\"Category\\\",\\\"Stress\\\")]` tests excluded from the commit gate. None are on the message delivery hot path. `Thread.SpinWait(20)` is the correct primitive for low-latency polling back-off and is not a banned API.\\n\\nNo changes to the flagged files are required. Gate 1 fired on structural signals (tight loops + `Thread.Sleep` in the same file) that do not co-locate on the same execution path.\", \"/changelog.d/260611-doc-taxonomy.md\": \"### Docs\\n- Doc-taxonomy: frontmatter on primordials, docs/_index.md hub, relative cross-links (fact-doc-structure).\\n\\n### Perf\\n- N/A — documentation linking only.\", \"/docs/reports/bench-history/bench-history.md\": \"# Benchmark History\\n\\n_generated 2026-06-12T13:07:29Z · env `c15f4501` · 12th Gen Intel Core i7-12700 · .NET 9.0.14 (9.0.1426.11910) · 12 cores · BDN 0.13.12_\\n\\n_Methodology: `docs/bench-methodology.md` (v1)_\\n\\n> Derived file — **do not edit by hand**. Regenerate with `/bench-report ingest`.\\n> Full interactive view: [`bench-history.html`](bench-history.html)\\n\\n## 2026-06-12\\n\\n### Relay.Benchmarks.Sinks.UnixSocketSinkBenchmarks — 13:06:32Z  ·  _micro · env c15f4501 · eb15567 · baseline_\\n\\n| benchId | Mean | StdDev | P99 | Alloc B/op | Δ vs prior |\\n|---|---|---|---|---|---|\\n| `Relay.Benchmarks.Sinks.UnixSocketSinkBenchmarks.Push_Single(ItemCount: 100000)` | 3.68 ms | 50.93 µs | 3.73 ms | 136.01 KB | new |\\n| `Relay.Benchmarks.Sinks.UnixSocketSinkBenchmarks.Push_Single(ItemCount: 1000000)` | 18.88 ms | 2.40 ms | 21.24 ms | 135.98 KB | new |\\n\\n### Relay.Benchmarks.Sinks.UdpSinkBenchmarks — 13:06:18Z  ·  _micro · env c15f4501 · eb15567 · baseline_\\n\\n| benchId
