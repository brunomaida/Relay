  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"d2b2e9f7-e5b5-4d52-b0cf-8c58cda52c6c\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  *{box-sizing:border-box;}\n  body{margin:0;background:#f1f5f9;zoom:1.15;}\n  input{font:inherit;}\n  *::-webkit-scrollbar{width:10px;height:10px;}\n  *::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:5px;border:2px solid transparent;background-clip:content-box;}\n  *::-webkit-scrollbar-track{background:transparent;}\n  .md-doc{font-size:13px;line-height:1.6;color:#334155;max-width:920px;max-height:520px;overflow:auto;padding-right:10px;}\n  .md-doc>*:first-child{margin-top:0;}\n  .md-doc h1,.md-doc h2,.md-doc h3,.md-doc h4{color:#0f172a;font-weight:600;line-height:1.3;margin:16px 0 8px;}\n  .md-doc h1{font-size:19px;border-bottom:1px solid #e2e8f0;padding-bottom:5px;}\n  .md-doc h2{font-size:16px;border-bottom:1px solid #eef2f7;padding-bottom:4px;}\n  .md-doc h3{font-size:14px;} .md-doc h4{font-size:13px;color:#475569;}\n  .md-doc p{margin:8px 0;} .md-doc strong{color:#0f172a;font-weight:650;}\n  .md-doc ul,.md-doc ol{margin:8px 0 8px 4px;padding-left:20px;}\n  .md-doc li{margin:3px 0;}\n  .md-doc code{background:#eef2f7;color:#0f172a;padding:1.5px 5px;border-radius:4px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;}\n  .md-doc pre{background:#0f172a;color:#e2e8f0;padding:12px 14px;border-radius:8px;overflow:auto;margin:10px 0;}\n  .md-doc pre code{background:none;color:inherit;padding:0;font-size:12px;line-height:1.5;}\n  .md-doc blockquote{border-left:3px solid #cbd5e1;margin:10px 0;padding:2px 14px;color:#64748b;background:#f8fafc;border-radius:0 6px 6px 0;}\n  .md-doc a{color:#2563eb;text-decoration:none;} .md-doc a:hover{text-decoration:underline;}\n  .md-doc hr{border:none;border-top:1px solid #e2e8f0;margin:14px 0;}\n  .md-doc table{border-collapse:collapse;margin:10px 0;font-size:12px;display:block;overflow-x:auto;}\n  .md-doc th,.md-doc td{border:1px solid #e2e8f0;padding:5px 10px;text-align:left;}\n  .md-doc th{background:#f8fafc;font-weight:600;color:#0f172a;}\n  .md-empty{color:#94a3b8;font-style:italic;}\n  .chip-clipped{display:none!important;}\n  .rexp{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:600;cursor:pointer;background:#f1f5f9;color:#64748b;border:none;white-space:nowrap;line-height:1.5;}\n  .rexp:hover{background:#e2e8f0;}\n  .row-compact > div { padding-top:5px!important; padding-bottom:5px!important; }\n  .hl-mark { background:#fef08a; border-radius:2px; padding:0 1px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"height:100vh;display:grid;grid-template-rows:60px 1fr;grid-template-columns:248px 1fr;grid-template-areas:'header header' 'sidebar main';background:#f1f5f9;color:#0f172a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;\">\n\n  <div style=\"grid-area: header; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 10; border-color: #eae9e9\">\n    <div style=\"display:flex;align-items:center;gap:12px;\">\n      <div style=\"width:30px;height:30px;border-radius:8px;background:{{accent}};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:-0.03em;\">R<\u002Fdiv>\n      <div style=\"font-size:16px;font-weight:600;letter-spacing:-0.02em;\">Relay — Zero-Allocation .NET Dispatch/Sink Relay Library Roadmap<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:6px;zoom:calc(1/1.15);\">\n      <sc-for list=\"{{ colToggles }}\" as=\"ct\" hint-placeholder-count=\"5\">\n      <button onclick=\"{{ ct.onToggle }}\" style=\"padding:5px 8px;border:1px solid {{ ct.borderColor }};border-radius:6px alAI-Audit.md\",\n                \"content\": [\n                  \"O documento docs/text-specs/2026-05-24-ExternalAI-Audit.md reúne dois pareceres externos (Gemini 3.1 e Codex 5.5) sobre o Relay. Vários itens são bugs de correção reais (uso multi-processo do SharedMemorySink, envios parciais de socket nos sinks packet, overfl\",\n                  \"O objetivo deste relatório é separar com clareza:\"\n                ]\n              },\n              {\n                \"name\": \"2026-05-24-analisando-docs-text-specs-2026-05-24-ex-resilient-cat-2.md\",\n                \"type\": \"spec\",\n                \"path\": \"/docs/superpowers/plans/2026-05-24-analisando-docs-text-specs-2026-05-24-ex-resilient-cat-2.md\",\n                \"title\": \"Plano — Execução das 4 decisões pendentes (§2.2, §2.3, §2.4, §3.3)\",\n                \"content\": [\n                  \"Após executar o plano original de triagem do audit Gemini+Codex, restaram 4 itens da seção §2 (Recomendado / perf mensurável) e §3 (Opcional). A lição central de §2.1 (rejeitado por benchmark) é que claims numéricos do audit não são aceitáveis como base — +5-2\",\n                  \"1. Hipótese técnica explícita antes de qualquer código — qual mecanismo de hardware/runtime explica o ganho esperado, e por que o cenário do Relay o ativa. 2. Benchmark que mede o mecanismo, não o proxy — se a hipótese é \\\"elimina cache bounce X→Y\\\", o benchmark\"\n                ]\n              }\n            ],\n            \"reason\": \"Gemini 3.1 audit → triage + decision execution (§2.2/2.3/2.4/3.3)\",\n            \"is_branch\": false,\n            \"version\": \"1.0.2\",\n            \"verBadge\": null\n          }\n        ]\n      }\n    ]\n  },\n  {\n    \"id\": \"REL:1.0.0\",\n    \"type\": \"release\",\n    \"name\": \"1.0.0 · 2026-05-09\",\n    \"version\": \"1.0.0\",\n    \"released\": true,\n    \"start\": \"2026-04-23\",\n    \"end\": \"2026-05-04\",\n    \"status\": \"done\",\n    \"statusLabel\": \" tent\": [\n                  \"Relay is a private .NET library targeting GitHub Packages. Before this work, no CI/CD infrastructure existed, no NuGet metadata was defined in any .csproj, and no release process was documented. The goal was a reusable, sequenced process for any .NET solution \",\n                  \"/release-1-checklist <version> → /release-2-merge-master → /release-3-execute (develop) (develop → master) (master) Validates gates Safe merge Pack → publish Produces release-action.md Reads version from file Tag → GitHub Release Back-merge develop\"\n                ]\n              }\n            ],\n            \"reason\": \"Release workflow, GitHub Packages + NuGet publishing, symbols\",\n            \"is_branch\": false,\n            \"version\": \"1.0.0\",\n            \"verBadge\": null\n          }\n        ]\n      }\n    ]\n  }\n];\n\n  docBodies = {\"/docs/superpowers/specs/2026-04-24-relay-phase1-design.md\": \"# Relay Fase 1 — Design spec\\n\\nData: 2026-04-24  \\nContexto: pré-requisito para integração Log2 → Relay (Fase 2)\\n\\n---\\n\\n## Objetivo\\n\\nCompletar a hierarquia `PacketSink` no Relay com infraestrutura, builder e sinks concretos,\\ncorrigindo bugs existentes e garantindo performance igual ou superior ao baseline Log2 atual.\\nAo final desta fase, Relay está pronto para receber o adapter Log2 → Relay (Fase 2) sem\\nregressões de CPU ou memória.\\n\\n---\\n\\n## Decisões de arquitetura\\n\\n### 1. `PacketSink` substitui `ByteSink`\\n\\n`ByteSink` não comunica que o payload é uma unidade discreta de tamanho variável. `PacketSink`\\né o nome correto: packet = unidade autocontida, variável, entregue atomicamente.\\n\\nRenomeações diretas (breaking change aceitável — Relay não tem consumers externos ainda):\\n\\n| Antes | Depois |\\n|---|---|\\n| `ByteSink` | `PacketSink` |\\n| `SpscByteQueueSink` | `SpscQueueSink` (non-generic) |\\n| `MpscByteQueueSink` | `MpscQueueSink` (non-generic) |\\n| `NullByteSink` | `NullSink` (non-generic) |\\n| `SpscByteRingBuffer` | sem rename (interno) |\\n| `MpscByteRingBuffer` | sem rename (interno) |\\n\\nConcretos novos (packet): `TcpSink`, `UdpSink`, `FileSink`, `RamSink` (non-generic).  \\nExistentes typed: `TcpSink<T>`, `FileStreamSink<T>`, `RamSink<T>`, `MmfSink<T>` — inalterados.  \\nCoexistência: C# distingue por arity (`TcpSink` vs `TcpSink<T>`), sem conflito de namespace.\\n\\n### 2. Sem `CircuitBreaker` em Relay\\n\\n`_healthy` flag + backoff exponencial em `TryRecoverBackend` é o circuit breaker do Relay.\\nQualquer IOException abre o breaker (`_healthy = false`). `TryRecoverBackend` é o half-open\\nprobe. `Log2.Sinks.Infrastructure.CircuitBreaker` permanece exclusivo de `ChannelSinkBase`.\\n\\n### 3. `SerializeSink<T>` — único ponto de cruzamento entre hierarquias\\n\\nTyped → packet via `MemoryMarshal.AsBytes`: zero copy, zero alloc. Concretos packet são\\nusados por ambos os mundos através deste bridge. Elimina duplicação de `TcpSink<T>` + `TcpSink`\\npara quem precisar de TCP em cadeias typed.\\n\\n### 4. SPSC para todos os concretos da Fase 1\\n\\nLog2 tem um único consumer thread — único produtor para o Relay. MPSC não é necessário para\\no bridge Log2 → Relay. `MpscQueueSink` (non-generic) existe como base para uso direto do\\nRelay com múltiplos produtores — sem concretos MPSC nesta fase.\\n\\n### 5. Sem `RotatingFileSink` em Relay core\\n\\nRotação requer semântica de formato (headers, contagem de registros, políticas de cleanup).\\nRelay é agnóstico de formato. `FileSink` é simples: abre, acumula, faz flush, fecha. Rotação\\nfica em `Log2.Sinks` ou futuro `Relay.Sinks.Local`.\\n\\n### 6. `FileSink` com header opcional\\n\\n`ReadOnlyMemory<byte>? header` no construtor. Escrito uma vez no `Start()`, antes de qualquer\\npayload. Conteúdo definido pelo caller — Relay não conhece o formato.\\n\\n---\\n\\n## Hierarquia completa após Fase 1\\n\\n```\\nPacketSink (abstract)\\n├── SpscQueueSink (abstract, SPSC consumer thread)\\n│   ├── TcpSink\\n│   ├── UdpSink\\n│   └── FileSink\\n├── MpscQueueSink (abstract, MPSC consumer thread)  ← base only, sem concretos\\n├── NullSink\\n├── ForkSink\\n├── MultiSink\\n├── FilterSink\\n└── RamSink                                         ← sem consumer thread\\n```\\n\\n---\\n\\n## Namespaces\\n\\n| Namespace | Conteúdo |\\n|---|---|\\n| `Relay` | `PacketSink`, `SpscQueueSink`, `MpscQueueSink`, `NullSink`, `ForkSink`, `MultiSink`, `FilterSink`, `SerializeSink<T>`, `PacketPredicate` |\\n| `Relay.Sinks` | `TcpSink`, `UdpSink`, `FileSink`, `RamSink` |\\n| `Relay.Builder` | `SinkChainBuilder`, `SinkChain<THead>`, `MultiBuilder`, `FilterBinding<THead>` |\\n\\n---\\n\\n## Correção de bug — `SpscQueueSink.Flush()` cross-thread\\n\\n**Problema:** `SpscByteQueueSink.Flush()` chama `FlushBackend()` diretamente. `FlushBackend()`\\né documentado como \\\"consumer thread only.\\\" `Flush()` pode ser chamado de qualquer thread.\\nRace condition com o consumer thread.\\n\\n**Fix:** idêntico ao `SpscQueueSink<T>` typed.\\n\\n```csharp\\nprivate int _flushRequested;\\n\\npublic override void Flush() => Volatile.Write(ref _flushRequested, 1);\\n```\\n\\nNo `ConsumeLoop`, checar junto ao deadline:\\n\\n```csharp\\nbool flushDue = Volatile.Read(ref _flushRequested) == 1\\n             || HfClock.NowTicks >= flushDeadline;\\nif (flushDue)\\n{\\n    Volatile.Write(ref _flushRequested, 0);\\n    FlushBackend();\\n    TryRecoverBackend();\\n    TryDrainToPrev();\\n    flushDeadline = HfClock.NowTicks + _flushIntervalTicks;\\n}\\n```\\n\\n---\\n\\n## `PacketSink` — contrato\\n\\n```csharp\\npublic abstract class PacketSink : IDisposable\\n{\\n    public PacketSink? Next { get; internal set; }\\n    public abstract bool IsHealthy { get; }\\n\\n    // JIT elimina branch em sealed subclasses com retorno constante.\\n    public virtual bool PropagateAfterAccept => false;\\n\\n    [MethodImpl(MethodImplOptions.AggressiveInlining)]\\n    public void Enqueue(ReadOnlySpan<byte> payload)\\n    {\\n        if (IsHealthy && Accept(payload))\\n        {\\n            if (PropagateAfterAccept) Next?.Enqueue(payload);\\n            return;\\n        }\\n        Next?.Enqueue(payload);\\n    }\\n\\n    [MethodImpl(MethodImplOptions.AggressiveInlining)]\\n    protected abstract bool Accept(ReadOnlySpan<byte> payload);\\n\\n    public abstract void Flush();\\n    public abstract void Dispose();\\n}\\n```\\n\\n---\\n\\n## `SerializeSink<T>`\\n\\n```csharp\\npublic sealed class SerializeSink<T> : DispatchSink<T> where T : unmanaged\\n{\\n    private readonly PacketSink _target;\\n\\n    public SerializeSink(PacketSink target) => _target = target;\\n\\n    public override bool IsHealthy => _target.IsHealthy;\\n\\n    [MethodImpl(MethodImplOptions.AggressiveInlining)]\\n    protected override bool Accept(in T item)\\n    {\\n        _target.Enqueue(MemoryMarshal.AsBytes(MemoryMarshal.CreateReadOnlySpan(in item, 1)));\\n        return true;\\n    }\\n\\n    public override void Flush()   => _target.Flush();\\n    public override void Dispose() => _target.Dispose();\\n}\\n```\\n\\n`Accept` retorna `true` sempre: a cadeia packet assumiu responsabilidade de entrega. Cadeia\\ntyped não recebe sinal de falha pós-aceite — equivalente à semântica de `ForkSink<T>`.\\n\\n---\\n\\n## `ForkSink`\\n\\n```csharp\\npublic sealed class ForkSink : PacketSink\\n{\\n    private readonly PacketSink _primary;\\n\\n    public ForkSink(PacketSink primary) => _primary = primary;\\n\\n    public override bool PropagateAfterAccept => true;\\n    public override bool IsHealthy            => _primary.IsHealthy;\\n\\n    protected override bool Accept(ReadOnlySpan<byte> payload)\\n    {\\n        _primary.Enqueue(payload);\\n        return _primary.IsHealthy;\\n    }\\n\\n    public override void Flush()   { _primary.Flush();   Next?.Flush();   }\\n    public override void Dispose() { _primary.Dispose(); Next?.Dispose(); }\\n}\\n```\\n\\n---\\n\\n## `MultiSink`\\n\\n```csharp\\npublic sealed class MultiSink : PacketSink\\n{\\n    private readonly PacketSink[] _children;\\n\\n    public MultiSink(params PacketSink[] children) => _children = children;\\n\\n    public override bool IsHealthy\\n    {\\n        get { foreach (var c in _children) if (c.IsHealthy) return true; return false; }\\n    }\\n\\n    protected override bool Accept(ReadOnlySpan<byte> payload)\\n    {\\n        foreach (var c in _children) c.Enqueue(payload);\\n        return true;\\n    }\\n\\n    public override void Flush()   { foreach (var c in _children) c.Flush();   Next?.Flush(); }\\n    public override void Dispose() { foreach (var c in _children) c.Dispose(); }\\n}\\n```\\n\\nSem `Multi2Sink` CRTP — YAGNI. Array de 2–4 elementos com loop é suficiente nesta fase.\\n\\n---\\n\\n## `FilterSink`\\n\\n```csharp\\npublic delegate bool PacketPredicate(ReadOnlySpan<byte> payload);\\n\\npublic sealed class FilterSink : PacketSink\\n{\\n    private readonly PacketPredicate _predicate;\\n    private readonly PacketSink      _downstream;\\n\\n    public FilterSink(PacketPredicate predicate, PacketSink downstream)\\n    {\\n        _predicate  = predicate;\\n        _downstream = downstream;\\n    }\\n\\n    // Sempre true. Se IsHealthy espelhasse o downstream, `PacketSink.Enqueue` puláaria o\\n    // Accept quando downstream ficasse unhealthy e o payload vazaria para Next — violando\\n    // o contrato \\\"itens reprovados pelo predicado nunca propagam\\\". O downstream gerencia\\n    // sua própria saúde e sua própria cadeia de fallback.\\n    public override bool IsHealthy => true;\\n\\n    protected override bool Accept(ReadOnlySpan<byte> payload)\\n    {\\n        if (_predicate(payload)) _downstream.Enqueue(payload);\\n        return true; // itens que falham: consumidos, sem propagação para Next\\n    }\\n\\n    public override void Flush()   => _downstream.Flush();\\n    public override void Dispose() => _downstream.Dispose();\\n}\\n```\\n\\n---\\n\\n## `SinkChainBuilder`\\n\\n```csharp\\npublic static class SinkChainBuilder\\n{\\n    public static SinkChain<THead> Start<THead>(THead head)\\n        where THead : PacketSink      => new(head);\\n\\n    public static SinkChain<THead> StartSpsc<THead>(THead head)\\n        where THead : SpscQueueSink   => new(head);\\n\\n    public static SinkChain<THead> StartMpsc<THead>(THead head)\\n        where THead : MpscQueueSink   => new(head);\\n}\\n\\npublic sealed class SinkChain<THead> where THead : PacketSink\\n{\\n    public THead Head { get; }\\n    private PacketSink _tail;\\n\\n    internal SinkChain(THead head) { Head = head; _tail = head; }\\n\\n    public SinkChain<THead> To(PacketSink sink)\\n    {\\n        _tail.Next = sink;\\n        if (sink is SpscQueueSink spsc) spsc.Prev = _tail;\\n        _tail = sink;\\n        return this;\\n    }\\n\\n    public SinkChain<THead> Fork(PacketSink primary)\\n    {\\n        var fork = new ForkSink(primary);\\n        _tail.Next = fork;\\n        _tail = fork;\\n        return this;\\n    }\\n\\n    public FilterBinding<THead> When(PacketPredicate predicate) => new(this, predicate);\\n\\n    public SinkChain<THead> Multi(params PacketSink[] children)\\n    {\\n        var multi = new MultiSink(children);\\n        _tail.Next = multi;\\n        _tail = multi;\\n        return this;\\n    }\\n\\n    public static implicit operator PacketSink(SinkChain<THead> chain) => chain.Head;\\n\\n    // Chamado por FilterBinding.To: instala o filter no tail corrente e avança o tail\\n    // para o downstream — o filter é terminal para o predicado, o downstream estende a cadeia.\\n    internal void AppendFilter(FilterSink filter, PacketSink downstream)\\n    {\\n        _tail.Next = filter;\\n        _tail      = downstream;\\n    }\\n}\\n\\npublic sealed class FilterBinding<THead> where THead : PacketSink\\n{\\n    private readonly SinkChain<THead> _chain;\\n    private readonly PacketPredicate  _predicate;\\n\\n    internal FilterBinding(SinkChain<THead> chain, PacketPredicate predicate)\\n    {\\n        _chain     = chain;\\n        _predicate = predicate;\\n    }\\n\\n    public SinkChain<THead> To(PacketSink downstream)\\n    {\\n        var filter = new FilterSink(_predicate, downstream);\\n        _chain.AppendFilter(filter, downstream);\\n        return _chain;\\n    }\\n}\\n```\\n\\n---\\n\\n## Sinks concretos\\n\\n### `TcpSink`\\n\\n- Estende `SpscQueueSink`\\n- POH send buffer: `GC.AllocateArray<byte>(capacity, pinned: true)`, default 64 KB\\n- Socket: non-blocking, `NoDelay = true`, `KeepAlive = true`\\n- Framing: 4 bytes Big-Endian length-prefix antes de cada payload (compatível com\\n  Input2Log TCP/NamedPipe/UnixSocket/SharedMemory — `BinaryPrimitives.ReadInt32BigEndian`\\n  em `src/Input2Log/TcpInput.cs:64`)\\n- `WriteToBackend`: acumula no send buffer; flush automático quando cheio\\n- `FlushBackend`: `_socket.Send(buffered)` + reset contador\\n- `TryRecoverBackend`: fecha socket, recria, conecta; backoff 1 000 → 30 000 ms exponencial\\n- `DisposeBackend`: `Shutdown + Close`\\n\\n### `UdpSink`\\n\\n- Estende `SpscQueueSink`\\n- Socket pré-conectado, `DontFragment = true`\\n- `maxPayload` configurável, default 65 507 bytes\\n- `WriteToBackend`: `_socket.Send(payload)` direto — sem buffer de acumulação\\n- `FlushBackend`: no-op\\n- `TryRecoverBackend`: recria socket pré-conectado; backoff 1 000 → 10 000 ms\\n\\n### `FileSink`\\n\\n- Estende `SpscQueueSink`\\n- POH write buffer: `GC.AllocateArray<byte>(capacity, pinned: true)`, default 64 KB\\n- `ReadOnlyMemory<byte>? header`: escrito no `Start()` antes de qualquer payload\\n- `WriteToBackend`: acumula no write buffer; flush automático quando cheio\\n- `FlushBackend`: `_stream.Write(buffered)` + `_stream.Flush()` + reset\\n- `TryRecoverBackend`: fecha + reabre `FileMode.Append`; backoff 1 000 → 60 000 ms\\n- Sem rotação\\n\\n### `RamSink`\\n\\nFallback de última instância. Sem consumer thread — acumula durante outage do primário\\ne é reproduzido por `DrainTo(target)` na recuperação.\\n\\n**Contrato de thread:**\\n- SPSC não-concorrente. `Accept` roda no producer; `DrainTo` no consumer de recuperação.\\n  NUNCA simultâneos. Caller garante quiescência do producer antes de invocar `DrainTo`.\\n- Sem CAS. `Volatile.Write`/`Volatile.Read` em `_head` e `_tail` bastam — a ausência\\n  de concorrência real elimina a necessidade de barreira mais forte.\\n\\n**Layout e capacidade:**\\n- Buffer: `NativeMemory.AlignedAlloc(capacity, 64)`, `capacity` power-of-two, default 4 MB.\\n- Record: `[uint32 length (host order)][payload][padding até múltiplo de 4 bytes]`.\\n  `recordSize = 4 + ((payloadLen + 3) & ~3)`. Length em host-order por ser buffer\\n  process-local — não atravessa wire.\\n- Fill-once não-circular. Buffer enche linearmente de 0 a `_capacity`. Quando o\\n  próximo record não couber, `Accept` retorna `false` e `IsHealthy` fica `false`.\\n- Drenagem parcial NÃO libera capacidade. Só a drenagem total (`_head >= _tail`)\\n  reseta `_head = _tail = 0` — somente então o buffer volta a aceitar writes.\\n- Espaço disponível: `_capacity - _tail` (posição absoluta, não delta).\\n\\n**API:**\\n- `Accept(payload)`: `if (_tail + recordSize > _capacity) return false;` depois escreve\\n  length + payload + padding e `Volatile.Write(ref _tail, _tail + recordSize)`.\\n- `IsHealthy`: `_tail < _capacity` (aproximação conservadora; `Accept` é autoritativo).\\n- `DrainTo(PacketSink target)`: lê de `_head` até `Volatile.Read(_tail)`, chama\\n  `target.Enqueue(span)`; para se `target.IsHealthy == false`; no fim da drenagem\\n  total, zera os ponteiros.\\n- `Dispose`: `NativeMemory.AlignedFree`. Idempotente via flag `_disposed`.\\n\\n---\\n\\n## Benchmarks e gates\\n\\n### Baseline\\n\\nExecutar antes de qualquer commit da Fase 1 com BDN + `MemoryDiagnoser` +\\n`HardwareCounters(CacheMisses, BranchMispredictions)`. Salvar em\\n`benchmarks/baselines/2026-04-24-before-phase1.json`.\\n\\nBenchmarks de baseline:\\n\\n| Benchmark | Configuração |\\n|---|---|\\n| `EnqueueThroughput` | Log2 `TcpSink` direto, 1 produtor, steady state |\\n| `FanOut` | Log2 `SinkRouter` com 2, 3, 4 sinks |\\n| `FileWrite` | Log2 `FileSink`, 1 produtor, payload 128B |\\n| `UdpEnqueue` | Log2 `UdpSink`, 1 produtor |\\n\\n### Gates — Camada 1 (infraestrutura)\\n\\n- `dotnet test` passa sem falhas\\n- Build release: verificar IL de `PropagateAfterAccept` em sealed subclass — branch deve ser\\n  eliminado pelo JIT (inspecionar com `dotnet-dump` ou Rider IL viewer)\\n\\n### Gates — Camada 2 (concretos)\\n\\n| Métrica | Gate |\\n|---|---|\\n| `ns/op` vs baseline | ≤ +10% |\\n| `B/op` steady state | 0 |\\n| `Gen0` steady state | 0 |\\n| `ns/op` fan-out 2 sinks | ≤ baseline × 1,15 |\\n| `ns/op` fan-out 4 sinks | ≤ baseline × 1,35 |\\n\\n### Benchmarks novos (sem baseline anterior)\\n\\n| Benchmark | O que mede |\\n|---|---|\\n| `PacketChainFallback` | custo de fallback com sink primário unhealthy |\\n| `SerializeSinkOverhead` | custo de `SerializeSink<T>` vs `TcpSink<T>` direto |\\n| `RamSinkDrainTo` | tempo de `DrainTo` com buffer cheio → `TcpSink` |\\n| `FlushLatency` | intervalo entre `Flush()` e entrega confirmada no backend |\\n\\n`SerializeSinkOverhead` gate adicional: overhead de `MemoryMarshal.AsBytes` +\\ndouble `IsHealthy` check ≤ 5 ciclos vs caminho typed direto.\\n\\n---\\n\\n…(truncated)\", \"/docs/reports/2026-04-23-hot-path-audit-relay.md\": \"# Hot Path Audit — Relay Library\\n**Date:** 2026-04-23  \\n**Scope:** Full library (`src/Relay/**`)  \\n**Auditor:** Claude Sonnet 4.6 / hot-path-audit skill  \\n**Tests at audit time:** 19/19 passing\\n\\n---\\n\\n## Hot Paths Identified\\n\\nAll code on the `Enqueue → Accept` axis qualifies. Call frequency is tick-rate (>10k/sec per CLAUDE.md). No profiler evidence was available; justification is the explicit design intent of the library.\\n\\n| Path | File | Justification |\\n|------|------|---------------|\\n| `DispatchPipe.Enqueue` | `DispatchPipe.cs:33` | Primary producer entry point, tick-rate |\\n| `SpscRingBuffer.TryPublish` | `SpscRingBuffer.cs:65` | Called by `SpscQueuePipe.Accept` on every Enqueue |\\n| `SpscRingBuffer.TryConsume` | `SpscRingBuffer.cs:82` | Consumer inner loop, up to 256/batch |\\n| `SpscQueuePipe.IsHealthy` | `SpscQueuePipe.cs:57` | Called once per Enqueue as pre-gate |\\n| `FanOutPipe.Accept` + `FanOut2Pipe.Accept` | `FanOutPipe.cs:35,68` | Fan-out on every broadcast Enqueue |\\n| `FilterPipe.Accept` | `FilterPipe.cs:31` | Predicate eval per item |\\n| `RamPipe.Accept` | `RamPipe.cs:38` | Last-resort fallback, active during backend failure |\\n\\nConsumer thread (`ConsumeLoop`) is warm path, not direct producer hot path.\\n\\n---\\n\\n## Findings\\n\\n### A1 — Double Volatile.Read per Enqueue (MEDIUM)\\n\\n**Files:** `SpscQueuePipe.cs:57`, `SpscRingBuffer.cs:43–46`, `SpscRingBuffer.cs:65–74`\\n\\n`SpscQueuePipe.IsHealthy` calls `_ring.IsFull`, which executes `Volatile.Read(ref _head.Value)`. Then `Accept` calls `TryPublish`, which **also** executes `Volatile.Read(ref _head.Value)` unconditionally.\\n\\nOn the hot path (healthy, ring not full):\\n- `IsHealthy`: 1× `Volatile.Read(head)` → ~15c (or ~5c L1 hit)\\n- `TryPublish`: 1× `Volatile.Read(head)` → ~15c (or ~5c L1 hit)\\n- Total: **2× Volatile.Read** of the same value, each a potential cross-core invalidation when the consumer is running concurrently.\\n\\n**Fix:** Remove `IsFull` from `IsHealthy` on `SpscQueuePipe<T>`. Let `TryPublish` be the sole arbiter of ring capacity. Semantics are preserved: when ring is full, `TryPublish` returns false → `Accept` returns false → `Enqueue` falls to `Next`. `IsHealthy` becomes a pure backend-health indicator.\\n\\n```csharp\\n// SpscQueuePipe.cs:57 — before\\npublic override bool IsHealthy => _healthy && !_ring.IsFull;\\n\\n// after\\npublic override bool IsHealthy => _healthy;\\n```\\n\\nSaves 1× `Volatile.Read` (~15c worst-case, ~5c L1-warm) on every successful Enqueue. No semantic regression for the fallback chain.\\n\\n**Side note:** `TryPublish` can be further optimized with a cached head value (standard SPSC optimization): read `_head` only when `_tail - _cachedHead >= Capacity`. This would save the `Volatile.Read` in the common case (ring not near full).\\n\\n---\\n\\n### A4 — Ring buffer bounds check not explicitly eliminated (LOW)\\n\\n**File:** `SpscRingBuffer.cs:72`, `SpscRingBuffer.cs:89`\\n\\n```csharp\\n_buffer[tail & _mask] = item;   // TryPublish\\nitem = _buffer[head & _mask];   // TryConsume\\n```\\n\\nThe JIT can prove `(x & mask) < capacity` where `mask = capacity - 1` (power-of-two), but this proof requires pattern recognition of the bitwise-AND idiom. If the JIT fails to eliminate the bounds check, each access incurs a compare + branch.\\n\\nTo guarantee elimination: use `Unsafe.Add(ref MemoryMarshal.GetArrayDataReference(_buffer), (nint)(tail & _mask))`. At present no codegen evidence confirms or denies the JIT is eliminating the check. Low severity; optimize only with disassembly proof.\\n\\n---\\n\\n### D14 — Delegate call overhead in FilterPipe (LOW)\\n\\n**File:** `FilterPipe.cs:18,33`\\n\\n`_predicate` is `Predicate<T>` (a delegate). Delegate invocation goes through an indirect call via `_target` + `_methodPtr` (~3–5c overhead vs a direct call). For high-frequency filter paths this adds up.\\n\\nAlternative API: `FilterPipe<T, TPredicate>` where `TPredicate : struct, IPredicate<T>` allows JIT to devirtualize and inline the predicate at zero call overhead. Trade-off: API verbosity. Low priority unless FilterPipe is measured on the critical path.\\n\\n---\\n\\n### E19 — `FanOutPipe.Accept` virtual dispatch per child (INFO — by design)\\n\\n**File:** `FanOutPipe.cs:37`\\n\\n`foreach (var c in _children) c.Enqueue(in item)` — each `c.Enqueue` is a virtual call through `DispatchPipe<T>`. JIT cannot devirtualize since `c` is the abstract base. For 2 children this is 2 virtual calls vs `FanOut2Pipe`'s 0 (when children are sealed).\\n\\nThis is documented and `FanOut2Pipe<T,TC1,TC2>` is the provided mitigation. **No action required.**\\n\\n---\\n\\n### E19b — `MmfPipe.WriteToBackend` uses checked accessor API (LOW)\\n\\n**File:** `MmfPipe.cs:46`\\n\\n```csharp\\n_view.Write(_position, ref Unsafe.AsRef(in item));\\n```\\n\\n`MemoryMappedViewAccessor.Write` performs an internal bounds check on every call. Since `_position` is only incremented by `EntrySize` (checked in `IsHealthy` before overflow), the bounds check is provably redundant.\\n\\nAlternative: acquire the native pointer once in the constructor via `SafeMemoryMappedViewHandle.AcquirePointer` and use `Unsafe.CopyBlockUnaligned` directly. This eliminates the per-call bounds check. This is on the consumer thread (warm path, not producer hot path), so impact is moderate.\\n\\n---\\n\\n### F21 — `RamPipe` fields are non-volatile (INFO — by contract)\\n\\n**File:** `RamPipe.cs:21–22`\\n\\n`_head` and `_tail` are plain `long` with no volatile/fence. The contract (\\\"call from a single thread\\\") is documented in both the XML summary and CLAUDE.md. However, if a caller uses `RamPipe` in a chain where the producer calls `Enqueue` concurrently with `DrainTo`, data races will occur silently.\\n\\nNo fix required; contract is clear. Consider a DEBUG assertion (similar to `PipeConstraints`) to detect multi-threaded misuse.\\n\\n---\\n\\n### F22 — No thread-affinity API for consumer thread (LOW)\\n\\n**File:** `SpscQueuePipe.cs:71–82`\\n\\nConsumer thread `Priority = BelowNormal`. No core pinning. For latency-critical deployments, OS migration of the consumer thread invalidates L1/L2 cache. Typical fix: expose an optional `CoreAffinity` parameter to `Start()` and call `Thread.BeginThreadAffinity()` + P/Invoke `SetThreadAffinityMask`. Out of scope until a user requests it; worth tracking.\\n\\n---\\n\\n### H24a — No tests for `FilterPipe` (MEDIUM)\\n\\n**Files:** `tests/` — no `FilterPipeTests.cs`\\n\\n`FilterPipe` has two behavioral invariants:\\n1. Items passing the predicate reach `_downstream`.\\n2. Items failing the predicate are silently consumed — they do NOT reach `Next`.\\n\\nInvariant 2 is critical (avoids spurious fallback triggers) and is completely untested. A single test verifying that failed-predicate items don't appear in `Next` would close this gap.\\n\\n---\\n\\n### H24b — No zero-allocation assertions in tests (LOW)\\n\\nNo test uses `GC.CollectionCount(0)` before/after a burst to assert zero allocations on the hot path. An allocation regression (e.g., a boxing change or delegate capture) would be invisible in CI.\\n\\n---\\n\\n### H24c — No tests for `MmfPipe` (HIGH)\\n\\n**File:** `Pipes/MmfPipe.cs` — zero test coverage\\n\\n`MmfPipe` has unique behavior: it is the only pipe with capacity-only failure (no IOException, no recovery). Its `IsHealthy` override is different from the base. No test covers:\\n- Basic write and readback\\n- Capacity exhaustion (`IsHealthy` → false)\\n- Items routed to `Next` when capacity is full\\n\\n---\\n\\n### H24d — No tests for `TcpPipe` (HIGH)\\n\\n**File:** `Pipes/TcpPipe.cs` — zero test coverage\\n\\n`TcpPipe` has reconnect logic and backoff. No test covers even the basic write path (local loopback socket). A minimal test using `TcpListener` on `127.0.0.1` would cover the happy path and verify the send buffer is flushed.\\n\\n---\\n\\n### H26 — No stress tests (HIGH)\\n\\nNo long-running tests (minutes) to detect:\\n- Memory growth (native memory leak in `RamPipe.Dispose` omission path)\\n- GC pressure under sustained throughput\\n- Consumer thread degradation or livelock\\n\\n---\\n\\n### H27 — No benchmark tests (HIGH)\\n\\n**Files:** `tests/` — no BenchmarkDotNet project\\n\\nThe CLAUDE.md states specific cycle budgets (`TryPublish ~25c`, `Enqueue depth-1 ~32c`) but there is no benchmark to verify or track these. Any change to `SpscRingBuffer`, `DispatchPipe.Enqueue`, or `SpscQueuePipe.IsHealthy` could silently regress these targets.\\n\\nRequired: a `benchmarks/Relay.Benchmarks` project with BenchmarkDotNet covering:\\n- `DispatchPipe.Enqueue` (single pipe, hot cache)\\n- `SpscRingBuffer.TryPublish` + `TryConsume` roundtrip\\n- `FanOutPipe.Accept` (2 children) vs `FanOut2Pipe.Accept`\\n- End-to-end throughput: producer vs consumer thread (FileStreamPipe, TcpPipe)\\n\\n---\\n\\n## Summary Table\\n\\n| # | Dimension | Severity | Component | Issue | Action |\\n|---|-----------|----------|-----------|-------|--------|\\n| A1 | CPU Cycles | MEDIUM | `SpscQueuePipe.IsHealthy` + `TryPublish` | 2× `Volatile.Read(head)` per Enqueue | Remove `IsFull` from `IsHealthy` |\\n| A4 | Bounds Check | LOW | `SpscRingBuffer.TryPublish/TryConsume` | Bounds check elimination unverified | Verify JIT output; consider `Unsafe.Add` |\\n| D14 | Closures | LOW | `FilterPipe._predicate` | Delegate indirect call per item | CRTP generic predicate (optional API change) |\\n| E19b | Inlining | LOW | `MmfPipe.WriteToBackend` | `MemoryMappedViewAccessor.Write` bounds check | Direct unsafe pointer via `AcquirePointer` |\\n| F21 | Lock-Free | INFO | `RamPipe._head/_tail` | Non-volatile; single-thread contract | Add DEBUG concurrency assertion |\\n| F22 | Thread Affinity | LOW | `SpscQueuePipe.Start()` | No core pinning API | Expose optional `coreAffinity` param |\\n| H24a | Unit Tests | MEDIUM | `FilterPipe` | No tests for predicate-fail → not-to-Next | Add `FilterPipeTests` |\\n| H24b | Unit Tests | LOW | All hot-path pipes | No zero-alloc GC assertions | Add allocation-count assertions in burst tests |\\n| H24c | Unit Tests | HIGH | `MmfPipe` | Zero coverage | Add `MmfPipeTests` with capacity exhaustion |\\n| H24d | Unit Tests | HIGH | `TcpPipe` | Zero coverage | Add `TcpPipeTests` with loopback socket |\\n| H26 | Stress Tests | HIGH | All pipes | No long-running tests | Add stress test project |\\n| H27 | Benchmarks | HIGH | All hot paths | No BenchmarkDotNet suite | Add `Relay.Benchmarks` project |\\n\\n---\\n\\n## Category Scores\\n\\n| Group | Score | Notes |\\n|-------|-------|-------|\\n| A. CPU & Computation | 7/10 | Double-volatile issue is real; rest is excellent |\\n| B. Memory Layout | 10/10 | PaddedLong 128B, POH pinned, sequential access |\\n| C. Allocation & GC | 10/10 | Zero alloc steady state, POH, no boxing possible |\\n| D. Language Runtime | 9/10 | `in T` everywhere; delegate in FilterPipe is minor |\\n| E. Compiler & JIT | 8/10 | AggressiveInlining on all hot methods; sealed types |\\n| F. Concurrency | 9/10 | SPSC-correct volatile-only; RamPipe contract clear |\\n| G. System Boundary | 9/10 | Batched I/O; RDTSC clock |\\n| H. Test Validation | 4/10 | Critical gaps: MmfPipe/TcpPipe coverage, no benchmarks |\\n\\n---\\n\\n## Verdict\\n\\n**Architecture is sound.** The library correctly applies SPSC ring, cache-line padding, POH pinning, in-parameter passing, and AggressiveInlining across all hot paths. Steady-state allocations are zero; no locks, no LINQ, no async on any dispatch path.\\n\\n**Two actionable improvements:**\\n1. **A1 (MEDIUM, ~15c win per Enqueue):** Remove `IsFull` from `SpscQueuePipe.IsHealthy` to eliminate redundant `Volatile.Read`. Single-line change; no behavioral regression.\\n2. **Test coverage (HIGH):** `MmfPipe`, `TcpPipe`, `FilterPipe` behavioral invariants, and a BenchmarkDotNet project are all missing. The stated cycle budgets in CLAUDE.md are unverifiable without benchmarks.\", \"/docs/reports/2026-04-23-bdn-vs-static-analysis.md\": \"# BDN Measurements vs Static Analysis — Relay Hot Path\\n_generated 2026-04-23 · BenchmarkDotNet 0.13.12 · .NET 9.0.14 RyuJIT X64 AVX2_\\n_v2: corrected run — CounterPipe terminal (DCE fix) + [IterationSetup] removed (RingBuffer fix)_\\n\\n## 0. Executive Summary\\n\\nFive benchmark classes (19 methods) ran to completion after two design corrections:\\n- **DCE fix:** `CounterPipe` (Volatile.Write) replaces `SinkPipe` as terminal pipe.\\n- **RingBuffer fix:** `[IterationSetup]` removed; default BDN job now runs >100M invocations/measurement.\\n\\nAll 19 methods produced valid sub-ns measurements. Zero `ZeroMeasurement` warnings.\\n\\n**TL;DR for CLAUDE.md maintainers:**\\n\\n| Claim | Verdict |\\n|---|---|\\n| `TryPublish` ~25c | ⚠️ OVERSTATED — RoundTrip (TryPublish+TryConsume) in L1 = 3c; in L2+ = 23c |\\n| `Enqueue` depth-1 ~32c | ⚠️ OVERSTATED — direct CounterPipe Enqueue = 0.81c; realistic chain depth-2 = 5.5c |\\n| Fallback hop +4c | ⚠️ UNDERESTIMATED — measured +4.7c (IsHealthy miss) to +8.3c (AllUnhealthy chain) |\\n| FanOut2 saves ~6c vs FanOut | ✅ APPROXIMATELY CONFIRMED — measured ~4.8c savings with real downstream work |\\n\\n---\\n\\n## 1. Hardware & Environment\\n\\n| Field | Value |\\n|---|---|\\n| CPU | 12th Gen Intel Core i7-12700 (Alder Lake), 12 physical / 20 logical |\\n| P-core base / boost | 3.6 GHz / 4.9 GHz |\\n| E-core base / boost | 2.7 GHz / 3.8 GHz |\\n| L1d / L2 / L3 | 48 KB per P-core / 1.25 MB per P-core / 25 MB shared |\\n| Runtime | .NET 9.0.14 (9.0.1426.11910) |\\n| JIT | RyuJIT X64 AVX2, VectorSize=256 |\\n| OS | Windows 11 (10.0.26200) |\\n| GC | Concurrent Workstation |\\n| Power plan | High Performance (set by BDN per benchmark) |\\n\\n**Cycle conversion (P-core base):** 1 ns = 3.6 cycles; 1 cycle = 0.278 ns\\n\\nCLAUDE.md reference values use i9-12900K at 3.2 GHz base (1 cycle = 0.3125 ns).\\n\\n---\\n\\n## 2. Results\\n\\n> Default BDN job: >100M invocations/measurement, overhead-subtracted. All results reliable.\\n\\n### 2.1 EnqueueBenchmarks\\n\\n| Method | Mean (ns) | ±StdDev | Cycles @3.6GHz | Ratio | Code Size |\\n|---|---:|---:|---:|---:|---:|\\n| Depth1_Healthy _(baseline)_ | 0.226 | ±0.016 | 0.81c | 1.00 | 194 B |\\n| Depth2_AcceptReject | 2.393 | ±0.040 | 8.61c | 10.6× | 226 B |\\n| Depth2_HeadUnhealthy | 1.523 | ±0.026 | 5.48c | 6.77× | 198 B |\\n| Depth3_AllUnhealthy | 3.817 | ±0.420 | 13.7c | 14.7× | 228 B |\\n\\n**Chain topology:**\\n- `Depth1_Healthy`: `CounterPipe` direct (IsHealthy + Accept + `Volatile.Write`)\\n- `Depth2_AcceptReject`: `RejectPipe` (Accept=false) → `CounterPipe`\\n- `Depth2_HeadUnhealthy`: `DeadPipe` (IsHealthy=false) → `CounterPipe`\\n- `Depth3_AllUnhealthy`: `DeadPipe` → `DeadPipe` → `CounterPipe`\\n\\n**Hop cost analysis:**\\n\\n| Comparison | Delta (ns) | Delta (cycles) | Interpretation |\\n|---|---|---|---|\\n| Depth2_HeadUnhealthy − Depth1_Healthy | 1.297 | ~4.7c | Cost of 1 IsHealthy-miss hop |\\n| Depth3 − Depth2_HeadUnhealthy | 2.294 | ~8.3c | Cost of 1 extra DeadPipe layer |\\n| Depth2_AcceptReject − Depth1_Healthy | 2.167 | ~7.8c | Cost of 1 Accept-miss hop |\\n\\n> Note: Depth3 has high StdDev (±0.42 ns, 11%) — bimodal distribution detected by BDN.\\n\\n### 2.2 FanOutEnqueueBenchmarks\\n\\n| Method | Mean (ns) | ±StdDev | Cycles | Ratio |\\n|---|---:|---:|---:|---:|\\n| FanOut_Enqueue _(baseline)_ | 6.410 | ±0.094 | 23.1c | 1.00 |\\n| FanOut2_Enqueue | **5.063** | ±0.203 | **18.2c** | **0.80** |\\n\\n> FanOut2 is **1.35 ns (~4.8c) faster** than array-based FanOut with N=2 CounterPipe children.\\n\\n### 2.3 FanOutIsHealthyBenchmarks\\n\\n| Method | Mean (ns) | ±StdDev | Cycles | Ratio |\\n|---|---:|---:|---:|---:|\\n| FanOut_IsHealthy _(baseline)_ | 1.036 | ±0.141 | 3.73c | 1.00 |\\n| FanOut2_IsHealthy | 1.183 | ±0.111 | 4.26c | 1.14 |\\n\\n> Both near-equivalent; difference within noise (high StdDev on both). FanOut2.IsHealthy shows no advantage over the loop.\\n\\n### 2.4 FilterPipeBenchmarks\\n\\n| Method | Mean (ns) | ±StdDev | Cycles | Ratio |\\n|---|---:|---:|---:|---:|\\n| Filter_Reject _(baseline)_ | 0.679 | ±0.052 | 2.44c | 1.00 |\\n| Filter_Pass | **4.945** | ±0.057 | **17.8c** | **7.33×** |\\n\\n> Pass = predicate call (~2.4c) + downstream `CounterPipe.Enqueue` (~15.4c).\\n> Reject = predicate call only; `CounterPipe.Accept` never invoked.\\n\\n### 2.5 RingBufferBenchmarks\\n\\n> `[IterationSetup]` removed — BDN now uses default job (>100M invocations). No timer-resolution artifacts.\\n\\n| Method | Capacity | Mean (ns) | ±StdDev | Cycles @3.6GHz | Cache tier |\\n|---|---|---:|---:|---:|---|\\n| TryConsume_Empty _(baseline)_ | 64 | 0.169 | ±0.063 | 0.61c | L1 |\\n| RoundTrip | 64 | **0.838** | ±0.022 | **3.02c** | L1 |\\n| TryPublish_Full | 64 | 0.799 | ±0.154 | 2.88c | L1 |\\n| TryConsume_Empty | 1024 | 0.183 | ±0.063 | 0.66c | L2 |\\n| RoundTrip | 1024 | **6.477** | ±0.146 | **23.3c** | L2 |\\n| TryPublish_Full | 1024 | 0.533 | ±0.068 | 1.92c | L2 |\\n| TryConsume_Empty | 65536 | 0.152 | ±0.073 | 0.55c | L3 |\\n| RoundTrip | 65536 | **6.370** | ±0.067 | **22.9c** | L3 |\\n| TryPublish_Full | 65536 | 0.573 | ±0.077 | 2.06c | L3 |\\n\\n**Cache-tier effect on RoundTrip:**\\n\\n| Capacity | Buffer size | Cache tier | RoundTrip (ns) | Cycles |\\n|---|---|---|---|---|\\n| 64 | 4 KB | L1 (fits) | 0.838 | ~3c |\\n| 1024 | 64 KB | L2 (barely) | 6.477 | ~23c |\\n| 65536 | 4 MB | L3 | 6.370 | ~23c |\\n\\n> L1→L2 transition: +5.6 ns (+20c) per round trip. L2→L3: no additional cost (prefetcher effective on sequential ring).\\n\\n> `TryConsume_Empty` and `TryPublish_Full` are near-zero because they access only head/tail fields (two 128B PaddedLong lines) — no buffer data read. Cache tier irrelevant for fast-fail paths.\\n\\n---\\n\\n## 3. CLAUDE.md Claims Validation\\n\\nCLAUDE.md documents cycle budgets for i9-12900K at 3.2 GHz. Adjusted for i7-12700 at 3.6 GHz, expected ns/op if claims were correct:\\n\\n| Claim | CLAUDE.md cycles | Expected ns (i7-12700) | Measured | Verdict |\\n|---|---|---|---|---|\\n| `TryPublish` (ring not full) ~25c | 25c | ~6.9 ns | **0.84 ns (L1), 6.5 ns (L2+)** | ⚠️ Cache-dependent |\\n| Successful `Enqueue` depth-1 ~32c | 32c | ~8.9 ns | **0.23–3.82 ns** | ⚠️ Overstated |\\n| Fallback hop +4c | +4c | +1.1 ns | **+1.3 to +2.3 ns** | ⚠️ Underestimated |\\n| FanOut2 saves ~6c vs FanOut | saves 6c | saves ~1.7 ns | **saves 1.35 ns (~4.8c)** | ✅ ~Confirmed |\\n\\n### TryPublish is cache-tier-dependent\\n\\nCLAUDE.md assumes hot caches (L1). The 25c claim (~7.8 ns on i9-12900K, ~6.9 ns on i7-12700) matches the L2+ RoundTrip result (~6.5 ns). In actual L1-resident conditions (Capacity=64), TryPublish+TryConsume together cost only ~3c = 0.84 ns. The 25c estimate assumed L2 or stressed conditions. Revise CLAUDE.md to reflect cache-tier dependency.\\n\\n### Enqueue depth-1 is not 32c\\n\\n`Depth1_Healthy` (direct `CounterPipe.Enqueue`) = 0.226 ns ≈ 0.81c. RyuJIT devirtualizes the sealed `CounterPipe` at the call site using tiered JIT profiling. The 32c estimate assumed undevirtualized virtual dispatch + full ring buffer write. In practice, the JIT eliminates virtual dispatch overhead for sealed concrete types used directly.\\n\\nA realistic single-hop healthy Enqueue with SpscQueuePipe backend (TryPublish in L1) would be ~Depth1 (0.81c) + TryPublish L1 (≈1.5c of the 3c round-trip) ≈ ~2.3c. Still well below 32c.\\n\\n### Fallback hop cost: +4.7c (IsHealthy) to +8.3c (AllUnhealthy chain)\\n\\nCLAUDE.md claims +4c per hop. Measured:\\n- 1 IsHealthy-miss hop: +4.7c (close to claim)\\n- 1 Accept-miss hop: +7.8c (nearly 2× the claim)\\n- Depth3 vs Depth2 delta: +8.3c per additional unhealthy layer (vs +7c in static analysis)\\n\\nThe +4c claim underestimates the Accept-miss case. Update CLAUDE.md to \\\"+4–8c depending on miss type.\\\"\\n\\n### FanOut2 saves ~4.8c — claim approximately confirmed\\n\\nWith `CounterPipe` children (real observable work): FanOut2 = 5.063 ns vs FanOut = 6.410 ns → saves 1.35 ns ≈ **4.8c**. CLAUDE.md claims ~6c. Close enough to validate the design rationale.\\n\\n> First run (with SinkPipe) showed FanOut2 *slower* by 1.2c — that was DCE distorting both measurements. CounterPipe is required for meaningful FanOut2 vs FanOut comparison.\\n\\n---\\n\\n## 4. Static Analysis vs Measured\\n\\n| Symbol | Static Est. | Measured | Delta | Accuracy |\\n|---|---|---|---|---|\\n| `SpscRingBuffer.TryPublish` (L1) | ~10c | ~1.5c (half of 3c RoundTrip) | −8.5c | ❌ 7× overestimate (L1 case) |\\n| `SpscRingBuffer.TryPublish` (L2+) | ~10c | ~11.5c (half of 23c RoundTrip) | +1.5c | ✅ Close |\\n| `SpscRingBuffer.TryConsume` (empty, fast-fail) | ~10c | ~0.6c | −9.4c | ❌ Fast-fail not modeled |\\n| `DispatchPipe.Enqueue` (sealed, direct) | ~15c | ~0.81c (devirtualized) | −14.2c | ❌ JIT devirtualizes sealed |\\n| `FanOutPipe.Accept` N=2 | ~41c | ~23.1c | −18c | ❌ 1.8× overestimate |\\n| `FanOut2Pipe.Accept` (sealed) | ~30c | ~18.2c | −11.8c | ❌ 1.6× overestimate |\\n| `FilterPipe.Accept` (pass path) | ~18c | ~17.8c | −0.2c | ✅ Accurate |\\n| `FilterPipe.Accept` (reject path) | not modeled | ~2.4c | — | predicate-only cost |\\n| Fallback hop (IsHealthy-miss) | +7c | +4.7c | −2.3c | ~OK |\\n| Fallback hop (Accept-miss) | not modeled | +7.8c | — | Accept-miss > IsHealthy-miss |\\n| FanOut2 saving vs FanOut | ~11c saved | ~4.8c saved | −6.2c | ❌ 2× overestimate |\\n\\n**Why static analysis overestimated:**\\n\\n1. **JIT devirtualization of sealed types.** RyuJIT with tiered JIT profiles call sites and devirtualizes sealed concrete types, even through `DispatchPipe<T>` typed fields. Static analysis assumed virtual dispatch always costs ~3c.\\n\\n2. **Fast-fail paths not modeled.** `TryConsume` on empty ring and `TryPublish` on full ring hit an early-return branch — no Volatile.Write, no data copy. Static analysis modeled the successful path only.\\n\\n3. **L1 vs L2 cache not distinguished.** `TryPublish` is ~10c in L2+, but ~1.5c in L1. The static model had no cache-tier parameter.\\n\\n4. **FilterPipe.Accept accurate.** The 18c estimate matches measured 17.8c — delegate dispatch through a non-closure lambda costs ~2.4c (predicate), and CounterPipe.Enqueue downstream costs ~15.4c.\\n\\n---\\n\\n## 5. Recommendations for CLAUDE.md\\n\\n| Priority | Update |\\n|---|---|\\n| HIGH | Replace `TryPublish ~25c` with: `~1.5c (L1-resident ring)` / `~11.5c (L2+ ring)` |\\n| HIGH | Replace `Enqueue depth-1 ~32c` with: `~1–3c (sealed devirtualized, L1)` |\\n| MEDIUM | Replace fallback `+4c per hop` with: `+4–8c (IsHealthy-miss ~5c, Accept-miss ~8c)` |\\n| LOW | Keep `FanOut2 saves ~6c` (measured ~5c — directionally correct) |\\n\\n---\\n\\n## 6. Artifact Locations\\n\\n```\\nBenchmarkDotNet.Artifacts/results/\\n  Relay.Benchmarks.EnqueueBenchmarks-report.csv          ← corrected, CounterPipe\\n  Relay.Benchmarks.FanOutEnqueueBenchmarks-report.csv    ← corrected, CounterPipe children\\n  Relay.Benchmarks.FanOutIsHealthyBenchmarks-report.csv  ← SinkPipe (unchanged, IsHealthy only)\\n  Relay.Benchmarks.FilterPipeBenchmarks-report.csv       ← corrected, CounterPipe downstream\\n  Relay.Benchmarks.RingBufferBenchmarks-report.csv       ← corrected, no [IterationSetup]\\n  Relay.Benchmarks.*-asm.md                              ← disassembly (maxDepth=3)\\n```\\n\\nRun time: 17 min 58 sec total (19 benchmarks). All 19 results valid.\", \"/docs/reports/2026-04-23-bdn-byte-vs-typed.md\": \"# BDN — Byte-pipe hierarchy vs Typed baseline\\n_generated 2026-04-23 · BenchmarkDotNet 0.13.12 (ShortRun) · .NET 9.0.14 RyuJIT X64 AVX2_\\n\\n## 0. Executive Summary\\n\\nNew `BytePipe` hierarchy (BytePipe, SpscByteRingBuffer, SpscByteQueuePipe, NullBytePipe) measured against the typed baseline from the same day (`EnqueueBenchmarks`, full-job run at 15:49).\\n\\n| Claim | Verdict |\\n|---|---|\\n| Byte hot path ≤ 1.5× typed (plan gate) | ✅ PASSED — Depth1_Byte 0.95× typed |\\n| Byte zero-alloc hot path | ✅ CONFIRMED — 0 B allocated in every benchmark |\\n| Length-prefix overhead negligible at Depth 1 | ✅ CONFIRMED — Depth1 within noise |\\n| RoundTrip (publish+peek+advance) comparable to typed | ⚠️ +30% at cap 64 × 64B — acceptable; reflects header I/O + Advance |\\n| Resource cost map estimates accurate | ⚠️ OVERSTATED 5–19× for ULTRA-HOT inlined tier (same pattern as typed) |\\n\\n**Verdict**: byte variant ships. No blocking issues. One micro-anomaly (small payload × small capacity RoundTrip slowdown) flagged for follow-up.\\n\\n---\\n\\n## 1. Hardware & Environment\\n\\n| Field | Value |\\n|---|---|\\n| CPU | 12th Gen Intel Core i7-12700 (Alder Lake), 12 physical / 20 logical |\\n| P-core base / boost | 3.6 GHz / 4.9 GHz |\\n| L1d / L2 / L3 | 48 KB per P-core / 1.25 MB per P-core / 25 MB shared |\\n| Runtime | .NET 9.0.14 (9.0.1426.11910) |\\n| JIT | RyuJIT X64 AVX2, VectorSize=256 |\\n| OS | Windows 11 (10.0.26200) |\\n| GC | Concurrent Workstation |\\n| Power plan | High Performance (set by BDN per benchmark) |\\n\\n**Cycle conversion (P-core base):** 1 ns = 3.6 cycles.\\n\\n**Job profile note**: Byte benchmarks use `--job short` (3 iterations, 3 warmup, 1 launch) to keep total BDN runtime under 10 minutes. Typed baseline used default long job. Short-job ±StdDev can be up to ~60% of Mean on sub-ns measurements; directional conclusions hold but cycle-level precision is weaker than the typed numbers. Full-job re-run recommended before publishing hard SLAs.\\n\\n---\\n\\n## 2. Enqueue A/B — byte vs typed\\n\\nTyped baseline from `EnqueueBenchmarks` (today 15:49, full job):\\n\\n| Method | Mean (ns) | Cycles @3.6GHz | Ratio |\\n|---|---:|---:|---:|\\n| Depth1_Healthy _(baseline)_ | 0.226 | 0.81c | 1.00 |\\n| Depth2_HeadUnhealthy | 1.523 | 5.48c | 6.77× |\\n| Depth2_AcceptReject | 2.393 | 8.61c | 10.60× |\\n| Depth3_AllUnhealthy | 3.817 | 13.74c | 14.66× |\\n\\nByte (today 22:22, short job):\\n\\n| Method | Mean (ns) | Cycles @3.6GHz | Ratio |\\n|---|---:|---:|---:|\\n| Depth1_Byte_Healthy _(baseline)_ | 0.215 | 0.77c | 1.00 |\\n| Depth2_Byte_HeadUnhealthy | 1.970 | 7.09c | 9.18× |\\n| Depth2_Byte_AcceptReject | 2.233 | 8.04c | 10.41× |\\n| Depth3_Byte_AllUnhealthy | 3.044 | 10.96c | 14.19× |\\n\\nCross-hierarchy ratio (byte / typed, matched scenarios):\\n\\n| Scenario | Typed (ns) | Byte (ns) | Byte/Typed | Gate ≤1.5× |\\n|---|---:|---:|---:|:-:|\\n| Depth1_Healthy | 0.226 | 0.215 | **0.95×** | ✅ |\\n| Depth2_HeadUnhealthy | 1.523 | 1.970 | 1.29× | ✅ |\\n| Depth2_AcceptReject | 2.393 | 2.233 | 0.93× | ✅ |\\n| Depth3_AllUnhealthy | 3.817 | 3.044 | 0.80× | ✅ |\\n\\n**Interpretation:**\\n- Depth 1 healthy: Byte 0.95× typed — indistinguishable within short-job noise. Both hierarchies reach the same JIT endpoint: devirtualised `Accept` on a sealed terminal pipe that does one `Volatile.Write`.\\n- Depth 2–3 variability is higher for byte (short-job noise) and slightly lower Mean in 3 of 4 scenarios; treat the \\\"byte is faster in fallback chains\\\" as noise, not a real trend.\\n- **Gate passed on all comparable scenarios.**\\n\\n---\\n\\n## 3. Ring primitives — byte vs typed\\n\\nTyped `RingBufferBenchmarks` at capacity 64 (today 18:07, full job):\\n\\n| Method | Mean (ns) | Cycles |\\n|---|---:|---:|\\n| TryConsume_Empty _(baseline)_ | 0.169 | 0.61c |\\n| RoundTrip (T=Entry64=64B) | 0.838 | 3.02c |\\n| TryPublish_Full | 0.799 | 2.88c |\\n\\nByte `ByteRingBufferBenchmarks` at capacity 64 × payload 64B (today 22:33, short job):\\n\\n| Method | Mean (ns) | Cycles |\\n|---|---:|---:|\\n| TryPeek_Empty _(baseline)_ | 0.226 | 0.81c |\\n| RoundTrip (payload 64B) | 1.091 | 3.93c |\\n| TryPublish_Full | 0.392 | 1.41c |\\n\\nDirect comparison (cap 64, 64B payload):\\n\\n| Primitive | Typed (ns) | Byte (ns) | Byte/Typed | Note |\\n|---|---:|---:|---:|---|\\n| Empty peek/consume | 0.169 | 0.226 | 1.34× | Both are single vol-read + early exit; short-job noise bloats byte figure |\\n| RoundTrip (publish + consume/peek + advance) | 0.838 | 1.091 | **1.30×** | Byte pays for: 4B LE header I/O, Advance-as-separate-call, record-size arithmetic |\\n| TryPublish_Full (rejection) | 0.799 | 0.392 | 0.49× | **Byte faster** — branch order in byte `TryPublish` exits on `(uint)len >= PaddingMarker` or `recordSize > Capacity` before the vol-read of head; typed pays the full vol-read |\\n\\n**Interpretation:**\\n- RoundTrip +30% is the price of the byte variant's variable-length design. Paid per dequeue, not per hop.\\n- `TryPublish_Full` going faster in byte is a real geometry win — the rejection branch hits before any vol-read.\\n\\n---\\n\\n## 4. Byte ring — sweep across Capacity × PayloadSize\\n\\nFull matrix (ShortRun, ns Mean):\\n\\n| Capacity | Payload | TryPeek_Empty | RoundTrip | TryPublish_Full |\\n|---:|---:|---:|---:|---:|\\n| 64 | 8 | 0.226 | **3.940** | 0.441 |\\n| 64 | 64 | 0.226 | 1.091 | 0.392 |\\n| 64 | 256 | 0.217 | 1.810 | 0.436 |\\n| 64 | 1024 | 0.198 | 1.102 | 0.468 |\\n| 1024 | 8 | 0.208 | **3.904** | 0.456 |\\n| 1024 | 64 | 0.252 | **4.744** | 0.446 |\\n| 1024 | 256 | 0.240 | **5.910** | 0.452 |\\n| 1024 | 1024 | 0.218 | 1.114 | 0.436 |\\n| 65536 | 8 | 0.255 | **3.708** | 0.437 |\\n| 65536 | 64 | 0.215 | **4.151** | 0.437 |\\n| 65536 | 256 | 0.190 | **6.078** | 0.431 |\\n| 65536 | 1024 | 0.212 | **15.128** | 0.445 |\\n\\n**Observations:**\\n1. **TryPeek_Empty and TryPublish_Full are flat** across the matrix (~0.2 ns / ~0.44 ns). Both are early-exit branches that don't touch the backing buffer.\\n2. **RoundTrip spike at 8B payload** — cap 64/1024/65536 all hit ~3.7–3.9 ns (vs 1.09 ns at 64B payload). Record size = 4+8 = 12B; for capacity 64 this leaves only 5 slots before wrap — padding marker triggers on ~20% of iterations, dragging the Mean up. For larger capacities the same geometry recurs because BDN's tight loop keeps the ring at near-empty, and the 12B stride doesn't align to 64B cache lines cleanly.\\n3. **Cap 65536 × 1024B payload = 15.1 ns** — record stride 1028B × repeated traversal thrashes 1.25 MB L2; not a code issue, a working-set issue. Documented so callers dimension rings against cache size.\\n4. **Cap 1024 × 1024B payload = 1.11 ns** — same record size but smaller ring fits L1; stays fast.\\n\\n**Recommendation for consumers**: size the ring to stay within L1d (48 KB) or L2 (1.25 MB) for predictable latency. Crossing L2→L3 costs ~5× per RoundTrip.\\n\\n**Follow-up candidate** (not blocking): investigate whether the 8B-payload RoundTrip overhead is dominated by padding-marker branch cost or by the separated Advance call. If the former, padding handling could be specialised on a \\\"recordSize == capacity-pos\\\" fast path.\\n\\n---\\n\\n## 5. vs Resource Cost Map (static estimate)\\n\\nThe static `resource-cost-map-relay.md` (generated 2026-04-23, x64-golden-cove v1 model) predicts cycles/call for the typed hierarchy. Applying the same model shape to byte (both hierarchies share the `IsHealthy + Accept + vol-read + store` skeleton):\\n\\n| Symbol | Static estimate | BDN measured (byte) | Discrepancy |\\n|---|---:|---:|---:|\\n| `DispatchPipe.Enqueue` / `BytePipe.Enqueue` (healthy, sealed subclass) | ~15c / 4.2 ns | 0.215 ns / 0.77c | **~19× overestimated** |\\n| `SpscRingBuffer.TryPublish` / `SpscByteRingBuffer.TryPublish` | ~10c / 2.8 ns | publish-portion of RoundTrip ≈ 0.5 ns / 1.8c | **~5.5× overestimated** |\\n| `NullPipe.Accept` / `NullBytePipe.Accept` | ~1c / 0.28 ns | not directly measured (used only as terminal in fallback); Depth1 = 0.77c bound is inclusive of the entire chain | within bound |\\n\\n**Consistency with typed analysis**: `2026-04-23-bdn-vs-static-analysis.md` already flagged the same 5–20× overestimation pattern for typed ULTRA-HOT symbols. The byte hierarchy inherits the pattern — static analysis does not model JIT devirtualisation + aggressive inlining on sealed types, which collapses entire call chains into a few instructions.\\n\\n**Action for resource-cost-map**: when byte-variant rows are added, flag the ULTRA-HOT tier entries with the same \\\"measure before trusting\\\" note already present for the typed variants, not a separate adjustment factor.\\n\\n---\\n\\n## 6. Fallback hop cost (byte)\\n\\nDerived from Depth 1/2/3 measurements:\\n\\n| Comparison | Delta (ns) | Delta (cycles) | Interpretation |\\n|---|---:|---:|---|\\n| Depth2_HeadUnhealthy − Depth1_Healthy | 1.755 | ~6.3c | One IsHealthy-miss hop into CounterPipe |\\n| Depth3_AllUnhealthy − Depth2_HeadUnhealthy | 1.074 | ~3.9c | One extra DeadBytePipe layer |\\n| Depth2_AcceptReject − Depth1_Healthy | 2.018 | ~7.3c | One Accept-miss hop |\\n\\nByte fallback hop is **~4–7c**, same order of magnitude as typed (4.7–8.3c). No pathological branch pattern introduced by the byte hierarchy.\\n\\n---\\n\\n## 7. Artefacts referenced\\n\\n- `BenchmarkDotNet.Artifacts/results/Relay.Benchmarks.ByteEnqueueBenchmarks-report-github.md`\\n- `BenchmarkDotNet.Artifacts/results/Relay.Benchmarks.ByteRingBufferBenchmarks-report-github.md`\\n- `BenchmarkDotNet.Artifacts/results/Relay.Benchmarks.EnqueueBenchmarks-report-github.md` (typed baseline, 15:49)\\n- `BenchmarkDotNet.Artifacts/results/Relay.Benchmarks.RingBufferBenchmarks-report-github.md` (typed ring, 18:07)\\n- `docs/reports/2026-04-23-resource-cost-map-relay.md` (static estimate)\\n- `docs/reports/2026-04-23-bdn-vs-static-analysis.md` (typed BDN vs static, prior discrepancy analysis)\\n\\n---\\n\\n## 8. Recommendations\\n\\n1. **Merge `feature/260423-relay-bytepipe` into `develop`** — all gates green.\\n2. **Re-run byte benchmarks with the default long job** post-merge to produce publishable SLA numbers (short-job ±Error too high for documentation).\\n3. **Update resource-cost-map** with byte-variant rows when next generated; apply the same \\\"static-overestimates-inlined-ULTRA-HOT\\\" caveat.\\n4. **Monitor 8B × small-capacity RoundTrip overhead** if a real consumer hits that geometry; optimise padding branch if it materialises.\", \"/docs/reports/2026-04-23-mpsc-ringbuffer-byte-vs-log2.md\": \"# MPSC ring buffers — Relay byte vs Log2 typed\\n\\n_generated 2026-04-23 · structural comparison + projected performance · no cross-lib benchmark yet_\\n\\n## 0. Scope\\n\\nCompare the **structure** and **projected performance** of:\\n- `Relay.Buffers.MpscByteRingBuffer` (this commit) — variable-length byte payloads.\\n- `Log2.Core.MpscRingBuffer<T>` (existing, `where T : struct`) — fixed-size managed struct.\\n\\nBoth are single-consumer, multi-producer, lock-free ring buffers. Both adopt the FTL / Log2 `FIX #18` three-counter HeadCache layout. They diverge in payload model, synchronization protocol granularity, and memory strategy.\\n\\nNo live A/B benchmark in this report — that requires a shared benchmark harness neither project currently has. Projected performance is derived from the structural analysis below plus the typed MPSC numbers already measured in `Relay.Benchmarks.MpscBenchmarks`.\\n\\n---\\n\\n## 1. Structural comparison\\n\\n| Axis | `Log2.MpscRingBuffer<T>` (typed) | `Relay.MpscByteRingBuffer` (byte) |\\n|---|---|---|\\n| **Payload model** | Fixed-size `T` (where `T : struct`) — e.g. `LogEntry` ~24 B | Variable-length `ReadOnlySpan<byte>`, 4-byte aligned |\\n| **Constraint** | `T : struct` — allows managed references (e.g. `byte[]? PooledBuffer` inside `LogEntry`) | `byte[]` on POH; payload is raw bytes only |\\n| **Slot storage** | Managed `Slot[]` array (heap, GC-visible) | POH-pinned `byte[]` |\\n| **Slot layout** | `struct Slot { int Published; T Value; }` — implicit layout, no explicit padding | No slot struct — records are `[uint32 header][payload]` in-place |\\n| **Publish marker** | `int Published` (per-slot) | High bit of the length header (per-record) |\\n| **Reservation granularity** | 1 slot (always one `T`) | Variable bytes (aligned to 4) |\\n| **Reservation CAS target** | `_claimedTail` increment by 1 | `_claimedTail` increment by `recordSize` or `wrapPadding + recordSize` |\\n| **HeadCache** | ✓ Yes — `_headCache` consulted first | ✓ Yes — same pattern |\\n| **Wrap handling** | Implicit — `index & mask` | Explicit — padding marker (sentinel header `0xFFFFFFFF`) at wrap boundary |\\n| **Consumer zero-copy** | No — returns `out T item` (copy) | Yes — returns `ReadOnlySpan<byte>` into buffer |\\n| **Slot recycle** | Consumer writes `slot.Value = default; Volatile.Write(Published, 0);` | Consumer writes `Volatile.Write(header, 0)` before advancing head |\\n| **Memory model (payload write ordering)** | `slot.Value = item;` then `Volatile.Write(Published, 1)` — release semantics via .NET Volatile.Write | `payload.CopyTo(_buffer)` then `Volatile.Write(header, len \\\\| HighBit)` — same release semantics |\\n| **Overflow mode** | `TryWrite` (drop) + `WriteBlocking` (SpinWait) | `TryPublish` only — caller wraps spin if needed |\\n| **Memory allocation** | Managed `Slot[]`, ~ `capacity × sizeof(Slot)` heap | POH-pinned `byte[capacity]` |\\n| **VirtualLock / PreFault** | Not invoked (managed heap) | `RelayMemory.PreFaultAndLock(byte[])` via `PreFaultAndLock()` method |\\n| **Minimum capacity** | 2 | 16 (byte-level — needs room for at least one header+aligned payload) |\\n| **Capacity unit** | Slot count | Bytes |\\n\\n---\\n\\n## 2. Synchronization protocol — side by side\\n\\n### Producer path (`TryPublish` / `TryWrite`)\\n\\n**Typed (Log2)**:\\n```\\nloop:\\n  claimed = VRead(_claimedTail)\\n  wrapPoint = claimed - capacity\\n  hc = _headCache          (plain read)\\n  if hc <= wrapPoint:\\n    hc = VRead(_head)       (cross-core refresh)\\n    _headCache = hc         (cache the refresh)\\n    if hc <= wrapPoint: return false    // truly full\\n  if CAS(_claimedTail, claimed, claimed+1) succeeded:\\n    slot = _slots[claimed & mask]\\n    slot.Value = item\\n    VWrite(slot.Published, 1)   // release\\n    return true\\n  retry\\n```\\n\\n**Byte (Relay)**:\\n```\\nvalidate length ≤ MaxLength, recordSize ≤ capacity\\nloop:\\n  claimed = VRead(_claimedTail)\\n  pos = claimed & mask\\n  contiguous = capacity - pos\\n  if contiguous >= recordSize: reserve = recordSize; wrap = false\\n  else:                         reserve = contiguous + recordSize; wrap = true\\n  wrapPoint = claimed + reserve - capacity\\n  hc = _headCache\\n  if hc <= wrapPoint: refresh from VRead(_head), retry full-check; if still full return false\\n  if CAS(_claimedTail, claimed, claimed+reserve) succeeded:\\n    if wrap:\\n      copy payload to _buffer[HeaderSize..HeaderSize+len]\\n      VWrite(header @ 0, len | HighBit)          // publish record header at new origin\\n      VWrite(header @ pos, PaddingFull)          // stamp padding marker at claim origin\\n    else:\\n      copy payload to _buffer[pos+HeaderSize..pos+HeaderSize+len]\\n      VWrite(header @ pos, len | HighBit)\\n    return true\\n  retry\\n```\\n\\nThe typed path is ~15 lines; the byte path is ~25. The **only structural difference** is the wrap-padding write — typed records never straddle because they are exactly one slot each.\\n\\n### Consumer path\\n\\n**Typed**:\\n```\\npos = _head.Value       (plain — single consumer)\\nslot = _slots[pos & mask]\\nif VRead(slot.Published) == 0: return false\\nitem = slot.Value\\nslot.Value = default\\nVWrite(slot.Published, 0)     // recycle\\nVWrite(_head, pos+1)          // release slot to producers\\nreturn true\\n```\\n\\n**Byte**:\\n```\\npos = _head.Value       (plain — single consumer)\\nidx = pos & mask\\nhdr = VRead(header @ idx)\\nif (hdr & HighBit) == 0: return false (not yet published)\\nlenField = hdr & LengthMask\\nif lenField == PaddingLowBits:\\n  skip = capacity - idx\\n  VWrite(header @ idx, 0)        // clear padding slot\\n  VWrite(_head, pos + skip)      // advance past wrap\\n  retry (consumer self-recursion)\\nreturn payload = _buffer[idx+HeaderSize..idx+HeaderSize+lenField]\\nadvanceBytes = HeaderSize + (lenField + 3) & ~3\\n\\non Advance(bytes):\\n  idx = _head.Value & mask\\n  VWrite(header @ idx, 0)        // clear slot header\\n  VWrite(_head, pos + bytes)     // release slot to producers\\n```\\n\\nByte splits consumption into `TryPeek` (borrow) + `Advance` (release). Typed does it inline. The byte split is what enables zero-copy — the caller uses the span, then calls `Advance` once done, without a `Volatile.Write` happening in the middle.\\n\\n---\\n\\n## 3. Projected performance\\n\\nTyped MPSC `TryPublish+TryConsume` round-trip (BDN MpscBenchmarks, projected from typed SPSC baseline):\\n\\n| Capacity | SPSC baseline | MPSC typed (projected) | MPSC byte (projected) |\\n|---:|---:|---:|---:|\\n| 64 slots / ~4 KB | 0.84 ns | 1.3-1.5 ns | 1.5-2.0 ns |\\n| 1024 slots / ~64 KB | 0.84 ns | 1.3-1.5 ns | 1.5-2.0 ns |\\n| 65536 slots / ~4 MB | ~6 ns | ~7-8 ns | ~7-9 ns |\\n\\nNumbers not measured here — produce by running `dotnet run -c Release --project benchmarks/Relay.Benchmarks -- --filter \\\"*Mpsc*\\\"`.\\n\\nWhere the byte variant costs more (per-record), no-contention:\\n- **Length validation** (`(uint)len > MaxLength`): ~1 c.\\n- **`recordSize` arithmetic** (`(len + 3) & ~3`): ~2 c.\\n- **Contiguous check** (`contiguous = capacity - pos`): ~2 c.\\n- **Wrap-case branch**: ~1 c (predictable, not taken most of the time).\\n- **Payload copy** (`Span.CopyTo`): dominates for payloads ≥ 64 B; amortized ~0.3 c/byte on modern x86 via `rep movsb` or AVX path.\\n- **Volatile header write via `Unsafe.As` + `MemoryMarshal.GetArrayDataReference`**: same cost as typed's `slot.Published` write (~15 c mfence on x64). No indirection penalty; JIT inlines.\\n\\nWhere the byte variant saves vs typed:\\n- **No slot struct layout penalty**: typed `Slot { int; T; }` has an implicit pad for `T`'s alignment (4-byte pad if `T` has 8-byte alignment). The byte variant's header is packed at natural position.\\n- **Zero-copy consume**: typed `TryConsume` copies `T` out of the slot (`item = slot.Value`), which is sizeof(T) bytes of work. Byte `TryPeek` hands back a span — zero bytes moved until the caller uses the span.\\n\\n**Multi-producer contention**:\\n- Typed CAS target: `_claimedTail` increment by 1. Retry rate proportional to `N_producers - 1`.\\n- Byte CAS target: same counter, increment by variable `reserve`. Retry rate identical.\\n- Payload write step does NOT contend (each producer writes into its own reserved region).\\n- Header publish write also does not contend (each producer writes its own header address).\\n\\n**The two implementations should exhibit essentially identical contention behavior** for the same producer count, because the only contention point — the `_claimedTail` CAS — is structurally the same.\\n\\n---\\n\\n## 4. Trade-offs summary\\n\\n| When to pick typed `MpscRingBuffer<T>` | When to pick byte `MpscByteRingBuffer` |\\n|---|---|\\n| Payload is a fixed-size struct (tick, log-entry header, event) | Payload size varies per record (serialized frames, text lines, variable-length protocol messages) |\\n| `T` contains managed references (e.g. `byte[]? Pool`) | Payload is already a byte blob |\\n| Consumer wants an owned copy in a local variable | Consumer processes the payload in place (write-through, network send, file append) |\\n| Capacity is naturally expressed in slot count | Capacity is bounded by a byte budget |\\n| Benefit from typed `TryConsume(out T)` API | Benefit from zero-copy `TryPeek(out ReadOnlySpan<byte>)` |\\n\\n---\\n\\n## 5. Observations on Log2's implementation worth adopting upstream\\n\\n1. **HeadCache**: already adopted in the Relay MPSC ring (both typed and byte).\\n2. **Three-counter PaddedLong layout**: already adopted.\\n3. **Slot recycle before head advance**: already adopted (byte ring's `Advance()` zeros header first).\\n4. **No HeadCache on consumer side**: Log2 doesn't cache tail on the consumer (single consumer, no benefit). Byte ring inherits the same stance. Correct.\\n5. **Log2 has `WriteBlocking` (SpinWait)** — the byte ring does not. If AQTrade Fase 2 needs back-pressure blocking, this is a 10-line addition: wrap `TryPublish` in a `SpinWait` loop. Noted as follow-up, not in scope here.\\n\\nObservations where Log2's implementation could adopt from Relay byte (if Log2 ever needed variable-length payloads):\\n- Zero-copy consumer via `TryPeek` + `Advance` would eliminate one `T` copy per dequeue. Only valuable if `sizeof(T)` is large.\\n\\n---\\n\\n## 6. Tests gap (explicit)\\n\\nByte MPSC currently has NO dedicated tests on this branch — deferred per user instruction during the iteration. The typed MPSC has 10 tests (80/80 green) covering the same CAS + HeadCache protocol, so the shared logic is exercised. Byte-specific gaps to fill in a follow-up:\\n- Byte-ring constructor validation.\\n- Wrap-with-padding-marker + consumer skip (single-producer).\\n- Multi-producer stress (4 + 8 threads, variable payload sizes).\\n- `TryPeek` + `Advance` slot-recycle under contention.\\n- Consumer pipe lifecycle + crash exposure + fallback fan-out.\\n\\nThe single-producer SPSC byte ring has equivalent tests (`SpscByteRingBufferTests`) exercising wrap/padding, so the geometry is validated structurally; the MPSC-specific addition is the CAS-retry + multi-producer ordering.\\n\\n---\\n\\n## 7. Why the test-writing cycle was slow this session\\n\\nDuring the MPSC + byte-pipe work today, the test cycle became the dominant per-phase cost. Root causes:\\n\\n- **Sonnet subagent delegation overhead** per test file: 2-4 minutes per delegation, driven by (a) subagent cold-start + file-read loop, (b) multi-pass rewriting to satisfy namespace collisions with existing test helpers, (c) the subagent's own build-verify loop at the end.\\n- **BDN short-job runs** from the previous byte-pipe work: ~10 minutes wall time, dwarfing the test write itself.\\n- **xUnit run is fast** — 80 tests in 481 ms. The runner is not the bottleneck.\\n\\nRemediation options for future sessions:\\n1. Write mechanical tests directly in the main loop when patterns are well-established — avoid delegation overhead for template-heavy code.\\n2. Batch test delegation: one agent writes all related test files in a single invocation rather than one call per file.\\n3. Defer BDN to end-of-plan verification — do not run BDN per phase unless gates are contested.\\n4. Skip per-phase BDN when the static analysis + xUnit gates are sufficient.\\n\\nMemory pointer: `feedback_defer_tests.md` captures the rule \\\"defer tests when they stall progress; diagnose separately.\\\"\", \"/docs/reports/2026-04-23-resource-cost-map-relay.md\": \"# Resource Cost Map — Relay\\n_generated 2026-04-23 · model x64-golden-cove v1 · static estimate, not benchmark · library mode_\\n\\n## 0. Header\\n- scope: Relay .NET 9 library (`src/Relay/**/*.cs`
