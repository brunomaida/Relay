gle_SlowBackend(ItemCount: 1000000)` | 124.59 ms | 886.45 µs | 125.46 ms | 17.00 KB | new |\\n| `Relay.Benchmarks.QueuePipeThroughputBenchmarks.Push_Batch32_SlowBackend(ItemCount: 1000000)` | 125.80 ms | 2.54 ms | 128.30 ms | 17.00 KB | new |\\n| `Relay.Benchmarks.QueuePipeThroughputBenchmarks.MpscPush_Single(ItemCount: 1000000)` | 14.39 ms | 428.13 µs | 14.68 ms | 16.83 KB | new |\\n| `Relay.Benchmarks.QueuePipeThroughputBenchmarks.MpscPush_Single_SlowBackend(ItemCount: 1000000)` | 124.43 ms | 2.53 ms | 126.22 ms | 16.92 KB | new |\\n\\n### Relay.Benchmarks.PropagateBenchmarks — 12:52:53Z  ·  _micro · env c15f4501 · eb15567 · baseline_\\n\\n| benchId | Mean | StdDev | P99 | Alloc B/op | Δ vs prior |\\n|---|---|---|---|---|---|\\n| `Relay.Benchmarks.PropagateBenchmarks.Depth1_Healthy_Default` | 0.25 ns | 0.02 ns | 0.26 ns | 0 | new |\\n| `Relay.Benchmarks.PropagateBenchmarks.Depth1_Healthy_Propagate_NoNext` | 0.28 ns | 0.04 ns | 0.30 ns | 0 | new |\\n| `Relay.Benchmarks.PropagateBenchmarks.Depth2_Propagate_Fork` | 0.85 ns | 0.01 ns | 0.86 ns | 0 | new |\\n| `Relay.Benchmarks.PropagateBenchmarks.Depth2_Fork_Wrapped` | 3.44 ns | 0.01 ns | 3.45 ns | 0 | new |\\n\\n### Relay.Benchmarks.MultiIsHealthyBenchmarks — 12:51:28Z  ·  _micro · env c15f4501 · eb15567 · baseline_\\n\\n| benchId | Mean | StdDev | P99 | Alloc B/op | Δ vs prior |\\n|---|---|---|---|---|---|\\n\\n…(truncated)\", \"/docs/superpowers/plans/2026-06-11-merry-weaving-sprout.md\": \"# Plan: Relay Hot-Path Cost Map + Robustness Audit\\n\\n## Context\\n\\nUser requested evaluation of performance improvements via `/resource-cost-mapping` combined\\nwith the BDN baseline (`bench_history.md`, commit `ddf2f0b`, i7-12700 / .NET 9.0.14).\\nAlso: robustness assessment under high load (memory leaks, failure modes, crash paths).\\n\\nAll source files have been read. Fable advisor review completed. Two FileStreamSink crash paths\\ndiscovered during analysis; those are the primary actionable findings alongside the cost map.\\n\\n## Deliverables\\n\\n1. **`docs/reports/2026-06-10-resource-cost-map-relay.md`** — library-mode cost map per skill\\n   output contract (§0–§8; no §9 Delta — no prior cost-map snapshot exists).\\n2. **`docs/reports/resource-cost-map.json`** — sibling JSON with full node set + schema version\\n   (required by the skill contract for CI gates).\\n3. **Chat summary (PT-BR)** — robustness findings with `file:line` refs, actionable next steps.\\n   NOT a separate document; only the cost map goes to disk per skill contract.\\n\\n## Key Findings (pre-approved by Fable review)\\n\\n### FileStreamSink — two crash paths converting transient disk failure into permanent sink death\\n\\n**Path 1: buffer-full → IndexOutOfRangeException → consumer thread dies**\\n- `FileStreamSink.WriteToBackend` (FileStreamSink.cs:52–63): when `_bufferPos == _writeBuffer.Length`,\\n  calls `FlushBuffer()`. `FlushBuffer` catches `IOException` but does NOT reset `_bufferPos`\\n  (FileStreamSink.cs:99–105). Control returns → `ref _writeBuffer[_bufferPos]` where\\n  `_bufferPos == Length` → `IndexOutOfRangeException` → escapes ConsumeLoop catch →\\n  consumer thread dies permanently.\\n- **TcpSink**: immune (double bounds check: WriteToBackend:73–79 checks again after flush).\\n- **MmfSink**: immune (direct pointer write, no buffer flush path).\\n\\n**Path 2: disposed stream → ObjectDisposedException → consumer thread dies**\\n- `TryRecoverBackend` (FileStreamSink.cs:76–78) disposes `_stream` then calls `OpenStream()`.\\n  If `OpenStream()` throws, `_stream` still references the disposed instance (catch at :82\\n  does not null it out). Next flush deadline: `FlushBackend` (FileStreamSink.cs:65–68) has\\n  no `_healthy` gate → `_stream!.Write(...)` on disposed stream → `ObjectDisposedException`\\n  (not caught by `catch (IOException)` at FlushBuffer:101) → consumer dies.\\n- **TcpSink**: immune (`catch (Exception)` in both FlushBuffer:136–140 and TryRecoverBackend:106–110).\\n\\n### MemorySink — no finalizer, native memory leak\\n\\n`NativeMemory.AllocZeroed` in constructor (MemorySink.cs:40). `NativeMemory.Free` only in\\n`Dispose` (MemorySink.cs:76). No finalizer → leak if `Dispose` not called. Since `MemorySink`\\nis not managed via `SpscQueueSink<T>.Start/Stop` chain, caller must ensure disposal.\\n\\nAlso: `_head`/`_tail` are plain `long` fields (MemorySink.cs:29–30). Remarks at :16–17 claim\\n\\\"volatile reads/writes\\\" — code has no volatile. Safe under SPSC invariant but comment is wrong.\\n\\n### TryDrainToPrev — one-item loss on health flip\\n\\n`SpscQueueSink.TryDrainToPrev` (SpscQueueSink.cs:270–274): `TryConsume(out var item)` pops\\nthe item before `!Prev.IsHealthy` check at :272. On break, that item is dropped. Bounded:\\nmax 1 item per health flip, shutdown-only path. Documented behavior but worth naming precisely.\\n\\n### RotatingFileSink — per-record RDTSC in ShouldRotate\\n\\n`ShouldRotate` (RotatingFileSink.cs:122–127) calls `HfClock.NowTicks` on every record.\\nBDN: `ShouldRotate_Predicate` = 13.38 ns (vs `ShouldRotate_HotPath` = 34.18 ns total).\\nThe RDTSC dominates the predicate cost. Fix: throttle the clock check (e.g., every 256 records\\nvia a counter) since day-boundary precision ≤ 1s. Would drop predicate from ~13 ns to ~0.5 ns.\\nNote: BDN benchmark was added as regression gate for the `DateTime.UtcNow` removal — the fix\\nlanded but left per-record RDTSC, which remains 13 ns.\\n\\n### Multi2Sink CRTP — BDN shows no advantage vs MultiSink\\n\\n`Multi2Sink.Enqueue` BDN = 3.31 ns vs `MultiSink.Enqueue` = 3.18 ns (2-child case).\\nCLAUDE.md documents \\\"~6c saving\\\" — not reproduced in baseline. JIT likely already applies GDV\\ndevirtualization at call site for sealed types. CRTP adds complexity without measured payoff\\nat N=2. Reported as doc-vs-measurement mismatch.\\n\\n### PacketSink._dropCount — Interlocked on unpadded field\\n\\n`PacketSink._dropCount` (PacketSink.cs:41) is a plain `long` with no PaddedLong isolation.\\n`Interlocked.Increment` = ~25c uncontended (BDN measured: 3.77 ns = ~13c total drop path).\\nUnder monitoring from a second thread (reading `DropCount` via `Volatile.Read`), false sharing\\nwith adjacent fields `Next` and `PropagateAfterAccept` on the same 64-byte line. Padding would\\neliminate the bounce but is only observable under concurrent monitoring.\\n\\n### MpscByteRingBuffer — non-inlineable recursion in TryPeek\\n\\nPadding-skip on wrap uses recursion (`TryPeek` calling itself). JIT cannot inline recursive\\nmethods → extra stack frame + call overhead on every wrapped record. Impact: one extra\\nindirect call per wrapped record; at high throughput with large payloads, wrap frequency ≈ 1/N.\\n\\n### MpscRingBuffer.TryConsume — two Volatile.Write per slot\\n\\n`TryConsume` (MpscRingBuffer.cs:137–138): writes `Volatile.Write(ref PublishedAt, 0)` + \\n`Volatile.Write(ref _head.Value, pos + 1)` = 2 mfences per consumed item. Unavoidable for\\nMPSC correctness; `TryConsumeBatch` (MpscRingBuffer.cs:164–165) amortizes to 1 head write\\nfor N items (N-1 savings), but per-slot Published clear is still per-item.\\n\\n## CPU Reference\\n\\nAll ns→cycles conversions use **3.5 GHz** (CLAUDE.md convention). i7-12700 P-core boost = 4.9 GHz;\\ncycles understate by ≤40% on boosted cores. Header will note this.\\n\\n## Cost Map Structure\\n\\nLibrary mode: §0 Header → §1 Per-Entry Cost Table → §2 Top Offenders → §3 Hot Tree → \\n§4 Allocation Map → §5 Anti-Pattern Offenders → §6 Cache-Line Report → §7 Syscalls →\\n§8 Blind Subgraphs. No §9 (no prior snapshot). Target ≤400 lines.\\n\\n## Model Routing\\n\\n| Etapa | Modelo | Justificativa |\\n|---|---|---|\\n| Geração do cost map + chat summary | **Sonnet** | Escrita de report e análise estruturada |\\n| Performance analysis / scope review | **Opus** | Relay CLAUDE.md: Opus para análise de performance |\\n| Adversarial review (Fable) | ✅ Concluído via `advisor()` nesta sessão | Frontier reservado para review final |\\n\\n## Verification\\n\\n- Open `docs/reports/2026-06-10-resource-cost-map-relay.md` and confirm:\\n  - Every row has `file:line`\\n  - §5 lists FileStreamSink IndexOutOfRangeException + ObjectDisposedException paths\\n  - §8 lists `FilterSink._predicate` body and TCP handshake as blind subgraphs\\n  - Tier column uses `declared-hot` not BDN-derived rates (library mode)\\n- Confirm `docs/reports/resource-cost-map.json` exists with `schemaVersion` field.\\n- No existing source files modified.\", \"/docs/superpowers/plans/2026-06-11-merry-weaving-sprout-2.md\": \"# Plan: Relay Robustness + Hot-Path Fixes\\n\\n## Context\\n\\nCost-map audit (2026-06-10, static+BDN) identified 2 crash paths that kill `FileStreamSink`'s\\nconsumer thread under transient disk failure, plus 1 RDTSC per-record overhead in\\n`RotatingFileSink` and 1 non-inlineable recursion in `MpscByteRingBuffer`. Fable unavailable\\nfor hot-path review — assessment based on the generated cost-map and BDN baseline only.\\n\\n**No new abstractions. All changes are surgical.**\\n\\n## Task 1 — FileStreamSink: 2 crash paths (🔴 block)\\n\\n**File:** `src/Relay/Sinks/FileStreamSink.cs`\\n\\n### Crash 1: `_bufferPos` not reset → IndexOutOfRangeException (FileStreamSink.cs:99–105)\\n\\n`FlushBuffer` IOException handler catches and sets `_healthy=false` but does NOT reset\\n`_bufferPos`. Next `WriteToBackend` call executes `ref _writeBuffer[_bufferPos]` where\\n`_bufferPos == _writeBuffer.Length` → `IndexOutOfRangeException` escapes `ConsumeLoop`\\n(SpscQueueSink.cs:251) → consumer thread dies permanently. Ring contents lost.\\n\\n**Fix:** add `_bufferPos = 0;` in the IOException catch block (FileStreamSink.cs:101):\\n\\n```csharp\\ncatch (IOException)\\n{\\n    _bufferPos       = 0; // prevent OOB on next WriteToBackend\\n    _healthy         = false;\\n    _retryAfterTicks = HfClock.NowTicks + (long)_retryDelayMs * TicksPerMs;\\n}\\n```\\n\\n### Crash 2: disposed `_stream` not nulled → ObjectDisposedException (FileStreamSink.cs:76–87)\\n\\n`TryRecoverBackend`: `_stream?.Dispose()` at :76, then `OpenStream()` at :77 throws → catch at :82\\ndoes NOT null `_stream`. `FlushBackend` at :65 (no `_healthy` gate) calls `FlushBuffer` if\\n`_bufferPos > 0`, which calls `_stream!.Write(…)` on the disposed stream → `ObjectDisposedException`\\n(inherits `InvalidOperationException`, NOT `IOException`) escapes `catch (IOException)` in\\n`FlushBuffer` → escapes consumer → consumer thread dies permanently.\\n\\n**Fix (2 changes):**\\n\\n1. Null `_stream` in the recovery catch (FileStreamSink.cs:82):\\n\\n```csharp\\ncatch (Exception)\\n{\\n    _stream          = null; // drop disposed reference — FlushBuffer null-guards below\\n    _retryDelayMs    = Math.Min(_retryDelayMs * 2, RetryMaxDelayMs);\\n    _retryAfterTicks = HfClock.NowTicks + (long)_retryDelayMs * TicksPerMs;\\n}\\n```\\n\\n2. Add null guard at top of `FlushBuffer` (FileStreamSink.cs:94). Without this, nulling `_stream`\\n   merely swaps `ObjectDisposedException` for `NullReferenceException` — consumer still dies.\\n   Also incorporates the Crash 1 `_bufferPos = 0` fix, so both crashes share one corrected method:\\n\\n```csharp\\nprivate void FlushBuffer()\\n{\\n    if (_stream is null) { _bufferPos = 0; return; }\\n    try\\n    {\\n        _stream.Write(_writeBuffer.AsSpan(0, _bufferPos));\\n        _bufferPos = 0;\\n    }\\n    catch (IOException)\\n    {\\n        _bufferPos       = 0; // Crash 1: prevent OOB on next WriteToBackend\\n        _healthy         = false;\\n        _retryAfterTicks = HfClock.NowTicks + (long)_retryDelayMs * TicksPerMs;\\n    }\\n}\\n```\\n\\n**Note:** `_stream!.Write` in `WriteToBackend` also calls `FlushBuffer` when buffer is full.\\nThe null guard handles both call sites (WriteToBackend and FlushBackend). Consistent with\\n`TcpSink.FlushBuffer` pattern: `if (_socket is null) { MarkUnhealthy(); return; }`.\\n\\n**Immunity check (do not touch):** TcpSink uses `catch (Exception)` in FlushBuffer (:136)\\nand TryRecoverBackend (:106) — already immune. MmfSink has no FlushBuffer — already immune.\\n\\n**Commit:** `fix(FileStreamSink): prevent consumer crash on sustained backend failure`\\n\\n**Test:** add test that simulates IOException loop until buffer fills; assert `IsConsuming`\\nremains true after recovery. Existing gate: `dotnet test --filter \\\"Category!=Endurance&...\\\"`.\\n\\n---\\n\\n## Task 2 — Hot-path improvements\\n\\n### 2a: RotatingFileSink.ShouldRotate — RDTSC throttle (🟡 47c → ~1c)\\n\\n**File:** `src/Relay/Sinks/RotatingFileSink.cs:122–127`\\n\\n`ShouldRotate` calls `HfClock.NowTicks` (RDTSC+LFENCE, ~47c effective on i7-12700) on\\n**every record**. BDN: ShouldRotate_Predicate = 13.38 ns; WriteToBackend = 34.18 ns.\\nDay-boundary check needs ≤1s precision — no need for per-record RDTSC.\\n\\n**Fix:** add `_shouldRotateCounter` (plain `int` field, consumer-thread-only):\\n\\n```csharp\\nprivate int _shouldRotateCounter;\\n\\nprivate bool ShouldRotate(int incomingBytes)\\n{\\n    if (_currentFileBytes + incomingBytes > _maxBytes) return true;\\n    if ((++_shouldRotateCounter & 0xFF) == 0)  // every 256 records\\n        if (HfClock.NowTicks >= _nextDayBoundaryTicks) return true;\\n    return false;\\n}\\n```\\n\\nExpected: predicate from ~13 ns → ~0.5 ns. Update `BenchInvokeShouldRotate` benchmark\\ncomment to reflect the new expected range. Run `RotatingFileSinkBenchmarks` after to confirm.\\n\\n### 2b: MpscByteRingBuffer.TryPeek — eliminate recursion (🟡 JIT inlineability)\\n\\n**File:** `src/Relay/Buffers/MpscByteRingBuffer.cs:193`\\n\\n`TryPeek` self-recurses when skipping a padding marker (line 193:\\n`return TryPeek(out payload, out advanceBytes);`). JIT cannot inline recursive methods →\\nextra stack frame + call cost on every wrapped record. At high throughput with large payloads,\\nevery record that straddles the ring boundary pays this overhead.\\n\\n**Fix:** replace the recursive tail call with an iterative jump — re-read the new head slot\\ninline without self-calling. The logic is a simple retry after advancing past the padding:\\n\\n```csharp\\n// Instead of: return TryPeek(out payload, out advanceBytes);\\n// Use: idx = (idx + skip) & _mask; lenField = Volatile.Read(ref header at idx); continue/goto\\n```\\n\\nExact implementation: convert the method body into a `while(true)` loop and `continue` instead\\nof the recursive call. No semantic change — only control flow restructuring.\\n\\n**Commit:** `perf: throttle RDTSC in RotatingFileSink.ShouldRotate; eliminate TryPeek recursion`\\n\\n---\\n\\n## Task 3 — Documentation fixes (🟡 correctness)\\n\\n### 3a: MemorySink volatile comment (MemorySink.cs:16)\\n\\nRemarks: \\\"No CAS — volatile reads/writes on head and tail suffice for the SPSC invariant.\\\"\\nCode: `private long _head; private long _tail;` — plain `long`, zero volatile.\\nSafe under x86/x64 TSO with single producer, but the claim is factually wrong.\\n\\n**Fix:** update remark to: \\\"No CAS — plain reads/writes on `_head` and `_tail` suffice under\\nx86/x64 TSO (single producer). `DrainTo` callers must establish happens-before externally\\n(e.g., via `Volatile.Read` of the primary's `_healthy` flag) before the first `DrainTo` call.\\\"\\n\\n### 3b: CLAUDE.md Multi2Sink cycle-saving claim (CLAUDE.md)\\n\\nCurrent: \\\"~6c saving\\\" vs MultiSink for 2-child case.\\nBDN (commit ddf2f0b, N=2): Multi2 = 3.31 ns vs Multi = 3.18 ns — Multi2 is **0.45c slower**.\\nJIT GDV already devirtualizes sealed types; CRTP adds no measured benefit at N=2.\\n\\n**Fix:** update CLAUDE.md to: \\\"JIT GDV devirtualizes sealed types at call site; BDN (N=2):\\nMulti2=3.31 ns vs Multi=3.18 ns — no measured advantage. Prefer `Multi2Sink` when compile-time\\ntype binding is explicitly required; do not use for expected performance gains at N=2.\\\"\\n\\n**Commit:** `docs: fix MemorySink volatile comment; correct Multi2Sink BDN finding in CLAUDE.md`\\n\\n---\\n\\n## Task 4 — Optional hardening (🟢)\\n\\n### 4a: MemorySink finalizer\\n\\nAdd `~MemorySink()` that calls `NativeMemory.Free(_buffer)` behind a `_disposed` guard.\\nPrevents native memory leak when caller omits `using`/`Dispose`.\\n\\n### 4b: PacketSink._dropCount padding\\n\\n`PacketSink._dropCount` (plain `long` at :41) shares cache line with `Next` and\\n`PropagateAfterAccept`. Concurrent `DropCount` monitoring from a second thread causes false\\nsharing (~200c± contended). `PaddedLong` is currently in `Relay.Buffers` (internal).\\n\\n**Option chosen:** inline a local `[StructLayout(LayoutKind.Explicit, Size = 128)]` struct\\nin `PacketSink` — avoids moving `PaddedLong` to a shared namespace for one consumer.\\n\\n**Commit:** `chore: add MemorySink finalizer; pad PacketSink._dropCount to prevent false sharing`\\n\\n---\\n\\n## Verification\\n\\n- `dotnet test Relay.sln -c Release --filter \\\"Category!=Endurance&Category!=Stress&Category!=Perf\\\"` → 0 failures after each task\\n- Task 1: new test simulates IOException loop until `_writeBuffer` fills; assert consumer survives and recovers\\n- Task 2a: run `RotatingFileSinkBenchmarks.ShouldRotate_Predicate` — expect < 2 ns (from 13.38 ns)\\n- Task 2b: run MpscByteRingBuffer wrap-path tests; assert behavior unchanged\\n- Task 3: doc review only — no executable verification\\n\\n## Model Routing\\n\\n| Task | Model | Reason |\\n|---|---|---|\\n| Task 1 (crash fix) | **Sonnet** | Surgical 2-line patch, well-bounded |\\n| Task 2a (RDTSC throttle) | **Sonnet** | Mechanical counter addition |\\n| Task 2b (TryPeek iterative) | **Sonnet** | Control-flow rewrite; lock-free — Opus reviews diff |\\n| Task 3 (docs) | **Fable** | Memory-model semantics (TSO happens-before) + BDN interpretation require Fable validation |\\n| Task 4 (hardening) | **Sonnet** | Mechanical, well-understood patterns |\\n| Final diff review | **Opus** | Performance analysis scope (Relay CLAUDE.md) |\\n\\n> [!DECISION] gh-issue-gate\\n> Relay has no issue tracker (CLAUDE.md git workflow: \\\"no `<ref>` segment — lib has no issue\\n> tracker\\\"). Gate is waived. Branch: `fix/260611-robustness-perf-fixes`.\", \"/docs/reports/2026-06-10-resource-cost-map-relay.md\": \"# Resource Cost Map — Relay\\n_generated 2026-06-10 · model x64-goldenCove v1 · static+BDN hybrid · BDN baseline commit ddf2f0b (i7-12700, .NET 9.0.14, 12 cores, GC=Server, BDN 0.13.12)_\\n_Cycles at 3.5 GHz (CLAUDE.md ref). i7-12700 P-core boost ≈4.9 GHz; cycles understate by ≤40% on boosted cores._\\n\\n## 0. Header\\n- scope: `src/Relay/**/*.cs` (tier: ultra-low-latency; all files hot-path by declaration)\\n- mode: library — no `Main`; all public API is entry\\n- entry points: 14 (calls/s: `declared-hot` — derived from tier declaration; no hints file)\\n- nodes analyzed: ~65\\n- blind subgraphs: see §8\\n- budget: library mode — no weight/s; relative ranking by cycles/call\\n\\n## 1. Per-Entry Cost Table\\n(library mode — calls/s = declared-hot; tier from project declaration)\\n\\n| # | Entry | cycles/call | bytes/call | Drivers | file:line |\\n|---|---|---|---|---|---|\\n| 1 | `DispatchSink<T>.Enqueue` (healthy, depth=1) | 1c† | 0 | JIT inlines all for sealed types; IsHealthy (1c) + Accept (3c) collapses to ~1c | DispatchSink.cs:49 |\\n| 2 | `SpscRingBuffer<T>.TryPublish` (HeadCache hit) | 3c | 0 | L1 load cachedHead (4c) + store slot (1c) + Volatile.Write tail (1c); mfence amortized | SpscRingBuffer.cs:48 |\\n| 3 | `MpscRingBuffer<T>.TryPublish` (no contention) | 22c | 0 | Volatile.Read claimedTail (1c) + CAS (25c uncontended) + Volatile.Write Published (1c) | MpscRingBuffer.cs:93 |\\n| 4 | `MpscRingBuffer<T>.TryConsume` | 12c | 0 | Volatile.Read Published (1c) + InitBlockUnaligned T=64B (4c) + 2×Volatile.Write (2c) | MpscRingBuffer.cs:125 |\\n| 5 | `FilterSink<T>.Accept` (pass) | 4c | 0 | Predicate<T> delegate invoke (8c model; BDN total 3.8c — devirt likely) | FilterSink.cs:Accept |\\n| 6 | `MultiSink<T>.Accept` (N=2 children) | 11c | 0 | 2× virtual Enqueue (7c each); BDN 3.18 ns | MultiSink.cs:Accept |\\n| 7 | `Multi2Sink<T,TC1,TC2>.Accept` (N=2, sealed) | 12c | 0 | 2× devirt direct Enqueue (3c each); BDN 3.31 ns — **0.45c slower** than MultiSink in baseline; JIT GDV already devirtualizes sealed types at call site | MultiSink.cs:Multi2Sink.Accept |\\n| 8 | `PacketSink.Enqueue` (drop, Next=null, unhealthy) | 13c | 0 | Interlocked.Increment _dropCount (25c) on unpadded field; BDN 3.77 ns | PacketSink.cs:66 |\\n| 9 | `SpscQueueSink.ConsumeLoop` batch drain (per item) | 3c/item | 0 | TryConsumeBatch: 1 Volatile.Read(tail) + 1 Volatile.Write(head) per batch of 256 | SpscQueueSink.cs:196 |\\n| 10 | `RotatingFileSink.ShouldRotate` | 47c | 0 | HfClock.NowTicks (RDTSC) per record; BDN 13.38 ns; size check (1c) dwarfed | RotatingFileSink.cs:122 |\\n| 11 | `RotatingFileSink.WriteToBackend` (no rotation) | 120c | 0 | ShouldRotate (47c) + payload copy 64B (4c) + bookkeeping; BDN 34.18 ns | RotatingFileSink.cs:72 |\\n| 12 | `MemorySink<T>.Accept` (ring not full) | 8c | 0 | 2× plain long read (4c each) + store + increment (plain, no Volatile) | MemorySink.cs:47 |\\n| 13 | `HfClock.NowTicks` | 20c† | 0 | Stopwatch.GetTimestamp() = RDTSC+LFENCE; BDN evidence ~47c effective on i7-12700 | HfClock.cs:NowTicks |\\n| 14 | `MpscByteRingBuffer.TryPublish` (no wrap) | 30c | 0 | CAS (25c) + payload copy + Volatile.Write header | MpscByteRingBuffer.cs:TryPublish |\\n| 15 | `MpscByteRingBuffer.TryPublish` (wrap) | 40c | 0 | +padding Volatile.Write at original pos; wrap adds ~10c | MpscByteRingBuffer.cs:TryPublish |\\n\\n† JIT-dependent; worst-case higher.\\n\\n## 2. Top 20 Offenders (by cycles/call)\\n\\n| # | cycles/call | BDN ns | symbol | file:line | note |\\n|---|---|---|---|---|---|\\n| 1 | 120c | 34.18 | `RotatingFileSink.WriteToBackend` | RotatingFileSink.cs:72 | ShouldRotate RDTSC dominates |\\n| 2 | 47c | 13.38 | `RotatingFileSink.ShouldRotate` | RotatingFileSink.cs:122 | RDTSC per record; see §5 |\\n| 3 | 40c | — | `MpscByteRingBuffer.TryPublish` (wrap) | MpscByteRingBuffer.cs:TryPublish | 2× Volatile.Write; recursion in TryPeek |\\n| 4 | 30c | — | `MpscByteRingBuffer.TryPublish` (no wrap) | MpscByteRingBuffer.cs:TryPublish | CAS dominant |\\n| 5 | 22c | 6.35 | `MpscRingBuffer<T>.TryPublish` | MpscRingBuffer.cs:93 | CAS 25c uncontended; 7× SPSC |\\n| 6 | 21c | 6.09 | `PacketSink.Enqueue` byte depth=2 | PacketSink.cs:66 | MPSC byte ring overhead |\\n| 7 | 13c | 3.77 | `PacketSink.Enqueue` (drop path) | PacketSink.cs:81 | Interlocked on unpadded field |\\n| 8 | 12c | — | `MpscRingBuffer<T>.TryConsume` | MpscRingBuffer.cs:125 | 2× Volatile.Write per slot |\\n| 9 | 12c | 3.31 | `Multi2Sink<T,TC1,TC2>.Accept` (N=2) | MultiSink.cs:Multi2Sink.Accept | CRTP 0.45c slower than MultiSink in baseline; JIT GDV likely explains parity |\\n| 10 | 11c | 3.18 | `MultiSink<T>.Accept` (N=2) | MultiSink.cs:Accept | virtual Enqueue per child |\\n| 11 | 4c | 1.08 | `FilterSink<T>.Accept` (pass) | FilterSink.cs:Accept | delegate invoke; BDN beats model |\\n| 12 | 3c | 0.95 | `SpscRingBuffer<T>.TryPublish` | SpscRingBuffer.cs:48 | HeadCache hit fast path |\\n| 13 | 3c | 0.86 | `SpscRingBuffer<T>.RoundTrip` | SpscRingBuffer.cs:48 | publish+consume same thread |\\n| 14 | 1c | 0.20 | `DispatchSink<T>.Enqueue` (healthy, depth=1) | DispatchSink.cs:49 | JIT inlines all for sealed types |\\n\\n## 3. Hot Tree (by thread)\\n\\n```\\nProducer path (tick-rate call)\\nDispatchSink<T>.Enqueue                    DispatchSink.cs:49\\n├─ IsHealthy (volatile bool read)          SpscQueueSink.cs:67      1c   declared-hot  0  HOT\\n├─ SpscQueueSink<T>.Accept                 SpscQueueSink.cs:130     0c   declared-hot  0  HOT (inlined)\\n│  └─ SpscRingBuffer<T>.TryPublish         SpscRingBuffer.cs:48     3c   declared-hot  0  HOT\\n│     ├─ _cachedHead check (L1 hit)        SpscRingBuffer.cs        4c   declared-hot  0  HOT\\n│     ├─ _basePtr[tail & mask] = item      SpscRingBuffer.cs        1c   declared-hot  0  HOT\\n│     └─ Volatile.Write(_tail.Value)       SpscRingBuffer.cs        1c   declared-hot  0  HOT\\n└─ Next?.Enqueue (fallback only)           DispatchSink.cs:53       7c   fallback      0  HOT\\n\\nMpscQueueSink<T>.Accept → TryPublish       MpscRingBuffer.cs:93\\n├─ Volatile.Read _claimedTail              MpscRingBuffer.cs:97     1c   declared-hot  0  HOT\\n├─ _headCache check                        MpscRingBuffer.cs:99     1c   declared-hot  0  HOT\\n├─ Interlocked.CAS _claimedTail            MpscRingBuffer.cs:110   25c   declared-hot  0  HOT ±\\n├─ ValueAt(claimed) = item                 MpscRingBuffer.cs:112    1c   declared-hot  0  HOT\\n└─ Volatile.Write PublishedAt              MpscRingBuffer.cs:113    1c   declared-hot  0  HOT\\n\\nConsumer thread · SpscQueueSink.ConsumeLoop SpscQueueSink.cs:183\\n├─ TryConsumeBatch (batch=256)             SpscQueueSink.cs:196     3c/item  N/batch  0  HOT\\n│  └─ WriteToBackend(in _consumeBuf[i])    SpscQueueSink.cs:202     varies   N/batch  0  HOT\\n├─ Idle spin: Thread.SpinWait(20)          SpscQueueSink.cs:209     inf      idle     0  IDLE\\n├─ Idle yield: Thread.Yield()              SpscQueueSink.cs:216     inf      idle     0  IDLE\\n├─ Idle sleep: Thread.Sleep(1ms)           SpscQueueSink.cs:222     inf      idle     0  IDLE\\n├─ FlushBackend (on deadline/signal)       SpscQueueSink.cs:241     5e3c     1/flush  0  WARM\\n└─ TryRecoverBackend (on deadline)         SpscQueueSink.cs:244     varies   1/flush  0  WARM\\n\\nConsumer thread · RotatingFileSink.WriteToBackend  RotatingFileSink.cs:72\\n├─ ShouldRotate(payload.Length)            RotatingFileSink.cs:76   47c  declared-hot  0  HOT ⚠\\n│  ├─ size compare (plain long)            RotatingFileSink.cs:124   1c  declared-hot  0  HOT\\n│  └─ HfClock.NowTicks (RDTSC)            RotatingFileSink.cs:125  47c  declared-hot  0  HOT ⚠\\n├─ payload.CopyTo(_writeBuffer)            RotatingFileSink.cs:101   4c  declared-hot  0  HOT\\n└─ _currentFileBytes += payload.Length     RotatingFileSink.cs:103   1c  declared-hot  0  HOT\\n```\\n\\n## 4. Allocation Map (top entries by bytes/s)\\n\\n| # | bytes/call | symbol | file:line | kind |\\n|---|---|---|---|---|\\n| 1 | 0 | All hot-path entries | DispatchSink.cs:49 | All zero-alloc; GC.AllocateArray(pinned:true) in ctors only |\\n\\nCOLD paths only (not hot):\\n- `RotatingFileSink.TryOpenStream`: `string.Format(...)` — string alloc on rotation\\n- `RotatingFileSink.Cleanup`: LINQ `.ToArray()` — array alloc on file pruning\\n\\n## 5. Anti-Pattern Offenders (declared-hot path violations)\\n\\n| Severity | Rule | symbol | file:line | evidence |\\n|---|---|---|---|---|\\n| block | crash: no reset on IOException | `FileStreamSink.FlushBuffer` | FileStreamSink.cs:99 | `_bufferPos` not reset on IOException; next WriteToBackend: `ref _writeBuffer[_bufferPos]` at :57 where `_bufferPos==Length` → IndexOutOfRangeException → consumer dies |\\n| block | crash: disposed-stream reuse | `FileStreamSink.TryRecoverBackend` | FileStreamSink.cs:76 | `_stream?.Dispose()` at :76; OpenStream() throw caught at :82 without nulling `_stream`; FlushBackend (no _healthy gate at :65) calls `_stream!.Write` → ObjectDisposedException not caught by IOException handler → consumer dies |\\n| warn | RDTSC per declared-hot record | `RotatingFileSink.ShouldRotate` | RotatingFileSink.cs:125 | HfClock.NowTicks on every record; BDN 13.38 ns; fix: throttle every 256 records (counter) |\\n| warn | Interlocked on unpadded field | `PacketSink._dropCount` | PacketSink.cs:41 | plain `long` shares cache line with `Next` and `PropagateAfterAccept`; concurrent DropCount monitoring causes false sharing; 25c uncontended, 200c± contended |\\n| warn | recursive non-inlineable | `MpscByteRingBuffer.TryPeek` | MpscByteRingBuffer.cs:TryPeek | recursive padding-skip; JIT cannot inline recursive methods → extra stack frame on wrapped records |\\n| warn | doc/code mismatch: volatile claim | `MemorySink<T>` remarks | MemorySink.cs:16 | remarks claim \\\"volatile reads/writes on head and tail\\\"; code uses plain `long _head/_tail` at :29–30; safe under SPSC invariant but comment incorrect |\\n| warn | doc/measurement mismatch: CRTP | `Multi2Sink<T,TC1,TC2>` | MultiSink.cs:Multi2Sink | CLAUDE.md documents ~6c saving vs MultiSink; BDN: Multi2=3.31 ns vs Multi=3.18 ns at N=2 — Multi2 is 0.45c **slower** in baseline; JIT GDV likely devirtualizes sealed types at call site; ~6c saving claim not reproduced |\\n| warn | no finalizer, native leak | `MemorySink<T>` | MemorySink.cs:72 | NativeMemory.AllocZeroed at :40; Free only in Dispose at :76; no finalizer → leak if caller omits using/Dispose |\\n| info | DateTime.UtcNow injected default | `RotatingFileSink._utcNow` | RotatingFileSink.cs:67 | default lambda `() => DateTime.UtcNow` violates CLAUDE.md; acceptable only if rotation path is COLD; production callers should inject HfClock-based clock |\\n\\n## 6. Cache-Line Report\\n\\n| symbol | sizeof / issue | file:line |\\n|---|---|---|\\n| `PacketSink._dropCount` | plain `long` shares cache line with `Next` (ref) and `PropagateAfterAccept` (bool); concurrent Volatile.Read of DropCount from monitoring thread bounces the line | PacketSink.cs:41 |\\n| `MemorySink<T>._head/_tail` | plain `long` without PaddedLong; safe under single-producer-only invariant; comment at :16 claims isolation it does not provide | MemorySink.cs:29 |\\n\\n## 7. Syscalls & Kernel Boundaries\\n\\n| symbol | file:line | kind | cycles |\\n|---|---|---|---|\\n| `FileStreamSink.FlushBuffer` | FileStreamSink.cs:98 | file I/O write | 5e3c |\\n| `TcpSink.FlushBuffer` | TcpSink.cs:131 | socket send | 2e3c |\\n| `MmfSink.FlushBackend` | MmfSink.cs:83 | FlushViewOfFile | 5e3c |\\n| `RotatingFileSink.FlushToStream` | RotatingFileSink.cs:149 | file I/O write + flush | 5e3c |\\n| `RotatingFileSink.Cleanup` | RotatingFileSink.cs:198 | Directory.GetFiles + File.Delete (COLD rotation) | varies |\\n| `SpscQueueSink.Start` | SpscQueueSink.cs:104 | Thread.Start (COLD setup) | — |\\n| `RelayMemory.PreFaultAndLock` | SpscQueueSink.cs:108 | VirtualLock P/Invoke (COLD setup) | — |\\n\\n## 8. Blind Subgraphs\\n\\n| symbol | file:line | reason |\\n|---|---|---|\\n| `FilterSink<T>._predicate` body | FilterSink.cs:Accept | caller-supplied `Predicate<T>` delegate; body unknown; cost ranges from 1c (field compare) to 500c+ (reflection) |\\n| `TcpSink.TryConnect` OS handshake | TcpSink.cs:184 | TCP SYN/ACK at kernel level; cost = OS scheduler + network RTT; not analyzable from source |\\n| `MpscByteRingBuffer` (full) | MpscByteRingBuffer.cs:TryPublish | file not in scope of this read-pass; costs estimated from MPSC typed ring analogy; wrap path TryPeek recursion confirmed from summary |\\n| `SpscByteRingBuffer` (full) | SpscByteRingBuffer.cs:TryPublish | same; padding skip uses non-recursive Unsafe.WriteUnaligned (safer than MPSC variant) |\\n| `RotatingFileSink._utcNow` body | RotatingFileSink.cs:67 | injected delegate; default `DateTime.UtcNow`; not RDTSC-based; acceptable only on COLD rotation path |\", \"/docs/bench-methodology.md\": \"# Relay — Benchmark Methodology\\n\\n> Per-project methodology consumed by the `bench-report` skill. Prose is for humans; the machine\\n> block below drives verdict thresholds and the regression gate. Relay is **ultra-low-latency,\\n> zero-alloc** — ring-buffer, MPSC, and packet-sink hot paths measured at ns scale.\\n\\n## Setup\\n| Parameter | Value |\\n|-----------|-------|\\n| Tool | BenchmarkDotNet (see `Relay.Benchmarks.csproj`) |\\n| Runtime | net9.0, Release |\\n| Diagnosers | `[MemoryDiagnoser]` on every benchmark (zero-alloc invariant) |\\n\\n## Suites (all `micro`, ns scale, no external comparison)\\nByteRingBuffer · ByteEnqueue · Enqueue · MultiEnqueue · MPSC · MpscByte · MpscByteContention ·\\nMpscContention · MpscSlotLayout · RingBuffer · FilterSink · PropagateBench · QueuePipeThroughput ·\\nPacketSinks (Chain · File · Filter · MpscPacket · MultiPacket · QueueSink · TcpSink) ·\\nSinks (Batch · Mmf · NamedPipe · RamPacket · RotatingFile · SharedMemory · Unix · Udp) ·\\nReceivers (SharedMemorySpsc · Udp) · Baselines (TypedSinkBaseline) · Internal (QueueSinkLatency).\\nAll are the project's own code → all gated.\\n\\n## How to Run\\n```powershell\\ndotnet run -c Release --project benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -- --filter \\\"*\\\"\\n# then archive:\\npython ~/.claude/hooks/bench-history-cli.py ingest --repo . --tag micro --gc Server\\n```\\n\\n## Noise Floor\\n**TODO — calibrate.** Run the suite 3× on the target machine and record the run-to-run variance (ns).\\nSet `noiseFloorNs` (machine block) to the observed indistinguishable band so sub-floor deltas are\\ntreated as noise. Until calibrated it stays `10` (typical ultra-low-latency floor — tighten after\\ncalibration).\\n\\n## Decision rules\\nA delta is a regression when it is beyond `noiseSigma`·σ AND exceeds `regressionPct` (and, once set,\\nbeyond `noiseFloorNs`). Any new allocation where a bench was 0-alloc is a hard regression.\\n\\n## Interpreting Results\\nFocus on **Mean** and **Allocated**. `[Benchmark(Baseline = true)]` sets the in-suite Ratio reference.\\n\\n## Pre-regression Gate\\n`bench-report gate` fails CI when a gated bench regresses beyond `gateMaxRegression` (statistically\\nsignificant changes only). The thresholds below are **conservative starting values** — tighten after\\ncalibration.\\n\\n## Machine knobs\\n\\nThe block below is parsed by the `bench-report` tooling. Edit the values; keep the sentinel comments\\nand the ```json fence intact.\\n\\n<!-- bench-methodology:begin -->\\n```json\\n{\\n  \\\"schemaVersion\\\": 1,\\n  \\\"version\\\": 1,\\n  \\\"defaults\\\": { \\\"regressionPct\\\": 0.05, \\\"noiseSigma\\\": 2.0, \\\"noiseFloorNs\\\": 10, \\\"gateMaxRegression\\\": 0.05, \\\"gated\\\": true },\\n  \\\"perTag\\\": {\\n    \\\"micro\\\": { \\\"run\\\": \\\"dotnet run -c Release --project benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -- --filter \\\\\\\"*\\\\\\\"\\\" }\\n  }\\n}\\n```\\n<!-- bench-methodology:end -->\\n\\n<!-- doc-links:auto -->\\n## Related\\n\\n- [Bench history](reports/bench-history/bench-history.md)\", \"/changelog.d/archived/1.0.3/feature-260525-4-relay-receivers.md\": \"### Summary\\n- `PacketCallback<TState>` delegate — zero-alloc span-compatible callback; sidesteps `Action<ReadOnlySpan<byte>>` C# restriction; static-lambda dispatch eliminates closure allocation\\n- `PacketReceiver` abstract base — passive receiver hierarchy (caller's loop drives via `Poll()`); optional `Next: PacketSink?` forward-chain\\n- `UdpReceiver<TState>` (hot path) — non-blocking `Poll()` via `Socket.Poll(0, SelectRead)`; `stackalloc byte[1432]` per call (MTU-safe, cache-hot, zero GC, matches fTL DispatchReceiver); configurable kernel RX buffer (default 1 MB)\\n- `TcpReceiver<TState>` (management-plane) — blocking `Accept()` + non-blocking `Poll()`; POH-pinned buffer pre-touched per fTL TcpGateway (eliminates soft page faults); wire format `[4B BE length][payload]` matching Relay TcpSink/NamedPipeSink; configurable kernel RX buffer\\n- `RelayBuilder.From<TState>()` and `RelayBuilder.FromTcp<TState>()` factory methods\\n- 8 new tests (5 unit, 3 integration on real loopback) — 221 unit + 3 integration passing\\n\\n### Perf\\nestimated — `UdpReceiver.Poll` uses `stackalloc byte[1432]` per call: MTU-safe (1432 B < 1472 B Ethernet MTU), cache-hot (stack frame is L1-resident during callback), zero GC, matches fTL DispatchReceiver pattern; `TcpReceiver` buffer pre-touched in ctor: eliminates OS soft page faults on first receive (fTL TcpGateway validated pattern); kernel RX buffer configurable to avoid burst drops; `PacketCallback<TState>` with static lambda = zero closure allocation per frame\", \"/changelog.d/archived/1.0.3/fix-260526-receiver-desync-stall.md\": \"### Summary\\n- `TcpReceiver<TState>.Poll` / `NamedPipeReceiver<TState>.Poll`: on invalid frame length (≤0 or > buffer), tear down the underlying stream/pipe and throw `InvalidDataException` instead of silently leaving the wire mid-frame. Subsequent `Poll()` returns `false`; the caller restarts the session.\\n- `SharedMemorySpscReceiver<TState>` ctor: validate `SHM_MAGIC` (`0x4C473200`) at header offset 0; throw `InvalidDataException` on mismatch instead of accepting a foreign/uninitialised MMF.\\n- `SharedMemorySpscReceiver<TState>.Poll`: throw `InvalidDataException` on invalid frame length instead of returning `false` without advancing `_readIndex` — the latter caused an infinite re-read stall.\\n- `TcpReceiver<TState>` XML doc: removed misleading \\\"non-blocking poll\\\" wording; documents non-blocking at frame boundaries + possible mid-frame block on TCP segmentation (matches `NamedPipeReceiver` management-plane wording). No behavioural change.\\n- `NamedPipeReceiver<TState>`: removed POH-pinned 4-byte `_header` field; `Poll` uses `Span<byte> header = stackalloc byte[4]` instead, mirroring `TcpReceiver`. One less per-instance pinned object.\\n\\n### Audit\\nFindings F0, F0b, F1, F3 from `docs/reports/2026-05-26-hot-path-audit-receivers.md` (hot-path-audit, post v1.0.2). F0/F0b classified `HIGH — correctness`; F1 `HIGH — doc`; F3 `MEDIUM — alloc`. Regression tests in `tests/Relay.Tests/Receivers/ReceiverDesyncStallTests.cs` cover negative-length, oversized-length, and wrong-magic cases for all three receivers.\\n\\n### Perf\\nHot path unchanged on the happy path — added branches are predicted-not-taken and outside the inlined fast path. BDN baseline (`benchmarks/Relay.Benchmarks/Receivers/`) preserved: `SharedMemorySpscReceiver.Poll_Empty` ~0.66 ns, `Roundtrip_PerFrame` 20.7 ns @ 64 B / 38.4 ns @ 1 KiB / 0 B allocations.\", \"/docs/superpowers/plans/2026-05-28-improve-readme-md-with-ascii-fancy-bird.md\": \"# Plan: Add Pipeline Topology Diagrams to README.md\\n\\n## Context\\n\\nREADME.md has one generic ASCII diagram (lines 39–53) showing a linear fallback chain. It\\ndoes not show the combinator patterns (Multi, Fork, Filter) or the Receiver input layer\\nthat feed packets into sink chains. The goal is a `## Pipeline Topologies` section with 14\\nflow diagrams organized in four groups:\\n\\n- **Simple** — serial fallback chains (3 patterns)  \\n- **Intermediate** — broadcast, fork, filter combinators (4 patterns)  \\n- **Complex** — composed combinations (4 patterns)  \\n- **Input layer — Receivers** — how `PacketReceiver` subclasses feed into sink chains (3 patterns)\\n\\nEach diagram: runtime flow first (unicode box-drawing), builder/factory snippet below.\\nServes both newcomers evaluating adoption and integrators looking for a composition reference.\\n\\n---\\n\\n## Insertion Point\\n\\n**Insert between line 61 (`---`) and line 63 (`## Project Structure`).**\\n\\nNew section header: `## Pipeline Topologies`  \\nRough line growth: ~260–290 lines (429 → ~700).\\n\\n---\\n\\n## Diagram Conventions\\n\\n| Symbol | Meaning |\\n|---|---|\\n| `┌──┐` / `│  │` / `└──┘` | Sink or receiver node |\\n| `────▶` | Data flow (healthy / success path) |\\n| `fail` + `────▶` | Fallback path (IsHealthy=false or Accept=false) |\\n| `▼` | Propagation to Next (ForkSink PropagateAfterAccept) |\\n| `├────▶` / `└────▶` | MultiSink broadcast branches |\\n| `├──▶` cb / `└──▶` Next | Receiver: callback path + forward-to-sink path |\\n| `(drop)` | Terminal — no Next wired |\\n| `(silent drop)` | FilterSink predicate miss |\\n\\n---\\n\\n## Section Content — All 14 Diagrams\\n\\nInsert the following block between the `---` at line 61 and `## Project Structure` at line 63:\\n\\n````markdown\\n## Pipeline Topologies\\n\\nThe `Enqueue` / `Poll` hot paths short-circuit on health and fall through to `Next`\\nautomatically — no producer involvement required.\\n\\n---\\n\\n### Simple\\n\\n#### 1. Single sink\\n\\n```\\n  Producer\\n     │\\n     ▼\\n  ┌──────────────────┐\\n  │  FileStreamSink  │\\n  └──────────────────┘\\n    (no Next — silent drop on failure)\\n```\\n\\n```csharp\\nvar head = RelayBuilder\\n    .StartSpsc<Tick, FileStreamSink<Tick>>(fileSink)\\n    .Build();\\n```\\n\\n---\\n\\n#### 2. Serial fallback — depth 2\\n\\nItems delivered to the first healthy sink. On failure, fall through to the next.\\n\\n```\\n  Producer\\n     │\\n     ▼\\n  ┌──────────────────┐  fail   ┌─────────────┐\\n  │  FileStreamSink  │────────▶│   TcpSink   │──▶ (drop)\\n  └──────────────────┘         └─────────────┘\\n```\\n\\n```csharp\\nvar head = RelayBuilder\\n    .StartSpsc<Tick, FileStreamSink<Tick>>(fileSink)\\n    .To(tcpSink)\\n    .Build();\\n```\\n\\n---\\n\\n#### 3. Serial fallback — depth 3\\n\\nClassic tiered persistence: fast local file → remote TCP → native memory ring.\\n\\n```\\n  Producer\\n     │\\n     ▼\\n  ┌──────────────────┐  fail   ┌─────────────┐  fail   ┌──────────────┐\\n  │  FileStreamSink  │────────▶│   TcpSink   │────────▶│  MemorySink  │\\n  └──────────────────┘         └─────────────┘         └──────────────┘\\n```\\n\\n```csharp\\nvar head = RelayBuilder\\n    .StartSpsc<Tick, FileStreamSink<Tick>>(fileSink)\\n    .To(tcpSink)\\n    .To(memorySink)\\n    .Build();\\n```\\n\\n---\\n\\n### Intermediate\\n\\n#### 4. Broadcast — `MultiSink`\\n\\nEvery item goes to **all** children regardless of individual health. `Next` is reached\\nonly when all children are unhealthy simultaneously.\\n\\n```\\n  Producer\\n     │\\n     ▼\\n  ┌─────────────┐────▶ ┌──────────────────┐\\n  │  MultiSink  │      │  FileStreamSink  │\\n  └─────────────┘      └──────────────────┘\\n        │\\n        └────▶ ┌─────────────┐\\n               │   TcpSink   │\\n               └─────────────┘\\n  (all unhealthy → Next or drop)\\n```\\n\\n```csharp\\nvar head = RelayBuilder\\n    .Start<Tick, MultiSink<Tick>>(\\n        new MultiSink<Tick>(fileSink, tcpSink))\\n    .Build();\\n```\\n\\n---\\n\\n#### 5. Broadcast — `Multi2Sink` (CRTP, 2 sealed children)\\n\\nSame semantics as `MultiSink` but the JIT devirtualizes both `Enqueue` calls when `TC1`\\nand `TC2` are sealed types, saving ~6 cycles per dispatch.\\n\\n```\\n  Producer\\n     │\\n     ▼\\n  ┌──────────────────────┐────▶ ┌──────────────────┐  (sealed TC1)\\n  │  Multi2Sink<T,F,C>   │      │  FileStreamSink  │\\n  └──────────────────────┘      └──────────────────┘\\n        │\\n        └────▶ ┌─────────────┐  (sealed TC2)\\n               │   TcpSink   │\\n               └─────────────┘\\n  JIT devirtualizes both calls — ~6c saved vs array MultiSink\\n```\\n\\n```csharp\\nvar multi = new Multi2Sink<Tick, FileStreamSink<Tick>, TcpSink<Tick>>(\\n    fileSink, tcpSink);\\n\\nvar head = RelayBuilder\\n    .Start<Tick, Multi2Sink<Tick, FileStreamSink<Tick>, TcpSink<Tick>>>(multi)\\n    .Build();\\n```\\n\\n---\\n\\n#### 6. Fork / audit — `ForkSink`\\n\\nEvery item reaches the audit sink (via `Accept`) **and** propagates to `Next`\\n(`PropagateAfterAccept = true`). Both deliveries are synchronous on the producer thread.\\n\\n```\\n  Producer\\n     │\\n     ▼\\n  ┌─────────────┐────▶ ┌──────────────────┐\\n  │  ForkSink   │      │   MemorySink     │  (audit — receives every item)\\n  └─────────────┘      └──────────────────┘\\n        │\\n        │ PropagateAfterAccept = true\\n        ▼\\n  ┌──────────────────┐\\n  │  FileStreamSink  │  (main delivery chain)\\n  └──────────────────┘\\n```\\n\\n```csharp\\nvar head = RelayBuilder\\n    .Start<Tick, ForkSink<Tick>>(new ForkSink<Tick>(memorySink))\\n    .To(fileSink)\\n    .Build();\\n```\\n\\n---\\n\\n#### 7. Conditional gate — `FilterSink`\\n\\nItems that fail the predicate are **silently consumed** — they do not propagate to `Next`.\\nThis is intentional: a filtered item is not an error.\\n\\n```\\n  Producer\\n     │\\n     ▼\\n  ┌──────────────────────┐  pred true   ┌──────────────────┐\\n  │     FilterSink       │─────────────▶│  FileStreamSink  │\\n  │   (price > 0)        │              └──────────────────┘\\n  └──────────────────────┘\\n        │\\n        pred false\\n        │\\n      (silent drop — does not reach Next)\\n```\\n\\n```csharp\\nvar head = RelayBuilder\\n    .Start<Tick, FilterSink<Tick>>(\\n        new FilterSink<Tick>(t => t.Price > 0, fileSink))\\n    .Build();\\n```\\n\\n---\\n\\n### Complex\\n\\n#### 8. Selective fallback — `FilterSink` as conditional fallback\\n\\nAll items go to `FileStreamSink`. On failure, only high-priority items fall through to\\n`TcpSink`; the rest are silently discarded. Use `.When().To()` on the builder.\\n\\n```\\n  Producer\\n     │\\n     ▼\\n  ┌──────────────────┐\\n  │  FileStreamSink  │──(healthy)──▶ (deliver)\\n  └──────────────────┘\\n        │ fail\\n        ▼\\n  ┌───────────────────────┐  pred true   ┌─────────────┐\\n  │      FilterSink       │─────────────▶│   TcpSink   │\\n  │  (priority == High)   │              └─────────────┘\\n  └───────────────────────┘\\n        │\\n        pred false ──▶ (drop — low priority discarded on file failure)\\n```\\n\\n```csharp\\nvar head = RelayBuilder\\n    .StartSpsc<Tick, FileStreamSink<Tick>>(fileSink)\\n    .When(t => t.Priority == Priority.High)\\n    .To(tcpSink)\\n    .Build();\\n```\\n\\n---\\n\\n#### 9. Broadcast with per-branch fallback\\n\\nEach broadcast branch is an independent fallback chain. Build each branch first, then\\npass the branch heads as children to `MultiSink`.\\n\\n```\\n  Producer\\n     │\\n     ▼\\n  ┌─────────────┐────▶ ┌──────────────────┐  fail   ┌──────────────┐\\n  │  MultiSink  │      │  FileStreamSink  │────────▶│  MemorySink  │\\n  └─────────────┘      └──────────────────┘         └──────────────┘\\n        │\\n        └────▶ ┌─────────────┐  fail   ┌──────────────┐\\n               │   TcpSink   │────────▶│  MemorySink  │\\n               └─────────────┘         └──────────────┘\\n```\\n\\n```csharp\\nvar fileBranch = RelayBuilder\\n    .StartSpsc<Tick, FileStreamSink<Tick>>(fileSink)\\n    .To(new MemorySink<Tick>())\\n    .Build();\\n\\nvar tcpBranch = RelayBuilder\\n    .StartSpsc<Tick, TcpSink<Tick>>(tcpSink)\\n    .To(new MemorySink<Tick>())\\n    .Build();\\n\\nvar head = RelayBuilder\\n    .Start<Tick, MultiSink<Tick>>(new MultiSink<Tick>(fileBranch, tcpBranch))\\n    .Build();\\n```\\n\\n---\\n\\n#### 10. Audit + broadcast — `ForkSink` + `MultiSink`\\n\\nEvery item is recorded in the audit ring, then broadcast to both file and TCP. The fork\\nis the head; its `Next` is the `MultiSink`.\\n\\n```\\n  Producer\\n     │\\n     ▼\\n  ┌─────────────┐────▶ ┌──────────────────┐\\n  │  ForkSink   │      │   MemorySink     │  (audit ring — every item)\\n  └─────────────┘      └──────────────────┘\\n        │\\n        │ propagates\\n        ▼\\n  ┌─────────────┐────▶ ┌──────────────────┐\\n  │  MultiSink  │      │  FileStreamSink  │\\n  └─────────────┘      └──────────────────┘\\n        │\\n        └────▶ ┌─────────────┐\\n               │   TcpSink   │\\n               └─────────────┘\\n```\\n\\n```csharp\\nvar multi = new MultiSink<Tick>(fileSink, tcpSink);\\n\\nvar head = RelayBuilder\\n    .Start<Tick, ForkSink<Tick>>(new ForkSink<Tick>(auditSink))\\n    .To(multi)\\n    .Build();\\n```\\n\\n---\\n\\n#### 11. Full production pipeline\\n\\nGate → audit → broadcast with per-branch fallback. Build inside-out: branches first,\\nthen multi, then fork, then filter.\\n\\n```\\n  Producer\\n     │\\n     ▼\\n  ┌──────────────────────┐\\n  │     FilterSink       │──(false)──▶ (drop)\\n  │   (price > 0)        │\\n  └──────────────────────┘\\n        │ true\\n        ▼\\n  ┌─────────────┐────▶ ┌──────────────────┐\\n  │  ForkSink   │      │   MemorySink     │  (audit ring)\\n  └─────────────┘      └──────────────────┘\\n        │ propagates\\n        ▼\\n  ┌─────────────┐────▶ ┌──────────────────┐  fail   ┌──────────────┐\\n  │  MultiSink  │      │  FileStreamSink  │────────▶│  MemorySink  │\\n  └─────────────┘      └──────────────────┘         └──────────────┘\\n        │\\n        └────▶ ┌─────────────┐  fail   ┌──────────────┐\\n               │   TcpSink   │────────▶│  MemorySink  │\\n               └─────────────┘         └──────────────┘\\n```\\n\\n```csharp\\n// Build inner chains first (inside-out)\\nvar fileBranch = RelayBuilder\\n    .StartSpsc<Tick, FileStreamSink<Tick>>(fileSink)\\n    .To(new MemorySink<Tick>()).Build();\\n\\nvar tcpBranch = RelayBuilder\\n    .StartSpsc<Tick, TcpSink<Tick>>(tcpSink)\\n    .To(new MemorySink<Tick>()).Build();\\n\\nvar multi = new MultiSink<Tick>(fileBranch, tcpBranch);\\nvar fork  = new ForkSink<Tick>(auditSink);\\n\\nvar forkChain = RelayBuilder\\n    .Start<Tick, ForkSink<Tick>>(fork)\\n    .To(multi)\\n    .Build();\\n\\nvar head = new FilterSink<Tick>(t => t.Price > 0, forkChain);\\n```\\n\\n---\\n\\n### Input Layer — Receivers\\n\\n`PacketReceiver` subclasses are **passive** — the caller's coordination loop drives them\\nby calling `Poll()`. Each `Poll()` attempts a non-blocking receive; if a frame arrives,\\nit invokes `callback(state, frame)` (caller inline processing) and optionally forwards\\nthe frame to `Next` (a `PacketSink` chain).\\n\\n#### 12. Receive and process inline (callback only)\\n\\nThe simplest pattern: frame consumed entirely in the callback. No sink forward.\\n\\n```\\n  [UDP :9090]\\n       │\\n       ▼\\n  ┌──────────────────────┐\\n  │  UdpReceiver<TState> │  stackalloc 1 432 B — MTU-safe, zero GC\\n  └──────────────────────┘\\n       │  Poll()\\n       ▼\\n  callback(state, frame)    ← caller processes inline\\n  (Next == null — frame not forwarded)\\n```\\n\\n```csharp\\nvar recv = RelayBuilder.From(\\n    local:    new IPEndPoint(IPAddress.Any, 9090),\\n    state:    engine,\\n    callback: static (eng, frame) => eng.HandlePacket(frame));\\n\\n// Coordination loop (single thread — no lock needed)\\nwhile (running) recv.Poll();\\n```\\n\\n---\\n\\n#### 13. Receive, process, and persist\\n\\nCallback for inline processing plus `Next` forward to a `PacketSink` fallback chain for\\ndurable storage. Both paths execute synchronously per `Poll()` call.\\n\\n```\\n  [UDP :9090]\\n       │\\n       ▼\\n  ┌──────────────────────┐\\n  │  UdpReceiver<TState> │  Next = head of sink chain\\n  └──────────────────────┘\\n       │  Poll()\\n       ├──▶ callback(state, frame)   ← caller inline processing\\n       │\\n       └──▶ Next.Enqueue(frame)\\n                  │\\n                  ▼\\n            ┌──────────────────┐  fail   ┌──────────────┐\\n            │   FileSink       │────────▶│  MemorySink  │\\n            └──────────────────┘         └──────────────┘\\n```\\n\\n```csharp\\nvar sinkChain = SinkChainBuilder\\n    .StartSpsc(new FileSink(\\\"/data/frames.bin\\\"))\\n    .To(new MemorySink())\\n    .Head;\\n\\nsinkChain.Start();\\n\\nvar recv = RelayBuilder.From(\\n    local:    new IPEndPoint(IPAddress.Any, 9090),\\n    state:    engine,\\n    callback: static (eng, frame) => eng.HandlePacket(frame),\\n    next:     sinkChain);\\n\\nwhile (running) recv.Poll();\\n```\\n\\n---\\n\\n#### 14. Multi-protocol input → shared sink chain\\n\\nTwo receivers (different transports) both forward to the same sink chain. Safe when both\\nare polled from the same coordination thread (single producer to the sink).\\nUse `MpscQueueSink` as the head if receivers run on separate threads.\\n\\n```\\n  [UDP :9090]              [SharedMemory \\\"feed\\\"]\\n       │                           │\\n       ▼                           ▼\\n  ┌────────────────┐    ┌───────────────────────────┐\\n  │  UdpReceiver   │    │  SharedMemorySpscReceiver  │\\n  └────────────────┘    └───────────────────────────┘\\n       │                           │\\n       │  Next = sinkChain         │  Next = sinkChain (same instance)\\n       └───────────────────────────┘\\n                    │\\n                    ▼ Next.Enqueue(frame)\\n              ┌─────────────────────┐  fail   ┌──────────────┐\\n              │  RotatingFileSink   │────────▶│  MemorySink  │\\n              └─────────────────────┘         └──────────────┘\\n```\\n\\n```csharp\\nvar sinkChain = SinkChainBuilder\\n    .StartSpsc(new RotatingFileSink(\\\"/data/frames\\\", maxBytes: 256 * 1024 * 1024))\\n    .To(new MemorySink())\\n    .Head;\\n\\nsinkChain.Start();\\n\\nvar udpRecv = RelayBuilder.From(\\n    new IPEndPoint(IPAddress.Any, 9090), engine,\\n    static (eng, frame) => eng.HandleUdp(frame),\\n    next: sinkChain);\\n\\nvar shmRecv = RelayBuilder.FromSharedMemory(\\n    \\\"feed\\\", engine,\\n    static (eng, frame) => eng.HandleShm(frame),\\n    next: sinkChain);\\n\\n// Single coordination thread — both receivers share the SPSC sink safely\\nwhile (running) { udpRecv.Poll(); shmRecv.Poll(); }\\n```\\n\\n---\\n````\\n\\n---\\n\\n## Implementation Steps\\n\\n1. **Read** `README.md` to confirm line 61 is `---` and line 63 is `## Project Structure`.\\n2. **Edit** `README.md`: insert the block above between the `---` at line 61 and\\n   `## Project Structure` at line 63. Use the `Edit` tool.\\n3. **Verify** README renders correctly: 14 diagrams present, markdown fences closed.\\n4. **Run** `dotnet build src/Relay` — smoke test (docs-only change).\\n\\n---\\n\\n## Verification\\n\\n- `## Pipeline Topologies` section with 4 sub-sections:\\n  - Simple (1–3), Intermediate (4–7), Complex (8–11), Input Layer — Receivers (12–14)\\n- 14 numbered diagrams, each with an ASCII flow block and a builder/factory snippet.\\n- `docs/topology.md` link at line 59 intact.\\n- Build passes: `dotnet build src/Relay`.\", \"/docs/superpowers/plans/2026-05-28-ok-ent-o-siga-imperative-dragonfly.md\": \"# Context\\n\\nContinuação do `/release-3-execute` para Relay v1.0.4. release-notes.md aprovado (somente mudanças da versão atual). publish-target=none (tag + GitHub Release apenas). CI monitor=yes.\\n\\n## Estado atual\\n- Branch: `master` (após merge develop → master)\\n- release-notes.md: escrito para v1.0.4\\n- Workflows CI/CD: já existem e corretos (release.yml dispara em tags `v*`)\\n\\n---\\n\\n## Phase 4 — Execução (steps restantes)\\n\\n### 1. Build final no master\\n```\\ndotnet build Relay.sln -c Release -warnaserror\\n```\\n\\n### 2. Tests finais no master\\n```\\ndotnet test Relay.sln -c Release --no-build --logger \\\"console;verbosity=minimal\\\" --filter \\\"Category!=Endurance&Category!=Stress&Category!=Perf\\\"\\n```\\n\\n### 3. Tag + push\\n```\\ngit tag v1.0.4\\ngit push origin master --tags\\n```\\n→ Dispara `release.yml` no GitHub Actions.\\n\\n### 4. Monitor CI\\n- `gh run list` para detectar run da tag\\n- `gh run watch <run_id>` até conclusão\\n- Se falhar: diagnose → auto-heal loop (max 3 ciclos)\\n\\n### 5. GitHub Release\\n```\\ngh release create v1.0.4 --title \\\"v1.0.4\\\" --notes-file release-notes.md --repo brunomaida/Relay\\n```\\n\\n### 6. Back-merge master → develop\\n```\\ngit checkout develop\\ngit merge master --no-ff -m \\\"chore: back-merge v1.0.4 release w/Claude\\\"\\ngit push origin develop\\n```\\n\\n---\\n\\n## Verification\\n- Tag `v1.0.4` visível em `git tag`\\n- CI verde: `gh run list --branch v1.0.4`\\n- GitHub Release criado: `gh release view v1.0.4`\\n- develop ahead of master: `git log master..develop --oneline`\", \"/changelog.d/archived/1.0.1/ci-test-failures.md\": \"### Fixed\\n\\n- `SharedMemorySinkTests`: mark 4 facts as `[Fact(Skip = \\\"Windows only\\\")]` — `MemoryMappedFile.CreateOrOpen` with a named map throws `PlatformNotSupportedException` on Linux; the `[SupportedOSPlatform(\\\"windows\\\")]` attribute is a Roslyn hint only and does not cause xUnit to skip at runtime.\\n- `BatchSinkTests.Flush_signal_drains_pending_payload`: replaced `Thread.Sleep(100)` with `sink.Stop(1_000)` — consumer thread runs at `BelowNormal` priority and was not guaranteed to be scheduled within 100 ms on a loaded CI VM; `Stop` joins the thread, giving a hard happens-before before assertion.\\n\\n### Perf\\n\\nNo performance-sensitive code changed.\", \"/changelog.d/archived/1.0.3/feature-260526-14-shm-pipe-receivers.md\": \"### Summary\\n- Add `SharedMemorySpscReceiver<TState>`: hot-path SPSC ring consumer; mirrors `SharedMemorySpscSink` wire format exactly (128-byte header, 4B BE length prefix, ring-wrapped payload, `Volatile.Read/Write` on ReadIndex/WriteIndex)\\n- Add `NamedPipeReceiver<TState>`: management-plane named-pipe receiver; compatible with `NamedPipeSink` wire format; `WaitForConnection` blocks on management thread, `Poll` reads synchronously (blocking acceptable on management-plane)\\n- Add `RelayBuilder.FromSharedMemory` and `RelayBuilder.FromNamedPipe` factory methods; `FromSharedMemory` carries `[SupportedOSPlatform(\\\"windows\\\")]`\\n\\n### Perf\\nestimated — `SharedMemorySpscReceiver.Poll` is hot-path: `Volatile.Read` on WriteIndex, ring-wrap arithmetic with `Math.Min` chunk, `Volatile.Write` on ReadIndex after consume; POH-pinned frame buffer pre-touched in ctor (eliminates soft page faults on first receive). `NamedPipeReceiver.Poll` is management-plane only; blocking `ReadFile` is acceptable and avoids the IOCP/SynchronizationContext complexity of async reads on synchronous callers.\"};\n\n  _mdInline(s) {\n    s = s.replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;');\n    s = s.replace(/`([^`]+)`/g, '<code>$1<\u002Fcode>');\n    s = s.replace(/\\*\\*([^*]+)\\*\\*/g, '<strong>$1<\u002Fstrong>');\n    // single-* / single-_ italic intentionally NOT supported: technical docs use\n    // bare * (globs: *.csv, AQTrade.UI.*) and _ (snake_case) far more than emphasis.\n    s = s.replace(/\\[([^\\]]+)\\]\\(([^)]+)\\)/g, '<a href=\"$2\" target=\"_blank\" rel=\"noopener\">$1<\u002Fa>');\n    return s;\n  }\n  _mdTable(rows) {\n    let out = '<table>';\n    rows.forEach((r, idx) => {\n      if (idx === 1 && /^[\\s:|+-]+$/.test(r.replace(/\\|/g, ''))) return;\n      const tag = idx === 0 ? 'th' : 'td';\n      const cells = r.trim().replace(/^\\||\\|$/g, '').split('|')\n        .map(c => '<' + tag + '>' + this._mdInline(c.trim()) + '<\u002F' + tag + '>');\n      out += '<tr>' + cells.join('') + '<\u002Ftr>';\n    });\n    return out + '<\u002Ftable>';\n  }\n  _mdToHtml(src) {\n    const L = src.replace(/\\r/g, '').split('\\n');\n    const bs = /^(#{1,6}\\s|>|\\s*[-*+]\\s|\\s*\\d+\\.\\s|```|\\s*\\|)/;\n    let out = '', i = 0, stack = [];\n    const close = () => { while (stack.length) out += '<\u002F' + stack.pop().tag + '>'; };\n    while (i < L.length) {\n      let ln = L[i], m = ln.match(/^```(\\w*)/);\n      if (m) { close(); i++; let c = ''; while (i < L.length && !/^```/.test(L[i])) { c += L[i].replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;') + '\\n'; i++; } i++; out += '<pre><code>' + c + '<\u002Fcode><\u002Fpre>'; continue; }\n      m = ln.match(/^(#{1,6})\\s+(.*)$/);\n      if (m) { close(); const lv = m[1].length; out += '<h' + lv + '>' + this._mdInline(m[2]) + '<\u002Fh' + lv + '>'; i++; continue; }\n      if (/^(---|\\*\\*\\*|___)\\s*$/.test(ln)) { close(); out += '<hr>'; i++; continue; }\n      if (/^>\\s?/.test(ln)) { close(); let q = ''; while (i < L.length && /^>\\s?/.test(L[i])) { q += this._mdInline(L[i].replace(/^>\\s?/, '')) + ' '; i++; } out += '<blockquote>' + q + '<\u002Fblockquote>'; continue; }\n      if (/^\\s*\\|.*\\|\\s*$/.test(ln)) { close(); let rows = []; while (i < L.length && /^\\s*\\|.*\\|\\s*$/.test(L[i])) { rows.push(L[i]); i++; } out += this._mdTable(rows); continue; }\n      let ul = ln.match(/^(\\s*)[-*+]\\s+(.*)$/), ol = ln.match(/^(\\s*)\\d+\\.\\s+(.*)$/);\n      if (ul || ol) {\n        const mm = ul || ol, w = ul ? 'ul' : 'ol';\n        const depth = Math.min(Math.floor(mm[1].replace(/\\t/g, '  ').length / 2), 6);\n        while (stack.length && stack[stack.length - 1].depth > depth) out += '<\u002F' + stack.pop().tag + '>';\n        const top = stack[stack.length - 1];\n        if (!top || top.depth < depth) { out += '<' + w + '>'; stack.push({ tag: w, depth }); }\n        else if (top.tag !== w) { out += '<\u002F' + stack.pop().tag + '>'; out += '<' + w + '>'; stack.push({ tag: w, depth }); }\n        out += '<li>' + this._mdInline(mm[2]) + '<\u002Fli>'; i++; continue;\n      }\n      if (/^\\s*$/.test(ln)) { close(); i++; continue; }\n      close(); let p = ln; i++; while (i < L.length && !/^\\s*$/.test(L[i]) && !bs.test(L[i])) { p += ' ' + L[i]; i++; } out += '<p>' + this._mdInline(p) + '<\u002Fp>';\n    }\n    close();\n    return out || '<p class=\"md-empty\">No content.<\u002Fp>';\n  }\n  _renderDocs() {\n    if (this._mdBusy) return;            // reentrancy guard (defensive)\n    this._mdBusy = true;\n    try {\n      const map = this.docBodies || {};\n      document.querySelectorAll('.md-doc[data-md-path]').forEach(el => {\n        if (el.dataset.mdDone === '1' || el.childElementCount > 0) return;\n        const md = map[el.getAttribute('data-md-path')];\n        el.innerHTML = md ? this._mdToHtml(md) : '<p class=\"md-empty\">No content available for this document.<\u002Fp>';\n        el.dataset.mdDone = '1';\n      });\n    } finally { this._mdBusy = false; }\n  }\n  _collapseRows() {\n    if (this._crBusy) return;\n    this._crBusy = true;\n    try {\n      if (!this._expandedRows) this._expandedRows = {};\n      document.querySelectorAll('[data-row-id]').forEach(rowEl => {\n        const rowId = rowEl.dataset.rowId;\n        const isExp = !!this._expandedRows[rowId];\n        rowEl.querySelectorAll('.rexp').forEach(b => b.remove());\n        rowEl.querySelectorAll('.chip-clipped').forEach(c => c.classList.remove('chip-clipped'));\n        rowEl.querySelectorAll('[data-chips-wrap]').forEach(wrapEl => {\n          const chips = Array.from(wrapEl.querySelectorAll('[data-chip]'));\n          if (!chips.length) return;\n          const baseTop = chips[0].getBoundingClientRect().top;\n          const over = chips.filter(c => c.getBoundingClientRect().top > baseTop + 4);\n          if (!over.length) return;\n          if (!isExp) over.forEach(c => c.classList.add('chip-clipped'));\n          const btn = document.createElement('button');\n          btn.className = 'rexp';\n          btn.textContent = isExp ? '↑' : '+' + over.length;\n          btn.addEventListener('click', () => {\n            if (isExp) delete this._expandedRows[rowId];\n            else this._expandedRows[rowId] = true;\n            this._crBusy = false;\n            this._collapseRows();\n          });\n          wrapEl.appendChild(btn);\n        });\n      });\n    } finally { this._crBusy = false; }\n  }\n\n  componentDidMount() {\n    document.addEventListener('mousemove', this.onResizeMove);\n    document.addEventListener('mouseup', this.onResizeEnd);\n    document.addEventListener('mouseup', this.onColUp);\n    this._renderDocs();\n    this._collapseRows();\n    this._highlightRows();\n  }\n  _highlightRows() {\n    // Clear old marks first\n    document.querySelectorAll('.hl-mark').forEach(el => {\n      const parent = el.parentNode;\n      if (!parent) return;\n      parent.replaceChild(document.createTextNode(el.textContent), el);\n      parent.normalize();\n    });\n    const q = (this.state.query || '').trim().toLowerCase();\n    if (!q || !this.state.highlightMode) return;\n    const walkText = (root) => {\n      const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {\n        acceptNode: (n) => n.parentElement && n.parentElement.closest('script,style,.hl-mark') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT\n      });\n      const nodes = [];\n      let n;\n      while ((n = tw.nextNode())) nodes.push(n);\n      nodes.forEach(tn => {\n        const txt = tn.textContent;\n        const lower = txt.toLowerCase();\n        if (!lower.includes(q)) return;\n        const frag = document.createDocumentFragment();\n        let last = 0, idx;\n        while ((idx = lower.indexOf(q, last)) >= 0) {\n          if (idx > last) frag.appendChild(document.createTextNode(txt.slice(last, idx)));\n          const mark = document.createElement('span');\n          mark.className = 'hl-mark';\n          mark.textContent = txt.slice(idx, idx + q.length);\n          frag.appendChild(mark);\n          last = idx + q.length;\n        }\n        if (last < txt.lengt
