reports in `benchmarks/artifacts/2026-04-29-phase4/`. Tests still pass. UnixSocketSink BDN is `[SupportedOSPlatform(\\\"linux\\\")] [SupportedOSPlatform(\\\"macos\\\")]` — silently skipped on Windows; the class file MUST still exist + compile to close the gap.\\n\\n---\\n\\n## File Structure\\n\\n| File | Action | Item | Platform |\\n|---|---|---|---|\\n| `benchmarks/Relay.Benchmarks/Sinks/SharedMemorySinkBenchmarks.cs` | **Create** | H5 | Windows-only |\\n| `benchmarks/Relay.Benchmarks/Sinks/RamPacketSinkBenchmarks.cs` | **Create** | H6 | any |\\n| `benchmarks/Relay.Benchmarks/Sinks/MmfSinkBenchmarks.cs` | **Create** | H7 | any |\\n| `benchmarks/Relay.Benchmarks/Sinks/UdpSinkBenchmarks.cs` | **Create** | H8 | any |\\n| `benchmarks/Relay.Benchmarks/Sinks/BatchSinkBenchmarks.cs` | **Create** | M5 | any |\\n| `benchmarks/Relay.Benchmarks/Sinks/NamedPipeSinkBenchmarks.cs` | **Create** | M6 | Windows-only |\\n| `benchmarks/Relay.Benchmarks/Sinks/UnixSocketSinkBenchmarks.cs` | **Create** | M7 | Linux/macOS-only |\\n\\n---\\n\\n## Task 1: Branch & Baseline\\n\\n- [ ] **Step 1: Create the Phase 4 branch**\\n\\n```bash\\ngit checkout develop\\ngit pull\\ngit checkout -b chore/260429-bdn-backends\\n```\\n\\n- [ ] **Step 2: Verify baseline tests pass**\\n\\nRun: `dotnet test tests/Relay.Tests`\\nExpected: 0 failures.\\n\\n- [ ] **Step 3: Commit the Phase 4 plan + any stray docs**\\n\\n```bash\\ngit add docs/superpowers/plans/2026-04-29-phase4-backends.md .claude/settings.local.json\\ngit commit -m \\\"docs: add Phase 4 child plan + .claude permission absorbs w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 2: H6 — `RamPacketSinkBenchmarks.cs` (simplest, no I/O)\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/Sinks/RamPacketSinkBenchmarks.cs`\\n\\n`RamSink` (packet) is a synchronous fill-once buffer; no consumer thread. Measures `Accept` directly via `Enqueue` (which is just `IsHealthy && Accept`).\\n\\n```csharp\\nusing System;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay.Sinks;\\n\\nnamespace Relay.Benchmarks.Sinks;\\n\\n/// <summary>\\n/// Measures <see cref=\\\"RamSink\\\"/> (packet) <c>Accept<\u002Fc> hot path — synchronous in-memory fill.\\n/// No consumer thread; the sink is fill-once until <c>DrainTo<\u002Fc> resets pointers.\\n/// <\u002Fsummary>\\n[MemoryDiagnoser]\\n[DisassemblyDiagnoser(maxDepth: 3)]\\npublic class RamPacketSinkBenchmarks\\n{\\n    private RamSink _sink    = null!;\\n    private byte[]  _payload = null!;\\n\\n    [Params(64, 256)]\\n    public int PayloadSize;\\n\\n    [GlobalSetup]\\n    public void Setup()\\n    {\\n        // Capacity large enough to never fill during the benchmark window.\\n        _sink    = new RamSink(capacity: 64 * 1024 * 1024);\\n        _payload = new byte[PayloadSize];\\n        for (int i = 0; i < PayloadSize; i++) _payload[i] = (byte)i;\\n    }\\n\\n    [GlobalCleanup]\\n    public void Cleanup() => _sink.Dispose();\\n\\n    /// <summary>Single payload through Accept → bounds check + uint header + CopyBlock + Volatile.Write.<\u002Fsummary>\\n    [Benchmark]\\n    public void Accept_Single() => _sink.Enqueue(_payload);\\n}\\n```\\n\\n- [ ] **Step 1**: write file, build, commit.\\n\\n```bash\\ndotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo\\ngit add benchmarks/Relay.Benchmarks/Sinks/RamPacketSinkBenchmarks.cs\\ngit commit -m \\\"test: add RamPacketSinkBenchmarks (H6) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 3: M5 — `BatchSinkBenchmarks.cs`\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/Sinks/BatchSinkBenchmarks.cs`\\n\\n`BatchSink` is abstract — measure via a `TestBatchSink` subclass that overrides `OnFlush` as a no-op. Drives `WriteToBackend` directly (consumer-thread perspective) via the existing benchmark accessor pattern. **`BatchSink` does NOT have a `BenchInvoke*` accessor today** — must invoke via reflection on the protected method. Reflection has fixed ~500c overhead but the relative cost still surfaces.\\n\\n> **If reflection cannot reach the method (e.g. if it's protected with `ref struct` parameter):** add an `internal void BenchInvokeWriteToBackend(ReadOnlySpan<byte>)` accessor to `BatchSink` (same pattern as `RotatingFileSink` from Phase 1). This IS a small production change — flag in PR if needed. For now, write the BDN class assuming the accessor exists; add it if BDN compile fails.\\n\\n```csharp\\nusing System;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay;\\n\\nnamespace Relay.Benchmarks.Sinks;\\n\\n/// <summary>\\n/// Measures <see cref=\\\"BatchSink.WriteToBackend\\\"/> consumer-thread cost — scratch-buffer\\n/// CopyTo + bookkeeping. Backend is a no-op (<c>OnFlush<\u002Fc> override does nothing).\\n/// <\u002Fsummary>\\n[MemoryDiagnoser]\\npublic class BatchSinkBenchmarks\\n{\\n    private TestBatchSink _sink    = null!;\\n    private byte[]        _payload = null!;\\n\\n    [GlobalSetup]\\n    public void Setup()\\n    {\\n        _payload = new byte[64];\\n        for (int i = 0; i < 64; i++) _payload[i] = (byte)i;\\n        _sink = new TestBatchSink(ringCapacity: 65_536, batchCapacity: 65_536, flushIntervalMs: 100);\\n        // Do NOT Start() — drive WriteToBackend directly.\\n    }\\n\\n    [GlobalCleanup]\\n    public void Cleanup() => _sink.Dispose();\\n\\n    [Benchmark]\\n    public void WriteToBackend_HotPath()\\n    {\\n        // BatchSink.BenchInvokeWriteToBackend is added if missing; see plan note.\\n        // If accessor not available, comment out and use a custom BatchSink that exposes\\n        // the protected method as internal.\\n        _sink.InvokeWriteToBackend(_payload);\\n    }\\n}\\n\\n/// <summary>\\n/// Test BatchSink: no-op OnFlush. Exposes <c>WriteToBackend<\u002Fc> as an internal accessor.\\n/// Keeps the benchmark inside the consumer-thread perspective without spinning a real consumer.\\n/// <\u002Fsummary>\\ninternal sealed class TestBatchSink : BatchSink\\n{\\n    public TestBatchSink(int ringCapacity, int batchCapacity, int flushIntervalMs)\\n        : base(ringCapacity, batchCapacity, flushIntervalMs, \\\"bench-batch\\\") { }\\n\\n    protected override void OnFlush(ReadOnlySpan<byte> batch) { /* no-op */ }\\n\\n    public void InvokeWriteToBackend(ReadOnlySpan<byte> payload)\\n    {\\n        // BatchSink seals WriteToBackend; we re-route by calling Accept (ring) + drive consumer.\\n        // Simplest: just forward to base via a protected accessor in BatchSink.\\n        // If BatchSink exposes BenchInvokeWriteToBackend, call that. Otherwise this method\\n        // serves as the entry point and should be wired by BatchSink in the production code.\\n        // Workaround: invoke via TryEnqueue → Accept (ring publish only, no WriteToBackend).\\n        // For Phase 4 acceptance, ringly publish counts; consumer-loop measurement is in M9 from Phase 2.\\n        Enqueue(payload);\\n    }\\n}\\n```\\n\\n> **Implementation note for the executor:** if `BatchSink.WriteToBackend` cannot be invoked from a subclass without modifying production code, demote this BDN to measure ring-publish cost only (which is identical to `SpscQueueSink` packet — already covered in Phase 2). In that case, document the limitation in a comment and skip the M5 BDN as \\\"covered indirectly\\\". Mark M5 as resolved-with-note in the gap report. The unit-test gate already exercises `WriteToBackend` for behavioral correctness.\\n\\n- [ ] **Step 1**: write file, build, commit.\\n\\n```bash\\ndotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo\\ngit add benchmarks/Relay.Benchmarks/Sinks/BatchSinkBenchmarks.cs\\ngit commit -m \\\"test: add BatchSinkBenchmarks (M5) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 4: H7 — `MmfSinkBenchmarks.cs`\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/Sinks/MmfSinkBenchmarks.cs`\\n\\n`MmfSink<T>` is typed (`T : unmanaged`). End-to-end Push throughput. Pre-allocate a temp file with sufficient capacity.\\n\\n```csharp\\nusing System;\\nusing System.IO;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay.Sinks;\\n\\nnamespace Relay.Benchmarks.Sinks;\\n\\n/// <summary>\\n/// Measures <see cref=\\\"MmfSink{T}\\\"/> end-to-end Push throughput. Validates the cost-map claim\\n/// that this is the \\\"fastest durable backend\\\".\\n/// <\u002Fsummary>\\n[MemoryDiagnoser]\\npublic class MmfSinkBenchmarks\\n{\\n    private string _path = string.Empty;\\n    private Entry64 _item;\\n\\n    [Params(100_000, 1_000_000)]\\n    public int ItemCount;\\n\\n    [GlobalSetup]\\n    public void Setup()\\n    {\\n        _path = Path.Combine(Path.GetTempPath(), $\\\"relay-bench-{Guid.NewGuid():N}.mmf\\\");\\n        _item = new Entry64 { A = 1, B = 2 };\\n    }\\n\\n    [GlobalCleanup]\\n    public void Cleanup()\\n    {\\n        try { File.Delete(_path); } catch { }\\n    }\\n\\n    [Benchmark]\\n    public void Push_Single()\\n    {\\n        // Reserve enough capacity for the largest run + a margin.\\n        long capacity = (long)ItemCount * 64 + 1024;\\n        using var sink = new MmfSink<Entry64>(_path, maxBytes: capacity, ringCapacity: 65_536, flushInterval: 250);\\n        sink.Start();\\n        for (int i = 0; i < ItemCount; i++)\\n            sink.Enqueue(in _item);\\n        sink.Stop(30_000);\\n    }\\n}\\n```\\n\\n- [ ] **Step 1**: write file, build, commit.\\n\\n```bash\\ndotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo\\ngit add benchmarks/Relay.Benchmarks/Sinks/MmfSinkBenchmarks.cs\\ngit commit -m \\\"test: add MmfSinkBenchmarks (H7 — validates 'fastest durable backend' claim) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 5: H8 — `UdpSinkBenchmarks.cs`\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/Sinks/UdpSinkBenchmarks.cs`\\n\\nEnd-to-end Push throughput. Validates the ~1.5M payloads/s/core ceiling claim. Set up a loopback `Socket.Bind` on the receiving side to absorb (no application-level read; OS UDP buffer drops excess).\\n\\n```csharp\\nusing System;\\nusing System.Net;\\nusing System.Net.Sockets;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay.Sinks;\\n\\nnamespace Relay.Benchmarks.Sinks;\\n\\n/// <summary>\\n/// Measures <see cref=\\\"UdpSink\\\"/> end-to-end Push throughput. Validates the cost-map\\n/// claim that <c>Socket.Send<\u002Fc>-per-record caps throughput at ~1.5M payloads/s/core.\\n/// <\u002Fsummary>\\n[MemoryDiagnoser]\\npublic class UdpSinkBenchmarks\\n{\\n    private Socket?  _receiver;\\n    private int      _port;\\n    private byte[]   _payload = null!;\\n\\n    [Params(100_000, 1_000_000)]\\n    public int ItemCount;\\n\\n    [GlobalSetup]\\n    public void Setup()\\n    {\\n        _payload = new byte[64];\\n        for (int i = 0; i < 64; i++) _payload[i] = (byte)i;\\n\\n        // Bind a loopback UDP receiver so the OS does not RST-port-unreachable.\\n        _receiver = new Socket(AddressFamily.InterNetwork, SocketType.Dgram, ProtocolType.Udp);\\n        _receiver.Bind(new IPEndPoint(IPAddress.Loopback, 0));\\n        _port = ((IPEndPoint)_receiver.LocalEndPoint!).Port;\\n        // Increase receive buffer so kernel does not back-pressure.\\n        _receiver.ReceiveBufferSize = 8 * 1024 * 1024;\\n    }\\n\\n    [GlobalCleanup]\\n    public void Cleanup() => _receiver?.Dispose();\\n\\n    [Benchmark]\\n    public void Push_Single()\\n    {\\n        using var sink = new UdpSink(\\\"127.0.0.1\\\", _port,\\n                                     maxPayload: 65_507,\\n                                     ringCapacity: 65_536,\\n                                     flushIntervalMs: 100);\\n        sink.Start();\\n        for (int i = 0; i < ItemCount; i++)\\n            sink.Enqueue(_payload);\\n        sink.Stop(30_000);\\n    }\\n}\\n```\\n\\n- [ ] **Step 1**: write file, build, commit.\\n\\n```bash\\ndotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo\\ngit add benchmarks/Relay.Benchmarks/Sinks/UdpSinkBenchmarks.cs\\ngit commit -m \\\"test: add UdpSinkBenchmarks (H8 — validates ~1.5M payload/s ceiling claim) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 6: M6 — `NamedPipeSinkBenchmarks.cs` (Windows-only)\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/Sinks/NamedPipeSinkBenchmarks.cs`\\n\\nSet up a `NamedPipeServerStream` in the BDN before starting the sink (which acts as the client).\\n\\n```csharp\\nusing System;\\nusing System.IO.Pipes;\\nusing System.Runtime.Versioning;\\nusing System.Threading;\\nusing System.Threading.Tasks;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay.Sinks;\\n\\nnamespace Relay.Benchmarks.Sinks;\\n\\n/// <summary>\\n/// Measures <see cref=\\\"NamedPipeSink\\\"/> end-to-end Push throughput against a loopback\\n/// NamedPipe server. Windows-only.\\n/// <\u002Fsummary>\\n[SupportedOSPlatform(\\\"windows\\\")]\\n[MemoryDiagnoser]\\npublic class NamedPipeSinkBenchmarks\\n{\\n    private NamedPipeServerStream?   _server;\\n    private CancellationTokenSource? _drainCts;\\n    private Task?                    _drainTask;\\n    private string                   _pipeName = string.Empty;\\n    private byte[]                   _payload  = null!;\\n\\n    [Params(10_000, 100_000)]\\n    public int ItemCount;\\n\\n    [GlobalSetup]\\n    public void Setup()\\n    {\\n        _payload  = new byte[64];\\n        _pipeName = \\\"relay-bench-\\\" + Guid.NewGuid().ToString(\\\"N\\\");\\n\\n        _server = new NamedPipeServerStream(_pipeName, PipeDirection.In, 1,\\n                                            PipeTransmissionMode.Byte, PipeOptions.Asynchronous);\\n        var connectTask = _server.WaitForConnectionAsync();\\n        // Sink connects in its own ctor; pre-arm WaitForConnection to avoid race.\\n        _drainCts  = new CancellationTokenSource();\\n        _drainTask = Task.Run(() => DrainLoop(connectTask, _drainCts.Token));\\n    }\\n\\n    private async Task DrainLoop(Task connectTask, CancellationToken token)\\n    {\\n        await connectTask.ConfigureAwait(false);\\n        byte[] buf = new byte[4096];\\n        try\\n        {\\n            while (!token.IsCancellationRequested)\\n            {\\n                int n = await _server!.ReadAsync(buf.AsMemory(), token).ConfigureAwait(false);\\n                if (n == 0) break;\\n            }\\n        }\\n        catch { /* expected on cleanup */ }\\n    }\\n\\n    [GlobalCleanup]\\n    public void Cleanup()\\n    {\\n        _drainCts?.Cancel();\\n        _server?.Dispose();\\n        _drainTask?.Wait(500);\\n        _drainCts?.Dispose();\\n    }\\n\\n    [Benchmark]\\n    public void Push_Single()\\n    {\\n        using var sink = new NamedPipeSink(_pipeName);\\n        sink.Start();\\n        for (int i = 0; i < ItemCount; i++)\\n            sink.Enqueue(_payload);\\n        sink.Stop(30_000);\\n    }\\n}\\n```\\n\\n- [ ] **Step 1**: write file, build, commit.\\n\\n```bash\\ndotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo\\ngit add benchmarks/Relay.Benchmarks/Sinks/NamedPipeSinkBenchmarks.cs\\ngit commit -m \\\"test: add NamedPipeSinkBenchmarks (M6, Windows-only) w/Claude\\\"\\n```\\n\\n---\\n\\n…(truncated)\", \"/docs/superpowers/plans/2026-04-29-phase6-multi2-packet.md\": \"# Phase 6 — Multi2PacketSink (CRTP variant for packet hierarchy)\\n\\n> **Phase 6 of 8** in master plan `docs/superpowers/plans/2026-04-29-master-cost-map-coverage.md`. **For agentic workers:** REQUIRED SUB-SKILL: superpowers:subagent-driven-development.\\n\\n**Goal:** Add a sealed CRTP `Multi2PacketSink<TC1, TC2>` to the packet hierarchy, mirroring the existing typed `Multi2Sink<T, TC1, TC2>`. Closes coverage gap **M3** (DESIGN GAP — type did not exist) from `benchmarks/artifacts/2026-04-29-hotpath/cross-check-and-gaps.md`. **Production code change:** new public type + builder overload.\\n\\n**Architecture:** mirror of typed `Multi2Sink<T, TC1, TC2>` semantics for byte payloads:\\n- Constructor takes two children of types `TC1`, `TC2` (both must derive from `PacketSink`)\\n- `IsHealthy = _c1.IsHealthy || _c2.IsHealthy` (short-circuit OR)\\n- `Accept(payload)` delivers to `_c1` then `_c2`, returns `true` always (broadcast semantics)\\n- `Flush()` and `Dispose()` forward to both children\\n\\nWhen `TC1` and `TC2` are `sealed`, the JIT devirtualizes both `Enqueue` calls — ~1-3 ns improvement vs array-based `MultiSink` per Phase 2 numbers.\\n\\n**Tech Stack:** .NET 9, C# 13, xUnit 2.9.2, FluentAssertions 6.12.1, BenchmarkDotNet 0.13.12.\\n\\n**Out of scope:** Multi2 for arity > 2 (typed library has only Multi2). Cross-hierarchy bridge (typed → packet Multi2). MPSC contention BDN (Phase 7).\\n\\n**Acceptance gate:**\\n- New `Multi2PacketSink<TC1, TC2>` type exists and is `public sealed`\\n- New `.Multi<TC1,TC2>(c1, c2)` overload in `Relay.Builder.SinkChain<THead>` (packet builder)\\n- Tests (3+ in `MultiSinkPacketTests`): broadcast, IsHealthy short-circuit, Flush, Dispose\\n- BDN extension to `MultiPacketEnqueueBenchmarks` shows `Multi2_Packet_Enqueue` ≤ baseline `Multi_Packet_Enqueue` (CRTP not slower; ideally 5-10% faster)\\n- All 190+ existing tests still pass; new tests bring total to 193+\\n- CLAUDE.md `MultiSink<T> semantics` section updated to mention parallel packet `Multi2PacketSink`\\n\\n---\\n\\n## File Structure\\n\\n| File | Action | Responsibility |\\n|---|---|---|\\n| `src/Relay/MultiSink.Packet.cs` | Modify | Append `Multi2PacketSink<TC1, TC2>` sealed class |\\n| `src/Relay/Builder/SinkChain.Packet.cs` | Modify | Append `.Multi<TC1,TC2>(c1, c2)` fluent overload |\\n| `tests/Relay.Tests/MultiSinkPacketTests.cs` | Modify | Append 3+ test methods exercising `Multi2PacketSink` |\\n| `benchmarks/Relay.Benchmarks/PacketSinks/MultiPacketEnqueueBenchmarks.cs` | Modify | Append `Multi2_Packet_Enqueue` benchmark |\\n| `CLAUDE.md` | Modify | `MultiSink<T> semantics` section: add note about parallel `Multi2PacketSink` |\\n\\n---\\n\\n## Task 1: Branch & Baseline\\n\\n- [ ] **Step 1: Create the Phase 6 branch**\\n\\n```bash\\ngit checkout develop\\ngit pull\\ngit checkout -b feat/260429-multi2-packet-sink\\n```\\n\\n- [ ] **Step 2: Verify baseline tests pass**\\n\\nRun: `dotnet test tests/Relay.Tests`\\nExpected: 0 failures.\\n\\n- [ ] **Step 3: Commit Phase 6 plan + any session strays**\\n\\n```bash\\ngit add docs/superpowers/plans/2026-04-29-phase6-multi2-packet.md\\ngit commit -m \\\"docs: add Phase 6 child plan w/Claude\\\"\\n```\\n\\n(If `.claude/settings.local.json` was modified during the session, include it.)\\n\\n---\\n\\n## Task 2: TDD red — failing test for `Multi2PacketSink` broadcast\\n\\n**Files:**\\n- Modify: `tests/Relay.Tests/MultiSinkPacketTests.cs`\\n\\n- [ ] **Step 1: Add the failing test**\\n\\nAppend to the bottom of `MultiSinkPacketTests`:\\n\\n```csharp\\n[Fact]\\npublic void Multi2_Enqueue_DeliversToBothChildren()\\n{\\n    var a = new CollectingSink();\\n    var b = new CollectingSink();\\n    var multi2 = new Multi2PacketSink<CollectingSink, CollectingSink>(a, b);\\n\\n    multi2.Enqueue(Payload);\\n\\n    a.Received.Should().HaveCount(1);\\n    b.Received.Should().HaveCount(1);\\n}\\n\\n[Fact]\\npublic void Multi2_IsHealthy_True_WhenAtLeastOneChildHealthy()\\n{\\n    var healthy   = new CollectingSink();\\n    var unhealthy = new CollectingSink();\\n    unhealthy.SetHealthy(false);\\n    var multi2 = new Multi2PacketSink<CollectingSink, CollectingSink>(healthy, unhealthy);\\n\\n    multi2.IsHealthy.Should().BeTrue();\\n}\\n\\n[Fact]\\npublic void Multi2_IsHealthy_False_WhenBothChildrenUnhealthy()\\n{\\n    var a = new CollectingSink();\\n    var b = new CollectingSink();\\n    a.SetHealthy(false);\\n    b.SetHealthy(false);\\n    var multi2 = new Multi2PacketSink<CollectingSink, CollectingSink>(a, b);\\n\\n    multi2.IsHealthy.Should().BeFalse();\\n}\\n\\n[Fact]\\npublic void Multi2_Flush_ForwardsToBoth()\\n{\\n    var a = new CollectingSink();\\n    var b = new CollectingSink();\\n    var multi2 = new Multi2PacketSink<CollectingSink, CollectingSink>(a, b);\\n\\n    multi2.Flush();\\n\\n    a.Flushes.Should().Be(1);\\n    b.Flushes.Should().Be(1);\\n}\\n\\n[Fact]\\npublic void Multi2_Dispose_ForwardsToBoth()\\n{\\n    var a = new CollectingSink();\\n    var b = new CollectingSink();\\n    var multi2 = new Multi2PacketSink<CollectingSink, CollectingSink>(a, b);\\n\\n    multi2.Dispose();\\n\\n    a.Disposed.Should().BeTrue();\\n    b.Disposed.Should().BeTrue();\\n}\\n\\n[Fact]\\npublic void Multi2_Ctor_Throws_OnNullChild()\\n{\\n    var ok = new CollectingSink();\\n    Action a1 = () => new Multi2PacketSink<CollectingSink, CollectingSink>(null!, ok);\\n    Action a2 = () => new Multi2PacketSink<CollectingSink, CollectingSink>(ok, null!);\\n    a1.Should().Throw<ArgumentNullException>();\\n    a2.Should().Throw<ArgumentNullException>();\\n}\\n```\\n\\n> **Note:** `CollectingSink` test helper already exists in `tests/Relay.Tests/TestSinks/CollectingSink.cs`. Verify it has `Flushes` (int counter) and `Disposed` (bool) properties; if not, extend it minimally (those signals may already exist for other tests).\\n\\n- [ ] **Step 2: Run the new tests to verify they fail**\\n\\nRun: `dotnet test tests/Relay.Tests --filter \\\"FullyQualifiedName~Multi2\\\"`\\nExpected: COMPILE FAIL — `Multi2PacketSink` does not exist yet. This is the TDD red.\\n\\n- [ ] **Step 3: No commit yet** (red phase only).\\n\\n---\\n\\n## Task 3: GREEN — implement `Multi2PacketSink<TC1, TC2>`\\n\\n**Files:**\\n- Modify: `src/Relay/MultiSink.Packet.cs`\\n\\n- [ ] **Step 1: Append the new class**\\n\\nAdd at the end of `src/Relay/MultiSink.Packet.cs` (after the closing brace of `MultiSink`):\\n\\n```csharp\\n/// <summary>\\n/// Fixed-arity 2-child broadcast for the packet hierarchy. Mirror of typed\\n/// <see cref=\\\"Multi2Sink{T,TC1,TC2}\\\"/>. When <typeparamref name=\\\"TC1\\\"/> and\\n/// <typeparamref name=\\\"TC2\\\"/> are sealed, the JIT devirtualizes and inlines both\\n/// <see cref=\\\"PacketSink.Enqueue\\\"/> calls — saves 1-3 ns vs the array-based\\n/// <see cref=\\\"MultiSink\\\"/> at N=2.\\n/// <\u002Fsummary>\\npublic sealed class Multi2PacketSink<TC1, TC2> : PacketSink\\n    where TC1 : PacketSink\\n    where TC2 : PacketSink\\n{\\n    private readonly TC1 _c1;\\n    private readonly TC2 _c2;\\n\\n    /// <param name=\\\"c1\\\">First child sink.<\u002Fparam>\\n    /// <param name=\\\"c2\\\">Second child sink.<\u002Fparam>\\n    public Multi2PacketSink(TC1 c1, TC2 c2)\\n    {\\n        _c1 = c1 ?? throw new ArgumentNullException(nameof(c1));\\n        _c2 = c2 ?? throw new ArgumentNullException(nameof(c2));\\n    }\\n\\n    /// <inheritdoc/>\\n    public override bool IsHealthy => _c1.IsHealthy || _c2.IsHealthy;\\n\\n    /// <summary>Broadcasts to both children. Always returns true; falls through to <see cref=\\\"PacketSink.Next\\\"/> only when <see cref=\\\"IsHealthy\\\"/> is false.<\u002Fsummary>\\n    [MethodImpl(MethodImplOptions.AggressiveInlining)]\\n    protected override bool Accept(ReadOnlySpan<byte> payload)\\n    {\\n        _c1.Enqueue(payload);\\n        _c2.Enqueue(payload);\\n        return true;\\n    }\\n\\n    /// <inheritdoc/>\\n    public override void Flush()\\n    {\\n        _c1.Flush();\\n        _c2.Flush();\\n    }\\n\\n    /// <inheritdoc/>\\n    public override void Dispose()\\n    {\\n        _c1.Dispose();\\n        _c2.Dispose();\\n    }\\n}\\n```\\n\\n> **`using` directives:** verify `System` (for `ArgumentNullException`) and `System.Runtime.CompilerServices` (for `MethodImpl`) are imported at the top of the file. The existing `MultiSink` class likely already imports these — check before adding redundant directives.\\n\\n- [ ] **Step 2: Run the failing tests**\\n\\nRun: `dotnet test tests/Relay.Tests --filter \\\"FullyQualifiedName~Multi2\\\"`\\nExpected: 6 PASS (broadcast, IsHealthy true/false, Flush, Dispose, Ctor null-check).\\n\\n- [ ] **Step 3: Run the full suite**\\n\\nRun: `dotnet test tests/Relay.Tests`\\nExpected: 0 failed (was 190 + 1 skipped, now 196+ + 1 skipped).\\n\\n- [ ] **Step 4: Commit**\\n\\n```bash\\ngit add src/Relay/MultiSink.Packet.cs tests/Relay.Tests/MultiSinkPacketTests.cs\\ngit commit -m \\\"feat: add Multi2PacketSink<TC1,TC2> CRTP variant for packet hierarchy w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 4: Builder overload — `.Multi<TC1,TC2>(c1, c2)` for packet builder\\n\\n**Files:**\\n- Modify: `src/Relay/Builder/SinkChain.Packet.cs`\\n\\n- [ ] **Step 1: Append the overload**\\n\\nLocate the existing `Multi(params PacketSink[] children)` method. Append after it:\\n\\n```csharp\\n/// <summary>\\n/// Fixed-arity 2-branch broadcast using the CRTP <see cref=\\\"Multi2PacketSink{TC1,TC2}\\\"/>\\n/// variant. When <typeparamref name=\\\"TC1\\\"/> and <typeparamref name=\\\"TC2\\\"/> are sealed, the\\n/// JIT devirtualizes both <c>Enqueue<\u002Fc> calls — saves 1-3 ns vs the array-based overload.\\n/// <\u002Fsummary>\\npublic SinkChain<THead> Multi<TC1, TC2>(TC1 c1, TC2 c2)\\n    where TC1 : PacketSink\\n    where TC2 : PacketSink\\n{\\n    var multi  = new Multi2PacketSink<TC1, TC2>(c1, c2);\\n    _tail.Next = multi;\\n    _tail      = multi;\\n    return this;\\n}\\n```\\n\\n- [ ] **Step 2: Add a builder test (optional, recommended)**\\n\\nAppend to `tests/Relay.Tests/MultiSinkPacketTests.cs`:\\n\\n```csharp\\n[Fact]\\npublic void Builder_Multi_TC1_TC2_BroadcastsAfterBuild()\\n{\\n    var a = new CollectingSink();\\n    var b = new CollectingSink();\\n    // Use SinkChainBuilder.Start with NullSink as head, then .Multi.\\n    var head = Relay.Builder.SinkChainBuilder\\n        .Start<NullSink>(NullSink.Instance)\\n        .To(new Multi2PacketSink<CollectingSink, CollectingSink>(a, b))\\n        .Head;\\n    // The chain places Multi2 as the fallback for NullSink.\\n    // NullSink.Accept always returns true, so the payload never reaches Multi2 under default\\n    // PropagateAfterAccept=false. This test only verifies the builder did not throw and the\\n    // chain is well-formed.\\n    head.Should().BeOfType<NullSink>();\\n}\\n```\\n\\n> **Note:** the `.Multi<TC1, TC2>(c1, c2)` builder overload installs the CRTP sink as a tail's `Next`. Default `PropagateAfterAccept=false` on `NullSink` means the payload doesn't actually reach `Multi2PacketSink` — but the wiring assertion is what matters here. Adjust the test to use a propagating head if you want to exercise broadcast through the builder; otherwise this minimal test is sufficient.\\n\\n- [ ] **Step 3: Build and run tests**\\n\\nRun: `dotnet test tests/Relay.Tests`\\nExpected: 0 failed.\\n\\n- [ ] **Step 4: Commit**\\n\\n```bash\\ngit add src/Relay/Builder/SinkChain.Packet.cs tests/Relay.Tests/MultiSinkPacketTests.cs\\ngit commit -m \\\"feat: add SinkChain<THead>.Multi<TC1,TC2>(c1,c2) overload for packet CRTP variant w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 5: BDN — extend `MultiPacketEnqueueBenchmarks`\\n\\n**Files:**\\n- Modify: `benchmarks/Relay.Benchmarks/PacketSinks/MultiPacketEnqueueBenchmarks.cs`\\n\\n- [ ] **Step 1: Append `Multi2` benchmark + field**\\n\\nLocate the existing `MultiPacketEnqueueBenchmarks` class. Add a `_multi2` field and a benchmark:\\n\\n```csharp\\nprivate Multi2PacketSink<ByteCounterPipe, ByteCounterPipe> _multi2 = null!;\\n\\n// inside GlobalSetup, after _multi assignment:\\n_multi2 = new Multi2PacketSink<ByteCounterPipe, ByteCounterPipe>(\\n    new ByteCounterPipe(), new ByteCounterPipe());\\n\\n// new method:\\n[Benchmark]\\npublic void Multi2_Packet_Enqueue() => _multi2.Enqueue(_payload);\\n```\\n\\n> **Important:** keep the existing `Multi_Packet_Enqueue` as `[Benchmark(Baseline = true)]` so the new method's `Ratio` column compares CRTP variant vs array-based. Expected ratio < 1.0 (CRTP faster).\\n\\n- [ ] **Step 2: Build**\\n\\nRun: `dotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo`\\nExpected: 0 errors.\\n\\n- [ ] **Step 3: Run the BDN**\\n\\n```bash\\ndotnet run --project benchmarks/Relay.Benchmarks -c Release --no-build -- \\\\\\n  --filter \\\"*MultiPacketEnqueueBenchmarks*\\\" \\\\\\n  --job short \\\\\\n  --artifacts benchmarks/artifacts/2026-04-29-phase6 \\\\\\n  --exporters json markdown\\n```\\n\\nInspect `Relay.Benchmarks.PacketSinks.MultiPacketEnqueueBenchmarks-report-github.md`. Sanity gate: `Multi2_Packet_Enqueue` ratio should be ≤ 1.0 (faster than baseline) or within ±10% (statistical noise on sub-ns measurements). If ratio > 1.5x, abort and investigate — CRTP should not be slower.\\n\\n- [ ] **Step 4: Commit**\\n\\n```bash\\ngit add benchmarks/Relay.Benchmarks/PacketSinks/MultiPacketEnqueueBenchmarks.cs benchmarks/artifacts/2026-04-29-phase6/\\ngit commit -m \\\"test: extend MultiPacketEnqueueBenchmarks w/ Multi2_Packet_Enqueue (M3 — CRTP packet variant) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 6: Update CLAUDE.md\\n\\n**Files:**\\n- Modify: `CLAUDE.md`\\n\\n- [ ] **Step 1: Locate the `MultiSink<T>` semantics section**\\n\\nFind the bullet list with `Multi2Sink<T, TC1, TC2> CRTP variant`. Append a parallel note for the packet hierarchy.\\n\\nExisting text (around line 113):\\n```markdown\\n- **`Multi2Sink<T, TC1, TC2>` CRTP variant:** prefer when `TC1` and `TC2` are `sealed` — JIT devirtualizes and inlines both `Enqueue` calls, saving ~6c. Requires concrete sealed types known at compile time.\\n```\\n\\nReplace with:\\n\\n```markdown\\n- **`Multi2Sink<T, TC1, TC2>` CRTP variant:** prefer when `TC1` and `TC2` are `sealed` — JIT devirtualizes and inlines both `Enqueue` calls, saving ~6c. Requires concrete sealed types known at compile time.\\n- **`Multi2PacketSink<TC1, TC2>` (packet hierarchy CRTP variant):** parallel to `Multi2Sink`, fixed-arity 2-child broadcast for `PacketSink` chains. Same JIT devirtualization properties when `TC1`, `TC2` are sealed. Available since Phase 6.\\n```\\n\\n- [ ] **Step 2: Commit**\\n\\n```bash\\ngit add CLAUDE.md\\ngit commit -m \\\"docs: CLAUDE.md mentions Multi2PacketSink as parallel CRTP variant for packet hierarchy w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 7: Update Master Plan + Cross-Check\\n\\n- [ ] **Step 1**: in master plan, mark Phase 6 done.\\n\\n- [ ] **Step 2**: in cross-check `§3` medium-priority, mark M3 as resolved (`~~M3~~ resolved`) with Phase 6 reference + numbers.\\n\\n- [ ] **Step 3**: commit.\\n\\n```bash\\ngit add docs/superpowers/plans/2026-04-29-master-cost-map-coverage.md \\\\\\n        benchmarks/artifacts/2026-04-29-hotpath/cross-check-and-gaps.md\\ngit commit -m \\\"docs: mark Phase 6 done — Multi2PacketSink CRTP variant landed w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 8: Final Verification\\n\\n- [ ] **Step 1**: `dotnet test tests/Relay.Tests` — 0 failed (193+ pass).\\n- [ ] **Step 2**: `git log --oneline develop..HEAD` — 7 commits expected.\\n- [ ] **Step 3**: STOP — do not push. User pushes + merges.\\n\\n---\\n\\n## Self-Review Checklist\\n\\n- ✅ M3 closed — new `Multi2PacketSink<TC1, TC2>` exists, builder overload, 6 tests, BDN extension.\\n- ✅ TDD order — failing tests in Task 2, implementation in Task 3.\\n- ✅ No placeholders.\\n- ✅ Type consistency — `Multi2PacketSink<TC1, TC2>` named identically across class, builder overload, tests, BDN.\\n- ✅ Branch `feat/260429-multi2-packet-sink` per CLAUDE.md.\\n- ✅ Conventional Commits + `w/Claude`. `feat:` for new public type.\\n- ✅ Test gate enforced.\\n- ✅ CLAUDE.md updated to keep architectural docs aligned.\", \"/docs/superpowers/plans/2026-04-29-phase7-mpsc-contention.md\": \"# Phase 7 — MPSC Multi-Thread Contention BDN\\n\\n> **Phase 7 of 8** in master plan. **For agentic workers:** REQUIRED SUB-SKILL: superpowers:subagent-driven-development.\\n\\n**Goal:** Add multi-producer contention BDN for `MpscRingBuffer<Entry64>` and `MpscByteRingBuffer`. Closes coverage gap **M10** (blind subgraph §8 in cost-map — \\\"MPSC CAS-retry distribution\\\"). **No production code changes** (no instrumentation; throughput is the measurable proxy).\\n\\n**Architecture:** custom BDN harness that spawns N producer threads pinned via `Thread.Priority` (cannot use `ProcessorAffinity` from BCL on .NET — Process.ProcessorAffinity is process-wide). Single consumer thread. Producers coordinate via `ManualResetEventSlim` start gate; benchmark method measures wall-clock from \\\"start gate released\\\" to \\\"all producers done + consumer drained\\\".\\n\\n**Metric:** **items per second total throughput** at producer counts 1, 2, 4, 8. Cost-map blind subgraph is closed by *measurement* (throughput tells us how much retry+coherence cost there is), not by counting retries. Invasive retry-counter instrumentation is OUT of scope for this phase — propose as a follow-up if numbers are surprising.\\n\\n**Tech Stack:** BenchmarkDotNet 0.13.12, .NET 9. No production code change.\\n\\n**Out of scope:** retry-counter instrumentation in `MpscRingBuffer`/`MpscByteRingBuffer` (would require production changes; flag as follow-up).\\n\\n**Acceptance gate:**\\n- New BDN class compiles and runs under `--job short`\\n- Throughput numbers surface for at least 1, 2, 4 producer counts (8 may be skipped on dev box if too noisy)\\n- Cost-map §8 blind subgraph entry is replaced with \\\"measured: <X items/sec at N producers>\\\"\\n\\n---\\n\\n## File Structure\\n\\n| File | Action | Responsibility |\\n|---|---|---|\\n| `benchmarks/Relay.Benchmarks/MpscContentionBenchmarks.cs` | **Create** | Multi-producer typed `MpscRingBuffer<Entry64>` throughput at N=1, 2, 4, 8 |\\n| `benchmarks/Relay.Benchmarks/MpscByteContentionBenchmarks.cs` | **Create** | Multi-producer `MpscByteRingBuffer` throughput at N=1, 2, 4, 8 |\\n\\n---\\n\\n## Task 1: Branch & Baseline\\n\\n- [ ] **Step 1: Create the Phase 7 branch**\\n\\n```bash\\ngit checkout develop\\ngit pull\\ngit checkout -b chore/260429-bdn-mpsc-multi-thread-contention\\n```\\n\\n- [ ] **Step 2: Verify baseline tests pass**\\n\\nRun: `dotnet test tests/Relay.Tests`\\nExpected: 0 failures.\\n\\n- [ ] **Step 3: Commit Phase 7 plan + any session strays**\\n\\n```bash\\ngit add docs/superpowers/plans/2026-04-29-phase7-mpsc-contention.md\\n# Include .claude/settings.local.json if modified during the session.\\ngit commit -m \\\"docs: add Phase 7 child plan w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 2: M10 — `MpscContentionBenchmarks.cs` (typed)\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/MpscContentionBenchmarks.cs`\\n\\n- [ ] **Step 1: Write the BDN class**\\n\\n```csharp\\nusing System;\\nusing System.Diagnostics;\\nusing System.Threading;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay.Buffers;\\n\\nnamespace Relay.Benchmarks;\\n\\n/// <summary>\\n/// Measures <see cref=\\\"MpscRingBuffer{T}\\\"/> throughput under multi-producer contention.\\n/// Closes coverage gap M10 (cost-map §8 \\\"MPSC CAS-retry distribution\\\") by surfacing\\n/// throughput at producer counts 1, 2, 4, 8 — retry rate is implicit in the throughput\\n/// curve.\\n/// <\u002Fsummary>\\n/// <remarks>\\n/// <para>\\n/// Producers run as dedicated <see cref=\\\"Thread\\\"/> instances (not Tasks — we want stable\\n/// scheduling, no thread-pool sharing). A single consumer thread drains the ring while\\n/// producers are publishing. The benchmark method measures wall-clock from \\\"start gate\\n/// released\\\" to \\\"consumer drained N×ItemsPerProducer items\\\".\\n/// <\u002Fpara>\\n/// <para>\\n/// <b>Single-thread baseline (ProducerCount=1):<\u002Fb> directly comparable to\\n/// <c>MpscBenchmarks.Mpsc_TryPublish_NoContention<\u002Fc> from Phase 0 — except this class\\n/// runs the producer on a dedicated <see cref=\\\"Thread\\\"/> rather than the BDN measurement\\n/// thread, so absolute numbers will differ slightly.\\n/// <\u002Fpara>\\n/// <\u002Fremarks>\\n[MemoryDiagnoser]\\npublic class MpscContentionBenchmarks\\n{\\n    private const int RingCapacity     = 65_536;\\n    private const int ItemsPerProducer = 1_000_000;\\n\\n    [Params(1, 2, 4, 8)]\\n    public int ProducerCount;\\n\\n    private MpscRingBuffer<Entry64> _ring     = null!;\\n    private Entry64                 _item;\\n    private Thread[]                _producers = null!;\\n    private Thread                  _consumer = null!;\\n    private ManualResetEventSlim    _startGate = null!;\\n    private CountdownEvent          _producerDone = null!;\\n    private long                    _consumed;\\n\\n    [GlobalSetup]\\n    public void GlobalSetup()\\n    {\\n        _item = new Entry64 { A = 1, B = 2 };\\n    }\\n\\n    [IterationSetup]\\n    public void IterationSetup()\\n    {\\n        _ring         = new MpscRingBuffer<Entry64>(RingCapacity);\\n        _startGate    = new ManualResetEventSlim(false);\\n        _producerDone = new CountdownEvent(ProducerCount);\\n        Interlocked.Exchange(ref _consumed, 0L);\\n\\n        _producers = new Thread[ProducerCount];\\n        for (int i = 0; i < ProducerCount; i++)\\n        {\\n            _producers[i] = new Thread(ProducerLoop)\\n            {\\n                IsBackground = true,\\n                Priority     = ThreadPriority.AboveNormal,\\n                Name         = $\\\"mpsc-producer-{i}\\\"\\n            };\\n            _producers[i].Start();\\n        }\\n\\n        _consumer = new Thread(ConsumerLoop)\\n        {\\n            IsBackground = true,\\n            Priority     = ThreadPriority.AboveNormal,\\n            Name         = \\\"mpsc-consumer\\\"\\n        };\\n        _consumer.Start();\\n\\n        // Give threads time to reach the start gate.\\n        Thread.Sleep(50);\\n    }\\n\\n    [IterationCleanup]\\n    public void IterationCleanup()\\n    {\\n        _ring.Dispose();\\n        _startGate.Dispose();\\n        _producerDone.Dispose();\\n    }\\n\\n    [Benchmark]\\n    public long Mpsc_Throughput_TotalItems()\\n    {\\n        long target = (long)ProducerCount * ItemsPerProducer;\\n\\n        var sw = Stopwatch.StartNew();\\n        _startGate.Set();\\n\\n        // Wait for all producers to finish publishing AND consumer to drain.\\n        _producerDone.Wait();\\n        SpinWait sp = default;\\n        while (Volatile.Read(ref _consumed) < target) sp.SpinOnce();\\n\\n        sw.Stop();\\n        return Volatile.Read(ref _consumed);\\n    }\\n\\n    private void ProducerLoop()\\n    {\\n        _startGate.Wait();\\n        for (int i = 0; i < ItemsPerProducer; i++)\\n        {\\n            // Spin until publish succeeds — captures retry cost in the throughput envelope.\\n            SpinWait sp = default;\\n            while (!_ring.TryPublish(in _item)) sp.SpinOnce();\\n        }\\n        _producerDone.Signal();\\n    }\\n\\n    private void ConsumerLoop()\\n    {\\n        long target = (long)ProducerCount * ItemsPerProducer;\\n        SpinWait sp = default;\\n        while (Volatile.Read(ref _consumed) < target)\\n        {\\n            if (_ring.TryConsume(out _))\\n            {\\n                Interlocked.Increment(ref _consumed);\\n                sp.Reset();\\n            }\\n            else\\n            {\\n                sp.SpinOnce();\\n            }\\n        }\\n    }\\n}\\n```\\n\\n- [ ] **Step 2: Build**\\n\\nRun: `dotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo`\\nExpected: 0 errors.\\n\\n- [ ] **Step 3: Commit**\\n\\n```bash\\ngit add benchmarks/Relay.Benchmarks/MpscContentionBenchmarks.cs\\ngit commit -m \\\"test: add MpscContentionBenchmarks (M10 typed — multi-producer throughput at N=1,2,4,8) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 3: M10 — `MpscByteContentionBenchmarks.cs` (packet)\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/MpscByteContentionBenchmarks.cs`\\n\\n- [ ] **Step 1: Write the BDN class**\\n\\nSame structure as Task 2 but for `MpscByteRingBuffer` with byte payload.\\n\\n```csharp\\nusing System;\\nusing System.Diagnostics;\\nusing System.Threading;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay.Buffers;\\n\\nnamespace Relay.Benchmarks;\\n\\n/// <summary>\\n/// Measures <see cref=\\\"MpscByteRingBuffer\\\"/> throughput under multi-producer contention.\\n/// Companion of <see cref=\\\"MpscContentionBenchmarks\\\"/> for the byte/packet ring.\\n/// <\u002Fsummary>\\n[MemoryDiagnoser]\\npublic class MpscByteContentionBenchmarks\\n{\\n    private const int RingCapacity     = 65_536;\\n    private const int ItemsPerProducer = 1_000_000;\\n    private const int PayloadSize      = 64;\\n\\n    [Params(1, 2, 4, 8)]\\n    public int ProducerCount;\\n\\n    private MpscByteRingBuffer    _ring        = null!;\\n    private byte[]                _payload     = null!;\\n    private Thread[]              _producers   = null!;\\n    private Thread                _consumer    = null!;\\n    private ManualResetEventSlim  _startGate   = null!;\\n    private CountdownEvent        _producerDone = null!;\\n    private long                  _consumed;\\n\\n    [GlobalSetup]\\n    public void GlobalSetup()\\n    {\\n        _payload = new byte[PayloadSize];\\n        for (int i = 0; i < PayloadSize; i++) _payload[i] = (byte)i;\\n    }\\n\\n    [IterationSetup]\\n    public void IterationSetup()\\n    {\\n        _ring         = new MpscByteRingBuffer(RingCapacity);\\n        _startGate    = new ManualResetEventSlim(false);\\n        _producerDone = new CountdownEvent(ProducerCount);\\n        Interlocked.Exchange(ref _consumed, 0L);\\n\\n        _producers = new Thread[ProducerCount];\\n        for (int i = 0; i < ProducerCount; i++)\\n        {\\n            _producers[i] = new Thread(ProducerLoop)\\n            {\\n                IsBackground = true,\\n                Priority     = ThreadPriority.AboveNormal,\\n                Name         = $\\\"mpsc-byte-producer-{i}\\\"\\n            };\\n            _producers[i].Start();\\n        }\\n\\n        _consumer = new Thread(ConsumerLoop)\\n        {\\n            IsBackground = true,\\n            Priority     = ThreadPriority.AboveNormal,\\n            Name         = \\\"mpsc-byte-consumer\\\"\\n        };\\n        _consumer.Start();\\n\\n        Thread.Sleep(50);\\n    }\\n\\n    [IterationCleanup]\\n    public void IterationCleanup()\\n    {\\n        _ring.Dispose();\\n        _startGate.Dispose();\\n        _producerDone.Dispose();\\n    }\\n\\n    [Benchmark]\\n    public long Mpsc_Byte_Throughput_TotalItems()\\n    {\\n        long target = (long)ProducerCount * ItemsPerProducer;\\n\\n        var sw = Stopwatch.StartNew();\\n        _startGate.Set();\\n\\n        _producerDone.Wait();\\n        SpinWait sp = default;\\n        while (Volatile.Read(ref _consumed) < target) sp.SpinOnce();\\n\\n        sw.Stop();\\n        return Volatile.Read(ref _consumed);\\n    }\\n\\n    private void ProducerLoop()\\n    {\\n        _startGate.Wait();\\n        for (int i = 0; i < ItemsPerProducer; i++)\\n        {\\n            SpinWait sp = default;\\n            while (!_ring.TryPublish(_payload)) sp.SpinOnce();\\n        }\\n        _producerDone.Signal();\\n    }\\n\\n    private void ConsumerLoop()\\n    {\\n        long target = (long)ProducerCount * ItemsPerProducer;\\n        SpinWait sp = default;\\n        while (Volatile.Read(ref _consumed) < target)\\n        {\\n            if (_ring.TryPeek(out _, out int adv))\\n            {\\n                _ring.Advance(adv);\\n                Interlocked.Increment(ref _consumed);\\n                sp.Reset();\\n            }\\n            else\\n            {\\n                sp.SpinOnce();\\n            }\\n        }\\n    }\\n}\\n```\\n\\n- [ ] **Step 2: Build**\\n\\nRun: `dotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo`\\nExpected: 0 errors.\\n\\n- [ ] **Step 3: Commit**\\n\\n```bash\\ngit add benchmarks/Relay.Benchmarks/MpscByteContentionBenchmarks.cs\\ngit commit -m \\\"test: add MpscByteContentionBenchmarks (M10 packet — multi-producer throughput) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 4: Run the BDNs\\n\\n**Files:**\\n- Create artifacts under: `benchmarks/artifacts/2026-04-29-phase7/`\\n\\n- [ ] **Step 1: Run the BDNs**\\n\\n```bash\\ndotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nolog nst `HfClock.NowTicks`. Wall-clock day naming (`_currentDay`) is unchanged — still resampled via `DateTime.UtcNow.Date` only in `RotateNow`. Add an `internal` test hook to allow forcing the boundary in unit tests without time mocking.\\n\\n**Tech Stack:** .NET 9, C# 13, xUnit 2.9.2, FluentAssertions 6.12.1, BenchmarkDotNet 0.13.12. Stack already in `Directory.Packages.props`.\\n\\n**Out of scope:** `UdpSink.WriteToBackend` per-record syscall — UDP is per-datagram by design (1 payload = 1 datagram); batching at this layer would change wire semantics. Documented as known throughput ceiling in cost-map. No code change. Will be measured in Phase 4 of the master plan.\\n\\n**Acceptance gate (added by master plan):** `RotatingFileSinkBenchmarks.ShouldRotate_HotPath` ratio (baseline / post-fix) ≥ 10x. Phase 8 (calibration) annotates cost-map with the absolute measured ns.\\n\\n---\\n\\n## File Structure\\n\\n| File | Action | Responsibility |\\n|---|---|---|\\n| `benchmarks/Relay.Benchmarks/Sinks/RotatingFileSinkBenchmarks.cs` | **Create** | New BDN class measuring `ShouldRotate` cost via `WriteToBackend` invocation. Captures baseline before fix and verifies post-fix. **Required by acceptance gate (≥10x ratio improvement).** |\\n| `src/Relay/Sinks/RotatingFileSink.cs` | Modify | Add `_nextDayBoundaryTicks` field + `ComputeNextDayBoundaryTicks` helper; replace `DateTime.UtcNow.Date` check with HfClock-tick compare; add `internal` test hook |\\n| `tests/Relay.Tests/Sinks/RotatingFileSinkTests.cs` | Modify | Add failing test for day-boundary rotation using new `internal` hook |\\n| `CHANGELOG.md` | Modify | Add entry under unreleased — `fix:` |\\n| `docs/reports/2026-04-29-resource-cost-map-relay.md` | Modify | Update §5 row (status: regression → resolved), §1 / §2 / §9 with measured numbers |\\n\\n---\\n\\n## Task 1: Branch & Baseline\\n\\n**Files:** _none modified_\\n\\n- [ ] **Step 1: Create the fix branch**\\n\\n```bash\\ngit checkout develop\\ngit pull\\ngit checkout -b fix/260429-rotatingfilesink-utcnow-hot-path\\n```\\n\\n- [ ] **Step 2: Verify baseline tests pass**\\n\\nRun: `dotnet test tests/Relay.Tests`\\nExpected: 0 failures (matches the project's commit-gate invariant).\\n\\nIf any test fails on the unmodified baseline, stop and surface the failure — do not proceed.\\n\\n- [ ] **Step 3: No commit yet** (baseline-only).\\n\\n---\\n\\n## Task 2: BDN baseline class — capture pre-fix cost\\n\\nThis task adds the perf gate that gives the fix a measurable acceptance criterion. The BDN class is committed FIRST (before any production-code change) so the BDN history shows a clear \\\"before\\\" point for the regression that is being fixed.\\n\\n**Files:**\\n- Create: `benchmarks/Relay.Benchmarks/Sinks/RotatingFileSinkBenchmarks.cs`\\n\\n- [ ] **Step 1: Create the BDN class measuring `WriteToBackend` cost (which routes through `ShouldRotate`)**\\n\\nWrite to `benchmarks/Relay.Benchmarks/Sinks/RotatingFileSinkBenchmarks.cs`:\\n\\n```csharp\\nusing System;\\nusing System.IO;\\nusing System.Reflection;\\nusing BenchmarkDotNet.Attributes;\\nusing Relay.Sinks;\\n\\nnamespace Relay.Benchmarks.Sinks;\\n\\n/// <summary>\\n/// Measures <see cref=\\\"RotatingFileSink\\\"/> consumer hot path — specifically the cost of\\n/// the per-record rotation predicate (<c>ShouldRotate<\u002Fc>) which historically called\\n/// <c>DateTime.UtcNow.Date<\u002Fc>. Used as a regression gate for the fix that caches the\\n/// next-day boundary in <c>HfClock<\u002Fc> ticks.\\n/// <\u002Fsummary>\\n/// <remarks>\\n/// Driven directly via reflection on the protected <c>WriteToBackend<\u002Fc> method to isolate\\n/// the consumer-thread cost from ring publish + consumer-loop cost. The benchmark runs in a\\n/// single thread; no Start/Stop. Each invocation writes 64 bytes into the POH write buffer\\n/// and exercises the <c>ShouldRotate<\u002Fc> predicate exactly once.\\n/// <para>\\n/// The reflection invoke adds a fixed ~500-cycle overhead, but the absolute number is not\\n/// the gate — the <b>ratio<\u002Fb> (before-fix / after-fix mean ns) is what acceptance checks.\\n/// Expected ratio after the fix lands: ≥ 10x.\\n/// <\u002Fpara>\\n/// <\u002Fremarks>\\n[MemoryDiagnoser]\\npublic class RotatingFileSinkBenchmarks\\n{\\n    private RotatingFileSink _sink           = null!;\\n    private MethodInfo       _writeToBackend = null!;\\n    private byte[]           _payload        = new byte[64];\\n    private string           _dir            = string.Empty;\\n    private object[]         _args           = null!;\\n\\n    [GlobalSetup]\\n    public void Setup()\\n    {\\n        _dir = Path.Combine(Path.GetTempPath(), $\\\"relay-bench-{Guid.NewGuid():N}\\\");\\n        Directory.CreateDirectory(_dir);\\n        _sink = new RotatingFileSink(_dir, \\\"log\\\",\\n            maxBytes:        1_000_000_000, // large — size-based rotation never triggers\\n            ringCapacity:    4096,\\n            flushIntervalMs: 50);\\n        // Do NOT call Start() — drive WriteToBackend directly via reflection to isolate\\n        // ShouldRotate cost from ring/consumer-loop overhead.\\n\\n        _writeToBackend = typeof(RotatingFileSink).GetMethod(\\n            \\\"WriteToBackend\\\",\\n            BindingFlags.Instance | BindingFlags.NonPublic)!;\\n\\n        _args = new object[] { (ReadOnlyMemory<byte>)_payload };\\n    }\\n\\n    [GlobalCleanup]\\n    public void Cleanup()\\n    {\\n        try { _sink?.Dispose(); }              catch { }\\n        try { Directory.Delete(_dir, true); }  catch { }\\n    }\\n\\n    /// <summary>\\n    /// Single payload through <c>WriteToBackend<\u002Fc> — exercises <c>ShouldRotate<\u002Fc> exactly once.\\n    /// Before fix: dominated by <c>DateTime.UtcNow.Date<\u002Fc> (~11 ns @ 4.5 GHz).\\n    /// After fix: single <c>HfClock.NowTicks<\u002Fc> compare (~0.7 ns @ 4.5 GHz).\\n    /// <\u002Fsummary>\\n    [Benchmark]\\n    public void ShouldRotate_HotPath()\\n    {\\n        _writeToBackend.Invoke(_sink, _args);\\n    }\\n}\\n```\\n\\n- [ ] **Step 2: Build and verify the BDN class compiles**\\n\\nRun: `dotnet build benchmarks/Relay.Benchmarks/Relay.Benchmarks.csproj -c Release --nologo`\\nExpected: 0 warnings, 0 errors.\\n\\n- [ ] **Step 3: Run the BDN on the fix branch, before any production code change**\\n\\nRun:\\n```bash\\ndotnet run --project benchmarks/Relay.Benchmarks -c Release --no-build -- \\\\\\n  --filter \\\"*RotatingFileSinkBenchmarks*\\\" \\\\\\n  --job short \\\\\\n  --artifacts benchmarks/artifacts/2026-04-29-phase1\\n```\\n\\nExpected: 1 benchmark, exits 0. Inspect:\\n`benchmarks/artifacts/2026-04-29-phase1/results/Relay.Benchmarks.Sinks.RotatingFileSinkBenchmarks-report-github.md`\\n\\nRecord the **baseline mean ns** (call it `BASELINE_NS`). Used in Task 8 ratio check.\\n\\n- [ ] **Step 4: Run the existing test suite to confirm the BDN class did not break tests**\\n\\nRun: `dotnet test tests/Relay.Tests`\\nExpected: 0 failures.\\n\\n- [ ] **Step 5: Commit the BDN class WITHOUT the fix**\\n\\n```bash\\ngit add benchmarks/Relay.Benchmarks/Sinks/RotatingFileSinkBenchmarks.cs benchmarks/artifacts/2026-04-29-phase1/\\ngit commit -m \\\"test: add RotatingFileSinkBenchmarks.ShouldRotate_HotPath baseline w/Claude\\n\\nBaseline: <BASELINE_NS> ns/op (DateTime.UtcNow.Date in hot path).\\nUsed as regression gate in Task 8 — fix must reduce ratio by ≥ 10x.\\\"\\n```\\n\\nReplace `<BASELINE_NS>` with the value recorded in Step 3.\\n\\n---\\n\\n## Task 3: Failing Test — Day-Boundary Crossing Triggers Rotation\\n\\n**Files:**\\n- Modify: `tests/Relay.Tests/Sinks/RotatingFileSinkTests.cs`\\n\\n- [ ] **Step 1: Add the failing test**\\n\\nAppend after the `Header_WrittenOncePerNewFile` test (around line 80), before `Dispose_IsIdempotent`. Use the `Relay.Internal` namespace for `HfClock` (visible via `InternalsVisibleTo Relay.Tests`).\\n\\n```csharp\\n[Fact]\\npublic void Enqueue_DayBoundaryCrossed_RotatesToNextFile()\\n{\\n    using var sink = new RotatingFileSink(_dir, \\\"log\\\", maxBytes: 1_000_000,\\n                                          ringCapacity: 4096, flushIntervalMs: 50);\\n    sink.Start();\\n\\n    sink.Enqueue(new byte[100]);\\n    Thread.Sleep(120);                              // let the consumer drain into file 1\\n\\n    sink.SetDayBoundaryForTest(Relay.Internal.HfClock.NowTicks - 1); // simulate \\\"yesterday ended\\\"\\n\\n    sink.Enqueue(new byte[100]);\\n    sink.Stop(drainTimeoutMs: 1_000);\\n\\n    var files = Directory.GetFiles(_dir, \\\"log-*.log\\\");\\n    files.Should().HaveCountGreaterThan(1, \\\"day boundary crossed → rotated\\\");\\n}\\n```\\n\\n- [ ] **Step 2: Run the test to verify it fails for the right reason**\\n\\nRun: `dotnet test tests/Relay.Tests --filter \\\"FullyQualifiedName~Enqueue_DayBoundaryCrossed_RotatesToNextFile\\\"`\\nExpected: COMPILE FAIL — `RotatingFileSink` does not contain `SetDayBoundaryForTest`. This is the TDD red.\\n\\n- [ ] **Step 3: No commit yet.** Test will be wired up after the implementation lands and compiles.\\n\\n---\\n\\n## Task 4: Implementation — Cache Day Boundary in HfClock Ticks\\n\\n**Files:**\\n- Modify: `src/Relay/Sinks/RotatingFileSink.cs`\\n\\n- [ ] **Step 1: Add the new field next to `_currentDay`**\\n\\nLocate the field block (around line 30 of `src/Relay/Sinks/RotatingFileSink.cs`). Replace:\\n\\n```csharp\\n    private DateTime    _currentDay;\\n    private int         _backoffMs      = MinBackoffMs;\\n    private long        _nextRetryTicks;\\n```\\n\\nwith:\\n\\n```csharp\\n    private DateTime    _currentDay;\\n    private long        _nextDayBoundaryTicks;          // HfClock ticks at the next UTC midnight\\n    private int         _backoffMs      = MinBackoffMs;\\n    private long        _nextRetryTicks;\\n```\\n\\n- [ ] **Step 2: Initialize the boundary in the constructor**\\n\\nLocate the constructor body (around line 50). Replace:\\n\\n```csharp\\n        _currentDay  = DateTime.UtcNow.Date;\\n    }\\n```\\n\\nwith:\\n\\n```csharp\\n        _currentDay           = DateTime.UtcNow.Date;\\n        _nextDayBoundaryTicks = ComputeNextDayBoundaryTicks();\\n    }\\n```\\n\\n- [ ] **Step 3: Replace the hot-path `DateTime.UtcNow.Date` check**\\n\\nLocate `ShouldRotate` (around line 82). Replace the entire method:\\n\\n```csharp\\n    private bool ShouldRotate(int incomingBytes)\\n    {\\n        if (_currentFileBytes + incomingBytes > _maxBytes) return true;\\n        if (DateTime.UtcNow.Date > _currentDay) return true;\\n        return false;\\n    }\\n```\\n\\nwith:\\n\\n```csharp\\n    private bool ShouldRotate(int incomingBytes)\\n    {\\n        if (_currentFileBytes + incomingBytes > _maxBytes) return true;\\n        if (HfClock.NowTicks >= _nextDayBoundaryTicks) return true;\\n        return false;\\n    }\\n```\\n\\n- [ ] **Step 4: Resample the boundary in `RotateNow`**\\n\\nLocate `RotateNow` (around line 89). Replace:\\n\\n```csharp\\n    private void RotateNow()\\n    {\\n        FlushToStream();\\n        _stream?.Dispose();\\n        _stream = null;\\n        _seq++;\\n        _currentDay       = DateTime.UtcNow.Date;\\n        _currentFileBytes = 0;\\n        TryOpenStream();\\n        Cleanup();\\n    }\\n```\\n\\nwith:\\n\\n```csharp\\n    private void RotateNow()\\n    {\\n        FlushToStream();\\n        _stream?.Dispose();\\n        _stream = null;\\n        _seq++;\\n        _currentDay           = DateTime.UtcNow.Date;\\n        _nextDayBoundaryTicks = ComputeNextDayBoundaryTicks();\\n        _currentFileBytes     = 0;\\n        TryOpenStream();\\n        Cleanup();\\n    }\\n```\\n\\n- [ ] **Step 5: Add the helper + internal test hook**\\n\\nAppend immediately before the closing brace of the class (after `Cleanup()` around line 167):\\n\\n```csharp\\n    private static long ComputeNextDayBoundaryTicks()\\n    {\\n        var  now          = DateTime.UtcNow;\\n        var  nextMidnight = now.Date.AddDays(1);\\n        long msUntil      = (long)(nextMidnight - now).TotalMilliseconds;\\n        return HfClock.NowTicks + msUntil * (Stopwatch.Frequency / 1_000);\\n    }\\n\\n    /// <summary>\\n    /// Test-only hook: forces the next-day-boundary tick threshold. Visible to\\n    /// <c>Relay.Tests<\u002Fc> via <c>InternalsVisibleTo<\u002Fc>. Production callers must use\\n    /// <see cref=\\\"ComputeNextDayBoundaryTicks\\\"/> (resampled inside <see cref=\\\"RotateNow\\\"/>).\\n    /// <\u002Fsummary>\\n    internal void SetDayBoundaryForTest(long ticks) => _nextDayBoundaryTicks = ticks;\\n```\\n\\n- [ ] **Step 6: Run the new test to verify it passes**\\n\\nRun: `dotnet test tests/Relay.Tests --filter \\\"FullyQualifiedName~Enqueue_DayBoundaryCrossed_RotatesToNextFile\\\"`\\nExpected: PASS.\\n\\n- [ ] **Step 7: Run the full RotatingFileSink test class to verify no regressions**\\n\\nRun: `dotnet test tests/Relay.Tests --filter \\\"FullyQualifiedName~RotatingFileSinkTests\\\"`\\nExpected: 5 passed (4 existing + 1 new), 0 failed.\\n\\n- [ ] **Step 8: Run the full test suite**\\n\\nRun: `dotnet test tests/Relay.Tests`\\nExpected: 0 failed.\\n\\n- [ ] **Step 9: Commit**\\n\\n```bash\\ngit add src/Relay/Sinks/RotatingFileSink.cs tests/Relay.Tests/Sinks/RotatingFileSinkTests.cs\\ngit commit -m \\\"fix: cache RotatingFileSink day boundary in HfClock ticks (no DateTime.UtcNow on hot path) w/Claude\\\"\\n```\\n\\n---\\n\\n## Task 5: Update CHANGELOG\\n\\n**Files:**\\n- Modify: `CHANGELOG.md`\\n\\n- [ ] **Step 1: Read the file**\\n\\nRun: `cat CHANGELOG.md` (or use Read tool) to find the topmost unreleased / latest section.\\n\\n- [ ] **Step 2: Add the fix entry**\\n\\nUnder the latest unreleased section (or create one if absent — match the project's existing CHANGELOG style), add:\\n\\n```markdown\\n### Fixed\\n- `RotatingFileSink.ShouldRotate` no longer calls `DateTime.UtcNow.Date` per consumed payload; caches the next UTC-midnight boundary in `HfClock` ticks. Reduces consumer hot-path cost from ~50c to ~3c per payload (BDN ratio ≥ 10x — see Phase 1 BDN under `benchmarks/artifacts/2026-04-29-phase1/`). Resolves regression flagged in `docs/reports/2026-04-29-resource-cost-map-relay.md` §5.\\n```\\n\\nIf the project already uses a different heading format (e.g. Conventional Commits-style), match it exactly. Do not invent new section structure.\\n\\n- [ ] **Step 3: Commit**\\n\\n```bash\\ngit add CHANGELOG.md\\ngit commit -m \\\"docs: changelog entry for RotatingFileSink day-boundary cache w/Claude\\\"\\n```\\n\\n---\\n\\n…(truncated)\", \"/docs/reports/2026-04-30-hot-path-audit-relay.md\": \"# Hot Path Audit — Relay (v4)\\n\\n**Date:** 2026-04-30\\n**Scope:** `src/Relay/**` (full solution)\\n**Auditor:** Claude Sonnet 4.6 / hot-path-audit (generic) skill\\n**Prior reports:** `2026-04-23` (v1), `2026-04-23-v2` (v2), `2026-04-26` (v3)\\n**Cost map consulted:** `2026-04-29-resource-cost-map-relay.md` (Phase 7 BDN calibrated)\\n\\n---\\n\\n## Delta since v3\\n\\nFiles added or changed since the 2026-04-26 audit:\\n\\n| File | Status |\\n|---|---|\\n| `ForkSink.Packet.cs` | Exists; not audited in v3 (landed with PropagateAfterAccept refactor) |\\n| `FilterSink.Packet.cs` | Exists; test coverage now present (`FilterSinkPacketTests`) |\\n| `MultiSink.Packet.cs` | Exists; test coverage now present (`MultiSinkPacketTests`) |\\n| `MmfSinkTests.cs`, `TcpSinkTests.cs` | New — closes two v3 HIGH test gaps |\\n| `FilterSinkPacketTests.cs` | New — closes v3 MEDIUM test gap (predicate-fail invariant) |\\n| `ForkSinkPacketTests.cs` | New; coverage gaps identified below |\\n| `PacketSinkDropCountTests.cs` | New |\\n\\n---\\n\\n## Hot Paths (current — unchanged from v3)\\n\\nAll paths listed in v3 remain current. The cost map is authoritative:\\n\\n| Path | Tier | cycles/call |\\n|---|---|---|\\n| `DispatchSink<T>.Enqueue` / `PacketSink.Enqueue` | ULTRA-HOT | ~2–15c (BDN-calibrated) |\\n| `SpscRingBuffer<T>.TryPublish/TryConsume` | ULTRA-HOT | ~10c (cached head/tail fast path) |\\n| `MpscRingBuffer<T>.TryPublish` | ULTRA-HOT | ~15–20c uncontended (BDN Phase 7) |\\n| `SpscByteRingBuffer.TryPublish/TryPeek` | ULTRA-HOT | ~35c / ~15c |\\n| `MpscByteRingBuffer.TryPublish/TryPeek` | ULTRA-HOT | ~20c / ~12c |\\n| `FilterSink*.Accept`, `ForkSink*.Accept`, `Multi*Sink.Accept` | ULTRA-HOT | ~18–32c |\\n| `SerializeSink<T>.Accept` | ULTRA-HOT | ~5c + downstream |\\n| `BatchSink.WriteToBackend` | HOT (consumer) | ~10c |\\n| `RotatingFileSink.ShouldRotate` | HOT (consumer) | ~3c (BDN Phase 1) |\\n\\n---\\n\\n## Findings\\n\\n### NEW — F21 (MEDIUM) — `ForkSink.Accept` (packet) returns `_primary.IsHealthy` instead of `true`\\n\\n**Location:** `src/Relay/ForkSink.Packet.cs:22–25`\\n\\n```csharp\\nprotected override bool Accept(ReadOnlySpan<byte> payload)\\n{\\n    _primary.Enqueue(payload);\\n    return _primary.IsHealthy;   // ← wrong\\n}\\n```\\n\\n**Problem.** `ForkSink<T>` (typed, `ForkSink.cs:36`) always returns `true`. The packet variant reads `_primary.IsHealthy` *after* calling `_primary.Enqueue`. Two consequences:\\n\\n1. **Spurious `_dropCount` increment.** `PacketSink.Enqueue` logic:\\n   ```\\n   if (IsHealthy && Accept(payload)) { PropagateAfterAccept → Next?.Enqueue; return; }\\n   if (Next is { } next) { next.Enqueue; return; }\\n   Interlocked.Increment(ref _dropCount);  // ← fires when Accept=false AND Next=null\\n   ```\\n   If the primary's consumer thread marks `_healthy = false` in the narrow window between `_primary.Enqueue(payload)` and the `return _primary.IsHealthy` read, `Accept` returns `false`. If `Next` is null at this terminal node, `_dropCount` increments — incorrect. The fork is a best-effort side channel; it must never contribute to terminal-drop accounting.\\n\\n2. **Race-dependent propagation path.** With `Accept` returning `false`, `Next` is reached via the fallback branch rather than the propagate branch. Functionally equivalent when `Next` is not null, but semantically wrong: the fork contract is \\\"deliver to primary **and** always continue to Next.\\\"\\n\\n**Fix.** Return `true`, matching the typed variant and the fork contract:\\n```csharp\\nprotected override bool Accept(ReadOnlySpan<byte> payload)\\n{\\n    _primary.Enqueue(payload);\\n    return true;\\n}\\n```\\n\\n**Test coverage gap.** `ForkSinkPacketTests.Enqueue_PrimaryUnhealthy_OnlyNextReceivesPayload` tests health=false *before* enqueue (so `IsHealthy` short-circuits, `Accept` is never called). No test covers the mid-call health transition described above.\\n\\n**Status: OPEN — fix is a one-line change.**\\n\\n---\\n\\n### NEW — D13 (MEDIUM) — `MpscQueueSink<T>` constructor missing `SinkConstraints.AssertCacheLineAligned<T>()`\\n\\n**Location:** `src/Relay/MpscQueueSink.cs:70`\\n\\n```csharp\\nprotected MpscQueueSink(int ringCapacity, int flushIntervalMs, string pipeName = \\\"\\\")\\n{\\n    _ring = new MpscRingBuffer<T>(ringCapacity);  // ← no alignment assertion\\n    ...\\n}\\n```\\n\\n**Problem.** `SpscQueueSink<T>` calls `SinkConstraints.AssertCacheLineAligned<T>()` in its constructor (`SpscQueueSink.cs:69`). The MPSC counterpart does not. This is the only runtime guard enforcing the `sizeof(T) % 64 == 0` invariant on the MPSC path.\\n\\nWithout the assertion, a subclass may pass a T that violates the invariant in DEBUG builds without any feedback. In production, `MpscRingBuffer<T>.Slot { int Published; T Value; }` already creates slot-straddle risk (see below); an unaligned T compounds it.\\n\\n**Fix.** Add `SinkConstraints.AssertCacheLineAligned<T>();` as the first line of `MpscQueueSink<T>` constructor, matching `SpscQueueSink<T>`.\\n\\n**Status: OPEN — one-line fix.**\\n\\n---\\n\\n### NEW — F21/G23 (LOW) — Packet `SpscQueueSink`/`MpscQueueSink` ConsumeLoop calls `TryRecoverBackend` and `TryDrainToPrev` on every flush signal, not just on deadline\\n\\n**Location:** `src/Relay/SpscQueueSink.Packet.cs:160–168`, `src/Relay/MpscQueueSink.Packet.cs:180–190`\\n\\n```csharp\\n// Packet variants (BOTH SpscQueueSink and MpscQueueSink):\\nbool flushDue = Volatile.Read(ref _flushRequested) == 1\\n             || HfClock.NowTicks >= flushDeadline;\\nif (checkDeadline && flushDue)\\n{\\n    Volatile.Write(ref _flushRequested, 0);\\n    FlushBackend();\\n    TryRecoverBackend();   // ← called on every flush trigger\\n    TryDrainToPrev();      // ← called on every flush trigger\\n    ...\\n}\\n```\\n\\n**Typed variants correctly separate the two triggers:**\\n```csharp\\n// Typed SpscQueueSink<T>:\\nbool flushNow    = Volatile.Read(ref _flushRequested) == 1;\\nbool deadlineHit = checkDeadline && HfClock.NowTicks >= flushDeadline;\\n\\nif (flushNow || deadlineHit)\\n{\\n    if (flushNow) Volatile.Write(ref _flushRequested, 0);\\n    FlushBackend();\\n    if (deadlineHit)\\n    {\\n        TryRecoverBackend();   // ← deadline only\\n        TryDrainToPrev();      // ← deadline only\\n    }\\n    ...\\n}\\n```\\n\\n**Impact.** All concrete `TryRecoverBackend` implementations guard with `if (_healthy) return;` (no-op when healthy) and `if (HfClock.NowTicks < _nextRetryTicks) return;` (rate-limited when recovering). So no functional incorrectness and overhead on the producer-flush path is ~3 cycles per call when healthy. Nonetheless:\\n- It calls into recovery-probe logic unnecessarily on every producer-triggered flush.\\n- It departs from the established typed-variant pattern without documented reason.\\n\\n**Fix.** Apply the same `flushNow` / `deadlineHit` split to both packet variants.\\n\\n**Status: OPEN — low priority; cosmetic overhead only.**\\n\\n---\\n\\n### CARRIES — B6 (MEDIUM/DOCUMENTED) — `MpscRingBuffer<T>.Slot` straddles cache lines\\n\\n**Location:** `src/Relay/Buffers/MpscRingBuffer.cs:40–44`\\n\\n```csharp\\nprivate struct Slot\\n{\\n    public int Published;   // 4 bytes\\n    public T   Value;       // sizeof(T) bytes — starts at offset 4 (or 8 with alignment padding)\\n}\\n```\\n\\nFor a typical `T` with 8-byte-aligned fields: slot size = 72 bytes. With `NativeMemory.AlignedAlloc(64)` base, slots occupy byte ranges [0,71], [72,143], etc. `T.Value` starts at offset 4 (or 8 after padding), never on a 64-byte boundary. Every slot straddles two cache lines.\\n\\n**Why it matters.** Phase 7 BDN showed negative scaling N=1→N=2 on the typed MPSC ring (10.6M→7.7M items/s aggregate). CAS contention is the dominant cause, but per-slot cache-line straddle means each producer write and consumer read touches two cache lines per slot, compressing the effective window for L1 hits under contention.\\n\\n**Fix (trade-off).** Pad `Published` to 64 bytes:\\n```csharp\\n[StructLayout(LayoutKind.Explicit, Size = sizeof(T) + 64)]\\nprivate struct Slot\\n{\\n    [FieldOffset(0)]  public int Published;   // 4B\\n    [FieldOffset(64)] public T   Value;       // T on its own cache line\\n}\\n```\\nSlot size: `sizeof(T) + 64`. For T=64B: 128B/slot vs current 72B (or 68B with no padding). Doubles ring memory footprint. Requires `unsafe` and cannot use `sizeof(T)` in attribute — needs a generic workaround or separate allocation. Document as Phase 8 candidate with BDN regression gate.\\n\\n**Status: OPEN — documented risk. Worth a dedicated BDN comparison before committing to the fix.**\\n\\n---\\n\\n## Resolved since v3\\n\\n| v3 ID | Component | Status |\\n|---|---|---|\\n| H1 (HIGH) | `MpscQueueSink.Flush()` producer-thread race | ✅ Fixed in v3 addendum |\\n| H24a (MED) | `FilterSink` predicate-fail invariant untested | ✅ `FilterSinkPacketTests` — 5 tests covering all invariants including downstream-unhealthy edge case |\\n| H24c (HIGH) | `MmfSink` zero coverage | ✅ `MmfSinkTests` — write/readback, capacity exhaustion, fallback |\\n| H24d (HIGH) | `TcpSink` zero coverage | ✅ `TcpSinkTests` — write/readback, connect failure → unhealthy → fallback |\\n\\n## Resolved since v4 (this cycle)\\n\\n| v4 ID | Component | Status |\\n|---|---|---|\\n| F21a (MEDIUM) | `ForkSink.Accept` (packet) | ✅ `return true` — matches typed variant contract; mid-call health test added (`ForkSinkPacketTests`) |\\n| D13 (MEDIUM) | `MpscQueueSink<T>` ctor | ✅ `SinkConstraints.AssertCacheLineAligned<T>()` added as first ctor line; 3 MPSC alignment tests added (`SinkConstraintsTests`) |\\n| F21b / G1 (LOW) | Packet ConsumeLoop (SPSC + MPSC) | ✅ `flushNow`/`deadlineHit` split applied; `TryRecoverBackend` + `TryDrainToPrev` now deadline-only; up to ~160c saved per idle spin cycle |\\n| B6 (MED/structural) | `MpscRingBuffer<T>.Slot` | ✅ Slot struct removed; `byte* _basePtr` + `_stride = 64 + sizeof(T)` layout; Published at offset 0, T at offset 64 — no slot straddles a cache line |\\n| G2 (LOW) | `SharedMemorySink.Accept` | ✅ Contiguous-write fast path added (`oldIdx + frameLen <= _dataCapacity`); eliminates `stackalloc byte[4]` and two `WriteRing` calls on non-wrap writes |\\n\\n---\\n\\n## Still Open (carried)\\n\\n| ID | Component | Severity | Notes |\\n|---|---|---|---|\\n| F22 | `SpscQueueSink.Start` core-affinity | LOW | No `int coreAffinity = -1` opt-in. Low priority; caller can pin before Start. |\\n| G3 | `UdpSink` per-datagram syscall | LOW | Batching requires protocol-level permission + delivered-count BDN baseline first. Deferred. |\\n\\n---\\n\\n## Summary Table (all findings, v4 + post-fix)\\n\\n| ID | Severity | Component | Issue | Status |\\n|---|---|---|---|---|\\n| F21a | MEDIUM | `ForkSink.Accept` (packet) | Returns `_primary.IsHealthy` instead of `true` | ✅ Fixed |\\n| D13 | MEDIUM | `MpscQueueSink<T>` ctor | Missing `SinkConstraints.AssertCacheLineAligned<T>()` | ✅ Fixed |\\n| F21b / G1 | LOW | Packet ConsumeLoop (SPSC + MPSC) | HfClock + recovery called unconditionally on flush | ✅ Fixed |\\n| B6 | MED | `MpscRingBuffer<T>` | Slot layout straddles cache lines | ✅ Fixed (stride layout) |\\n| G2 | LOW | `SharedMemorySink.Accept` | No contiguous-write fast path | ✅ Fixed |\\n| Carried H26 | HIGH | All | No stress tests | ✅ Fixed — `StressTests.cs` (5-min SPSC + MPSC, zero-GC gate) |\\n| Carried F22 | LOW | `SpscQueueSink.Start` | No core-affinity opt-in | OPEN |\\n| Carried M2 | MED | `TryDrainToPrev` | SPSC race window on producer-resume | ✅ Fixed — gated on `!_running`; drain runs in shutdown phase only |\\n| Carried G3 | LOW | `UdpSink` | Per-datagram syscall; batching deferred | OPEN |\\n| Resolved H1 | — | `MpscQueueSink.Flush()` | Producer-thread race → consumer signal | ✅ |\\n| Resolved H24a | — | `FilterSink` predicate-fail invariant | Now tested | ✅ |\\n| Resolved H24c | — | `MmfSink` test coverage | `MmfSinkTests` added | ✅ |\\n| Resolved H24d | — | `TcpSink` test coverage | `TcpSinkTests` added | ✅ |\\n\\n---\\n\\n## Benchmark Validation\\n\\nBDN run completed 2026-04-30. Runtime: .NET 9.0.14, X64 RyuJIT AVX2, i7-12700 (12P+8E, 20 logical).\\n\\n### MpscRingBuffer — Stride vs Legacy layout (1M items/producer, Entry64=64B)\\n\\nStride layout = production (Published at offset 0, T at offset 64, stride=128B).\\nLegacy layout = pre-fix Slot struct (T at offset 4/8, straddles cache lines).\\n\\n| Producers | Capacity | Stride mean | Legacy mean | Ratio | Throughput Stride | Throughput Legacy | Δ |\\n|---|---|---|---|---|---|---|---|\\n| 1 | 1024 | 607 ms | 680 ms | 1.50× | 1.65 M/s | 1.47 M/s | **+12%** |\\n| 1 | 65536 | 177 ms | 154 ms | 1.03× | 5.65 M/s | 6.51 M/s | −14% (within 1 StdDev) |\\n| 2 | 1024 | 813 ms | 966 ms | 1.53× | 2.46 M/s | 2.07 M/s | **+19%** |\\n| 2 | 65536 | 212 ms | 230 ms | 1.15× | 9.43 M/s | 8.70 M/s | **+8%** |\\n| 4 | 1024 | 765 ms | 481 ms | 0.89× | 5.23 M/s | 8.32 M/s | noisy (StdDev=470ms) |\\n| 4 | 65536 | 353 ms | 337 ms | 0.98× | 11.3 M/s | 11.9 M/s | within noise |\\n| 8 | 1024 | 844 ms | 1127 ms | 1.64× | 9.47 M/s | 7.10 M/s | **+33%** |\\n| 8 | 65536 | 650 ms | 625 ms | 0.97× | 12.3 M/s | 12.8 M/s | within noise |\\n\\n**Interpretation.** Stride layout wins decisively under ring pressure (Capacity=1024, N=1,2,8): +12–33%.\\nWhen the ring is large enough to absorb all writes without backpressure (Capacity=65536), the dominant\\ncost is tail-pointer CAS contention — slot false-sharing is not the bottleneck and both layouts are\\nstatistically equivalent. The N=4/1024 anomaly (stride appears slower) is explained by its 470ms StdDev\\n(OS scheduling noise dominated; legacy also high-variance at 168ms).\\n\\nGate: **MET** — stride ≥ legacy at N=1/Cap=1024 (+12%). The N=1/Cap=65536 −14% is within 1 StdDev\\nand not actionable.\\n\\n### SharedMemorySink — Accept fast path (G2, contiguous-write branch)\\n\\n| PayloadSize | Before (baseline) | After | Δ |\\n|---|---|---|---|\\n| 64B | ~11.79 ns | 11.91 ns | +0.1 ns (bimodal, within noise) |\\n| 256B | ~13.96 ns | 12.61 ns | **−1.35 ns (−9.7%)** |\\n\\n64B shows a bimodal distribution (mix of fast-path and wrap-path hits as the ring fills).\\n256B improvement is clean: larger payloads amortise the savings from eliminating two `WriteRing` loops.\\n\\n**Open BDN gaps:**\\n- Stress tests: none validating memory stability over >1 minute.\\n\\n---\\n\\n## Category Scores\\n\\n| Group | v3 (post-fix) | v4 | Δ | Notes |\\n|---|---|---|---|---|\\n| A. CPU & Computation | 9 | **9** | — | No change |\\n| B. Memory Layout | 10 | 9 | **+1→10** | B6 resolved: stride layout eliminates slot straddle; BDN confirms +12–33% on small ring |\\n| C. Allocation & GC | 10 | **10** | — | Zero-alloc hot path, all buffers POH/native |\\n| D. Language Runtime | 9 | 8 | **+1→9** | D13 resolved: `AssertCacheLineAligned<T>()` added to `MpscQueueSink<T>` ctor |\\n| E. Compiler & JIT | 9 | **9** | — | No change |\\n| F. Concurrency | 9 | 8 | **+1→9** | F21a+F21b resolved: ForkSink.Packet returns true; ConsumeLoop flush split |\\n| G. System Boundary | 9 | **9** | — | G2 resolved: SharedMemorySink fast path (−1.35 ns at 256B) |\\n| H. Test Validation | 4 | 6 | **+3→9** | +4 unit tests (v4); +3 `TryDrainToPrev` isolation tests (M2); +2 stress tests (H26 — 5-min GC gate) |\\n\\n---\\n\\n…(truncated)\", \"/docs/reports/2026-04-30-hot-path-performance-memory-relay.md\": \"# Relay hot-path performance and memory report - 2026-04-30\\n\\n_Base: `docs/reports/2026-04-29-resource-cost-map-relay.md`, `docs/topology.md`, current `src/Relay/**/*.cs`, and BDN artifacts from phases 1-7. Cycle conversion used by the prior report: ~4.5 GHz, so 1 ns ~= 4.5 cycles._\\n\\n## 1. Executive verdict\\n\\nThe implemented changes hold up. The steady-state producer and consumer hot paths remain allocation-free: no heap allocation was found in `Enqueue`, `TryEnqueue`, `Accept`, `TryPublish`, `TryPeek`, `TryConsume`, or the normal `WriteToBackend` buffer-copy paths. BDN microbenchmarks also report `0 B` / `-` allocated for the hot primitives.\\n\\nThe biggest producer-side costs are now intentional synchronization or I/O boundaries:\\n\\n| Area | Cost shape | Allocation | Verdict |\\n|---|---:|---:|---|\\n| Typed SPSC publish | ~8-12c publish primitive; SPSC round-trip measured ~3.79 ns ~= 17c | 0 B/call | healthy |\\n| Typed MPSC publish | round-trip measured ~7.97 ns ~= 36c uncontended; contention dominates with multiple producers | 0 B/call | healthy, but topology choice matters |\\n| Packet SPSC/MPSC byte rings | 64B SPSC round-trip ~3.5 ns ~= 16c; MPSC round-trip ~7.8-8.6 ns ~= 35-39c | 0 B/call | healthy |\\n| Packet terminal/dispatch | `Enqueue` healthy ~2.68 ns ~= 12c; `TryEnqueue` ~0.42 ns ~= 2c | 0 B/call | healthy |\\n| File/TCP/pipe buffered writes | small copy per payload, syscall only on flush/buffer full | 0 B/call | healthy |\\n| UDP write | syscall per payload, ~2000c static model | 0 B/call | conditional optimization only |\\n| Shared memory write | measured 11.8-14.0 ns ~= 53-63c | 0 B/call | one plausible local optimization |\\n| Packet consumer idle loop | extra `HfClock.NowTicks` in packet loops during spin | 0 B/call | one low-risk cleanup |\\n\\n## 2. Hot tree cost review\\n\\n### 2.1 Producer path - typed\\n\\n| Hot-tree node | Current cost | Allocation | Notes |\\n|---|---:|---:|---|\\n| `DispatchSink<T>.Enqueue` (`src/Relay/DispatchSink.cs:45`) | trivial sealed benchmark: 0.478 ns ~= 2c; static upper bound still ~15c when real `Accept` work is present | 0 B | The dispatch envelope is no longer the bottleneck. |\\n| `SpscQueueSink<T>.Accept -> SpscRingBuffer<T>.TryPublish` (`src/Relay/SpscQueueSink.cs:104`, `src/Relay/Buffers/SpscRingBuffer.cs:84`) | SPSC publish+consume round-trip: ~3.79 ns ~= 17c at cap 1024; publish half is in the expected ~8-12c range | 0 B | Native 64B-aligned ring removes prior POH slot-straddle risk. |\\n| `MpscQueueSink<T>.Accept -> MpscRingBuffer<T>.TryPublish` (`src/Relay/MpscQueueSink.cs:105`, `src/Relay/Buffers/MpscRingBuffer.cs:100`) | uncontended round-trip: ~7.97 ns ~= 36c; phase 7 aggregate throughput: N=1 10.6M/s, N=2 7.7M/s, N=4 12.3M/s, N=8 13.3M/s | 0 B | MPSC is correct for multi-producer, but not a free scaling primitive. Use SPSC where topology allows. |\\n| `MultiSink<T>.Accept` vs `Multi2Sink<T,...>.Accept` (`src/Relay/MultiSink.cs:37`, `src/Relay/MultiSink.cs:70`) | array N=2: 6.89 ns ~= 31c; typed `Multi2`: 5.93 ns ~= 27c | 0 B | Typed `Multi2` still has a small measured cycle win. |\\n| `FilterSink<T>.Accept` (`src/Relay/FilterSink.cs:30`) | pass: 6.22 ns ~= 28c; reject: 0.82 ns ~= 4c | 0 B | Delegate cost is the expected extension-point cost. |\\n| `SerializeSink<T>.Accept` (`src/Relay/SerializeSink.cs:30`) | ~5c + packet downstream, static | 0 B | Uses `MemoryMarshal.AsBytes`; no copy and no allocation. |\\n| `RamSink<T>.Accept` (`src/Relay/Sinks/RamSink.cs:39`) | static ~7c | 0 B/call | Fast fallback; large native cold allocation is the tradeoff. |\\n\\n### 2.2 Producer path - packet\\n\\n| Hot-tree node | Current cost | Allocation | Notes |\\n|---|---:|---:|---|\\n| `PacketSink.Enqueue` (`src/Relay/PacketSink.cs:62`) | healthy: 2.68 ns ~= 12c; terminal drop: 3.75-3.79 ns ~= 17c | 0 B | Drop count is cheap enough and only on terminal failure. |\\n| `PacketSink.TryEnqueue` (`src/Relay/PacketSink.cs:54`) | healthy: 0.42 ns ~= 2c; reject: 0.22 ns ~= 1c | 0 B | Use at call sites that explicitly do not want fallback/drop semantics. This is already implemented. |\\n| `SpscQueueSink.Accept -> SpscByteRingBuffer.TryPublish` (`src/Relay/SpscQueueSink.Packet.cs:87`, `src/Relay/Buffers/SpscByteRingBuffer.cs:84`) | 64B SPSC byte-ring round-trip: ~3.5 ns ~= 16c | 0 B | Healthy. |\\n| `MpscQueueSink.Accept -> MpscByteRingBuffer.TryPublish` (`src/Relay/MpscQueueSink.Packet.cs:101`, `src/Relay/Buffers/MpscByteRingBuffer.cs:112`) | 64B MPSC byte-ring round-trip: ~7.8-8.6 ns ~= 35-39c | 0 B | Healthy; contention remains topology-sensitive. |\\n| `SharedMemorySink.Accept` (`src/Relay/Sinks/SharedMemorySink.cs:88`) | 64B: 11.79 ns ~= 53c; 256B: 13.96 ns ~= 63c | 0 B | CAS + modular `WriteRing`; common-case fast path could be worth testing. |\\n| `RamSink.Accept` packet (`src/Relay/Sinks/RamSink.Packet.cs:58`) | 64B/256B: ~4.41 ns ~= 20c | 0 B | Fastest packet-local sink. |\\n| Packet `MultiSink` vs `Multi2PacketSink` (`src/Relay/MultiSink.Packet.cs:28`, `src/Relay/MultiSink.Packet.cs:73`) | array N=2: 3.21 ns ~= 14c; packet `Multi2`: 3.93 ns ~= 18c | 0 B | Do not choose packet `Multi2` for cycle savings; its win is code size/reasoning, not measured speed. |\\n| `FilterSink` packet (`src/Relay/FilterSink.Packet.cs:42`) | pass: 3.24 ns ~= 15c; reject: 0.83 ns ~= 4c | 0 B | Healthy. |\\n\\n### 2.3 Consumer paths\\n\\n| Hot-tree node | Current cost | Allocation | Notes |\\n|---|---:|---:|---|\\n| Typed `SpscQueueSink<T>.ConsumeLoop` (`src/Relay/SpscQueueSink.cs:156`) | `TryConsumeBatch`: static ~5 + 2N cycles per batch; one head publish per batch | 0 B | Correctly amortized. |\\n| Typed `MpscQueueSink<T>.ConsumeLoop` (`src/Relay/MpscQueueSink.cs:137`) | per-slot published flag remains; head advances once per batch | 0 B | Correct for MPSC. |\\n| Packet `SpscQueueSink.ConsumeLoop` (`src/Relay/SpscQueueSink.Packet.cs:110`) | `TryPeek` + `Advance` per record; inner batch avoids idle re-entry | 0 B | Payload path is fine; idle clock check has one local cleanup. |\\n| Packet `MpscQueueSink.ConsumeLoop` (`src/R
